name: shipmate apply-all-detect
description: Compute the bare `shipmate apply` work set (all non-explicit envs, from the head's apply checks), bucket it into env-levels, and wave-order each level. Skips already-applied cells; explicit envs stay pending.
inputs:
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  github-token:
    description: 'GITHUB_TOKEN with actions:read, checks:read, contents:read.'
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  ungated-envs:
    description: SHIPMATE_UNGATED_ENVS verbatim — comma-separated envs applied without waiting for an approving review. An empty value exempts nothing, so an unreviewed PR holds every env. Supply it together with review-decision, never one without the other.
    required: false
    default: ''
  review-decision:
    description: The PR's reviewDecision, from the review job. Only NONE and APPROVED apply everything; an empty value means the decision never arrived and holds every env.
    required: false
    default: ''
outputs:
  envlevel0_waves: { description: JSON wave0..wave7 map for env-level 0, value: "${{ steps.d.outputs.envlevel0_waves }}" }
  envlevel1_waves: { description: JSON wave0..wave7 map for env-level 1, value: "${{ steps.d.outputs.envlevel1_waves }}" }
  envlevel2_waves: { description: JSON wave0..wave7 map for env-level 2, value: "${{ steps.d.outputs.envlevel2_waves }}" }
  envlevel3_waves: { description: JSON wave0..wave7 map for env-level 3, value: "${{ steps.d.outputs.envlevel3_waves }}" }
  envlevel0_empty: { description: "'true' when env-level 0 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel0_empty }}" }
  envlevel1_empty: { description: "'true' when env-level 1 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel1_empty }}" }
  envlevel2_empty: { description: "'true' when env-level 2 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel2_empty }}" }
  envlevel3_empty: { description: "'true' when env-level 3 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel3_empty }}" }
  head_sha: { description: Echoed head SHA, value: "${{ steps.d.outputs.head_sha }}" }
  excluded_envs: { description: JSON list of explicit envs left pending (target them with `shipmate apply <env>`), value: "${{ steps.d.outputs.excluded_envs }}" }
  skipped_envs: { description: "JSON list of envs skipped because they are ordered after an env not applying this run (held for review, or excluded as explicit)", value: "${{ steps.d.outputs.skipped_envs }}" }
  review_held_envs: { description: JSON list of envs held because the PR is not reviewed, value: "${{ steps.d.outputs.review_held_envs }}" }
  applied_ungated_envs: { description: JSON list of envs applied without an approving review because they are listed in SHIPMATE_UNGATED_ENVS, value: "${{ steps.d.outputs.applied_ungated_envs }}" }
runs:
  using: composite
  steps:
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_UNGATED_ENVS: ${{ inputs.ungated-envs }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/apply-all-detect"
