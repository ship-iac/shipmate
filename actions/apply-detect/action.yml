name: shipmate apply-detect
description: A targeted apply computes one environment's work set from the head's apply checks and wave-orders it at env-level 0. A bare apply (empty environment) computes the work set of every environment not `targeted`, buckets it into env-levels and wave-orders each level. Every form skips already-applied cells. Before reading the head's checks, the bare and targeted forms wait, up to 8 minutes of elapsed time, while a `shipmate plan` run of the pull request is live. At the deadline they fail when the last listing was incomplete, else refuse when a run is still live, else fail when a waited run could not be read; after the wait they refuse a cell whose apply check records a plan run they waited for. The auto form does not wait. The bare and targeted forms refuse the whole run when a cell they would apply is behind the base (the merge of the base into the branch changes its stack, or its apply check records that its plan found the base changed it). The auto form (`auto`) is the bare form over the environments whose `apply_mode` is `auto`, with the refusals the `auto` input names, and holds such a cell instead, and a cell an earlier apply run attempted and did not apply. Writes the apply result comment's fields to `report-path` (`scripts/apply-detect` `write_report`). Needs a full-history checkout of the head. Reads the job's GITHUB_TOKEN, which needs actions:read, checks:read, contents:read and pull-requests:read.
inputs:
  environment:
    description: Target environment, e.g. dev-eu. Empty runs the bare form over every pending environment.
    required: false
    default: ""
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  pr-number:
    description: The pull request the apply was authorized on. A pending apply check whose record names another pull request, or none, refuses.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  review-decision:
    description: The PR's reviewDecision, from the calling job's own pull-request read (`apply-pr-read`). Only NONE and APPROVED authorize; an empty value (the read wrote none) or a value the engine does not know fails every form (targeted, bare and `auto`).
    required: false
    default: ''
  auto:
    description: "'true' runs the auto form, the bare form over the `apply_mode: auto` environments, dispatched by the App after an autoplan: it refuses unless the actor is the App's bot, the plan is the head's newest autoplan, no newer shipmate plan run of the pull request is live or planned, the autoplan's actor has write access and the pull request is mergeable at this head, and holds a cell whose stack the merge of the base into the branch changes, directly or through a module it sources, or removes files it owns, or whose apply check records that its plan found the base changed it, and holds a cell an earlier apply run attempted and did not apply (an apply check retitled `Failed`, `Cancelled`, `Not run` or `Not applied`, a `stale` check, or one left `in_progress` by an apply run that ended without applying it): an auto run never retries a cell unattended."
    required: false
    default: "false"
  report-path:
    description: The file the complete report is written to, for the caller to upload as the apply result comment's report artifact.
    required: true
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  envlevel0_waves: { description: "JSON wave0..wave7 map for env-level 0. A targeted apply puts every cell here.", value: "${{ steps.d.outputs.envlevel0_waves }}" }
  envlevel1_waves: { description: JSON wave0..wave7 map for env-level 1, value: "${{ steps.d.outputs.envlevel1_waves }}" }
  envlevel2_waves: { description: JSON wave0..wave7 map for env-level 2, value: "${{ steps.d.outputs.envlevel2_waves }}" }
  envlevel3_waves: { description: JSON wave0..wave7 map for env-level 3, value: "${{ steps.d.outputs.envlevel3_waves }}" }
  envlevel0_empty: { description: "'true' when env-level 0 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel0_empty }}" }
  envlevel1_empty: { description: "'true' when env-level 1 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel1_empty }}" }
  envlevel2_empty: { description: "'true' when env-level 2 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel2_empty }}" }
  envlevel3_empty: { description: "'true' when env-level 3 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel3_empty }}" }
  first_level: { description: "The lowest env-level with a cell in any wave, '0' to '3'; empty when no level has one.", value: "${{ steps.d.outputs.first_level }}" }
  head_sha: { description: "The echoed head SHA.", value: "${{ steps.d.outputs.head_sha }}" }
  provenance_run: { description: "Auto form only: the autoplan run every applied cell's record names; empty when no cell applies.", value: "${{ steps.d.outputs.provenance_run }}" }
  base_sha: { description: "The tip of the pull request's base branch, read from its ref (in the auto form after the mergeability wait), that the behind cells were computed on; empty when no cell was selected to apply.", value: "${{ steps.d.outputs.base_sha }}" }
  refused_by_rule: { description: "`true` when the step failed on a refusal by rule (a cell behind the base, or a targeted apply without its review); empty otherwise, a failed tool or API call included. Set although the step fails.", value: "${{ steps.d.outputs.refused_by_rule }}" }
  refusal: { description: "The first error of the `::error::` message that failed the step (whatever its cause, a failed tool or API call included), without the prefix, its lines joined into one; empty when the step raised none. Set although the step fails, and read by the apply result comment. Branch-controlled text (it can name a stack path), so a reader passes it through `env:`.", value: "${{ steps.d.outputs.refusal }}" }
runs:
  using: composite
  steps:
    - uses: $/actions/python-yaml
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_AUTO: ${{ inputs.auto }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_REPORT_PATH: ${{ inputs.report-path }}
      run: exec python3 "$GITHUB_ACTION_PATH/../../scripts/apply-detect"
