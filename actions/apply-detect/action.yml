name: shipmate apply-detect
description: Compute the single-env apply work set (from a plan run's plan artifacts) and wave-order it, or in unlock mode the flat queue of cells whose apply check is still pending. Skips already-applied cells.
inputs:
  environment:
    description: Target environment, e.g. dev-eu.
    required: true
  plan-run-id:
    description: Plan run id holding the reviewed plan artifacts. Empty in unlock mode, which consumes no plan artifact.
    required: false
    default: ''
  mode:
    description: apply (default) or unlock. Anything else takes the apply path, which is the stricter of the two.
    required: false
    default: apply
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  github-token:
    description: 'GITHUB_TOKEN with actions:read, checks:read, contents:read.'
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  ungated-envs:
    description: SHIPMATE_UNGATED_ENVS verbatim — comma-separated envs applied without waiting for an approving review. Supply it together with review-decision, never one without the other.
    required: false
    default: ''
  review-decision:
    description: The PR's reviewDecision, from the review job. Only NONE and APPROVED authorize; an empty value means the decision never arrived and refuses the run.
    required: false
    default: ''
outputs:
  waves: { description: "All waves as one JSON object {wave0..wave7} (apply-env-level.yml waves_json shape)", value: "${{ steps.d.outputs.waves }}" }
  cells: { description: "Flat JSON array of cells — the unlock queue in unlock mode, [] in apply mode. Always valid JSON, never empty: consumers fromJSON it unconditionally.", value: "${{ steps.d.outputs.cells }}" }
  empty: { description: true when no cell is pending, value: "${{ steps.d.outputs.empty }}" }
  head_sha: { description: Echoed head SHA, value: "${{ steps.d.outputs.head_sha }}" }
  plan_run_id: { description: Echoed plan run id (unset in unlock mode, which consumes no plan run), value: "${{ steps.d.outputs.plan_run_id }}" }
runs:
  using: composite
  steps:
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_PLAN_RUN_ID: ${{ inputs.plan-run-id }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_UNGATED_ENVS: ${{ inputs.ungated-envs }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
        SHIPMATE_MODE: ${{ inputs.mode }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/apply-detect"
