name: shipmate apply-detect
description: Compute the single-env apply work set (from the head's apply checks) and wave-order it, or in unlock mode the flat queue of cells whose apply check is still pending. Skips already-applied cells. Reads the job's GITHUB_TOKEN, which needs actions:read, checks:read and contents:read.
inputs:
  environment:
    description: Target environment, e.g. dev-eu.
    required: true
  mode:
    description: apply (default) or unlock. Anything else takes the apply path, which is the stricter of the two.
    required: false
    default: apply
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  review-decision:
    description: The PR's reviewDecision, from the review job. Only NONE and APPROVED authorize; an empty value means the decision never arrived and refuses the run.
    required: false
    default: ''
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  waves: { description: "Apply mode only: all waves as one JSON object {wave0..wave7} (apply-env-level.yml waves_json shape). In unlock mode nothing is written and this resolves to the empty string, NOT {} — a consumer must not fromJSON it there; use `cells` instead.", value: "${{ steps.d.outputs.waves }}" }
  cells: { description: "Unlock mode only: the unlock queue as a flat JSON array, [] when it is empty, never the empty string.", value: "${{ steps.d.outputs.cells }}" }
  empty: { description: "Apply mode only: true when no cell is pending. In unlock mode nothing is written and this resolves to the empty string.", value: "${{ steps.d.outputs.empty }}" }
  head_sha: { description: "Apply mode only: the echoed head SHA. In unlock mode nothing is written and this resolves to the empty string.", value: "${{ steps.d.outputs.head_sha }}" }
runs:
  using: composite
  steps:
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
        SHIPMATE_MODE: ${{ inputs.mode }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/apply-detect"
