name: shipmate apply-detect
description: A targeted apply computes one environment's work set from the head's apply checks and wave-orders it at env-level 0. A bare apply (empty environment) computes every non-explicit environment's work set, buckets it into env-levels and wave-orders each level. Unlock mode emits the flat queue of one environment's cells whose apply check is still pending. Every form skips already-applied cells. Reads the job's GITHUB_TOKEN, which needs actions:read, checks:read and contents:read.
inputs:
  environment:
    description: Target environment, e.g. dev-eu. Empty in apply mode runs the bare form over every pending environment; empty in unlock mode refuses.
    required: false
    default: ""
  mode:
    description: apply (default) or unlock. Anything else takes the apply path, which is the stricter of the two.
    required: false
    default: apply
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  review-decision:
    description: The PR's reviewDecision, from the review job. Only NONE and APPROVED authorize; an empty value means the decision never arrived, which refuses a targeted apply and holds every environment of a bare one.
    required: false
    default: ''
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  envlevel0_waves: { description: "JSON wave0..wave7 map for env-level 0. A targeted apply puts every cell here.", value: "${{ steps.d.outputs.envlevel0_waves }}" }
  envlevel1_waves: { description: JSON wave0..wave7 map for env-level 1, value: "${{ steps.d.outputs.envlevel1_waves }}" }
  envlevel2_waves: { description: JSON wave0..wave7 map for env-level 2, value: "${{ steps.d.outputs.envlevel2_waves }}" }
  envlevel3_waves: { description: JSON wave0..wave7 map for env-level 3, value: "${{ steps.d.outputs.envlevel3_waves }}" }
  envlevel0_empty: { description: "'true' when env-level 0 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel0_empty }}" }
  envlevel1_empty: { description: "'true' when env-level 1 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel1_empty }}" }
  envlevel2_empty: { description: "'true' when env-level 2 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel2_empty }}" }
  envlevel3_empty: { description: "'true' when env-level 3 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel3_empty }}" }
  cells: { description: "Unlock mode only: the unlock queue as a flat JSON array, [] when it is empty, never the empty string.", value: "${{ steps.d.outputs.cells }}" }
  head_sha: { description: "Apply mode only: the echoed head SHA. In unlock mode nothing is written and this resolves to the empty string.", value: "${{ steps.d.outputs.head_sha }}" }
  excluded_envs: { description: "Bare apply only: JSON list of explicit envs left pending, including held ones; the comment lists a held one under the hold. The targeted form writes none.", value: "${{ steps.d.outputs.excluded_envs }}" }
  skipped_envs: { description: "Bare apply only: JSON list of envs skipped because they are ordered after an env not applying this run (held for review, or excluded as explicit). The targeted form writes none.", value: "${{ steps.d.outputs.skipped_envs }}" }
  review_held_envs: { description: "Bare apply only: JSON list of envs held because the PR is not reviewed. The targeted form writes none.", value: "${{ steps.d.outputs.review_held_envs }}" }
  applied_ungated_envs: { description: "Bare apply only: JSON list of envs applied without an approving review because their entry holds `gated = false`. The targeted form writes none.", value: "${{ steps.d.outputs.applied_ungated_envs }}" }
  review_not_required_envs: { description: "Apply mode only: JSON list of gated envs authorized under a null review decision, because the pull request's review state required none, else []. In unlock mode nothing is written and this resolves to the empty string.", value: "${{ steps.d.outputs.review_not_required_envs }}" }
runs:
  using: composite
  steps:
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
        SHIPMATE_MODE: ${{ inputs.mode }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
      run: |
        # An empty environment is the bare form, which only apply mode has. Any other mode, absent
        # or garbled included, reaches apply-detect, which refuses an empty environment.
        if [ -z "$SHIPMATE_ENV" ] && [ "$SHIPMATE_MODE" = apply ]; then
          exec python3 "$GITHUB_ACTION_PATH/../../scripts/apply-all-detect"
        fi
        exec python3 "$GITHUB_ACTION_PATH/../../scripts/apply-detect"
