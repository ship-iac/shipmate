name: shipmate apply-detect
description: A targeted apply computes one environment's work set from the head's apply checks and wave-orders it at env-level 0. A bare apply (empty environment) computes the work set of every environment not `targeted`, buckets it into env-levels and wave-orders each level. Every form skips already-applied cells. The auto form (`auto`) is the bare form over the environments whose `apply_mode` is `auto`, with the refusals the `auto` input names. Reads the job's GITHUB_TOKEN, which needs actions:read, checks:read and contents:read, and pull-requests:read for the auto form.
inputs:
  environment:
    description: Target environment, e.g. dev-eu. Empty runs the bare form over every pending environment.
    required: false
    default: ""
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  pr-number:
    description: The pull request the apply was authorized on. A pending apply check whose record names another pull request, or none, refuses.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  review-decision:
    description: The PR's reviewDecision, from the review job. Only NONE and APPROVED authorize; an empty value means the decision never arrived, which refuses a targeted apply and holds every environment of a bare one.
    required: false
    default: ''
  auto:
    description: "'true' runs the auto form, the bare form over the `apply_mode: auto` environments, dispatched by the App after an autoplan: it refuses unless the actor is the App's bot, the plan is the head's newest autoplan, its pusher has write access and the pull request is mergeable at this head, and holds a cell whose stack the base changed since the merge base. Needs a full-history checkout of the head."
    required: false
    default: "false"
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  envlevel0_waves: { description: "JSON wave0..wave7 map for env-level 0. A targeted apply puts every cell here.", value: "${{ steps.d.outputs.envlevel0_waves }}" }
  envlevel1_waves: { description: JSON wave0..wave7 map for env-level 1, value: "${{ steps.d.outputs.envlevel1_waves }}" }
  envlevel2_waves: { description: JSON wave0..wave7 map for env-level 2, value: "${{ steps.d.outputs.envlevel2_waves }}" }
  envlevel3_waves: { description: JSON wave0..wave7 map for env-level 3, value: "${{ steps.d.outputs.envlevel3_waves }}" }
  envlevel0_empty: { description: "'true' when env-level 0 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel0_empty }}" }
  envlevel1_empty: { description: "'true' when env-level 1 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel1_empty }}" }
  envlevel2_empty: { description: "'true' when env-level 2 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel2_empty }}" }
  envlevel3_empty: { description: "'true' when env-level 3 has no cell in any wave.", value: "${{ steps.d.outputs.envlevel3_empty }}" }
  head_sha: { description: "The echoed head SHA.", value: "${{ steps.d.outputs.head_sha }}" }
  excluded_envs: { description: "Bare and auto forms: JSON list of targeted envs left pending, including held ones; the comment lists a held one under the hold. The targeted form writes none.", value: "${{ steps.d.outputs.excluded_envs }}" }
  skipped_envs: { description: "Bare and auto forms: JSON list of envs skipped because they are ordered after an env not fully applying this run (held for review, excluded as targeted, holding a waiting cell, holding a cell another pull request locks, or, under the auto form, holding a cell the base also changed or not `apply_mode: auto`). The targeted form writes none.", value: "${{ steps.d.outputs.skipped_envs }}" }
  skipped_after: { description: "Bare and auto forms: JSON object mapping each env in skipped_envs to its transitive `needs` predecessors not fully applying for a cause of their own (targeted, held, holding a waiting, locked or overlap cell, or, under the auto form, not `apply_mode: auto`). The targeted form writes none.", value: "${{ steps.d.outputs.skipped_after }}" }
  review_held_envs: { description: "Bare and auto forms: JSON list of envs held because the PR is not reviewed. The targeted form writes none.", value: "${{ steps.d.outputs.review_held_envs }}" }
  applied_exempt_envs: { description: "Bare and auto forms: JSON list of envs applied without an approving review because their entry holds `review: false`. The targeted form writes none.", value: "${{ steps.d.outputs.applied_exempt_envs }}" }
  review_not_required_envs: { description: "JSON list of `review: true` envs authorized under a null review decision, because the pull request's review state required none, else [].", value: "${{ steps.d.outputs.review_not_required_envs }}" }
  waiting_cells: { description: "JSON list of cells left pending because a cell they run after (CONTRACT.md §Fan-out) is pending and not applying this run, each with that cell; both forms.", value: "${{ steps.d.outputs.waiting_cells }}" }
  held_cells: { description: "JSON list of pending cells left pending and not applying this run for a cause of their own, each `{stack, environment, cause}`. `cause` is `locked` when another pull request holds the cell's lock, and such a cell also carries `holder`, that pull request's number (null when the lock's holder is unknown); both forms. `cause` is `overlap` when the base changed the cell's stack since the merge base, directly or through a module, so its plan would revert that change; auto form only.", value: "${{ steps.d.outputs.held_cells }}" }
  env_order: { description: "JSON list of every environment the apply checks on the head name, in apply order (the env-levels of the table's `needs`, ties by name); the targeted form names its one environment. Read by the apply result comment to order its environment headings.", value: "${{ steps.d.outputs.env_order }}" }
  provenance_run: { description: "Auto form only: the autoplan run every applied cell's record names; empty when no cell applies.", value: "${{ steps.d.outputs.provenance_run }}" }
  base_sha: { description: "Auto form only: the tip of the pull request's base branch, read from its ref after the mergeability wait, that the overlap cells in held_cells were computed on; empty when no environment had a pending cell to consider.", value: "${{ steps.d.outputs.base_sha }}" }
  bare_envs: { description: "Auto form only: JSON list of pending envs neither `apply_mode: auto`, targeted nor held, left for a bare `shipmate apply`.", value: "${{ steps.d.outputs.bare_envs }}" }
  refusal: { description: "The first error of the `::error::` message that failed the step (a refusal or a failed tool or API call), without the prefix, its lines joined into one; empty when the step raised none. Set although the step fails, and read by the apply result comment. Branch-controlled text (it can name a stack path), so a reader passes it through `env:`.", value: "${{ steps.d.outputs.refusal }}" }
runs:
  using: composite
  steps:
    - uses: $/actions/python-yaml
    - name: Detect
      id: d
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_AUTO: ${{ inputs.auto }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_REVIEW_DECISION: ${{ inputs.review-decision }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
      run: exec python3 "$GITHUB_ACTION_PATH/../../scripts/apply-detect"
