name: shipmate unlock-result
description: Reply once on the pull request with the state locks an unlock run released per cell, or why it released nothing (scripts/unlock-result). Display only, written with the job token, which needs pull-requests write; a reply that cannot be posted never fails the step, and a cell whose record did not arrive reads as unknown.
inputs:
  comment-id:
    description: The command comment's id, the dispatch's `comment_id`. The pull request is read from it.
    required: true
  environment:
    description: The unlocked environment.
    required: true
  cells:
    description: The `detect` job's `cells` output, the unlock queue as a JSON array.
    required: true
  detect-result:
    description: The `detect` job's result; anything but `success` replies that no cell was probed.
    required: true
  download-outcome:
    description: The outcome of the calling job's record download into `$RUNNER_TEMP/unlock-records`; `failure` reads the cells with no record as unknown.
    required: true
runs:
  using: composite
  steps:
    - name: Reply with the unlock result
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ inputs.comment-id }}
        SHIPMATE_ENV: ${{ inputs.environment }}
        SHIPMATE_CELLS: ${{ inputs.cells }}
        SHIPMATE_DETECT_RESULT: ${{ inputs.detect-result }}
        SHIPMATE_DOWNLOAD_OUTCOME: ${{ inputs.download-outcome }}
        SHIPMATE_RECORDS: ${{ runner.temp }}/unlock-records
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/unlock-result"
