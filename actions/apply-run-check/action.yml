name: shipmate apply-run-check
description: Show a running apply run as the `shipmate / apply run` check on the pull request head (scripts/apply-run-check). `start` creates the check in progress and completes the open checks of apply runs that ended without completing theirs; `finish` completes this run's check. Mints a shipmate App installation token with checks write and actions read. Display only, so every caller degrades a failure.
inputs:
  mode:
    description: "`start` or `finish`."
    required: true
  head-sha:
    description: The pull request head SHA the check is on.
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        # The sweep reads each linked run; a private repository refuses that without it.
        permission-actions: read
    - name: Create or complete the apply run check
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        MODE: ${{ inputs.mode }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/apply-run-check" "$MODE" "$HEAD_SHA"
