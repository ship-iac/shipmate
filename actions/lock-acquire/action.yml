name: shipmate lock-acquire
description: >-
  Lock every cell of apply-detect's `cells` for the pull request through scripts/cell-lock,
  re-entering locks it already holds, then refuse unless the pull request stayed open while the
  locks were taken. A refusal releases the locks this run created. Mints its own App token with
  contents:write and pull-requests:read.
inputs:
  cells:
    description: JSON list of `{stack, environment}`, apply-detect's `cells` output.
    required: true
  pr-number:
    description: The pull request the locks are taken for.
    required: true
  app-id:
    description: shipmate App id (repo/org variable).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
outputs:
  refusal: { description: "The first error of the `::error::` message that failed the step (whatever its cause, a failed API call included), without the prefix, its lines joined into one; empty when the step raised none. Set although the step fails. Branch-controlled text (it can name a stack path), so a reader passes it through `env:`.", value: "${{ steps.a.outputs.refusal }}" }
  refused_by_rule: { description: "`true` when the step failed because another pull request or an unknown holder locks a cell; empty otherwise, a failed API call or a refusal whose rollback failed included. Set although the step fails.", value: "${{ steps.a.outputs.refused_by_rule }}" }
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: read
    - name: Acquire the cell locks
      id: a
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_CELLS: ${{ inputs.cells }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
      run: exec python3 "$GITHUB_ACTION_PATH/../../scripts/cell-lock" acquire
