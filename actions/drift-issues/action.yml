name: shipmate drift-issues
description: Open/update/close drift Issues from this run's drift-summary cell artifacts, which the calling job downloads into drift/. The only step on the drift path that mints the App key.
inputs:
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  cells:
    description: >-
      Every cell of the scanned tree as JSON [{environment,stack},...], from build-matrix's
      `cells` output, not only the cells this sweep's tag query selects: a filtered sweep must not
      close another sweep's Issues. An open drift Issue naming no cell in it is closed. Empty or
      unparseable is refused.
    required: true
  default-branch:
    description: >-
      The repository's default branch. Issues of cells absent from `cells` are closed only when
      this run's commit is that branch's live head.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `gh issue` and `gh label` resolve their repository from a checkout's git remote. This
        # job checks out nothing, so without GH_REPO every call fails with "failed to determine
        # base repository".
        GH_REPO: ${{ github.repository }}
        SHIPMATE_TREE_CELLS: ${{ inputs.cells }}
        SHIPMATE_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        # The App token holds issues: write alone; the default branch head is read with this.
        SHIPMATE_READ_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
