name: shipmate drift-issues
description: Open/update/close drift Issues from downloaded drift-summary cell artifacts, and Slack-notify each drifted cell. The only step on the drift path that mints the App key.
inputs:
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  slack-webhook:
    description: Slack webhook URL; a drifted cell is posted when set. Empty posts nothing.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # owner/repositories omitted on purpose: with both empty, create-github-app-token scopes
        # the token to the current repository whatever the trigger type, so this needs nothing out
        # of the `schedule` event payload.
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `gh issue list/create/edit/close` and `gh label` are repository-scoped and resolve their
        # repository from a checkout's git remote. The job that runs this checks out nothing, so
        # without GH_REPO every one of those calls fails with "failed to determine base
        # repository".
        GH_REPO: ${{ github.repository }}
        SHIPMATE_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
