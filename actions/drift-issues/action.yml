name: shipmate drift-issues
description: Open/update/close drift Issues from downloaded drift-summary cell artifacts, and Slack-notify each drifted cell. The only step on the drift path that mints the App key.
inputs:
  cells-dir:
    description: Directory holding downloaded drift-summary.*/cell.json trees.
    required: false
    default: drift
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  slack-webhook:
    description: Optional Slack webhook URL; a drifted cell is posted when set.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # owner/repositories intentionally omitted: with both empty,
        # create-github-app-token scopes the token to the current repository
        # regardless of trigger type, so this needs nothing out of the
        # `schedule` event payload.
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `gh issue list/create/edit/close` and `gh label` are repository-scoped
        # and resolve their repository from the git remote of a checkout. The
        # job that runs this holds the App key and so deliberately has no
        # checkout at all -- without GH_REPO every one of those calls fails with
        # "failed to determine base repository" on the first nightly run.
        GH_REPO: ${{ github.repository }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
        SHIPMATE_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
