name: shipmate drift-issues
description: Open/update/close drift Issues from downloaded drift-summary cell artifacts, and Slack-notify each drifted cell. The only step on the drift path that mints the App key.
inputs:
  cells-dir:
    description: Directory holding downloaded drift-summary.*/cell.json trees.
    required: false
    default: drift
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from a repo/org secret).
    required: true
  slack-webhook:
    description: Optional Slack webhook URL; a drifted cell is posted when set.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # owner/repositories intentionally omitted: this job runs from the
        # same `schedule`/`workflow_dispatch` triggers drift-cell's matrix
        # does, where `github.event.repository` is unpopulated -- with
        # `owner` still set, create-github-app-token would fall back to
        # scoping the token to ALL repos in the installation. Omitting both
        # inputs makes it default to the current repository regardless of
        # trigger type (its documented behavior when both are empty).
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
        SHIPMATE_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
