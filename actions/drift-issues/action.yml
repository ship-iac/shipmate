name: shipmate drift-issues
description: Download this run's drift-summary cell artifacts and open/update/close drift Issues from them. The only step on the drift path that mints the App key.
inputs:
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  cells:
    description: >-
      The drift matrix's cells as JSON [{environment,stack},...], from build-matrix's `cells`
      output. An open drift Issue naming no cell in it is closed. Empty or unparseable is refused.
    required: true
  default-branch:
    description: >-
      The repository's default branch. Issues of cells absent from `cells` are closed only when
      this run's commit is that branch's live head.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Download drift cell summaries
      # No continue-on-error: an artifact-API error fails the job rather than reading as no
      # drift.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: drift-summary.*
        path: drift
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # owner/repositories omitted on purpose: with both empty, create-github-app-token scopes
        # the token to the current repository whatever the trigger type, so this needs nothing out
        # of the `schedule` event payload.
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `gh issue` and `gh label` resolve their repository from a checkout's git remote. This
        # job checks out nothing, so without GH_REPO every call fails with "failed to determine
        # base repository".
        GH_REPO: ${{ github.repository }}
        SHIPMATE_MATRIX_CELLS: ${{ inputs.cells }}
        SHIPMATE_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        # The App token holds issues: write alone; the default branch head is read with this.
        SHIPMATE_READ_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
