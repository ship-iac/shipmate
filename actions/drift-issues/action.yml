name: shipmate drift-issues
description: Open/update/close drift Issues from downloaded drift-summary cell artifacts, and Slack-notify each drifted cell. The only step on the drift path that mints the App key.
inputs:
  cells-dir:
    description: Directory holding downloaded drift-summary.*/cell.json trees.
    required: false
    default: drift
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  slack-webhook:
    description: Slack webhook URL; a drifted cell is posted when set. Empty posts nothing.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # owner/repositories omitted on purpose: with both empty, create-github-app-token scopes
        # the token to the current repository whatever the trigger type, so this needs nothing out
        # of the `schedule` event payload.
        permission-issues: write

    - name: Upsert / close drift issues
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `gh issue list/create/edit/close` and `gh label` are repository-scoped and resolve their
        # repository from a checkout's git remote. The job that runs this holds the App key and so
        # deliberately has no checkout, and without GH_REPO every one of those calls fails with
        # "failed to determine base repository".
        GH_REPO: ${{ github.repository }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
        SHIPMATE_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-issues"
