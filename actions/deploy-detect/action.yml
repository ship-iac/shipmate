name: shipmate deploy-detect
description: Map a merge commit to its PR, find still-pending applies, order them into stages. Reads the job's GITHUB_TOKEN, which needs contents, checks, pull-requests and actions read.
inputs:
  base-sha:
    description: Previous main tip for change detection (github.event.before).
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  levels:
    description: >-
      JSON list, one element per populated env-level in run order; each element is a JSON string
      of that level's `{"L<i>-W<w>": [cell row, ...]}` stage map.
    value: "${{ steps.detect.outputs.levels }}"
  stages:
    description: >-
      JSON list in run order of `{key, n, level, first}`: the stage key, its run position, its
      index into `levels`, and whether it is its level's first stage.
    value: "${{ steps.detect.outputs.stages }}"
  keys:
    description: JSON list of the stage keys in run order.
    value: "${{ steps.detect.outputs.keys }}"
  counts:
    description: JSON list of each stage's cell count in run order.
    value: "${{ steps.detect.outputs.counts }}"
  cells:
    description: JSON list of every cell's `{stack, environment}`, in run order.
    value: "${{ steps.detect.outputs.cells }}"
  empty:
    description: "'true' when no stage has a cell."
    value: "${{ steps.detect.outputs.empty }}"
  head_sha:
    description: PR head SHA for the merged commit.
    value: "${{ steps.detect.outputs.head_sha }}"
  pr_number:
    description: Number of the pull request the commit merged; empty for a push that merged none.
    value: "${{ steps.detect.outputs.pr_number }}"
  warm:
    description: >-
      JSON list of `{stack, tf_vars}`, one managed stack of the merged tree per distinct provider
      lock digest, changed or not, up to 256; one tools-only row `{"stack": "", "tf_vars": {}}`
      when none has a lock naming a provider or the list could not be built.
    value: "${{ steps.detect.outputs.warm }}"
  max_parallel:
    description: The `warm` matrix's `max-parallel`, the table's validated `max_parallel`.
    value: "${{ steps.detect.outputs.max_parallel }}"
  push:
    description: >-
      JSON `{"stacks": [...], "outside": <bool>}`: the stacks the push changed, module dependents
      included, and whether it changed a path outside every stack (also true when the previous
      tip is unknown). `{"stacks": null, "outside": true}` past 64 KiB; empty when the diff
      failed or detect refused before reading the changed stacks.
    value: "${{ steps.detect.outputs.push }}"
  refused_locked:
    description: >-
      `true` when detect refused because another pull request holds a lock on a pending cell;
      empty otherwise.
    value: "${{ steps.detect.outputs.refused_locked }}"
runs:
  using: composite
  steps:
    - uses: $/actions/python-yaml
    - name: Detect pending applies and order into waves
      id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_BASE_SHA: ${{ inputs.base-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/deploy-detect"
