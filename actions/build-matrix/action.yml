name: shipmate build-matrix
description: Compute the changed stack x environment plan matrix (fails above 256 cells), and verify the signed checksum file of each tool version a pull request's `tools` changes.
inputs:
  base-sha:
    description: >-
      The pull request's base commit. Detect diffs from the merge base of it and the
      checked-out head. A sweep leaves it empty.
    required: false
    default: ""
  sweep:
    description: >-
      Set to 'true' only in a drift sweep: every stack is enumerated, the head-repository and
      head-commit checks are skipped, and `tags` is allowed. Never set it in a plan wrapper.
    required: false
    default: "false"
  head-repo:
    description: >-
      The pull request's head repository full name (owner/repo). Empty is refused: a run that
      does not state its head repository cannot be checked for being a fork.
    required: false
    default: ""
  head-sha:
    description: >-
      The pull request's head commit, the commit this run is planning. Wire it to the
      `head-sha` output of shipmate's `pr-facts` action. Empty is refused: a run that does not
      state the commit it is planning cannot have its checkout checked, and a checkout left on
      the base or the dispatch ref plans a different tree and reports no changes.
    required: false
    default: ""
  tags:
    description: >-
      Tag query narrowing the cells this run covers, over Terramate's on-disk tag form; not
      a Terramate query. ',' is OR and ':' is AND, so 'env/dev-eu,env/dev-us' is either
      environment and 'env/dev-eu:workload/app' is both. A cell matches against its stack's
      tags with every other `env/*` tag removed, so 'env/a:env/b' matches nothing. Empty (the
      default) covers every cell. Allowed only in a sweep, because narrowing a plan run would leave changed stacks with no plan cell and no apply
      check. Every clause matching no cell is named in a notice, with the terms no stack
      carries; a query matching no cell leaves the run empty with a notice; an empty term
      fails the run.
    required: false
    default: ""
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
  tools:
    description: >-
      The `tools` output of the job's `setup` step: the default branch's Terramate and OpenTofu
      versions, a JSON object of terramate and tofu to X.Y.Z versions. Each tool the pull request
      head's `.github/shipmate-config.yml` resolves to another version has that release's
      checksum file and signature verified before merge. Empty or invalid refuses outside a sweep;
      a sweep checks no head and passes none.
    required: false
    default: ""
outputs:
  matrix:
    description: 'JSON {"include":[{stack,environment,workload,role_arn,cred_region,tf_vars,config_path,env_binding},...]} for the plan matrix.'
    value: ${{ steps.build.outputs.matrix }}
  empty:
    description: '"true" when no stack changed in any environment.'
    value: ${{ steps.build.outputs.empty }}
  count:
    description: How many cells the plan matrix has. Read by the trusted summary job to check that every planned cell produced a summary.
    value: ${{ steps.build.outputs.count }}
  max_parallel:
    description: The plan or sweep matrix's `max-parallel`, a whole number from 1 to 256 -- the table's `max_parallel` (10 when unset), the most cell jobs the matrix runs at once. Unset when the step refuses.
    value: ${{ steps.build.outputs.max_parallel }}
  command_hints:
    description: The table's `command_hints` from the default branch, `true` or `false` (`false` when unset). Read by the plan summary to end the comment with its command section.
    value: ${{ steps.build.outputs.command_hints }}
  auto_envs:
    description: 'JSON [env, ...]: the default branch table''s `apply_mode: auto` environments, sorted; `[]` when none. Read by the plan summary to decide an auto apply and to say in the plan comment why none follows.'
    value: ${{ steps.build.outputs.auto_envs }}
  targeted_envs:
    description: 'JSON [env, ...]: the default branch table''s `apply_mode: targeted` environments, sorted; `[]` when none. Read by the plan summary to name `shipmate apply <env>` in the plan comment''s command section for each one holding a changed cell.'
    value: ${{ steps.build.outputs.targeted_envs }}
  cells:
    description: 'JSON [{environment,stack},...]: every cell of the scanned tree before the `tags` filter, in matrix order, as names alone to keep an env var small; not capped at 256 like the matrix. Read by drift-issues to close the Issues of removed cells, and by the plan summary to name the planned cells that left no cell summary; on a plan, where a `tags` filter is refused, it names exactly the matrix''s cells. The list reaches drift-issues in one environment variable: past about 2,000 cells (128 KiB, Linux''s per-string limit) every sweep''s `issues` job fails at its "Upsert / close drift issues" step before the script starts, after every cell has planned.'
    value: ${{ steps.build.outputs.cells }}
  unmanaged:
    description: 'JSON {"count": N, "paths": [...]}: how many scanned stacks carry no `env/*` tag and no `shipmate/local` tag, and the first ten of their paths, sorted; {"count": 0, "paths": []} when none. Shipmate plans, applies and sweeps none of them or of the `shipmate/local` stacks, but the plan''s repo-wide fmt and stale-codegen checks still cover both. Read by the plan summary for its comment line.'
    value: ${{ steps.build.outputs.unmanaged }}
  lost:
    description: 'JSON {"count": N, "pairs": [...]}: how many `<stack> / <env>` pairs this pull request untagged on stacks that keep another `env/*` tag, and the first ten, sorted; a stack that lost its last tag is in `unmanaged` instead, unless it carries `shipmate/local`. Empty on a drift sweep or with no pull-request base. Read by the plan summary for its comment line.'
    value: ${{ steps.build.outputs.lost }}
  refusal:
    description: The first error of the `::error::` message that failed `Compute plan matrix` or `Verify changed tools` (a refusal, a failed tool or API call, or a tool release that did not verify), without the prefix, its lines joined into one; empty when neither raised one. Set although the step fails, and read by the trusted summary job for the gate description. Branch-controlled text (it can name a stack path), so a reader passes it through `env:`.
    value: ${{ steps.build.outputs.refusal || steps.tools-verify.outputs.refusal }}
  env_order:
    description: 'JSON [env, ...]: every environment the matrix''s cells name, in apply order (the env-levels of the table''s `needs`, ties by name). Read by the plan summary to order the comment''s environment headings.'
    value: ${{ steps.build.outputs.env_order }}
runs:
  using: composite
  steps:
    - uses: $/actions/python-yaml
    - name: Compute plan matrix
      id: build
      shell: bash
      env:
        # The environment table is read from the default branch through the contents
        # API; no permission beyond the job's own contents: read.
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_BASE_SHA: ${{ inputs.base-sha }}
        SHIPMATE_HEAD_REPO: ${{ inputs.head-repo }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_SWEEP: ${{ inputs.sweep }}
        SHIPMATE_TAGS: ${{ inputs.tags }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_TOOLS: ${{ inputs.tools }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/build-matrix"
    # Verify only: detect runs no program a pull request chooses. Each release is the head's
    # version, which `Compute plan matrix` validated before writing `verify`.
    - name: Verify changed tools
      id: tools-verify
      if: ${{ steps.build.outputs.verify != '{}' }}
      shell: bash
      env:
        SHIPMATE_VERIFY: ${{ steps.build.outputs.verify }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/../setup/release.sh"
        title="Pull request tools verification failed"
        head="the pull request head's .github/shipmate-config.yml: "
        release_init "$title" ""
        require jq
        named='type == "object" and length > 0 and all(keys[]; . == "terramate" or . == "tofu")'
        jq -e "$named" <<<"$SHIPMATE_VERIFY" >/dev/null \
          || fail "build-matrix wrote verify=${SHIPMATE_VERIFY}, which names no tool to verify."
        # One read per tool, not a pipeline: a `while read` subshell would lose verify_tofu's
        # keyring, and with it the EXIT handler's gpg-agent kill.
        for tool in terramate tofu; do
          v="$(jq -r --arg t "$tool" '.[$t] // ""' <<<"$SHIPMATE_VERIFY")"
          [ -n "$v" ] || continue
          if [ "$tool" = tofu ]; then
            name=OpenTofu
            require gpg gpgconf
            base="https://github.com/opentofu/opentofu/releases/download/v${v}"
            files=("tofu_${v}_SHA256SUMS" "tofu_${v}_SHA256SUMS.gpgsig")
          else
            name=Terramate
            base="https://github.com/terramate-io/terramate/releases/download/v${v}"
            files=(checksums.txt checksums.txt.sig)
          fi
          # Not setup's release directory, whose verified files this would overwrite.
          dir="$RUNNER_TEMP/head-${tool}-release"
          mkdir -p "$dir"
          release_init "$title" "${head}${name} ${v}: "
          for f in "${files[@]}"; do
            fetch "$base/$f" "$dir/$f" "no ${name} ${v} release publishes ${f}; set tools.${tool} to a released version" "re-run the failed job"
          done
          # verify_x sets its own prefix; the refusal keeps the head's in front of it.
          "verify_${tool}" "$v" "$dir" || { release_init "$title" "${head}${name} ${v}: "; fail "$reason"; }
        done
