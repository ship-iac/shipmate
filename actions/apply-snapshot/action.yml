name: shipmate apply-snapshot
description: Map every cell in this run's wave matrices to its pre-existing App-authored apply-check ids, before any wave applies, and slice that map per wave. Lists check-runs with GITHUB_TOKEN's checks:read; mints an App token only to prove the key authenticates before any wave applies.
inputs:
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  waves-json:
    description: This run's wave matrices (the apply-env-level.yml waves_json shape).
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count.
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  counted:
    description: '"true" refuses a check-run listing that holds fewer rows than its total_count.'
    required: false
    default: "false"
outputs:
  by_wave:
    description: JSON object mapping each wave key of `waves-json` to the pre-existing apply-check ids of that wave's cells; `{}` for an empty wave.
    value: ${{ steps.snap.outputs.by_wave }}
  refusal:
    description: The first error of the `::error::` message that failed the step, without the prefix, its lines joined into one; empty when the step raised none. Set although the step fails. Branch-controlled text (it can name a stack path), so a reader passes it through `env:`.
    value: ${{ steps.snap.outputs.refusal }}
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - id: snap
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_WAVES_JSON: ${{ inputs.waves-json }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        COUNTED: ${{ inputs.counted }}
      run: |
        set -euo pipefail
        flag=()
        if [ "$COUNTED" = true ]; then flag=(--counted); fi
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/gate-status" checks "$HEAD_SHA" \
          '.check_runs[]' "${flag[@]}" > "$RUNNER_TEMP/checks.jsonl"; then
          msg="could not list the check runs on $HEAD_SHA; the step log names the cause"
          echo "refusal=$msg" >> "$GITHUB_OUTPUT"
          echo "::error::$msg"
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-snapshot" < "$RUNNER_TEMP/checks.jsonl"

    # An authenticated preflight whose token no step uses: a present but revoked or wrong key
    # fails the calling job here, before any check is flipped or written.
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-checks: write
