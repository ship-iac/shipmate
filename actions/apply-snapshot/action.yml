name: shipmate apply-snapshot
description: Map every cell in this run's wave matrices to its pre-existing App-authored apply-check ids, before any wave applies. Holds no App key; GITHUB_TOKEN's checks:read is enough to list check-runs.
inputs:
  head-sha:
    description: PR head SHA carrying the pending apply checks.
    required: true
  waves-json:
    description: This run's wave matrices (the apply-env-level.yml waves_json shape).
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count.
    required: true
outputs:
  snapshot:
    description: JSON object mapping each cell's apply check name to its list of pre-existing App-authored apply-check ids.
    value: ${{ steps.snap.outputs.snapshot }}
runs:
  using: composite
  steps:
    - id: snap
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_WAVES_JSON: ${{ inputs.waves-json }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/gate-status" checks "$HEAD_SHA" \
          '.check_runs[]' > "$RUNNER_TEMP/checks.jsonl"; then
          echo "::error::could not list the check runs on $HEAD_SHA; the step log names the cause"
          exit 1
        fi
        snap=$(python3 "$GITHUB_ACTION_PATH/../../scripts/apply-snapshot" < "$RUNNER_TEMP/checks.jsonl")
        echo "snapshot=$snap" >> "$GITHUB_OUTPUT"
