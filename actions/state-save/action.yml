name: shipmate state-save
description: Save one cell's sealed local state from a job that runs no pull-request code, or look up an earlier attempt's entry. scripts/state-save decides from the apply job's state output and the run's job listing; save takes the cell's bundle artifact whose bytes match the digest the apply job wrote and saves it under the cell's state key, or under the same key with -r1 when that save is not found. A save or lookup runs only on GitHub-hosted runners; takes no encryption key. Reads the job's GITHUB_TOKEN, which needs actions:read to list the run's jobs and artifacts.
inputs:
  stack:
    description: The cell's stack path.
    required: true
  environment:
    description: The cell's environment.
    required: true
  slug:
    description: The cell's stack slug.
    required: true
  state:
    description: The apply job's state output, possibly empty.
    required: true
  job-id:
    description: This job's check run id (job.check_run_id), which finds the cell's level in the run's job listing.
    required: true
runs:
  using: composite
  steps:
    - name: Decide and fetch the cell's state bundle
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STACK: ${{ inputs.stack }}
        ENV_NAME: ${{ inputs.environment }}
        SLUG: ${{ inputs.slug }}
        STATE: ${{ inputs.state }}
        JOB_ID: ${{ inputs.job-id }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/state-save"
    - name: Check the decision
      id: check
      # Fail-closed: an empty or unknown kind never reads as skip, and actions/state would read an
      # empty attempt as this job's own.
      shell: bash
      env:
        KIND: ${{ steps.fetch.outputs.kind }}
        ATTEMPT: ${{ steps.fetch.outputs.attempt }}
        STATE_PATH: ${{ steps.fetch.outputs.path }}
      run: |
        if [ "$KIND" = skip ]; then
          exit 0
        fi
        if { [ "$KIND" = save ] || [ "$KIND" = lookup ]; } && [ -n "$ATTEMPT" ] && [ -n "$STATE_PATH" ]; then
          echo "go=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::error::shipmate/actions/state-save: the save decision (kind '$KIND', attempt '$ATTEMPT') is unknown or incomplete, so this cell's state is not known saved. Never re-run this job or its workflow run. A re-run, a shipmate apply comment, or a merge can apply this cell's reviewed plan again against the state from before the apply. Before applying or merging any plan of this stack in this environment, on any pull request, follow docs/troubleshooting.md section The apply step ran and its state was not saved."
        exit 1
    - name: Save or look up the state
      id: primary
      # A save the cache service refuses fails this step; the -r1 call must still run.
      continue-on-error: true
      if: ${{ steps.check.outputs.go == 'true' }}
      uses: $/actions/state
      with:
        stack-slug: ${{ inputs.slug }}
        env: ${{ inputs.environment }}
        mode: ${{ steps.fetch.outputs.kind }}
        path: ${{ steps.fetch.outputs.path }}
        attempt: ${{ steps.fetch.outputs.attempt }}
        key-suffix: ""
    - name: Save or look up the state under the retry key
      id: retry
      if: ${{ !cancelled() && steps.check.outputs.go == 'true' && steps.primary.outputs.saved != 'true' }}
      uses: $/actions/state
      with:
        stack-slug: ${{ inputs.slug }}
        env: ${{ inputs.environment }}
        mode: ${{ steps.fetch.outputs.kind }}
        path: ${{ steps.fetch.outputs.path }}
        attempt: ${{ steps.fetch.outputs.attempt }}
        key-suffix: -r1
    - name: Fail unless the state entry was found
      id: found
      if: ${{ always() && steps.check.outputs.go == 'true' }}
      shell: bash
      env:
        PRIMARY_SAVED: ${{ steps.primary.outputs.saved }}
        RETRY_SAVED: ${{ steps.retry.outputs.saved }}
        STACK: ${{ inputs.stack }}
        ENV_NAME: ${{ inputs.environment }}
        SLUG: ${{ inputs.slug }}
        ATTEMPT: ${{ steps.fetch.outputs.attempt }}
      run: |
        if [ "$PRIMARY_SAVED" = true ] || [ "$RETRY_SAVED" = true ]; then
          exit 0
        fi
        key="state/$SLUG/$ENV_NAME/$GITHUB_RUN_ID-$ATTEMPT"
        echo "::error::the state of $ENV_NAME / $STACK was not found under $key or $key-r1. Never re-run this job or its workflow run. A re-run, a shipmate apply comment, or a merge can apply this cell's reviewed plan again against the state from before the apply. Before applying or merging any plan of this stack in this environment, on any pull request, follow docs/troubleshooting.md section The apply step ran and its state was not saved."
        exit 1
