name: shipmate pre-apply
description: >-
  The pre-apply check, read-only through scripts/cell-lock verify. Refuses unless the run attempt
  is 1, the pull request holds the cell's lock and is open at the applied head, the base tip is
  still the one detect read, and the cell's newest apply check records the wave row's plan run
  and plan-text digest and is no behind record; with auto true, also unless the pull request is
  not a draft, the provenance run is still the head's newest autoplan and the run the cell's
  newest plan record names, that record names an event action that starts an auto apply (opened, synchronize or ready_for_review) and, when it says its push landed on a draft, the newest autoplan is a ready-for-review run that deferred to it, no
  newer shipmate plan run of the pull request, by any actor, created since the provenance run is
  live or planned (its plan / detect job succeeded), and the autoplan's actor still has write access. With
  deploy true (a merge deploy's wave) it runs none of those and refuses only when a pull request
  other than pr-number, the merged one (empty on a push), holds the cell's lock, or, on a run
  attempt above 1, when an earlier attempt of this run may have applied the cell without saving
  its state. A read that fails refuses too. Reads the job's GITHUB_TOKEN, which needs
  contents:read, pull-requests:read and checks:read, and, with auto true or deploy true,
  actions:read.
inputs:
  pr-number:
    description: The pull request that must hold the lock; with deploy true, the merged pull request, empty on a push.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  head-sha:
    description: The applied head; the pull request must be open at it.
    required: true
  auto:
    description: true for an auto apply, false otherwise; any other value refuses.
    required: true
  provenance-run:
    description: The auto apply's plan run, from detect. Empty refuses when auto is true.
    required: false
    default: ""
  base-sha:
    description: The base tip detect read. Empty refuses unless deploy is true.
    required: false
    default: ""
  plan-run-id:
    description: The plan run the wave row applies, from detect. Empty refuses unless deploy is true.
    required: false
    default: ""
  plan-sha256:
    description: The plan-text digest the wave row applies, from detect. Empty refuses unless deploy is true.
    required: false
    default: ""
  app-id:
    description: The shipmate App id, whose apply checks carry the plan records.
    required: false
    default: ""
  deploy:
    description: true for a merge deploy's wave, false otherwise; any other value refuses.
    required: false
    default: "false"
  job-id:
    description: This job's check run id (job.check_run_id), which finds the cell's level in the run's job listing. Empty refuses a deploy run attempt above 1.
    required: false
    default: ""
outputs:
  refusal:
    description: The refusal on one line; empty when the check passed or failed before naming one.
    value: ${{ steps.verify.outputs.refusal }}
runs:
  using: composite
  steps:
    - name: Pre-apply check
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_AUTO: ${{ inputs.auto }}
        SHIPMATE_PROVENANCE_RUN: ${{ inputs.provenance-run }}
        SHIPMATE_BASE_SHA: ${{ inputs.base-sha }}
        SHIPMATE_PLAN_RUN_ID: ${{ inputs.plan-run-id }}
        SHIPMATE_PLAN_SHA256: ${{ inputs.plan-sha256 }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_DEPLOY: ${{ inputs.deploy }}
        JOB_ID: ${{ inputs.job-id }}
      run: exec python3 "$GITHUB_ACTION_PATH/../../scripts/cell-lock" verify
