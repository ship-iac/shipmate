name: shipmate summary
description: Mint a shipmate App installation token and, as the App, create the pending apply checks, upsert the sticky plan comment, and create/refresh the shipmate / gate check.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  head-sha:
    description: PR head commit SHA.
    required: true
  cells-dir:
    description: Directory holding downloaded cell-summary.*/cell.json.
    required: false
    default: cells
  run-conclusion:
    description: 'Conclusion of the plan workflow run (github.event.workflow_run.conclusion): success|failure|cancelled|skipped|…'
    required: true
  artifact-count:
    description: Number of cell-summary.* artifacts the API reports for that plan run, or "unknown" when that listing could not be read. Never decides "nothing changed" on its own — a zero here is quiet only when matrix-count agrees the plan matrix was empty, and a shortfall against either matrix-count or the parsed cells holds the gate, as does "unknown". Always supply matrix-count alongside it — the runner does not enforce `required` for a composite action, so omitting it silently holds every pull request.
    required: true
  matrix-count:
    description: How many cells the plan matrix had, read from the plan run's `plan-matrix.<N>` marker artifact, or "unknown" when no single marker could be read. Distinguishes an empty matrix (0 — docs-only or pin-bump) from an artifact listing that did not show the cells, which holds the gate.
    required: true
  plan-run-url:
    description: 'HTML URL of the plan workflow run (github.event.workflow_run.html_url). Used for the comment footer, the per-cell fallback link and the gate''s target_url; this run''s URL is used when empty.'
    required: false
    default: ""
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-statuses: write
        permission-pull-requests: write
        permission-contents: read
        # For doctor's environment probes below (`/environments` and, per
        # environment, `/environments/{name}`): on some configurations a
        # fine-grained installation token needs Actions read to see them, and a
        # degraded environment probe shows up only as a "could not verify"
        # annotation. A subset of the `actions: write` app/manifest.json already
        # declares, so it needs no re-approval of the installation.
        permission-actions: read

    - name: Mint an environments-scoped token for doctor's plan-env secret probe
      id: envtoken
      # Its own mint so that a permission request no org owner has accepted yet
      # cannot reach the apply checks or the gate status — argued in
      # scripts/tests/test_env_token_mint_scoping.py. Until it is accepted this
      # step's rejection also lands a failure annotation on this run, which
      # doctor harvests: expect an :x: row in the report beside the plan-env
      # secret check's "not performed" note, from the same one cause.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-environments: read

    - name: Create apply checks (pending / no-changes)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
      run: |
        set -euo pipefail
        [[ "$SHIPMATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $SHIPMATE_HEAD_SHA)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/pending-checks" > bodies.jsonl
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
        done < bodies.jsonl

    - name: Build comment + gate state
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        CELLS: ${{ inputs.cells-dir }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_PLAN_RUN_URL: ${{ inputs.plan-run-url }}
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # filter=all + latest-run-per-name (apply-gate.latest_by_name): the
        # same check-runs read discipline as gate-refresh / the detects.
        # summary-comment resolves each cell's plan-check link from this list
        # and writes comment.md + pending/count to GITHUB_OUTPUT. A transient
        # listing failure must not block creation of the shipmate / gate
        # check over what only feeds cosmetic links — degrade to an empty
        # listing (summary-comment already falls back to the workflow-run URL
        # when a check can't be resolved) instead of failing the step.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, html_url, id}' > check-runs.jsonl; then
          echo "::warning::check-runs listing failed; comment links degrade to the workflow-run URL"
          : > check-runs.jsonl
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/summary-comment" < check-runs.jsonl

    - name: Decide gate state and comment mode
      id: gate
      shell: bash
      env:
        SHIPMATE_RUN_CONCLUSION: ${{ inputs.run-conclusion }}
        SHIPMATE_ARTIFACT_COUNT: ${{ inputs.artifact-count }}
        SHIPMATE_MATRIX_COUNT: ${{ inputs.matrix-count }}
        SHIPMATE_CELL_COUNT: ${{ steps.build.outputs.count }}
        SHIPMATE_PENDING: ${{ steps.build.outputs.pending }}
        SHIPMATE_PLAN_RUN_URL: ${{ inputs.plan-run-url }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/gate-state" > gate.json

    - name: Doctor — settings-drift warnings (annotations only, never blocks)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # Empty when the mint above failed; doctor then says the plan-env secret
        # check did not run rather than reporting it clean.
        SHIPMATE_ENV_TOKEN: ${{ steps.envtoken.outputs.token }}
        SHIPMATE_DOCTOR_MODE: annotate
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The commit the pin probe reads the consumer's workflow files at.
        # Without it the contents API falls back to the default branch, where a
        # pin bump on this PR is not visible yet — doctor would report the pin
        # stale on the very run that fixes it.
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        # The engine's own owner/repo, so the pin probe reports on shipmate's
        # pins and not on some other org's shared action the consumer also uses.
        # `github.action_repository` is the slug of the running action, resolved
        # by GitHub at runtime — org-agnostic, never hardcoded. Empty when the
        # action runs from a local path, and doctor then says pin freshness was
        # not verified rather than guessing.
        SHIPMATE_ENGINE_REPO: ${{ github.action_repository }}
        # For the engine-pin probe's cross-repo release read: the App
        # installation token is scoped to the consumer repo and may not read
        # the engine repo; the workflow token can (public repo). `github.token`
        # is available inside a composite action — no new consumer input.
        SHIPMATE_PUBLIC_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Findings surface as workflow annotations on this run, not in the
        # sticky comment: `shipmate doctor` harvests them back onto the PR on
        # demand. doctor writes fully-formed ::warning::/::notice:: lines; cat
        # them through unmodified so no shell reconstruction can mangle them.
        if python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.txt; then
          cat doctor.txt
        else
          echo "::warning::doctor probes errored; settings-drift check skipped"
        fi

    - name: Upsert sticky comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        RUN_CONCLUSION: ${{ inputs.run-conclusion }}
      run: |
        set -euo pipefail
        marker='<!-- shipmate:summary -->'
        # Match the marker plus any Bot author, not a hardcoded login: the
        # App's bot login is derived from the registered App name, which a
        # consumer org may have had to slug differently than "shipmate[bot]".
        # `startswith`, not `contains`: build_comment emits the marker as the
        # body's FIRST line, and a `contains` match also selects a comment that
        # merely quotes it — doctor's report renders findings interpolating
        # repository data such as workflow file names — which this step would
        # then PATCH with the plan body.
        # The lookup writes to a file instead of piping into `head`: `head`
        # closing the pipe early raises EPIPE under `pipefail`, which is what
        # the `|| true` here used to swallow — together with a genuine listing
        # failure, whose empty id fell through to the create branch and left the
        # pull request with two marker-bearing Bot comments, the older of which
        # every later run then PATCHed. Removing the pipe removes the reason for
        # the `|| true`, so a failed listing skips the post and the next run
        # recovers. `Create/refresh gate` is a later step, so it still runs.
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq "map(select(((.body // \"\") | startswith(\"$marker\")) and .user.type == \"Bot\")) | .[0].id // empty" \
               > summary-comment-ids.txt; then
          echo "::warning::could not list this pull request's comments; the sticky plan comment was not updated this run"
          exit 0
        fi
        # --paginate evaluates --jq per page, so a marker match on >1 page emits
        # one id per matching page; the first line is the single id PATCH needs.
        id=$(head -n1 summary-comment-ids.txt)
        # gate-state has already collapsed every "the plan can't be trusted"
        # case (a non-success plan run, an unknown artifact count, a
        # cell/artifact-count shortfall, no readable plan-matrix marker, or an
        # artifact listing that disagrees with the marker's cell count)
        # into comment_mode=hold. Warn and leave any existing comment
        # untouched rather than overwriting the review surface with an
        # incomplete picture — `Create/refresh gate` below also fails the
        # gate on the same cases, so the pull request still shows that
        # something is wrong.
        if [ "$MODE" = "hold" ]; then
          echo "::warning::the plan run ($RUN_CONCLUSION) did not produce a trustworthy set of cell summaries; the sticky plan comment was left as it is"
          exit 0
        fi
        nothing_changed=false
        if [ "$MODE" = "nothing-changed" ]; then
          nothing_changed=true
        fi
        # Nothing changed and no comment to keep current: post nothing, so a
        # docs-only or engine-pin-bump pull request carries no plan comment at
        # all. Two things keep that silence from hiding anything: the gate is
        # written by a later step regardless, and a run where doctor reported
        # settings drift still posts, because doctor's annotations carry no
        # file/line and so render only on the run page — the comment's footer is
        # the only pull-request-visible pointer at `shipmate doctor`. Warnings
        # (actionable misconfiguration) only, not `::notice::` findings, which
        # are informational and would put a comment on every quiet run.
        # An existing comment is always kept current instead of suppressed, or a
        # pull request that planned changes and then pushed them away would keep
        # displaying applies that no longer exist.
        doctor_warned=false
        if [ -s doctor.txt ] && grep -q '^::warning' doctor.txt; then
          doctor_warned=true
        fi
        if [ "$nothing_changed" = "true" ] && [ -z "$id" ] && [ "$doctor_warned" = "false" ]; then
          echo "nothing changed, no existing plan comment, no doctor findings — nothing to post"
          exit 0
        fi
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
        fi

    - name: Create/refresh gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATE: ${{ steps.gate.outputs.state }}
        RUN_CONCLUSION: ${{ inputs.run-conclusion }}
      run: |
        set -euo pipefail
        # The gate is a commit STATUS, not a check-run. A check-run is bound to a
        # check-suite; an imperatively-created one lands in an arbitrary suite
        # when a commit carries more than one plan run (draft->ready, or a rapid
        # re-push, spawns two runs = two suites). The merge evaluator then reads
        # the live suite, finds no gate there, and blocks the PR forever while
        # the green gate sits in the stale suite. A commit status is
        # commit-scoped, so it is immune to that attribution race. Written
        # with the App's installation token (statuses:write) alongside the
        # App-authored checks and sticky comment above — one minted token
        # covers all three writes for this job.
        # gate-state already wrote gate.json and the state output. An empty
        # state means "write nothing" — a skipped or cancelled plan run.
        if [ -z "${STATE}" ]; then
          echo "plan run was ${RUN_CONCLUSION}; no gate written"
          exit 0
        fi
        gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input gate.json >/dev/null
