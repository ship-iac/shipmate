name: shipmate summary
description: Download this run's plan cell summaries, mint a shipmate App installation token and, as the App, create the pending apply checks, mirror an on-demand plan's own per-cell checks onto the pull request head, upsert the sticky plan comment, and write the shipmate / gate commit status through scripts/gate-status, greening it when this run published no queued apply check and every apply check is already done.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  head-sha:
    description: PR head commit SHA.
    required: true
  detect-result:
    description: 'Result of the plan workflow''s detect job (needs.detect.result): success|failure|cancelled|skipped.'
    required: true
  detect-refusal:
    description: >-
      build-matrix's `refusal` output: the first line of the `::error::` message from detect
      (a refusal or a failed tool or API call), empty when detect raised none. When
      detect-result is not success, gate-state writes it into the gate description; empty
      keeps the generic text.
    required: false
    default: ""
  plan-result:
    description: 'Result of the plan workflow''s plan matrix job (needs.plan.result). "skipped" is the NORMAL empty-matrix case, not a failure.'
    required: true
  planned-cells:
    description: How many cells detect planned (its `count` output). Compared against the cell summaries this job parses; any disagreement holds the gate and publishes no apply check.
    required: true
  on-demand:
    description: >-
      '"true"' when a human named this plan (the plan workflow's workflow_dispatch leg). Such a
      run's own per-cell checks are attached to the ref it was dispatched on, not to the pull
      request head, so they are mirrored onto the head here. Empty or "false" mirrors nothing:
      under a pull-request event those checks are already on the head, and a second copy would
      put two producers behind one check name. gate-state also reads it, with is-draft, to tell
      an autoplan of a draft from a requested plan.
    required: false
    default: ""
  is-draft:
    description: >-
      '"true"' when the pull request is a draft. With on-demand not "true", the run planned
      nothing and the gate is written pending with the draft reason.
    required: false
    default: ""
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
  unmanaged-stacks:
    description: >-
      build-matrix's `unmanaged` output: JSON {"count": N, "paths": [...]} for the changed
      stacks that carry no env/* tag, at most ten paths named. The plan comment counts and names
      them under its verdict. Empty (detect skipped) renders no line; a value not of that shape,
      or one naming other than min(N, 10) paths, renders none and warns.
    required: false
    default: ""
  lost-env-tags:
    description: >-
      build-matrix's `lost` output: JSON {"count": N, "pairs": [...]} for the `<stack> / <env>`
      pairs this pull request untagged on stacks that keep another env/* tag, at most ten
      pairs named. The plan comment counts and names them under the unmanaged stacks line.
      Empty (detect skipped, a sweep, no base) renders no line; a value not of that shape, or
      one naming other than min(N, 10) pairs, renders none and warns.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Download plan cell summaries
      # No `if:`: skipping it when zero cells were planned would make gate-state's "more cells
      # than planned" branch unreachable. A `pattern:` matching nothing succeeds.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      # A failed download must reach gate-state as a cell-summary shortfall that holds the gate,
      # not end the job before `Create/refresh gate` writes any gate.
      continue-on-error: true
      with:
        pattern: cell-summary.*
        path: cells
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-statuses: write
        permission-pull-requests: write
        permission-contents: read
        # Some configurations need Actions read for doctor's environment probes' `/environments`
        # reads; without it they degrade to "could not verify". A subset of the manifest's
        # `actions: write`, so no re-approval.
        permission-actions: read
        # doctor's plan-environment secret probe lists `/environments/{name}/secrets`.
        permission-environments: read

    - name: Hold the gate while apply checks publish
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_PLAN_RESULT: ${{ inputs.plan-result }}
        SHIPMATE_PLANNED_CELLS: ${{ inputs.planned-cells }}
      run: |
        set -euo pipefail
        gate_status="$GITHUB_ACTION_PATH/../../scripts/gate-status"
        hold() { python3 "$gate_status" hold "$SHIPMATE_HEAD_SHA" "$1"; }
        ended="re-plan this pull request (comment shipmate plan or push): its plan run ended before writing a final gate"
        # A failed read holds, which is always safe: a failed artifact download leaves `cells/`
        # empty over planned cells, so no cell summary is no proof of no work. A newer run's hold or
        # checks refuse without a write, so an older run never overwrites that run's gate or checks.
        rc=0
        python3 "$gate_status" refuse-newer "$SHIPMATE_HEAD_SHA" || rc=$?
        # Exit 4 is refuse-newer's newer-run refusal, which writes nothing.
        if [ "$rc" = 4 ]; then exit 1; fi
        if [ "$rc" != 0 ]; then
          hold "$ended"
          exit 1
        fi
        cells=$(find cells -name cell.json -print -quit 2>/dev/null || true)
        if ! python3 "$gate_status" checks "$SHIPMATE_HEAD_SHA" \
          '.check_runs[] | {name, status, conclusion, started_at, id, app: {id: .app.id}, external_id}' \
          > apply-check-runs.jsonl; then
          # Before the hold: under `set -e` a failed hold write ends the step.
          echo "::error::could not list the check runs on $SHIPMATE_HEAD_SHA; the step log names the cause"
          hold "$ended"
          exit 1
        fi
        rc=0
        SHIPMATE_CHECK_RUNS=apply-check-runs.jsonl \
          python3 "$GITHUB_ACTION_PATH/../../scripts/pending-checks" > bodies.jsonl || rc=$?
        # Exit 3 is pending-checks' newer-run refusal, which writes nothing.
        if [ "$rc" = 3 ]; then exit 1; fi
        if [ "$rc" != 0 ]; then
          hold "$ended"
          exit 1
        fi
        # Fail-closed, never `|| true`: gate-refresh greens an absent or pending gate, so a job dying
        # mid-publish would let an apply of the published cells merge the unpublished ones. A re-run
        # that publishes nothing still holds. `Create/refresh gate` replaces this hold.
        if [ -n "$cells" ]; then
          hold "plan run $GITHUB_RUN_ID holds this gate while it publishes; re-plan (comment shipmate plan or push) if that run has ended"
        fi

    - name: Create apply checks (pending / no-changes)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        set -euo pipefail
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
        done < bodies.jsonl

    - name: Mirror this run's per-cell plan checks onto the head
      if: ${{ inputs.on-demand == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        # GITHUB_SHA is the dispatch ref, where GitHub attached the plan jobs' checks.
        # Reviewer-facing only, so it degrades: `Create/refresh gate` is a later step, and the
        # degrade must not extend to anything the gate depends on.
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/gate-status" checks "$GITHUB_SHA" \
          '.check_runs[]' > run-checks.jsonl; then
          echo "::warning::could not list this run's own check runs; the per-cell plan checks were not mirrored onto the pull request head"
          exit 0
        fi
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/mirror-checks" < run-checks.jsonl > mirror.jsonl; then
          echo "::warning::could not build the mirrored per-cell checks; the pull request shows none for this run"
          exit 0
        fi
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          if ! printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null; then
            # Every remaining body is still attempted: the listing is unordered, so
            # bailing out drops an arbitrary suffix -- possibly the very failed cell
            # this mirror exists to show.
            name=${body#*\"name\": \"}
            echo "::warning::could not mirror the check \"${name%%\"*}\" onto the pull request head; the pull request shows only some of this run's plan checks"
            continue
          fi
        done < mirror.jsonl

    - uses: $/actions/python-yaml

    - name: "Doctor: settings-drift warnings (annotations only, never blocks)"
      id: doctor
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_DOCTOR_MODE: annotate
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The pin probe reads the workflow files here; the default branch would not show this
        # pull request's pin bump, and doctor would report the pin stale on the run that fixes it.
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        # The engine-pin probe's release read: the App token is scoped to the consumer repo, and
        # the workflow token can read the public engine repo. `github.token` resolves inside a
        # composite action, so this needs no consumer input.
        SHIPMATE_PUBLIC_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Findings are annotations on this run, harvested onto the pull request by `shipmate
        # doctor`. doctor writes whole ::warning::/::notice:: lines, catted through unmodified so
        # no shell reconstruction can mangle them.
        if python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.txt; then
          cat doctor.txt
        else
          echo "::warning::doctor probes errored; settings-drift check skipped"
        fi
        # Warnings (actionable misconfiguration) only: a `::notice::` finding is informational.
        # The one reading of doctor's result: the upsert takes `warned`.
        warned=false
        if [ -s doctor.txt ] && grep -q '^::warning' doctor.txt; then
          warned=true
        fi
        echo "warned=$warned" >> "$GITHUB_OUTPUT"

    - name: Build comment + gate state
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        # Reviewer-facing only, so each degrades: empty (draft autoplan, detect skipped) renders no
        # line, invalid renders none and warns. None touches `count`, `pending` or the gate.
        SHIPMATE_UNMANAGED: ${{ inputs.unmanaged-stacks }}
        SHIPMATE_LOST_ENV_TAGS: ${{ inputs.lost-env-tags }}
      run: |
        set -euo pipefail
        # Reviewer-facing only (cosmetic links), so a failure degrades to an empty listing and links
        # fall back to the workflow-run URL, rather than failing the step and blocking the gate
        # status.
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/gate-status" checks "$HEAD_SHA" \
          '.check_runs[] | {name, html_url, id}' > check-runs.jsonl; then
          echo "::warning::check-runs listing failed; comment links degrade to the workflow-run URL"
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/summary-comment" < check-runs.jsonl

    - name: Decide gate state and comment mode
      id: gate
      shell: bash
      env:
        SHIPMATE_DETECT_RESULT: ${{ inputs.detect-result }}
        SHIPMATE_DETECT_REFUSAL: ${{ inputs.detect-refusal }}
        SHIPMATE_PLAN_RESULT: ${{ inputs.plan-result }}
        SHIPMATE_PLANNED_CELLS: ${{ inputs.planned-cells }}
        SHIPMATE_CELL_COUNT: ${{ steps.build.outputs.count }}
        SHIPMATE_PENDING: ${{ steps.build.outputs.pending }}
        SHIPMATE_IS_DRAFT: ${{ inputs.is-draft }}
        SHIPMATE_ON_DEMAND: ${{ inputs.on-demand }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/gate-state"

    - name: Upsert sticky comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        PLAN_RESULT: ${{ inputs.plan-result }}
        DOCTOR_WARNED: ${{ steps.doctor.outputs.warned }}
        UNMANAGED: ${{ steps.build.outputs.unmanaged }}
        LOST: ${{ steps.build.outputs.lost }}
      run: |
        set -euo pipefail
        # A draft autoplan planned nothing, so an existing comment still describes a head
        # somebody planned; it is kept, and the draft run makes no comment API call.
        if [ "$MODE" = "draft" ]; then
          echo "the pull request was a draft when this run started and was not planned; the sticky plan comment was left as it is"
          exit 0
        fi
        # gate-state collapses every untrustworthy-plan case into comment_mode=hold. Keep the
        # existing comment rather than show an incomplete picture; `Create/refresh gate` fails
        # the gate on those cases, so the pull request still shows that something is wrong.
        if [ "$MODE" = "hold" ]; then
          echo "::warning::the plan job ($PLAN_RESULT) did not produce a trustworthy set of cell summaries; the sticky plan comment was left as it is"
          exit 0
        fi
        # Nothing changed: only an existing comment is kept current, or it would keep showing
        # applies that no longer exist. A doctor warning (the comment links the run page its
        # annotations live on), an unmanaged stacks line or a lost pairs line still posts.
        args=("$PR" comment.md)
        if [ "$MODE" = "nothing-changed" ] && [ "$DOCTOR_WARNED" != "true" ] && [ "$UNMANAGED" != "true" ] && [ "$LOST" != "true" ]; then
          args+=(--update-only)
        fi
        # A failed listing or write fails the job before `Create/refresh gate`: a gate written over
        # a stale comment shows reviewers the previous head's plan. A publish hold this run wrote
        # stays; a run that planned no cell wrote none, so the head keeps the gate it had, if any.
        result=$(python3 "$GITHUB_ACTION_PATH/../../scripts/upsert-comment" "${args[@]}")
        if [ "$result" = "list-failed" ]; then
          echo "::error::could not list this pull request's comments, so the sticky plan comment was not updated; re-plan this pull request (comment shipmate plan or push)"
          exit 1
        elif [ "$result" = "skipped" ]; then
          echo "nothing changed, no existing plan comment, no doctor findings; nothing to post"
        fi

    - name: Create/refresh gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATE: ${{ steps.gate.outputs.state }}
        DESCRIPTION: ${{ steps.gate.outputs.description }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        PLAN_RESULT: ${{ inputs.plan-result }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        gate_status="$GITHUB_ACTION_PATH/../../scripts/gate-status"
        # An empty state from gate-state means a cancelled plan job, so nothing is written.
        if [ -z "${STATE}" ]; then
          echo "plan job was ${PLAN_RESULT}; no gate written"
          exit 0
        fi
        # A draft status never replaces an existing gate: gate-refresh treats only `failure` as
        # a hold and greens `pending`, so a re-run draft run over a held head would open that
        # hold (scripts/tests/test_summary_draft_gate.py).
        if [ "$MODE" = "draft" ]; then
          if ! held=$(python3 "$gate_status" newest "$HEAD_SHA"); then
            echo "::warning::could not read the gate status of $HEAD_SHA; the draft gate status was not written"
            exit 0
          fi
          if [ -n "$held" ]; then
            echo "$HEAD_SHA keeps its ${held%% *} gate status; the draft gate status was not written"
            exit 0
          fi
        fi
        # A newer same-head run's hold (an evicted summary's) must not be buried by this write. A
        # failed read writes nothing; the publish hold, if any, stands.
        python3 "$gate_status" refuse-newer "$HEAD_SHA" || exit 1
        python3 "$gate_status" post "$HEAD_SHA" "$STATE" "$DESCRIPTION"
        # Degrades: the `pending` above is the fail-closed write, and the refresh only upgrades it
        # when every apply check is already done (an apply's refresh that ran before this write).
        # Skipped when this run published a queued check, which cannot be done yet.
        if [ "$STATE" = "pending" ] && [ "$MODE" != "draft" ] && [ -f bodies.jsonl ] \
          && ! grep -q '"status": "queued"' bodies.jsonl; then
          # A hold or a failed read does not fail this step, so its annotation stays a warning.
          if ! python3 "$gate_status" refresh "$HEAD_SHA" 2>&1 | sed 's/^::error:://'; then
            echo "::warning::could not refresh the gate of $HEAD_SHA; it stays pending until an apply refreshes it"
          fi
        fi
