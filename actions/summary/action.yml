name: shipmate summary
description: Mint a shipmate App installation token and, as the App, create the pending apply checks, mirror an on-demand plan's own per-cell checks onto the pull request head, upsert the sticky plan comment, and create/refresh the shipmate / gate check.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  head-sha:
    description: PR head commit SHA.
    required: true
  cells-dir:
    description: Directory holding downloaded cell-summary.*/cell.json.
    required: false
    default: cells
  detect-result:
    description: 'Result of the plan workflow''s detect job (needs.detect.result): success|failure|cancelled|skipped.'
    required: true
  plan-result:
    description: 'Result of the plan workflow''s plan matrix job (needs.plan.result). "skipped" is the NORMAL empty-matrix case, not a failure.'
    required: true
  planned-cells:
    description: How many cells detect planned (its `count` output). Compared against the cell summaries this job parses; any disagreement holds the gate.
    required: true
  on-demand:
    description: >-
      '"true"' when a human named this plan (the plan workflow's workflow_dispatch leg). Such a
      run's own per-cell checks are attached to the ref it was dispatched on, not to the pull
      request head, so they are mirrored onto the head here. Empty or "false" mirrors nothing —
      under a pull-request event those checks are already on the head, and a second copy would
      put two producers behind one check name.
    required: false
    default: ""
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-statuses: write
        permission-pull-requests: write
        permission-contents: read
        # doctor's environment probes read `/environments` and `/environments/{name}`; on
        # some configurations a fine-grained installation token needs Actions read to see
        # them, and a degraded probe surfaces only as a "could not verify" annotation. A
        # subset of the `actions: write` app/manifest.json already declares, so the
        # installation needs no re-approval.
        permission-actions: read

    - name: Mint an environments-scoped token for doctor's plan-env secret probe
      id: envtoken
      # Its own mint, so a permission request no org owner has accepted yet cannot reach the
      # apply checks or the gate status (scripts/tests/test_env_token_mint_scoping.py). Until
      # it is accepted the probe reports "not performed" as a warning; it clears on Accept.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-environments: read

    - name: Create apply checks (pending / no-changes)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
      run: |
        set -euo pipefail
        [[ "$SHIPMATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $SHIPMATE_HEAD_SHA)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/pending-checks" > bodies.jsonl
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
        done < bodies.jsonl

    - name: Mirror this run's per-cell plan checks onto the head
      if: ${{ inputs.on-demand == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        [[ "$SHIPMATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $SHIPMATE_HEAD_SHA)"; exit 1; }
        # GITHUB_SHA is this run's own commit, the ref it was dispatched on, which is where
        # GitHub attached the plan jobs' checks. This step degrades rather than fails: it only
        # decides what a reviewer sees, and `Create/refresh gate` is a later step. The pull
        # request still carries the App-authored apply checks and the sticky comment either
        # way. The degrade is deliberately not extended to anything the gate depends on.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[]' > run-checks.jsonl; then
          echo "::warning::could not list this run's own check runs; the per-cell plan checks were not mirrored onto the pull request head"
          exit 0
        fi
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/mirror-checks" < run-checks.jsonl > mirror.jsonl; then
          echo "::warning::could not build the mirrored per-cell checks; the pull request shows none for this run"
          exit 0
        fi
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          if ! printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null; then
            # Every remaining body is still attempted: the listing is unordered, so
            # bailing out drops an arbitrary suffix -- possibly the very failed cell
            # this mirror exists to show.
            name=${body#*\"name\": \"}
            echo "::warning::could not mirror the check \"${name%%\"*}\" onto the pull request head; the pull request shows only some of this run's plan checks"
            continue
          fi
        done < mirror.jsonl

    - name: Build comment + gate state
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        CELLS: ${{ inputs.cells-dir }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # filter=all + latest-run-per-name (apply-gate.latest_by_name): the same read
        # discipline as gate-refresh and the detects. summary-comment resolves each cell's
        # plan-check link from this list and writes comment.md plus pending/count to
        # GITHUB_OUTPUT.
        # A transient listing failure feeds only cosmetic links, so it degrades to an empty
        # listing -- summary-comment falls back to the workflow-run URL for a check it cannot
        # resolve -- rather than failing the step and blocking the gate status.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, html_url, id}' > check-runs.jsonl; then
          echo "::warning::check-runs listing failed; comment links degrade to the workflow-run URL"
          : > check-runs.jsonl
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/summary-comment" < check-runs.jsonl

    - name: Decide gate state and comment mode
      id: gate
      shell: bash
      env:
        SHIPMATE_DETECT_RESULT: ${{ inputs.detect-result }}
        SHIPMATE_PLAN_RESULT: ${{ inputs.plan-result }}
        SHIPMATE_PLANNED_CELLS: ${{ inputs.planned-cells }}
        SHIPMATE_CELL_COUNT: ${{ steps.build.outputs.count }}
        SHIPMATE_PENDING: ${{ steps.build.outputs.pending }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/gate-state" > gate.json

    - name: Doctor — settings-drift warnings (annotations only, never blocks)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # Empty when the `envtoken` mint failed; doctor then says the plan-env secret check
        # did not run rather than reporting it clean.
        SHIPMATE_ENV_TOKEN: ${{ steps.envtoken.outputs.token }}
        SHIPMATE_DOCTOR_MODE: annotate
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_CELLS_DIR: ${{ inputs.cells-dir }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The commit the pin probe reads the consumer's workflow files at. Without it the
        # contents API falls back to the default branch, where a pin bump on this pull request
        # is not visible yet, and doctor reports the pin stale on the run that fixes it.
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        # The engine's own owner/repo, so the pin probe reports on shipmate's pins and not on
        # some other org's shared action the consumer also uses. `github.action_repository` is
        # the running action's slug, resolved by GitHub at runtime -- org-agnostic, never
        # hardcoded. Empty when the action runs from a local path, and doctor then says pin
        # freshness was not verified rather than guessing.
        SHIPMATE_ENGINE_REPO: ${{ github.action_repository }}
        # For the engine-pin probe's cross-repo release read: the App installation token is
        # scoped to the consumer repo and may not read the engine repo; the workflow token
        # can, the engine repo being public. `github.token` resolves inside a composite
        # action, so this needs no new consumer input.
        SHIPMATE_PUBLIC_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Findings surface as workflow annotations on this run, not in the sticky comment:
        # `shipmate doctor` harvests them back onto the pull request on demand. doctor writes
        # fully-formed ::warning::/::notice:: lines, catted through unmodified so no shell
        # reconstruction can mangle them.
        if python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.txt; then
          cat doctor.txt
        else
          echo "::warning::doctor probes errored; settings-drift check skipped"
        fi

    - name: Upsert sticky comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        PLAN_RESULT: ${{ inputs.plan-result }}
      run: |
        set -euo pipefail
        marker='<!-- shipmate:summary -->'
        # The marker plus any Bot author, not a hardcoded login: the App's bot login derives
        # from the registered App name, which a consumer org may have had to slug differently
        # than "shipmate[bot]".
        # `startswith`, not `contains`: build_comment emits the marker as the body's FIRST
        # line, and a `contains` match also selects a comment that merely quotes it -- doctor's
        # report interpolates repository data such as workflow file names -- which this step
        # would then PATCH with the plan body.
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq "map(select(((.body // \"\") | startswith(\"$marker\")) and .user.type == \"Bot\")) | .[0].id // empty" \
               > summary-comment-ids.txt; then
          # A failed listing skips the post and the next run recovers. `Create/refresh gate`
          # is a later step, so the gate is still written.
          echo "::warning::could not list this pull request's comments; the sticky plan comment was not updated this run"
          exit 0
        fi
        # --paginate evaluates --jq per page, so a marker match on >1 page emits one id per
        # matching page; the first line is the single id PATCH needs. The lookup writes to a
        # file rather than piping into `head`, which raises EPIPE under `pipefail` and needs a
        # `|| true` that also masks a genuine listing failure -- an empty id then falls through
        # to the create branch, leaving two marker-bearing Bot comments, the older of which
        # every later run then PATCHes.
        id=$(head -n1 summary-comment-ids.txt)
        # gate-state has already collapsed every untrustworthy-plan case -- a failed detect, a
        # failed plan job, a plan job skipped with cells planned, an unreported planned count,
        # a shortfall between the planned cells and the summaries this job read -- into
        # comment_mode=hold. Warn and leave any existing comment untouched rather than
        # overwrite the review surface with an incomplete picture; `Create/refresh gate` fails
        # the gate on those cases, so the pull request still shows that something is wrong.
        if [ "$MODE" = "hold" ]; then
          echo "::warning::the plan job ($PLAN_RESULT) did not produce a trustworthy set of cell summaries; the sticky plan comment was left as it is"
          exit 0
        fi
        nothing_changed=false
        if [ "$MODE" = "nothing-changed" ]; then
          nothing_changed=true
        fi
        # Nothing changed and no comment to keep current: post nothing, so a docs-only or
        # engine-pin-bump pull request carries no plan comment at all. The gate is written by a
        # later step regardless.
        # A run where doctor reported settings drift still posts: doctor's annotations carry no
        # file/line and so render only on the run page, and the comment's footer is the only
        # pull-request-visible pointer at `shipmate doctor`. Warnings (actionable
        # misconfiguration) only -- a `::notice::` finding is informational and would put a
        # comment on every quiet run.
        # An existing comment is always kept current instead of suppressed, or a pull request
        # that planned changes and then pushed them away would keep displaying applies that no
        # longer exist.
        doctor_warned=false
        if [ -s doctor.txt ] && grep -q '^::warning' doctor.txt; then
          doctor_warned=true
        fi
        if [ "$nothing_changed" = "true" ] && [ -z "$id" ] && [ "$doctor_warned" = "false" ]; then
          echo "nothing changed, no existing plan comment, no doctor findings — nothing to post"
          exit 0
        fi
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
        fi

    - name: Create/refresh gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATE: ${{ steps.gate.outputs.state }}
        PLAN_RESULT: ${{ inputs.plan-result }}
      run: |
        set -euo pipefail
        # The gate is a commit STATUS, not a check-run. A check-run is bound to a check-suite,
        # and an imperatively-created one lands in an arbitrary suite when a commit carries
        # more than one plan run (draft->ready, or a rapid re-push, spawns two runs and two
        # suites); the merge evaluator then reads the live suite, finds no gate there, and
        # blocks the pull request forever while the green gate sits in the stale one. A commit
        # status is commit-scoped and immune to that attribution race. One minted App
        # installation token (statuses:write) covers this write, the App-authored checks and
        # the sticky comment.
        # gate-state already wrote gate.json and the state output. An empty state means write
        # nothing: a cancelled plan job.
        if [ -z "${STATE}" ]; then
          echo "plan job was ${PLAN_RESULT}; no gate written"
          exit 0
        fi
        gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input gate.json >/dev/null
