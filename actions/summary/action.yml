name: shipmate summary
description: Mint a shipmate App installation token and, as the App, create the pending apply checks, mirror an on-demand plan's own per-cell checks onto the pull request head, upsert the sticky plan comment, and create/refresh the shipmate / gate check.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  head-sha:
    description: PR head commit SHA.
    required: true
  detect-result:
    description: 'Result of the plan workflow''s detect job (needs.detect.result): success|failure|cancelled|skipped.'
    required: true
  plan-result:
    description: 'Result of the plan workflow''s plan matrix job (needs.plan.result). "skipped" is the NORMAL empty-matrix case, not a failure.'
    required: true
  planned-cells:
    description: How many cells detect planned (its `count` output). Compared against the cell summaries this job parses; any disagreement holds the gate.
    required: true
  on-demand:
    description: >-
      '"true"' when a human named this plan (the plan workflow's workflow_dispatch leg). Such a
      run's own per-cell checks are attached to the ref it was dispatched on, not to the pull
      request head, so they are mirrored onto the head here. Empty or "false" mirrors nothing:
      under a pull-request event those checks are already on the head, and a second copy would
      put two producers behind one check name. gate-state also reads it, with is-draft, to tell
      an autoplan of a draft from a requested plan.
    required: false
    default: ""
  is-draft:
    description: >-
      '"true"' when the pull request is a draft. With on-demand not "true", the run planned
      nothing and the gate is written pending with the draft reason.
    required: false
    default: ""
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-statuses: write
        permission-pull-requests: write
        permission-contents: read
        # Some configurations need Actions read for doctor's environment probes' `/environments`
        # reads; without it they degrade to "could not verify". A subset of the manifest's
        # `actions: write`, so no re-approval.
        permission-actions: read
        # doctor's plan-environment secret probe lists `/environments/{name}/secrets`.
        permission-environments: read

    - name: Create apply checks (pending / no-changes)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        [[ "$SHIPMATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $SHIPMATE_HEAD_SHA)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/pending-checks" > bodies.jsonl
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
        done < bodies.jsonl

    - name: Mirror this run's per-cell plan checks onto the head
      if: ${{ inputs.on-demand == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        [[ "$SHIPMATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $SHIPMATE_HEAD_SHA)"; exit 1; }
        # GITHUB_SHA is the dispatch ref, where GitHub attached the plan jobs' checks.
        # Reviewer-facing only, so it degrades: `Create/refresh gate` is a later step, and the
        # degrade must not extend to anything the gate depends on.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[]' > run-checks.jsonl; then
          echo "::warning::could not list this run's own check runs; the per-cell plan checks were not mirrored onto the pull request head"
          exit 0
        fi
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/mirror-checks" < run-checks.jsonl > mirror.jsonl; then
          echo "::warning::could not build the mirrored per-cell checks; the pull request shows none for this run"
          exit 0
        fi
        while IFS= read -r body; do
          [ -z "$body" ] && continue
          if ! printf '%s' "$body" | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null; then
            # Every remaining body is still attempted: the listing is unordered, so
            # bailing out drops an arbitrary suffix -- possibly the very failed cell
            # this mirror exists to show.
            name=${body#*\"name\": \"}
            echo "::warning::could not mirror the check \"${name%%\"*}\" onto the pull request head; the pull request shows only some of this run's plan checks"
            continue
          fi
        done < mirror.jsonl

    - name: "Doctor: settings-drift warnings (annotations only, never blocks)"
      id: doctor
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_DOCTOR_MODE: annotate
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The pin probe reads the workflow files here; the default branch would not show this
        # pull request's pin bump, and doctor would report the pin stale on the run that fixes it.
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
        # The engine-pin probe's release read: the App token is scoped to the consumer repo, and
        # the workflow token can read the public engine repo. `github.token` resolves inside a
        # composite action, so this needs no consumer input.
        SHIPMATE_PUBLIC_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Findings are annotations on this run, harvested onto the pull request by `shipmate
        # doctor`. doctor writes whole ::warning::/::notice:: lines, catted through unmodified so
        # no shell reconstruction can mangle them.
        if python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.txt; then
          cat doctor.txt
        else
          echo "::warning::doctor probes errored; settings-drift check skipped"
        fi
        # Warnings (actionable misconfiguration) only: a `::notice::` finding is informational.
        # The one reading of doctor's result: the upsert takes `warned`.
        warned=false
        if [ -s doctor.txt ] && grep -q '^::warning' doctor.txt; then
          warned=true
        fi
        echo "warned=$warned" >> "$GITHUB_OUTPUT"

    - name: Build comment + gate state
      id: build
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # filter=all + latest run per name, as gate-refresh and the detects read. Reviewer-facing
        # only (cosmetic links), so a failure degrades to an empty listing and links fall back to
        # the workflow-run URL, rather than failing the step and blocking the gate status.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, html_url, id}' > check-runs.jsonl; then
          echo "::warning::check-runs listing failed; comment links degrade to the workflow-run URL"
          : > check-runs.jsonl
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/summary-comment" < check-runs.jsonl

    - name: Decide gate state and comment mode
      id: gate
      shell: bash
      env:
        SHIPMATE_DETECT_RESULT: ${{ inputs.detect-result }}
        SHIPMATE_PLAN_RESULT: ${{ inputs.plan-result }}
        SHIPMATE_PLANNED_CELLS: ${{ inputs.planned-cells }}
        SHIPMATE_CELL_COUNT: ${{ steps.build.outputs.count }}
        SHIPMATE_PENDING: ${{ steps.build.outputs.pending }}
        SHIPMATE_IS_DRAFT: ${{ inputs.is-draft }}
        SHIPMATE_ON_DEMAND: ${{ inputs.on-demand }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/gate-state" > gate.json

    - name: Upsert sticky comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR: ${{ inputs.pr-number }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        PLAN_RESULT: ${{ inputs.plan-result }}
        DOCTOR_WARNED: ${{ steps.doctor.outputs.warned }}
      run: |
        set -euo pipefail
        # A draft autoplan planned nothing, so an existing comment still describes a head
        # somebody planned; it is kept, and the draft run makes no comment API call.
        if [ "$MODE" = "draft" ]; then
          echo "the pull request was a draft when this run started and was not planned; the sticky plan comment was left as it is"
          exit 0
        fi
        marker='<!-- shipmate:summary -->'
        # Marker plus any Bot author: the bot login derives from the App name, which an org may
        # slug differently. `startswith`, not `contains`: doctor's report can quote the marker
        # in repository data, and a `contains` match would PATCH the plan body over it.
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq "map(select(((.body // \"\") | startswith(\"$marker\")) and .user.type == \"Bot\")) | .[0].id // empty" \
               > summary-comment-ids.txt; then
          # A failed listing skips the post and the next run recovers. `Create/refresh gate`
          # is a later step, so the gate is still written.
          echo "::warning::could not list this pull request's comments; the sticky plan comment was not updated this run"
          exit 0
        fi
        # --paginate runs --jq per page, so take the first id. Via a file, not a pipe into `head`:
        # EPIPE under `pipefail` would need a `|| true` that masks a listing failure, and the empty
        # id would then create a second marker-bearing Bot comment.
        id=$(head -n1 summary-comment-ids.txt)
        # gate-state collapses every untrustworthy-plan case into comment_mode=hold. Keep the
        # existing comment rather than show an incomplete picture; `Create/refresh gate` fails
        # the gate on those cases, so the pull request still shows that something is wrong.
        if [ "$MODE" = "hold" ]; then
          echo "::warning::the plan job ($PLAN_RESULT) did not produce a trustworthy set of cell summaries; the sticky plan comment was left as it is"
          exit 0
        fi
        nothing_changed=false
        if [ "$MODE" = "nothing-changed" ]; then
          nothing_changed=true
        fi
        # Nothing changed and no comment to keep current: post nothing. A doctor warning still
        # posts, since the comment links the run page its annotations live on. An existing
        # comment is kept current, or it would keep showing applies that no longer exist.
        if [ "$nothing_changed" = "true" ] && [ -z "$id" ] && [ "$DOCTOR_WARNED" != "true" ]; then
          echo "nothing changed, no existing plan comment, no doctor findings; nothing to post"
          exit 0
        fi
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
        fi

    - name: Create/refresh gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATE: ${{ steps.gate.outputs.state }}
        MODE: ${{ steps.gate.outputs.comment_mode }}
        PLAN_RESULT: ${{ inputs.plan-result }}
      run: |
        set -euo pipefail
        # A commit STATUS, not a check-run: a check-run can land in a stale check-suite and block
        # the merge forever (CONTRACT.md says why). An empty state from gate-state means
        # a cancelled plan job, so nothing is written.
        if [ -z "${STATE}" ]; then
          echo "plan job was ${PLAN_RESULT}; no gate written"
          exit 0
        fi
        # A draft status never replaces an existing gate: gate-refresh treats only `failure` as
        # a hold and greens `pending`, so a re-run draft run over a held head would open that
        # hold (scripts/tests/test_summary_draft_gate.py). The read is gate-refresh's own.
        if [ "$MODE" = "draft" ]; then
          if ! held=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status?per_page=100" \
            --jq '[.statuses[] | select(.context == "shipmate / gate")] | .[0].state // empty'); then
            echo "::warning::could not read the gate status of $HEAD_SHA; the draft gate status was not written"
            exit 0
          fi
          if [ -n "$held" ]; then
            echo "$HEAD_SHA keeps its $held gate status; the draft gate status was not written"
            exit 0
          fi
        fi
        gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input gate.json >/dev/null
