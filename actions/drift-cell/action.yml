name: shipmate drift-cell
description: Plan one stack x env; hand a drift-summary cell artifact to a trusted trailing job. Authors no Issue itself and holds no App key; a plan environment must stay policy-free for planning to work, so a job naming one is reachable from a feature branch.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  tf-vars:
    description: The matrix row's resolved tf_vars, serialised with toJSON. Anything but a JSON object of strings is refused; the empty object is a legitimate value and an omitted input is not.
    required: true
  github-vars:
    description: The consumer's reachable GitHub variables, serialised with toJSON. Engine-built, so an empty rendering is a platform fact and not a consumer mistake; empty and null are both read as no variables.
    required: false
    default: ""
  consumer-secrets:
    description: The consumer's SHIPMATE_SECRETS envelope. Empty is the normal case (a consumer forwarding no secrets). Values are masked before anything is written.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Inject identity variables
      shell: bash
      env:
        SHIPMATE_TF_VARS: ${{ inputs.tf-vars }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_SECRETS: ${{ inputs.consumer-secrets }}
        STACK: ${{ inputs.stack }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/env-inject"

    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated), so injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Provider cache key
      id: provider-cache-key
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/provider-cache-key"

    - name: Restore provider cache
      id: provider-cache
      if: ${{ steps.provider-cache-key.outputs.digest != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: tofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ steps.provider-cache-key.outputs.digest }}

    - name: Initialize the stack
      id: init
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure

    - name: Name the restored provider cache entry
      if: ${{ failure() && steps.init.outcome == 'failure' && steps.provider-cache.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        KEY: ${{ steps.provider-cache.outputs.cache-primary-key }}
      run: |
        echo "::error::OpenTofu's init failed after restoring provider cache entry $KEY. If the log above says a cached package does not match the content of the downloaded package, delete the entry with gh cache delete $KEY --repo $GITHUB_REPOSITORY and re-run."

    - name: Check the provider cache
      id: provider-cache-files
      if: ${{ steps.provider-cache.outcome == 'success' && steps.provider-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        if [ -n "$(find "$TF_PLUGIN_CACHE_DIR" -type f -print -quit)" ]; then
          echo "populated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save provider cache
      if: ${{ steps.provider-cache-files.outputs.populated == 'true' }}
      # The key is the restore step's, computed before `init -reconfigure` can rewrite the
      # committed lock, as every reader's is.
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ steps.provider-cache.outputs.cache-primary-key }}

    - name: Locate state
      id: locate-state
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # Inside `terramate run` so a consumer's run.env TF_DATA_DIR or TF_WORKSPACE applies, as it
      # did for init.
      run: terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- python3 "$GITHUB_ACTION_PATH/../../scripts/state-path"

    - name: Restore state
      id: restore-state
      if: ${{ steps.locate-state.outputs.path != '' }}
      uses: $/actions/state
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ steps.locate-state.outputs.path }}

    - name: Plan + classify drift
      id: plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        echo "::group::terramate plan: $STACK"
        # errexit is lifted for the plan itself so the group is closed on a failing plan too --
        # tofu's error text is the one thing a reader needs here, and an unclosed `::group::`
        # collapses it.
        set +e
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu plan -input=false -lock=false -out=stack.otplan
        status=$?
        set -e
        echo "::endgroup::"
        # The explicit exit keeps a failed plan from falling through to the `tofu show` and
        # plan-classify lines that follow.
        [ "$status" -eq 0 ] || exit "$status"
        tofu -chdir="$STACK" show -json stack.otplan > plan.json
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" plan.json

    - name: Compose cell summary
      # always(): an earlier step or the plan itself may have failed, and the aggregator needs
      # a result for every attempted-or-blocked cell. drift-issues must never silently auto-close
      # an existing Issue for a stack x env whose plan attempt itself did not succeed.
      if: always()
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack }}
        ENV: ${{ inputs.env }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        DRIFTED: ${{ steps.plan.outputs.changed }}
        ADD: ${{ steps.plan.outputs.add }}
        CHANGE: ${{ steps.plan.outputs.change }}
        DESTROY: ${{ steps.plan.outputs.destroy }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/drift-cell-summary"

    - name: Upload drift summary
      # NOT continue-on-error, unlike apply-cell's namesake, whose artifact is only comment
      # data: this upload is the ONLY channel by which this cell's drift becomes visible at all.
      # Lose it and drift-issues' glob does not see the cell -- no Issue, no Slack, and a green
      # nightly run over real drift.
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: drift-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: ${{ runner.temp }}/cell.json
        # A job re-run in the same workflow run would otherwise 409 on the pre-existing name.
        overwrite: true
