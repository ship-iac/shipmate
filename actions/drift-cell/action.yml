name: shipmate drift-cell
description: Plan one stack x env; hand a drift-summary cell artifact to a trusted trailing job. Opens no Issue itself and holds no App key — a plan environment must stay policy-free for planning to work, so a job naming one is reachable from a feature branch.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the issue, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  state-path:
    description: Flavor state path, e.g. stacks/app/.state. Empty = remote backend owns state; the restore step is skipped.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated) — injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Restore state
      if: ${{ inputs.state-path != '' }}
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ inputs.state-path }}

    - name: Plan + classify drift
      id: plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        # Restored local-backend workspace state carries no `.terraform` record marking the
        # backend initialised, so `init` reads it as legacy state awaiting migration and
        # `-input=false` turns that question into a hard error.
        ws="$STACK/terraform.tfstate.d"
        hidden=$(mktemp -du "$RUNNER_TEMP/tfstate.d.XXXXXX")
        # The workspace state is hidden across the init and put back either way: under
        # `-reconfigure` a migration is never intended, and non-interactively it could never
        # have been answered.
        if [ -d "$ws" ]; then mv "$ws" "$hidden"; fi
        # errexit is lifted only so the workspace restore runs even on a failed init.
        set +e
        # `init` sits above the group marker: its output is setup noise, not plan output.
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure
        init_status=$?
        set -e
        # init recreates $ws empty; drop that so the real state replaces it
        # rather than being moved inside it.
        if [ -d "$hidden" ]; then rm -rf "$ws"; mv "$hidden" "$ws"; fi
        # Fatal: nothing is planned against state the engine could not initialise.
        [ "$init_status" -eq 0 ] || exit "$init_status"
        echo "::group::terramate plan: $STACK"
        # errexit is lifted for the plan itself so the group is closed on a failing plan too --
        # tofu's error text is the one thing a reader needs here, and an unclosed `::group::`
        # collapses it.
        set +e
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu plan -input=false -lock=false -out=stack.otplan
        status=$?
        set -e
        echo "::endgroup::"
        # The explicit exit keeps a failed plan from falling through to the `tofu show` and
        # plan-classify lines that follow.
        [ "$status" -eq 0 ] || exit "$status"
        tofu -chdir="$STACK" show -json stack.otplan > plan.json
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" plan.json

    - name: Compose cell summary
      # always(): a state restore or the plan itself may have failed, and the aggregator needs
      # a result for every attempted-or-blocked cell. drift-issues must never silently auto-close
      # an existing Issue for a stack x env whose plan attempt itself did not succeed.
      if: always()
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        DRIFTED: ${{ steps.plan.outputs.changed }}
        ADD: ${{ steps.plan.outputs.add }}
        CHANGE: ${{ steps.plan.outputs.change }}
        DESTROY: ${{ steps.plan.outputs.destroy }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os

        # plan_ok is false whenever `Plan + classify drift` did not conclude with success,
        # 'skipped' included. drift-issues treats such a cell as unknown and leaves its Issue
        # state untouched, rather than reading a missing or blank DRIFTED output as "clean".
        plan_ok = os.environ["PLAN_OUTCOME"] == "success"
        cell = {
            "stack": os.environ["STACK"],
            "stack_name": os.environ["STACK_NAME"],
            "environment": os.environ["ENV"],
            "plan_ok": plan_ok,
            "drifted": plan_ok and os.environ["DRIFTED"] == "true",
            "add": int(os.environ["ADD"]) if plan_ok else 0,
            "change": int(os.environ["CHANGE"]) if plan_ok else 0,
            "destroy": int(os.environ["DESTROY"]) if plan_ok else 0,
        }
        cell_path = os.path.join(os.environ["RUNNER_TEMP"], "cell.json")
        with open(cell_path, "w") as fh:
            json.dump(cell, fh)
        PY

    - name: Upload drift summary
      # NOT continue-on-error, unlike apply-cell's namesake, whose artifact is only comment
      # data: this upload is the ONLY channel by which this cell's drift becomes visible at all.
      # Lose it and drift-issues' glob does not see the cell -- no Issue, no Slack, and a green
      # nightly run over real drift.
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: drift-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: ${{ runner.temp }}/cell.json
        # A job re-run in the same workflow run would otherwise 409 on the pre-existing name.
        overwrite: true
