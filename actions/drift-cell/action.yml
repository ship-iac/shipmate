name: shipmate drift-cell
description: Plan one stack x env; hand a drift-summary cell artifact to a trusted trailing job. Never re-plans an Issue itself and holds no App key — a plan environment must stay policy-free for planning to work, so a job naming one is reachable from a feature branch.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the issue, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  state-path:
    description: Flavor state path, e.g. stacks/app/.state. Empty = remote backend owns state; the restore step is skipped.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated) — injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Restore state
      if: ${{ inputs.state-path != '' }}
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ inputs.state-path }}

    - name: Plan + classify drift
      id: plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # `init` sits above the group marker so a failed init's diagnostics are not
      # buried in a group this step then exits without ever closing (errexit).
      run: |
        set -euo pipefail
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure
        echo "::group::terramate plan: $STACK"
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu plan -input=false -lock=false -out=stack.otplan
        echo "::endgroup::"
        tofu -chdir="$STACK" show -json stack.otplan > plan.json
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" plan.json

    - name: Compose cell summary
      # Runs even when a prior step failed (state restore, or the plan itself)
      # -- the aggregator needs a result for every attempted-or-blocked cell,
      # and drift-issues must never silently auto-close an existing Issue for
      # a stack x env whose plan attempt itself did not succeed. plan_ok is
      # false whenever `steps.plan` did not conclude with success (including
      # 'skipped', when an earlier step failed); drift-issues treats a
      # plan_ok=false cell as unknown and leaves its Issue state untouched,
      # rather than reading a missing/blank DRIFTED output as "clean".
      # NOT continue-on-error, unlike apply-cell's namesake: this cell.json is
      # the ONLY channel by which this cell's drift reaches the trailing
      # `issues` job. Lose it and drift-issues' glob simply does not see the
      # cell -- no Issue, no Slack, and a green nightly run over real drift.
      # Writes cell.json to $RUNNER_TEMP, not the repo tree.
      if: always()
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
        DRIFTED: ${{ steps.plan.outputs.changed }}
        ADD: ${{ steps.plan.outputs.add }}
        CHANGE: ${{ steps.plan.outputs.change }}
        DESTROY: ${{ steps.plan.outputs.destroy }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os

        plan_ok = os.environ["PLAN_OUTCOME"] == "success"
        cell = {
            "stack": os.environ["STACK"],
            "stack_name": os.environ["STACK_NAME"],
            "environment": os.environ["ENV"],
            "plan_ok": plan_ok,
            "drifted": plan_ok and os.environ["DRIFTED"] == "true",
            "add": int(os.environ["ADD"]) if plan_ok else 0,
            "change": int(os.environ["CHANGE"]) if plan_ok else 0,
            "destroy": int(os.environ["DESTROY"]) if plan_ok else 0,
        }
        cell_path = os.path.join(os.environ["RUNNER_TEMP"], "cell.json")
        with open(cell_path, "w") as fh:
            json.dump(cell, fh)
        PY

    - name: Upload drift summary
      # NOT continue-on-error, unlike apply-cell's namesake (whose artifact is
      # only comment data): this upload is the sole path by which this cell's
      # drift becomes visible at all, so losing it must fail the cell rather
      # than leave a green run and an unreported drift.
      # overwrite: true so a job re-run in the same workflow run cannot 409 on
      # the pre-existing artifact name.
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: drift-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: ${{ runner.temp }}/cell.json
        overwrite: true
