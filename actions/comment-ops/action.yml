name: shipmate comment-ops
description: Parse a shipmate command comment, authorize it (every verb but `help` needs the commenter's write access to this repository; `apply` additionally requires that the PR satisfies the branch ruleset's review policy + mergeable + reviewed-plan-exists), and react or reject. Outputs feed actions/dispatch. Reads the job's GITHUB_TOKEN, which needs issues:write and pull-requests:write for reactions, refusal comments and pull request reads.
inputs:
  app-id:
    description: GitHub App id (a repo/org variable).
    required: true
  private-key:
    description: GitHub App private key (from the shipmate-engine environment secret).
    required: true
  comment-body:
    description: The PR comment body (author-controlled; never interpolated into a shell).
    required: true
  comment-user:
    description: Login of the commenter.
    required: true
  comment-id:
    description: Issue-comment id (for the reaction).
    required: true
  pr-number:
    description: PR number.
    required: true
  github-vars:
    description: >-
      The caller's reachable GitHub variables, serialised with toJSON. Read only when the
      environment table holds a variable reference; empty when unwired.
    required: false
    default: ""
outputs:
  authorized:
    description: true when the command is valid and authorized.
    # At most one of authz and planauthz runs, and a skipped step's empty output reads as false.
    # React on accept repeats this expression: a composite step cannot read its action's outputs.
    value: ${{ steps.authz.outputs.authorized == 'true' || steps.planauthz.outputs.authorized == 'true' }}
  environment:
    description: Parsed target environment; empty for a bare `shipmate apply` (all non-explicit environments) and on the plan route, whose dispatched run carries no environment.
    value: ${{ steps.authz.outputs.environment }}
  head-sha:
    description: PR head SHA; empty on the plan route, whose dispatched run resolves the head from the pull request itself.
    value: ${{ steps.authz.outputs.head_sha }}
  verb:
    description: The parsed verb, forwarded to actions/dispatch (plan, apply or unlock, which select a job in the consumer's one shipmate.yml). The `doctor` and `help` routes are answered in place and never reach a dispatch.
    value: ${{ steps.parse.outputs.route }}
runs:
  using: composite
  steps:
    - name: Ignore bot-authored comments
      id: guard
      shell: bash
      env:
        COMMENT_USER: ${{ inputs.comment-user }}
      run: |
        set -euo pipefail
        # Loop guard: shipmate's own comments (help output, apply results) can
        # contain text that matches the command grammar. GitHub reserves
        # brackets in logins, so the [bot] suffix cannot collide with a human.
        if [[ "$COMMENT_USER" == *"[bot]" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=comment-ops::ignoring a bot-authored comment (loop guard)"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Parse command
      id: parse
      if: ${{ steps.guard.outputs.skip != 'true' }}
      shell: bash
      env:
        COMMENT_BODY: ${{ inputs.comment-body }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be numeric (got: $PR_NUMBER)"; exit 1; }
        [[ "$COMMENT_ID" =~ ^[0-9]+$ ]] || { echo "::error::comment-id must be numeric (got: $COMMENT_ID)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/comment-parse"

    - name: Reject malformed / reserved command
      # Runs only when the comment IS a shipmate command but not a valid one. A non-command
      # is silently ignored, with no output. GITHUB_TOKEN posts the comment.
      if: ${{ steps.parse.outputs.is_command == 'true' && steps.parse.outputs.valid != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: refused
        SHIPMATE_REPLY_TEXT: ${{ steps.parse.outputs.error }}
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: Post help
      if: ${{ steps.parse.outputs.route == 'help' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # GITHUB_TOKEN, not the App: help must answer even when the App is not installed,
        # which is exactly when someone needs to be told what to run.
        python3 "$GITHUB_ACTION_PATH/../../scripts/comment-parse" --help-markdown > help.md
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@help.md >/dev/null

    - name: Acknowledge a command that changes no infrastructure
      # Two of the three routes are slow to show a result: doctor spends 30-60s in API calls
      # before its report comment appears, and a plan is a dispatched run that takes as long
      # to surface. Without an acknowledgement the commenter's next move is to comment again.
      if: ${{ steps.parse.outputs.route == 'doctor' || steps.parse.outputs.route == 'help' || steps.parse.outputs.route == 'plan' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        # `eyes` is the conventional "working on it" for a command that changes no
        # infrastructure; `rocket` marks an authorized dispatch. `|| true` because the reaction
        # is cosmetic -- comment deleted, reactions disabled -- and must not fail the command.
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
          -f content=eyes >/dev/null || true

    - name: Read the commenter's repository permission
      id: permission
      if: ${{ steps.parse.outputs.route != '' && steps.parse.outputs.route != 'help' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        USER: ${{ inputs.comment-user }}
      run: |
        set -euo pipefail
        # The commenter's repository permission is read with the workflow token, into a variable
        # because a pipe under pipefail turns SIGPIPE into a failure. A failed read or a value
        # outside [a-z]+ is written empty, which authorize refuses, and stderr stays in the log.
        if ! perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$USER/permission" --jq '.permission'); then
          perm=""
        fi
        [[ "$perm" =~ ^[a-z]+$ ]] || perm=""
        echo "permission=$perm" >> "$GITHUB_OUTPUT"

    - name: Authorize the commenter's permission
      id: access
      # Every later step that mints, reads or posts on these routes, except the two
      # refusal/failure replies below, runs only when this authorized. The `authorized`
      # output never reads it, so a permitted doctor dispatches nothing.
      if: ${{ steps.parse.outputs.route != '' && steps.parse.outputs.route != 'help' }}
      shell: bash
      env:
        PERMISSION: ${{ steps.permission.outputs.permission }}
        SHIPMATE_VERB: ${{ steps.parse.outputs.route }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/authorize" --permission

    - name: Reject a commenter without write access
      # GITHUB_TOKEN, not the App: this must answer even where the App is not installed.
      if: ${{ steps.parse.outputs.route != '' && steps.parse.outputs.route != 'help' && steps.access.outputs.authorized != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: refused
        SHIPMATE_REPLY_TEXT: ${{ steps.access.outputs.reason }}
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: Permission check failed
      # A failed step skips every later `success()`-gated step, so without `failure()` here
      # an errored read or decision would refuse in silence.
      if: ${{ failure() && (steps.permission.outcome == 'failure' || steps.access.outcome == 'failure') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: failed
        SHIPMATE_REPLY_TEXT: "could not decide the commenter's permission on this repository, so this command was not run. This run's log has the error; comment again."
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        exit 1

    - name: Authorize plan
      id: planauthz
      # Holds the fork check. No App token, no review, no plan lookup: a plan applies nothing,
      # and the commenter chooses only WHEN it runs. WHAT gets planned comes from the pull
      # request itself, never from this comment.
      if: ${{ steps.parse.outputs.route == 'plan' && steps.access.outputs.authorized == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Not a second gate: build-matrix refuses a fork head inside the dispatched run, on
        # checks that land on the dispatch ref where the pull request cannot see them. A head
        # this cannot read falls through to that refusal rather than replacing it.
        HEAD_REPO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.repo.full_name 2>/dev/null || true)
        if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "null" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "reason=this pull request's head is in \`$HEAD_REPO\`, and shipmate plans only branches of this repository: a fork's plan would execute the pull request's own Terramate/OpenTofu code with everything the plan environment holds." >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" = "null" ]; then
          echo "::notice title=comment-ops::could not read this pull request's head repository; a fork head is still refused inside the dispatched run."
        fi
        echo "authorized=true" >> "$GITHUB_OUTPUT"

    - name: Reject an unauthorized plan
      # GITHUB_TOKEN, not the App: the plan route mints nothing, so this must answer wherever
      # the route itself can run. Its one reason is the fork head's.
      if: ${{ steps.parse.outputs.route == 'plan' && steps.access.outputs.authorized == 'true' && steps.planauthz.outputs.authorized != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: plan
        SHIPMATE_REPLY_OUTCOME: refused
        SHIPMATE_REPLY_TEXT: ${{ steps.planauthz.outputs.reason }}
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: Mint App token for doctor
      id: doctortoken
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.access.outputs.authorized == 'true' }}
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: read
        permission-contents: read
        # `pull-requests`, not `issues`: a pull request comment posted to `/issues/{pr}/comments`
        # is governed by pull-requests, and an `issues: write` token gets 403 "Resource not
        # accessible by integration" there.
        permission-pull-requests: write
        # Some configurations need Actions read for the environment probes' `/environments`
        # reads; without it they degrade to "could not verify". A subset of the manifest's
        # `actions: write`, so no re-approval.
        permission-actions: read
        # The plan-environment secret probe lists `/environments/{name}/secrets`.
        permission-environments: read

    - name: "Doctor: App token unavailable"
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.access.outputs.authorized == 'true' && steps.doctortoken.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: doctor
        SHIPMATE_REPLY_OUTCOME: failed
        SHIPMATE_REPLY_TEXT: "could not mint a GitHub App token. Is the shipmate App installed on this repository, with every permission it requests accepted? Ask an org admin to install it or accept its pending permission request, then re-run `shipmate doctor`."
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: "Doctor: probe the manifest's full permission set"
      id: fullmint
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.access.outputs.authorized == 'true' && steps.doctortoken.outcome == 'success' }}
      # A mint requesting every permission app/manifest.json declares fails when the
      # installation is missing one, which is typical after a manifest bump nobody
      # re-approved. The failure IS the probe result, so it is never fatal.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-actions: write
        permission-pull-requests: write
        permission-contents: read
        permission-checks: write
        permission-statuses: write
        permission-issues: write
        permission-environments: read

    - name: "Doctor: gather head SHA, declared environments, annotations"
      id: gatherdoc
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.access.outputs.authorized == 'true' && steps.doctortoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.doctortoken.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_DOCTOR_MODE: check-ids
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha' || echo "")
        if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::warning::could not read the PR head SHA; doctor reports settings probes only"
          {
            echo "head_sha="
            echo "plan_run_ids="
            echo "harvest_failed=true"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "head_sha=$head" >> "$GITHUB_OUTPUT"
        # Harvest: latest shipmate-authored check run per name (check-ids mode filters on app slug/id),
        # then its annotations; never fails the command. harvest_failed is written last: an empty
        # "ann/<id>.json" fallback reads as "no annotations", so a failed fetch must not look complete.
        mkdir -p ann
        : > check-ids.tsv
        harvest_failed=false
        if GH_TOKEN="$APP_TOKEN" gh api --paginate \
             "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?filter=all&per_page=100" \
             --jq '.check_runs[] | {id, name, status, started_at, external_id, app: {id: .app.id}, app_slug: .app.slug, app_id: .app.id}' > check-runs.jsonl; then
          # check-ids mode also writes `harvest_pending`, true while any shipmate check run on
          # this commit is incomplete, so a report requested mid-run says so instead of printing
          # an all-clear nothing refreshes.
          if ! python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" < check-runs.jsonl > check-ids.tsv; then
            echo "::warning::doctor check-ids reduction failed; doctor reports settings probes only"
            : > check-ids.tsv
            harvest_failed=true
          fi
        else
          echo "::warning::check-runs listing failed; doctor reports settings probes only"
          harvest_failed=true
        fi
        # per_page=100, no --paginate: --paginate concatenates the pages' JSON arrays, which
        # json.loads rejects. 100 covers GHA's 10-per-level-per-step annotation caps.
        while IFS=$'\t' read -r id _name; do
          [ -z "$id" ] && continue
          if ! GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations?per_page=100" \
               > "ann/$id.json"; then
            echo '[]' > "ann/$id.json"
            echo "::warning::annotations fetch failed for check run $id; doctor reports a partial harvest"
            harvest_failed=true
          fi
        done < check-ids.tsv
        echo "harvest_failed=$harvest_failed" >> "$GITHUB_OUTPUT"
        # Declared environment set: the cell summaries of the plan runs this head's own apply
        # checks name, read from the check-runs listing, so a renamed plan workflow cannot
        # silently empty the environment probes. With no records doctor says so and skips them.
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/apply-gate" --plan-runs \
             < check-runs.jsonl > plan_runs.json; then
          echo '{}' > plan_runs.json
          echo "::warning::the plan records on this commit's apply checks could not be read; doctor skips the environment probes"
        fi
        run_ids=$(python3 -c 'import json,sys; print("\n".join(sorted(set(json.load(sys.stdin).values()))))' \
                    < plan_runs.json || echo "")
        # -R because this job checks out nothing, so gh has no remote to infer the repo from. One
        # directory per run: a cell planned in two runs has one artifact name in both, and those
        # identical names would collide in one shared directory.
        mkdir -p doctor-cells
        while read -r rid; do
          [ -n "$rid" ] || continue
          gh run download "$rid" -R "$GITHUB_REPOSITORY" -p 'cell-summary.*' -D "doctor-cells/$rid" \
            || echo "::warning::the cell summaries of plan run $rid could not be downloaded; doctor's environment probes may be incomplete"
        done <<< "$run_ids"
        echo "plan_run_ids=$(printf '%s' "$run_ids" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

    - name: "Doctor: render and upsert the sticky comment"
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.access.outputs.authorized == 'true' && steps.doctortoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.doctortoken.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_DOCTOR_MODE: report
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SHIPMATE_CELLS_DIR: doctor-cells
        SHIPMATE_HEAD_SHA: ${{ steps.gatherdoc.outputs.head_sha }}
        SHIPMATE_PLAN_RUN_IDS: ${{ steps.gatherdoc.outputs.plan_run_ids }}
        # `|| 'true'`: a red or skipped gatherdoc leaves the output empty, which is falsy, so the
        # harvest reads as failed. A real 'false' is a non-empty string, hence truthy, and passes.
        SHIPMATE_HARVEST_FAILED: ${{ steps.gatherdoc.outputs.harvest_failed || 'true' }}
        # Written by check-ids mode. No `|| 'true'` fallback: if gatherdoc never ran there is
        # no harvest at all and SHIPMATE_HARVEST_FAILED already says so, and adding "some runs
        # may still be going" on top of that would be noise.
        SHIPMATE_HARVEST_PENDING: ${{ steps.gatherdoc.outputs.harvest_pending }}
        # Workflow token for the pin probe's cross-repo release read: the App token is
        # scoped to the consumer repo.
        SHIPMATE_PUBLIC_TOKEN: ${{ github.token }}
        FULLMINT_OUTCOME: ${{ steps.fullmint.outcome }}
      run: |
        set -euo pipefail
        if [ "$FULLMINT_OUTCOME" != "success" ]; then
          export SHIPMATE_APP_PERMISSION_ERROR="a token mint requesting the manifest's full permission set failed"
        else
          export SHIPMATE_APP_PERMISSION_ERROR=""
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.md
        # `retry_hint` is resolved by the job-summary write, the one place that knows whether
        # the summary actually carries the report, so the listing-failure branch stays a single
        # `echo`: a nested `if` inside that asserted degrade block would hide the warning.
        retry_hint="comment shipmate doctor again to retry"
        # The job summary is written first so the run page keeps the report when the comment
        # listing (exit 0 by design) or the PATCH/POST fails. Reviewer-facing only, never fatal,
        # and not `|| true` (a guard forbids it here); `:-` keeps `set -u` alive when unset.
        if [ -z "${GITHUB_STEP_SUMMARY:-}" ] || ! cat doctor.md >> "$GITHUB_STEP_SUMMARY"; then
          echo "::warning::could not publish the doctor report to this job's summary; it survives only as the pull request comment"
        else
          retry_hint="read it in this job's summary, or $retry_hint"
        fi
        marker='<!-- shipmate:doctor -->'
        # Marker plus Bot author, since the App's bot login is org-dependent. `startswith`, not
        # `contains`: the sticky plan comment can quote the marker in `tofu plan` output, and a
        # `contains` match would PATCH the doctor report over the plan comment.
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
               --jq "map(select(((.body // \"\") | startswith(\"$marker\")) and .user.type == \"Bot\")) | .[0].id // empty" \
               > doctor-comment-ids.txt; then
          # `retry_hint` names the surface that survived, so the commenter need not re-run 30-60s
          # of probes for a report this run already rendered. A failed listing skips the post so
          # the next run can recover.
          echo "::warning::could not list this pull request's comments; the doctor report was not posted to the pull request this run: $retry_hint"
          exit 0
        fi
        # --paginate runs --jq per page, so take the first id. Via a file, not a pipe into `head`:
        # EPIPE under `pipefail` would need a `|| true` that masks a listing failure, and the empty
        # id would then create a second marker-bearing Bot comment.
        id=$(head -n1 doctor-comment-ids.txt)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@doctor.md >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@doctor.md >/dev/null
        fi

    - name: Mint App token (checks:read)
      id: apptoken
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.access.outputs.authorized == 'true' }}
      # A failed mint -- the App not being installed on this repository, for instance -- must
      # not hard-fail the job: `App token unavailable (App not installed?)` reports it to the
      # commenter.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        # The reviewed-plan lookup reads check runs, which needs `checks: read` (within the
        # manifest's `checks: write`). Unlock mints too, so an App missing from the repository
        # is reported before any lookup runs.
        permission-checks: read

    - name: App token unavailable (App not installed?)
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.access.outputs.authorized == 'true' && steps.apptoken.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: failed
        SHIPMATE_REPLY_TEXT: "could not mint a GitHub App token. Is the shipmate App installed on this repository (with checks:read)? Ask an org admin to install it, then retry."
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: Resolve gate configuration
      id: gate
      # Byte-identical to `Gather authorization inputs` below. `Authorize` reads
      # `ungated_envs` from this step, and a resolve that skips while authorization runs
      # hands it an empty list, which exempts nothing.
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.apptoken.outcome == 'success' }}
      # Fatal, deferred: every later step is `success()`-gated, so a hard failure here would
      # leave the commenter nothing, even for `unlock`, the recovery verb. `Gate configuration
      # unreadable` reports it and then fails the job in its place.
      continue-on-error: true
      shell: bash
      env:
        # The workflow token, not the App token: this reads repository contents only.
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/gate-config"

    - name: Gate configuration unreadable
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.apptoken.outcome == 'success' && steps.gate.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: refused
        SHIPMATE_REPLY_TEXT: "could not resolve the gate settings from `.github/shipmate.toml` on the default branch, so this command was not run. The file is not merged there, it does not validate, or a variable it references is unset or empty, this run's log says which. Fix that and comment again."
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        # The resolve's own failure, re-raised: `continue-on-error` above kept the job alive
        # long enough to post this, and a green run over an unauthorized command is not a
        # verdict this action may render.
        exit 1

    - name: Gather authorization inputs
      id: gather
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.apptoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.apptoken.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_VERB: ${{ steps.parse.outputs.route }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        # GitHub computes `mergeable` asynchronously, so retry. Not for unlock, which ignores it:
        # a merged pull request, the stranded-lock case, reports null forever, and the retries
        # would cost 15s and end in a false warning.
        if [ "$SHIPMATE_VERB" != unlock ]; then
          pr_ok=""
          for _ in 1 2 3 4 5; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
            m=$(python3 -c "import json;print(json.load(open('pr.json')).get('mergeable'))")
            if [ "$m" != "None" ]; then pr_ok=1; break; fi
            sleep 3
          done
          [ -n "$pr_ok" ] || echo "::warning::PR mergeable still unknown after retries; treating as not-ready"
        else
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
        fi
        # reviewDecision is null when no rule requires a review, or code-owner review owns no
        # changed file. NONE makes that explicit, since an empty string must never be a pass value:
        # authorize fails closed outside NONE and the enum.
        # shellcheck disable=SC2016 # $owner/$repo/$pr are GraphQL variables bound via -F.
        rd=$(gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision}}}' \
          -F owner="$OWNER" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
          --jq '.data.repository.pullRequest.reviewDecision // "NONE"')
        echo "review_decision=$rd" >> "$GITHUB_OUTPUT"
        # Each App-authored apply check on the head records its plan run, so these records are for
        # this head by construction; an empty mapping means nothing planned it (authorize refuses).
        # Unlock consumes no plan and authorize ignores the file for it, so it stays {}.
        if [ "$SHIPMATE_VERB" != unlock ]; then
          head=$(python3 -c "import json;print(json.load(open('pr.json'))['head']['sha'])")
          GH_TOKEN="$APP_TOKEN" gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?filter=all&per_page=100" \
            --jq '.check_runs[]' \
            | python3 "$GITHUB_ACTION_PATH/../../scripts/apply-gate" --plan-runs > plan_run.json
        else
          echo '{}' > plan_run.json
        fi

    - name: Authorize
      id: authz
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.apptoken.outcome == 'success' }}
      shell: bash
      env:
        PERMISSION: ${{ steps.permission.outputs.permission }}
        REVIEW_DECISION: ${{ steps.gather.outputs.review_decision }}
        PR_JSON: pr.json
        PLAN_RUN_JSON: plan_run.json
        SHIPMATE_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_GATE_UNGATED_ENVS: ${{ steps.gate.outputs.ungated_envs }}
        SHIPMATE_VERB: ${{ steps.parse.outputs.route }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/authorize"

    - name: React on accept
      if: ${{ steps.authz.outputs.authorized == 'true' || steps.planauthz.outputs.authorized == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        # `|| true`: the reaction is cosmetic, and a failed step skips the caller's dispatch.
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
          -f content=rocket >/dev/null || true
        echo "::notice title=comment-ops::command authorized (the caller's next step dispatches it)"

    # A report, not a decision: `reviewDecision` keeps no history, so nothing else records that
    # this apply was permitted without a review. It claims permission, never completion: nothing
    # has applied at comment time.
    - name: Report the review exemption
      if: ${{ steps.authz.outputs.ungated_exemption == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: apply
        SHIPMATE_REPLY_ENV: ${{ steps.authz.outputs.environment }}
        SHIPMATE_REPLY_OUTCOME: notice
        SHIPMATE_REPLY_TEXT: "${{ steps.authz.outputs.environment }}: ungated, permitted to apply without an approving review (`gated = false` in `.github/shipmate.toml`). The apply result comment shows what applied."
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null

    - name: Reject with reason
      if: ${{ (steps.parse.outputs.route == 'apply' || steps.parse.outputs.route == 'unlock') && steps.apptoken.outcome == 'success' && steps.authz.outputs.authorized != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_REPLY_VERB: ${{ steps.parse.outputs.verb }}
        SHIPMATE_REPLY_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_REPLY_OUTCOME: refused
        SHIPMATE_REPLY_TEXT: ${{ steps.authz.outputs.reason }}
      run: |
        set -euo pipefail
        body=$(python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment")
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
