name: shipmate comment-ops
description: Parse a shipmate command comment, authorize it (team membership via a short-lived App token, PR satisfies the branch ruleset's review policy + mergeable + reviewed-plan-exists), and react or reject. Outputs feed actions/dispatch.
inputs:
  app-id:
    description: GitHub App id (a repo/org variable).
    required: true
  private-key:
    description: GitHub App private key (from the shipmate-engine environment secret).
    required: true
  approvers-team:
    description: GitHub team slug whose members may apply.
    required: true
  comment-body:
    description: The PR comment body (author-controlled; never interpolated into a shell).
    required: true
  comment-user:
    description: Login of the commenter.
    required: true
  comment-id:
    description: Issue-comment id (for the reaction).
    required: true
  pr-number:
    description: PR number.
    required: true
  github-token:
    description: 'GITHUB_TOKEN with issues:write and pull-requests:write (reactions + reject comments + PR reads).'
    required: true
  ungated-envs:
    description: 'Optional: SHIPMATE_UNGATED_ENVS verbatim (comma-separated bare env names). Environments listed here may be applied without an approving review; every other environment keeps the branch ruleset requirement. Omitted or empty = every environment keeps it.'
    required: false
    default: ''
outputs:
  authorized:
    description: true when the command is valid and authorized.
    value: ${{ steps.authz.outputs.authorized }}
  is-command:
    description: true when the comment is a shipmate command at all.
    value: ${{ steps.parse.outputs.is_command }}
  environment:
    description: Parsed target environment; empty for a bare `shipmate apply` (all non-explicit environments).
    value: ${{ steps.authz.outputs.environment }}
  plan-run-id:
    description: Plan run id holding the reviewed plan.
    value: ${{ steps.authz.outputs.plan_run_id }}
  head-sha:
    description: PR head SHA.
    value: ${{ steps.authz.outputs.head_sha }}
runs:
  using: composite
  steps:
    - name: Ignore bot-authored comments, classify the commenter
      id: guard
      shell: bash
      env:
        COMMENT_USER: ${{ inputs.comment-user }}
        # Author-controlled only in the sense that GitHub classifies the author;
        # via env: like COMMENT_USER, never interpolated into the shell below.
        COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
      run: |
        set -euo pipefail
        # Loop guard: shipmate's own comments (help output, apply results) can
        # contain text that matches the command grammar. GitHub reserves
        # brackets in logins, so the [bot] suffix cannot collide with a human.
        if [[ "$COMMENT_USER" == *"[bot]" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=comment-ops::ignoring a bot-authored comment (loop guard)"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
        # Access gate for the `doctor` route, computed once here and consumed by
        # every step on that route. The report is a map of the guardrails a
        # repository is *missing*, so on a repository with public pull requests
        # it must not answer an arbitrary account. The allowlist is written
        # exactly once — repeated per-step in five `if:` conditions is precisely
        # how such a gate drifts open.
        # This is GitHub's own classification of the author's relationship to
        # the repository, NOT a permission check, and the output name says so:
        # a collaborator holding only the Read role, and an organization member
        # whose base repository permission is None, both pass this gate. What it
        # buys is that an account with no declared relationship to the
        # repository does not. CONTRIBUTOR — whose only signal is one merged
        # pull request — is deliberately excluded. Fails closed: the default
        # branch covers an absent `comment` context (empty string) as well as
        # every association not named above.
        case "$COMMENT_ASSOCIATION" in
          OWNER|MEMBER|COLLABORATOR) echo "privileged_association=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "privileged_association=false" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Parse command
      id: parse
      if: ${{ steps.guard.outputs.skip != 'true' }}
      shell: bash
      env:
        COMMENT_BODY: ${{ inputs.comment-body }}
        PR_NUMBER: ${{ inputs.pr-number }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be numeric (got: $PR_NUMBER)"; exit 1; }
        [[ "$COMMENT_ID" =~ ^[0-9]+$ ]] || { echo "::error::comment-id must be numeric (got: $COMMENT_ID)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/comment-parse"

    - name: Reject malformed / reserved command
      # Runs only when it IS a shipmate command but not valid. Non-commands are
      # silently ignored (no output). GITHUB_TOKEN posts the comment.
      if: ${{ steps.parse.outputs.is_command == 'true' && steps.parse.outputs.valid != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ERROR: ${{ steps.parse.outputs.error }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":x: shipmate: $ERROR" >/dev/null

    - name: Post help
      if: ${{ steps.parse.outputs.route == 'help' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # GITHUB_TOKEN, not the App: help must answer even when the App is not
        # installed, which is exactly when someone needs to be told what to run.
        python3 "$GITHUB_ACTION_PATH/../../scripts/comment-parse" --help-markdown > help.md
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@help.md >/dev/null

    - name: Acknowledge a read-only command
      # Ahead of every doctor step below, which spend 30-60s in API calls
      # before the report comment appears; with no acknowledgement the
      # commenter's next move is to comment again.
      if: ${{ steps.parse.outputs.route == 'doctor' || steps.parse.outputs.route == 'help' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        # `eyes` is the conventional "working on it" for a read-only command —
        # `rocket` stays reserved for an authorized apply. `|| true`: the
        # reaction is cosmetic (the comment may already be deleted, or
        # reactions disabled), and losing it must not fail the command.
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
          -f content=eyes >/dev/null || true

    - name: Doctor — reject a commenter without a privileged association
      # Silence would be indistinguishable from a broken engine, so say why.
      # GITHUB_TOKEN, not the App: this must answer even where the App is not
      # installed. One line, no probe results — the point is to disclose nothing.
      # The wording states what is actually checked (GitHub's classification of
      # the author), not "write access", which this gate does not verify.
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":x: shipmate: \`doctor\` reports this repository's settings, so it answers only organization members and repository collaborators." >/dev/null

    - name: Mint App token for doctor
      id: doctortoken
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' }}
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: read
        permission-contents: read
        permission-members: read
        # `pull-requests`, not `issues`: the report is posted to
        # `/issues/{pr}/comments`, but a pull request comment is governed by the
        # pull-requests permission -- an installation token holding only
        # `issues: write` gets 403 "Resource not accessible by integration"
        # there. Same permission the plan and apply comment mints use.
        permission-pull-requests: write
        # For the environment probes' reads (`/environments` and, per
        # environment, `/environments/{name}`): on some configurations a
        # fine-grained installation token needs Actions read to see them, and a
        # degraded environment probe shows up only as a "could not verify" note.
        # A subset of the `actions: write` app/manifest.json already declares,
        # so it needs no re-approval of the installation.
        permission-actions: read

    - name: Doctor — App token unavailable
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' && steps.doctortoken.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":x: shipmate: could not mint a GitHub App token — is the shipmate App installed on this repository? Ask an org admin to install it, then re-run \`shipmate doctor\`." >/dev/null

    - name: Doctor — probe the manifest's full permission set
      id: fullmint
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' && steps.doctortoken.outcome == 'success' }}
      # A mint requesting every permission app/manifest.json declares fails
      # when the installation is missing one (typical after a manifest bump
      # nobody re-approved). The failure IS the probe result — never fatal.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-actions: write
        permission-pull-requests: write
        permission-contents: read
        permission-members: read
        permission-checks: write
        permission-statuses: write
        permission-issues: write
        permission-environments: read

    - name: Doctor — mint an environments-scoped token for the plan-env secret probe
      id: envtoken
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' && steps.doctortoken.outcome == 'success' }}
      # Its own mint so that a permission request no org owner has accepted yet
      # costs this one probe and not the whole report — argued in
      # scripts/tests/test_env_token_mint_scoping.py.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-environments: read

    - name: Doctor — gather head SHA, declared environments, annotations
      id: gatherdoc
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' && steps.doctortoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_TOKEN: ${{ steps.doctortoken.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_DOCTOR_MODE: check-ids
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha' || echo "")
        if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::warning::could not read the PR head SHA; doctor reports settings probes only"
          {
            echo "head_sha="
            echo "run_id="
            echo "harvest_failed=true"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "head_sha=$head" >> "$GITHUB_OUTPUT"
        # Declared environment set: the cell summaries of the latest successful
        # plan run for this head. Absent -> doctor says so and skips those probes.
        # -R is required: this job has no checkout, so gh cannot infer the
        # repo from a git remote and `gh run download` would fail every time.
        mkdir -p doctor-cells
        run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/plan.yml/runs?head_sha=$head&status=success" \
                   --jq '.workflow_runs[0].id // ""' || echo "")
        if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -p 'cell-summary.*' -D doctor-cells; then
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        else
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "::warning::no plan-run cell summaries for $head; doctor skips the environment probes"
        fi
        # Harvest: latest shipmate-authored check-run per name (check-ids mode
        # filters on app slug/id), then its annotations. Degrades to an empty
        # harvest rather than failing the command. harvest_failed is written
        # exactly once, after every fallible step below has had a chance to
        # flip it -- a per-id annotations-fetch failure is just as much a
        # partial harvest as the listing or reduction failing, and an empty
        # "ann/<id>.json" fallback is byte-identical to "no annotations", so
        # it must not silently look like a clean, complete harvest.
        mkdir -p ann
        : > check-ids.tsv
        harvest_failed=false
        if GH_TOKEN="$APP_TOKEN" gh api --paginate \
             "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?filter=all&per_page=100" \
             --jq '.check_runs[] | {id, name, status, started_at, app_slug: .app.slug, app_id: .app.id}' > check-runs.jsonl; then
          # check-ids mode also writes the `harvest_pending` step output (true
          # when any shipmate-relevant check run on this commit has not
          # completed) -- it is the one step that already reads every check run,
          # and the render step needs it so a report requested mid-run says so
          # instead of printing an all-clear no later run ever refreshes.
          if ! python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" < check-runs.jsonl > check-ids.tsv; then
            echo "::warning::doctor check-ids reduction failed; doctor reports settings probes only"
            : > check-ids.tsv
            harvest_failed=true
          fi
        else
          echo "::warning::check-runs listing failed; doctor reports settings probes only"
          harvest_failed=true
        fi
        # per_page=100, no --paginate: --paginate concatenates the pages' JSON
        # arrays, which json.loads rejects; 100 comfortably covers GHA's
        # 10-per-level-per-step annotation caps.
        while IFS=$'\t' read -r id _name; do
          [ -z "$id" ] && continue
          if ! GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations?per_page=100" \
               > "ann/$id.json"; then
            echo '[]' > "ann/$id.json"
            echo "::warning::annotations fetch failed for check run $id; doctor reports a partial harvest"
            harvest_failed=true
          fi
        done < check-ids.tsv
        echo "harvest_failed=$harvest_failed" >> "$GITHUB_OUTPUT"

    - name: Doctor — render and upsert the sticky comment
      if: ${{ steps.parse.outputs.route == 'doctor' && steps.guard.outputs.privileged_association == 'true' && steps.doctortoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.doctortoken.outputs.token }}
        # Environment secret listing only; empty when the mint above failed, and
        # doctor then reports that check as not performed.
        SHIPMATE_ENV_TOKEN: ${{ steps.envtoken.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SHIPMATE_DOCTOR_MODE: report
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SHIPMATE_CELLS_DIR: doctor-cells
        SHIPMATE_TEAM: ${{ inputs.approvers-team }}
        SHIPMATE_HEAD_SHA: ${{ steps.gatherdoc.outputs.head_sha }}
        SHIPMATE_PLAN_RUN_ID: ${{ steps.gatherdoc.outputs.run_id }}
        # The engine's own owner/repo, so the pin probe reports on shipmate's
        # pins and not on some other org's shared action the consumer also uses.
        # `github.action_repository` is the slug of the running action, resolved
        # by GitHub at runtime — org-agnostic, never hardcoded. Empty when the
        # action runs from a local path, and doctor then says pin freshness was
        # not verified rather than guessing.
        SHIPMATE_ENGINE_REPO: ${{ github.action_repository }}
        SHIPMATE_ANNOTATIONS_DIR: ann
        SHIPMATE_CHECK_IDS: check-ids.tsv
        # `|| 'true'`: this render step's `if:` doesn't key on gatherdoc's
        # outcome, so if that step ever reds or is skipped, its output is
        # unset -- an empty string is falsy in this expression, so the
        # fallback fires and the harvest is (correctly) treated as failed
        # rather than silently reading as SHIPMATE_HARVEST_FAILED=false. A
        # real 'false' is a non-empty string, hence truthy, and passes through.
        SHIPMATE_HARVEST_FAILED: ${{ steps.gatherdoc.outputs.harvest_failed || 'true' }}
        # Written by check-ids mode, above. No `|| 'true'` fallback: if
        # gatherdoc never ran there is no harvest at all and
        # SHIPMATE_HARVEST_FAILED already says so — adding "and some runs may
        # still be going" on top of that would be noise, not honesty.
        SHIPMATE_HARVEST_PENDING: ${{ steps.gatherdoc.outputs.harvest_pending }}
        SHIPMATE_APP_PERMISSIONS_CHECKED: 'true'
        # Workflow token for the pin probe's cross-repo release read — the
        # App token is scoped to the consumer repo.
        SHIPMATE_PUBLIC_TOKEN: ${{ inputs.github-token }}
        FULLMINT_OUTCOME: ${{ steps.fullmint.outcome }}
      run: |
        set -euo pipefail
        if [ "$FULLMINT_OUTCOME" != "success" ]; then
          export SHIPMATE_APP_PERMISSION_ERROR="a token mint requesting the manifest's full permission set failed"
        else
          export SHIPMATE_APP_PERMISSION_ERROR=""
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/doctor" > doctor.md
        # The report is 30-60s of probes, and every path below can lose it: a
        # failed comment listing exits 0 by design (leaving a green run with no
        # report at all — indistinguishable, to the commenter, from the engine
        # ignoring them), and a failed PATCH/POST reds the step after the render.
        # So publish to the job summary before any of them: the run page then
        # carries the report even when the pull request does not, and a retry is
        # a convenience rather than the only way to see it.
        #
        # Degrading, never fatal, and deliberately not `|| true` (which a guard
        # on the listing below forbids in this step): the summary is the *added*
        # surface, so losing it must not cost the comment that posted fine
        # before — which a bare `cat` under `set -e` would do. `:-` in the
        # emptiness test keeps `set -u` from killing the step on a runner that
        # never exports the variable; the write itself can still fail on a full
        # or read-only runner volume.
        #
        # `retry_hint` resolves here, where whether the summary actually carries
        # the report is known, so the listing-failure branch stays a single
        # `echo` — it sits inside an `if ! gh api ... fi` whose degrade block is
        # asserted on, and a nested `if` there would hide the warning.
        retry_hint="comment shipmate doctor again to retry"
        if [ -z "${GITHUB_STEP_SUMMARY:-}" ] || ! cat doctor.md >> "$GITHUB_STEP_SUMMARY"; then
          echo "::warning::could not publish the doctor report to this job's summary; it survives only as the pull request comment"
        else
          retry_hint="read it in this job's summary, or $retry_hint"
        fi
        marker='<!-- shipmate:doctor -->'
        # Same upsert discipline as the sticky plan comment: marker + Bot
        # author (the App's bot login is org-dependent), single id.
        # `startswith`, not `contains`: render_report emits the marker as the
        # body's FIRST line. A `contains` match also selects a comment that
        # merely quotes the marker — the sticky plan comment embeds `tofu plan`
        # output verbatim — and this step would then PATCH the plan comment
        # with the doctor report, destroying it and orphaning the summary marker.
        # The lookup writes to a file instead of piping into `head`: `head`
        # closing the pipe early raises EPIPE under `pipefail`, which is what
        # the `|| true` here used to swallow — together with a genuine listing
        # failure, whose empty id fell through to the create branch and left the
        # pull request with two marker-bearing Bot comments. Removing the pipe
        # removes the reason for the `|| true`, so a failed listing can skip the
        # post and let the next run recover instead.
        if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
               --jq "map(select(((.body // \"\") | startswith(\"$marker\")) and .user.type == \"Bot\")) | .[0].id // empty" \
               > doctor-comment-ids.txt; then
          # `retry_hint` names the surface that did survive. Without it the only
          # signal is this annotation, which the commenter cannot see from the
          # pull request, so their next move is another `shipmate doctor` — a
          # second mint and another 30-60s of probes for a report already
          # rendered on this run.
          echo "::warning::could not list this pull request's comments; the doctor report was not posted to the pull request this run — $retry_hint"
          exit 0
        fi
        # --paginate evaluates --jq per page, so a marker match on >1 page emits
        # one id per matching page; the first line is the single id PATCH needs.
        id=$(head -n1 doctor-comment-ids.txt)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@doctor.md >/dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@doctor.md >/dev/null
        fi

    - name: Mint App token (members:read)
      id: apptoken
      if: ${{ steps.parse.outputs.route == 'apply' }}
      # Don't hard-fail the job if the token can't be minted (e.g. the App isn't
      # installed on this repo) — the next step reports it to the commenter.
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-members: read

    - name: App token unavailable (App not installed?)
      if: ${{ steps.parse.outputs.route == 'apply' && steps.apptoken.outcome != 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":x: shipmate: could not mint a GitHub App token — is the shipmate App installed on this repository (with members:read)? Ask an org admin to install it, then retry." >/dev/null

    - name: Gather authorization inputs
      id: gather
      if: ${{ steps.parse.outputs.route == 'apply' && steps.apptoken.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_TOKEN: ${{ steps.apptoken.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        TEAM: ${{ inputs.approvers-team }}
        USER: ${{ inputs.comment-user }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # PR (retry until mergeable is computed; GitHub computes it async).
        pr_ok=""
        for _ in 1 2 3 4 5; do
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          m=$(python3 -c "import json;print(json.load(open('pr.json')).get('mergeable'))")
          if [ "$m" != "None" ]; then pr_ok=1; break; fi
          sleep 3
        done
        [ -n "$pr_ok" ] || echo "::warning::PR mergeable still unknown after retries; treating as not-ready"
        # Review decision (ruleset-driven). A null decision means the ruleset
        # requires no review; normalize it to the explicit NONE sentinel —
        # authorize fails closed on anything that isn't NONE or a decision
        # enum value, so an empty string must never be a pass value.
        # The $owner/$repo/$pr tokens are GraphQL query variables (bound via -F), not
        # shell variables — single quotes are intentional.
        # shellcheck disable=SC2016
        rd=$(gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision}}}' \
          -F owner="$OWNER" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
          --jq '.data.repository.pullRequest.reviewDecision // "NONE"')
        echo "review_decision=$rd" >> "$GITHUB_OUTPUT"
        # Team membership via the App token (members:read). 200 + active = member.
        # Read into a variable, never a pipe: `grep -q` exits first, `gh` takes
        # SIGPIPE, and pipefail turns a member into a non-member. `|| true`
        # because a non-member is a 404 and errexit is live outside an `if`.
        state=$(GH_TOKEN="$APP_TOKEN" gh api "orgs/$OWNER/teams/$TEAM/memberships/$USER" --jq '.state' 2>/dev/null || true)
        if [ "$state" = "active" ]; then
          echo "is_member=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_member=false" >> "$GITHUB_OUTPUT"
        fi
        # Successful plan run for the CURRENT head (the reviewed-plan lookup).
        head=$(python3 -c "import json;print(json.load(open('pr.json'))['head']['sha'])")
        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/plan.yml/runs?head_sha=$head&status=success" \
          --jq '{id: (.workflow_runs[0].id // ""), head_sha: (.workflow_runs[0].head_sha // "")}' > plan_run.json
        # Empty id -> no plan run; normalize to {} so authorize treats it as stale.
        python3 -c "import json;d=json.load(open('plan_run.json'));open('plan_run.json','w').write(json.dumps(d if d.get('id') else {}))"

    - name: Authorize
      id: authz
      if: ${{ steps.parse.outputs.route == 'apply' && steps.apptoken.outcome == 'success' }}
      shell: bash
      env:
        IS_MEMBER: ${{ steps.gather.outputs.is_member }}
        APPROVERS_TEAM: ${{ inputs.approvers-team }}
        REVIEW_DECISION: ${{ steps.gather.outputs.review_decision }}
        PR_JSON: pr.json
        PLAN_RUN_JSON: plan_run.json
        SHIPMATE_ENV: ${{ steps.parse.outputs.env }}
        SHIPMATE_UNGATED_ENVS: ${{ inputs.ungated-envs }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/authorize"

    - name: React on accept
      if: ${{ steps.authz.outputs.authorized == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
          -f content=rocket >/dev/null
        echo "::notice title=comment-ops::command authorized (apply is dispatched by the caller's next step)"

    # A report, not a decision — authorize already decided. It exists because
    # `reviewDecision` keeps no history: once the review lands, nothing else
    # records that this apply was permitted without one. Wording matches
    # apply-comment's bare-path sentence and claims permission, never
    # completion — nothing has applied at comment time.
    - name: Report the review exemption
      if: ${{ steps.authz.outputs.ungated_exemption == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ENVIRONMENT: ${{ steps.authz.outputs.environment }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":memo: shipmate: environment \`$ENVIRONMENT\` is permitted to apply without an approving review, per the \`SHIPMATE_UNGATED_ENVS\` repository variable — see the apply result comment for what actually applied." >/dev/null

    - name: Reject with reason
      if: ${{ steps.parse.outputs.route == 'apply' && steps.apptoken.outcome == 'success' && steps.authz.outputs.authorized != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REASON: ${{ steps.authz.outputs.reason }}
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body=":x: shipmate: $REASON" >/dev/null
