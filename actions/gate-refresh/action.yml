name: shipmate gate-refresh
description: >-
  Write the shipmate / gate commit status on a head through scripts/gate-status: green it once
  every apply check is done, write a deploy run's verdict, or write a hold.
inputs:
  head-sha:
    description: PR head SHA carrying the apply checks and the gate.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  deploy-results:
    description: >-
      A deploy run's comma-separated job results. This or detect-result selects the post-merge
      verdict instead of a refresh; neither may be set with hold-description. Without
      detect-result the verdict is always `failure`.
    required: false
    default: ""
  detect-result:
    description: >-
      The deploy run's `detect` job result. This or deploy-results selects the post-merge verdict.
      A non-empty value other than `success` writes `failure`: detect stopped, so nothing applied.
      An empty value also writes `failure`, naming the missing input.
    required: false
    default: ""
  hold-description:
    description: >-
      Writes a `failure` gate with this description instead of a refresh; leads with the
      recovery, since the statuses API keeps 140 characters.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: read
        permission-statuses: write

    - name: Write the gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        DEPLOY_RESULTS: ${{ inputs.deploy-results }}
        DETECT_RESULT: ${{ inputs.detect-result }}
        HOLD_DESCRIPTION: ${{ inputs.hold-description }}
      run: |
        set -euo pipefail
        gate_status="$GITHUB_ACTION_PATH/../../scripts/gate-status"
        if [ -n "$HOLD_DESCRIPTION" ]; then
          if [ -n "$DEPLOY_RESULTS$DETECT_RESULT" ]; then
            echo "::error::hold-description cannot be set with deploy-results or detect-result"
            exit 1
          fi
          python3 "$gate_status" hold "$HEAD_SHA" "$HOLD_DESCRIPTION"
        elif [ -n "$DEPLOY_RESULTS$DETECT_RESULT" ]; then
          python3 "$gate_status" deploy "$HEAD_SHA" "$DETECT_RESULT" "$DEPLOY_RESULTS"
        else
          rc=0
          out=$(python3 "$gate_status" refresh "$HEAD_SHA") || rc=$?
          # Exit 3 is gate-status' hold: this refresh was due and is refused, so the step fails.
          if [ "$rc" = 3 ]; then
            echo "::error::$out"
            exit 1
          fi
          if [ -n "$out" ]; then echo "$out"; fi
          exit "$rc"
        fi
