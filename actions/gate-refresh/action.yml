name: shipmate gate-refresh
description: Complete the shipmate / gate check on a PR head once every apply check is done (pre-merge applies).
inputs:
  head-sha:
    description: PR head SHA carrying the apply checks and the gate.
    required: true
  app-id:
    description: shipmate App id (repo/org variable); only checks authored by this App count as done.
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
outputs:
  verdict: { description: "complete, pending, or no-applies", value: "${{ steps.scan.outputs.verdict }}" }
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: read
        permission-statuses: write

    - name: Scan apply checks on the head commit
      id: scan
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      # filter=all: a re-created check name keeps its historical runs; apply-gate
      # groups by name and judges the newest run per name. A duplicate apply
      # check created mid-apply is left pending by apply-cell (it completes only
      # ids snapshotted before its apply began), so the gate correctly stays
      # pending until that duplicate's plan is itself applied.
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, status, conclusion, started_at, id, app: {id: .app.id}}' \
          | python3 "$GITHUB_ACTION_PATH/../../scripts/apply-gate"
    - name: Complete gate
      if: ${{ steps.scan.outputs.verdict == 'complete' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        # A hold must not be cleared by the very applies it exists to prevent.
        # `shipmate apply` never consults the gate (scripts/authorize reads
        # reviewDecision), so the cells that WERE parsed can apply and land
        # here with verdict=complete while the stacks whose summaries were
        # never read still have no apply check at all.
        # Matched on the STATE alone, not on the description: gate-state writes
        # `failure` for exactly its hold cases (non-success plan run,
        # unreadable artifact list, cell/artifact shortfall) and only
        # `pending`/`success` otherwise -- so this is narrow enough that a
        # legitimate pending -> success refresh is untouched, and it needs no
        # wording to stay in sync. The only exit from a hold is a fresh plan
        # run, which rewrites the gate itself.
        held=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
          --jq '[.statuses[] | select(.context == "shipmate / gate")] | .[0].state // empty')
        if [ "$held" = "failure" ]; then
          echo "::error::shipmate / gate is held for $HEAD_SHA because the plan run's evidence was incomplete — some planned stacks may carry no apply check. Re-plan this pull request; the gate cannot be greened from apply checks alone."
          exit 1
        fi
        python3 - > gate.json <<'PY'
        import json, os
        # Commit status, not a check-run — see actions/summary for the rationale
        # (check-runs bind to a suite; a commit status is commit-scoped and so
        # survives the multi-suite attribution race).
        body = {"state": "success", "context": "shipmate / gate",
                "description": "all applies complete — nothing left to apply"}
        server, repo, run_id = (os.environ.get(k, "") for k in
                                ("GITHUB_SERVER_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID"))
        if server and repo and run_id:
            body["target_url"] = f"{server}/{repo}/actions/runs/{run_id}"
        print(json.dumps(body))
        PY
        gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input gate.json >/dev/null
