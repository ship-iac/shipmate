name: shipmate setup
description: Install pinned Terramate + OpenTofu and point OpenTofu at a provider plugin cache directory.
runs:
  using: composite
  steps:
    - name: Resolve versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        # `$/` fetches the whole engine repository at the pinned SHA, so this reads the
        # versions this release was tested with. An unresolved version must fail the step:
        # setup-opentofu reads an empty tofu_version as "latest", which is silent tool drift.
        versions="$GITHUB_ACTION_PATH/../../VERSIONS"
        if [ ! -f "$versions" ]; then
          echo "::error::$versions does not exist: it carries the terramate= and tofu= versions this release pins."
          exit 1
        fi
        TERRAMATE_VERSION="$(sed -n 's/^terramate=//p' "$versions" | tail -n1 | tr -d '[:space:]')"
        TOFU_VERSION="$(sed -n 's/^tofu=//p' "$versions" | tail -n1 | tr -d '[:space:]')"
        if [ -z "$TERRAMATE_VERSION" ]; then
          echo "::error::$versions carries no terramate= line; restore it."
          exit 1
        fi
        if [ -z "$TOFU_VERSION" ]; then
          echo "::error::$versions carries no tofu= line; restore it."
          exit 1
        fi
        # `sha256sum` lines whose asset name starts with the prefix. The name carries the
        # version, so a version bump without its checksum lines finds none and refuses.
        pinned() { tr -d '\r' < "$versions" | awk -v p="$1" 'NF == 2 && index($2, p) == 1'; }
        TERRAMATE_SHA256="$(pinned "terramate_${TERRAMATE_VERSION}_")"
        TOFU_SHA256="$(pinned "tofu_${TOFU_VERSION}_" | awk '{print $1}')"
        if [ -z "$TERRAMATE_SHA256" ]; then
          echo "::error::$versions carries no sha256 line for terramate ${TERRAMATE_VERSION}; paste the release's checksum lines."
          exit 1
        fi
        if [ -z "$TOFU_SHA256" ]; then
          echo "::error::$versions carries no sha256 line for tofu ${TOFU_VERSION}; paste the release's checksum lines."
          exit 1
        fi
        {
          echo "terramate=$TERRAMATE_VERSION"
          echo "tofu=$TOFU_VERSION"
          printf 'terramate_sha256<<SHIPMATE_EOF\n%s\nSHIPMATE_EOF\n' "$TERRAMATE_SHA256"
          printf 'tofu_sha256<<SHIPMATE_EOF\n%s\nSHIPMATE_EOF\n' "$TOFU_SHA256"
        } >> "$GITHUB_OUTPUT"
    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ steps.versions.outputs.tofu }}
        tofu_wrapper: false
        # A non-empty list makes setup-opentofu refuse a zip outside it; without one it
        # installs unverified when the release's SHA256SUMS cannot be fetched.
        checksums: ${{ steps.versions.outputs.tofu_sha256 }}
    - name: Install Terramate
      shell: bash
      env:
        SHIPMATE_TERRAMATE_VERSION: ${{ steps.versions.outputs.terramate }}
        SHIPMATE_TERRAMATE_SHA256: ${{ steps.versions.outputs.terramate_sha256 }}
      run: |
        set -euo pipefail
        v="$SHIPMATE_TERRAMATE_VERSION"
        # Fail-closed: every later step runs terramate.
        fail() { echo "::error title=Terramate install failed::Terramate ${v} did not install: $1"; exit 1; }
        command -v curl >/dev/null || fail "curl is not installed on the runner."
        system="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64|x64) arch=x86_64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) arch="$(uname -m)" ;;
        esac
        asset="terramate_${v}_${system}_${arch}.tar.gz"
        want="$(awk -v a="$asset" '$2 == a {print $1}' <<<"$SHIPMATE_TERRAMATE_SHA256")"
        [ -n "$want" ] || fail "VERSIONS pins no sha256 for ${asset}; shipmate installs on Linux x86_64 and arm64."
        url="https://github.com/terramate-io/terramate/releases/download/v${v}/${asset}"
        dir="$RUNNER_TEMP/terramate"
        mkdir -p "$dir"
        # --retry covers 408/429/500/502/503/504 and timeouts, stalls included. --retry-all-errors
        # adds connection resets and TLS errors; it is curl 7.71+, and an older curl exits 2 on it
        # on the command line or in a -K file, so it is added only when supported.
        IFS=. read -r maj min _ <<<"$(curl -V | awk 'NR==1{print $2}')"
        retry_all=()
        if [ "$maj" -gt 7 ] || { [ "$maj" -eq 7 ] && [ "$min" -ge 71 ]; }; then retry_all=(--retry-all-errors); fi
        rc=0
        code="$(curl "${retry_all[@]}" -sSL --retry 3 --connect-timeout 10 --speed-limit 1024 --speed-time 30 \
          -o "$dir/terramate.tar.gz" -w '%{http_code}' "$url")" || rc=$?
        if [ "$rc" -ne 0 ] || [ "${code:-000}" != 200 ]; then
          if [ "${code:-000}" = 404 ]; then
            fail "${url} answered HTTP 404 (curl exit ${rc}); check VERSIONS and the runner's OS and architecture."
          fi
          fail "${url} answered HTTP ${code:-000} (curl exit ${rc}); re-run the failed job."
        fi
        sum="$(sha256sum "$dir/terramate.tar.gz" | awk '{print $1}')"
        if [ "$sum" != "$want" ]; then
          fail "${url} has sha256 ${sum}, not the ${want} VERSIONS pins; the release asset differs from the pinned one."
        fi
        echo "Verified ${asset} sha256 ${sum}."
        tar -xzf "$dir/terramate.tar.gz" -C "$dir" terramate || fail "tar could not extract terramate from ${url}."
        got="$("$dir/terramate" --version)" || fail "the binary from ${url} failed to run terramate --version."
        if [ "$got" != "$v" ]; then
          fail "${url} delivered version ${got}; check VERSIONS and the release asset."
        fi
        echo "$dir" >> "$GITHUB_PATH"
    - name: Provider plugin cache
      shell: bash
      run: |
        echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/.tofu-plugin-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/.tofu-plugin-cache"
