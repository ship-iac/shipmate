name: shipmate setup
description: Install Terramate and, unless `tofu` is "false", OpenTofu, each at the version `tools` in .github/shipmate-config.yml names, else at this release's pin, resolved once per run by the detect job, from release files the Actions cache keeps per version and setup re-verifies; point OpenTofu at a provider plugin cache directory.
inputs:
  resolve:
    description: '"true" in a detect job: resolve the versions from the table and output them as `tools`. Set exactly one of `resolve` and `versions`.'
    required: false
    default: ""
  versions:
    description: "In a cell: the `tools` output of this run's detect job, a JSON object of terramate and tofu to X.Y.Z versions. The cell installs these and reads no table; an empty or invalid value refuses before any download."
    required: false
    default: ""
  tofu:
    description: Whether to install OpenTofu. "false" for jobs that never run it.
    required: false
    default: "true"
  cache-save:
    description: '"false" where the workflow declares cache-mode: read, whose token cannot save; a save there only warns.'
    required: false
    default: "true"
outputs:
  refusal:
    description: The first error of the `::error::` message that failed `Resolve versions` (a refusal of the table, of `tools` or of the `resolve` and `versions` inputs, or a failed read) or a verify or install step (a download, signature, digest or install failure), without the prefix, its lines joined into one; empty when none failed. Set although the step fails, and read through the `refusal` output of plan.yml's and apply.yml's `detect` jobs into the gate description and the apply result comment. Branch-controlled text, so a reader passes it through `env:`.
    value: ${{ steps.versions.outputs.refusal || steps.terramate-sums.outputs.refusal || steps.tofu-sums.outputs.refusal || steps.tofu-install.outputs.refusal || steps.terramate-install.outputs.refusal }}
  tools:
    description: 'The resolved pair as compact JSON, `{"terramate":"X.Y.Z","tofu":"X.Y.Z"}`. A detect job outputs it for its cells to pass as `versions`.'
    value: ${{ steps.versions.outputs.tools }}
runs:
  using: composite
  steps:
    - uses: $/actions/python-yaml
    - name: Resolve versions
      id: versions
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHIPMATE_RESOLVE: ${{ inputs.resolve }}
        SHIPMATE_VERSIONS: ${{ inputs.versions }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/tool-versions"
    # A restored entry is never trusted: the verify and install steps check each of its files as
    # they check a download, and download again the files of an entry that fails.
    - name: Restore the Terramate release
      id: terramate-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/terramate-release
        key: shipmate-tools-${{ runner.os }}-${{ runner.arch }}-terramate-${{ steps.versions.outputs.terramate }}
    - name: Restore the OpenTofu release
      id: tofu-cache
      if: ${{ inputs.tofu != 'false' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tofu-release
        key: shipmate-tools-${{ runner.os }}-${{ runner.arch }}-tofu-${{ steps.versions.outputs.tofu }}
    # Each verify step checks the release's checksum file against a signer key committed in this
    # repository, never fetched, and outputs the Linux digests only once the signature holds.
    - name: Verify Terramate checksums
      id: terramate-sums
      shell: bash
      env:
        SHIPMATE_TERRAMATE_VERSION: ${{ steps.versions.outputs.terramate }}
        SHIPMATE_CACHE_KEY: ${{ steps.terramate-cache.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/release.sh"
        v="$SHIPMATE_TERRAMATE_VERSION"
        release_init "Terramate checksum verification failed" "Terramate ${v}: "
        require
        key="${SHIPMATE_CACHE_KEY:-}"
        dir="$RUNNER_TEMP/terramate-release"
        release_sums terramate "$v"
        release_dir "$dir"
        # Without a restored entry, nothing explains a file already here.
        if [ -z "$key" ] || ! verify_terramate "$v" "$dir"; then
          [ -z "$key" ] || echo "::warning title=Tool cache entry failed verification::Terramate ${v}: ${reason} Downloading ${release_files[0]} and ${release_files[1]} again. Every job repeats this download until the entry is deleted: gh cache delete ${key} --repo ${GITHUB_REPOSITORY}"
          release_verify terramate "$v" "$dir" "" ""
        fi
    - name: Verify OpenTofu checksums
      id: tofu-sums
      if: ${{ inputs.tofu != 'false' }}
      shell: bash
      env:
        SHIPMATE_TOFU_VERSION: ${{ steps.versions.outputs.tofu }}
        SHIPMATE_CACHE_KEY: ${{ steps.tofu-cache.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/release.sh"
        v="$SHIPMATE_TOFU_VERSION"
        release_init "OpenTofu checksum verification failed" "OpenTofu ${v}: "
        require gpg gpgconf
        key="${SHIPMATE_CACHE_KEY:-}"
        dir="$RUNNER_TEMP/tofu-release"
        release_sums tofu "$v"
        release_dir "$dir"
        # Without a restored entry, nothing explains a file already here.
        if [ -z "$key" ] || ! verify_tofu "$v" "$dir"; then
          [ -z "$key" ] || echo "::warning title=Tool cache entry failed verification::OpenTofu ${v}: ${reason} Downloading ${release_files[0]} and ${release_files[1]} again. Every job repeats this download until the entry is deleted: gh cache delete ${key} --repo ${GITHUB_REPOSITORY}"
          release_verify tofu "$v" "$dir" "" ""
        fi
    - name: Install OpenTofu
      id: tofu-install
      if: ${{ inputs.tofu != 'false' }}
      shell: bash
      env:
        SHIPMATE_TOFU_VERSION: ${{ steps.versions.outputs.tofu }}
        SHIPMATE_TOFU_SHA256: ${{ steps.tofu-sums.outputs.tofu_sha256 }}
        SHIPMATE_CACHE_KEY: ${{ steps.tofu-cache.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/release.sh"
        v="$SHIPMATE_TOFU_VERSION"
        release_sums tofu "$v"
        sums="${release_files[0]}"
        # Fail-closed: every cell runs tofu.
        release_init "OpenTofu install failed" "OpenTofu ${v} did not install: "
        require
        system="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64|x64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) arch="$(uname -m)" ;;
        esac
        asset="tofu_${v}_${system}_${arch}.zip"
        want="$(awk -v a="$asset" '$2 == a {print $1}' <<<"$SHIPMATE_TOFU_SHA256")"
        [ -n "$want" ] || fail "the signed ${sums} yields no sha256 for ${asset}; shipmate installs on Linux x86_64 and arm64."
        url="${release_base}/${asset}"
        release="$RUNNER_TEMP/tofu-release"
        archive="$release/$asset"
        bin="$RUNNER_TEMP/tofu"
        mkdir -p "$release" "$bin"
        release_archive "$url" "$archive" "$want" "OpenTofu ${v}"
        python3 -m zipfile -e "$archive" "$bin" || fail "python3 could not extract OpenTofu from ${url}."
        # zipfile drops the archive's exec bit.
        chmod +x "$bin/tofu" || fail "could not make the OpenTofu binary executable."
        got="$("$bin/tofu" version)" || fail "the OpenTofu binary from ${url} failed its version check."
        got="${got%%$'\n'*}"
        if [ "$got" != "OpenTofu v${v}" ]; then
          fail "${url} delivered ${got}; check the signed ${sums} and the release asset."
        fi
        echo "$bin" >> "$GITHUB_PATH"
    - name: Install Terramate
      id: terramate-install
      shell: bash
      env:
        SHIPMATE_TERRAMATE_VERSION: ${{ steps.versions.outputs.terramate }}
        SHIPMATE_TERRAMATE_SHA256: ${{ steps.terramate-sums.outputs.terramate_sha256 }}
        SHIPMATE_CACHE_KEY: ${{ steps.terramate-cache.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$GITHUB_ACTION_PATH/release.sh"
        v="$SHIPMATE_TERRAMATE_VERSION"
        # Fail-closed: every later step runs terramate.
        release_init "Terramate install failed" "Terramate ${v} did not install: "
        release_sums terramate "$v"
        require
        system="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64|x64) arch=x86_64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) arch="$(uname -m)" ;;
        esac
        asset="terramate_${v}_${system}_${arch}.tar.gz"
        want="$(awk -v a="$asset" '$2 == a {print $1}' <<<"$SHIPMATE_TERRAMATE_SHA256")"
        [ -n "$want" ] || fail "the signed checksums.txt yields no sha256 for ${asset}; shipmate installs on Linux x86_64 and arm64."
        url="${release_base}/${asset}"
        release="$RUNNER_TEMP/terramate-release"
        archive="$release/$asset"
        dir="$RUNNER_TEMP/terramate"
        mkdir -p "$release" "$dir"
        release_archive "$url" "$archive" "$want" "Terramate ${v}"
        tar -xzf "$archive" -C "$dir" terramate || fail "tar could not extract terramate from ${url}."
        got="$("$dir/terramate" --version)" || fail "the binary from ${url} failed to run terramate --version."
        if [ "$got" != "$v" ]; then
          fail "${url} delivered version ${got}; check the signed checksums.txt and the release asset."
        fi
        echo "$dir" >> "$GITHUB_PATH"
    # Degrade steps: a save only decides whether a later job downloads, and nothing on the gate
    # path reads it, so a failed save must not fail the job before its cells run.
    - name: Save the Terramate release
      if: ${{ inputs.cache-save != 'false' && steps.terramate-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/terramate-release
        key: shipmate-tools-${{ runner.os }}-${{ runner.arch }}-terramate-${{ steps.versions.outputs.terramate }}
    - name: Save the OpenTofu release
      if: ${{ inputs.tofu != 'false' && inputs.cache-save != 'false' && steps.tofu-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tofu-release
        key: shipmate-tools-${{ runner.os }}-${{ runner.arch }}-tofu-${{ steps.versions.outputs.tofu }}
    - name: Provider plugin cache
      shell: bash
      run: |
        echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/.tofu-plugin-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/.tofu-plugin-cache"
