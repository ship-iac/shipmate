name: shipmate setup
description: Install pinned Terramate + OpenTofu and enable a shared provider plugin cache.
runs:
  using: composite
  steps:
    - name: Resolve versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        # `$/` fetches the whole engine repository at the pinned SHA, so this reads the
        # versions this release was tested with. An unresolved version must fail the step:
        # setup-opentofu reads an empty tofu_version as "latest", which is silent tool drift.
        versions="$GITHUB_ACTION_PATH/../../VERSIONS"
        if [ ! -f "$versions" ]; then
          echo "::error::$versions does not exist: it carries the terramate= and tofu= versions this release pins."
          exit 1
        fi
        TERRAMATE_VERSION="$(sed -n 's/^terramate=//p' "$versions" | tail -n1 | tr -d '[:space:]')"
        TOFU_VERSION="$(sed -n 's/^tofu=//p' "$versions" | tail -n1 | tr -d '[:space:]')"
        if [ -z "$TERRAMATE_VERSION" ]; then
          echo "::error::$versions carries no terramate= line; restore it."
          exit 1
        fi
        if [ -z "$TOFU_VERSION" ]; then
          echo "::error::$versions carries no tofu= line; restore it."
          exit 1
        fi
        {
          echo "terramate=$TERRAMATE_VERSION"
          echo "tofu=$TOFU_VERSION"
        } >> "$GITHUB_OUTPUT"
    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ steps.versions.outputs.tofu }}
        tofu_wrapper: false
    - name: Retry transient download errors
      shell: bash
      run: |
        set -euo pipefail
        # terramate-action runs one curl with no retry option; curl reads this file through
        # CURL_HOME. curl reads only the first config it finds, hence the copy of the runner's own.
        mkdir -p "$RUNNER_TEMP/shipmate-curl"
        rc="$RUNNER_TEMP/shipmate-curl/.curlrc"
        # The copy can carry `proxy-user` or `user` credentials, so the file is owner-only.
        umask 077
        : > "$rc"
        if [ -f "$HOME/.curlrc" ]; then
          printf '%s\n' "$(cat "$HOME/.curlrc")" >> "$rc"
        fi
        echo 'retry = 3' >> "$rc"
        echo 'retry-all-errors' >> "$rc"
    - name: Install Terramate
      id: terramate
      uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
      env:
        CURL_HOME: ${{ runner.temp }}/shipmate-curl
      with:
        version: ${{ steps.versions.outputs.terramate }}
    - name: Report a failed Terramate install
      if: ${{ failure() && steps.terramate.outcome == 'failure' }}
      shell: bash
      env:
        SHIPMATE_TERRAMATE_VERSION: ${{ steps.versions.outputs.terramate }}
      run: |
        set -uo pipefail
        v="$SHIPMATE_TERRAMATE_VERSION"
        system="$(uname -s | tr '[:upper:]' '[:lower:]')"
        case "$(uname -m)" in
          x86_64|x64) arch=x86_64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) arch="$(uname -m)" ;;
        esac
        url="https://github.com/terramate-io/terramate/releases/download/v${v}/terramate_${v}_${system}_${arch}.tar.gz"
        code="$(curl -sS -o /dev/null -I -L --max-time 30 -w '%{http_code}' "$url")" || true
        code="${code:-000}"
        echo "::error title=Terramate install failed::Terramate ${v} did not install; the step log above names the cause. ${url} answers HTTP ${code} now; re-run the failed job."
        exit 1
    - name: Provider plugin cache
      shell: bash
      run: |
        echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/.tofu-plugin-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/.tofu-plugin-cache"
    - name: Restore plugin cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: tofu-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: tofu-plugins-${{ runner.os }}-
