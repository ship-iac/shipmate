name: shipmate cell-complete
description: Complete one cell's apply checks from its own save job, after its apply job succeeded and the job's state step saved its state - completed success, linked to the apply job, the record title restored. A pre-merge re-run, and a run whose pull request has merged, still write it. Refuses a malformed check-id list or apply job id; a failed pull request read or a write that still fails after its retries fails the job, and the level's complete job then writes the check.
inputs:
  check-ids:
    description: JSON list of this cell's apply-check ids, its entry in apply-snapshot's by_wave.
    required: true
  apply-job-id:
    description: The cell's apply job's check run id, which the checks link to.
    required: true
  deploy:
    description: "`true` on the merge deploy."
    required: true
  pr-number:
    description: The pull request the run applies; read before a pre-merge write.
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Decide the cell's writes
      shell: bash
      env:
        CHECK_IDS: ${{ inputs.check-ids }}
        APPLY_JOB_ID: ${{ inputs.apply-job-id }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-complete" own "$CHECK_IDS" "$APPLY_JOB_ID" \
          > "$RUNNER_TEMP/cell-writes.jsonl"

    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-checks: write
        permission-pull-requests: read

    - name: Write the cell's apply checks
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        SHIPMATE_DEPLOY: ${{ inputs.deploy }}
        SHIPMATE_PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/patch-checks" < "$RUNNER_TEMP/cell-writes.jsonl"
