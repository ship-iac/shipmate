name: shipmate apply-cell
description: Apply one stack x env from its reviewed .otplan artifact. Never re-plans. Holds no App key — a trusted trailing job completes the apply check afterwards.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the check, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  head-sha:
    description: PR head SHA carrying the pending apply check.
    required: true
  plan-run-id:
    description: Plan run id holding the reviewed plan artifact.
    required: true
  state-path:
    description: Flavor state path, e.g. stacks/app/.state. Empty = remote backend owns state; both actions/state steps are skipped, and `skipped` never matches the Compose cell summary step's 'failure' checks, so a remote-backend cell can never be blocked on artifact state.
    required: false
    default: ""
  github-token:
    description: GITHUB_TOKEN with actions:read (reviewed-plan artifact download).
    required: true
  plan-passphrase:
    description: Passphrase to decrypt the .otplan artifact; must match plan-cell's. Empty = expect plaintext.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated) — injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Download reviewed plan artifact (fail-safe if missing)
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.plan-run-id }}
        ART: plan.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_ID" ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: the plan-run-id input reached this action empty. Each cell's plan run comes from its own apply check, and the detects refuse a cell whose check records none — so an empty value here is the matrix wiring dropping it rather than a missing plan, most likely an engine reference pinned at a different revision than the rest. Re-pin every engine reference to one commit."
          exit 1
        fi
        [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan-run-id must be numeric (got: $RUN_ID)"; exit 1; }
        echo "::group::download reviewed plan: $ART"
        if ! gh run download "$RUN_ID" -n "$ART" -D . ; then
          echo "::endgroup::"
          echo "::error::reviewed plan artifact '$ART' missing/expired — cannot apply $ENV/$STACK_NAME without re-planning (fail-safe). Re-run plan."
          exit 1
        fi
        echo "::endgroup::"

    - name: Verify the plan was produced from this commit
      id: planned-head
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      # Runs before the decrypt, the state restore and the apply, so a plan of another tree
      # is refused at the cheapest point. The record moves out of the repo tree because the
      # action runs in the consumer's checkout and must not leave a stray file at its root.
      run: |
        set -euo pipefail
        if [ ! -f planned-head.txt ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: this reviewed plan records no planned commit, so there is nothing to compare against this checkout — most likely the plan predates the release that binds a plan to the tree it was produced from, though a mismatched engine revision produces the same absence. Re-plan this stack on its pull request and apply the fresh plan; if that pull request has already merged, a new pull request touching the stack plans and applies it afresh."
          exit 1
        fi
        record="$RUNNER_TEMP/planned-head.txt"
        mv planned-head.txt "$record"
        planned=$(cat "$record")
        observed=$(git rev-parse HEAD)
        if [ "$planned" != "$observed" ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: the reviewed plan was produced from $planned but this job has $observed checked out — re-plan."
          exit 1
        fi

    - name: Decrypt reviewed plan artifact (fail-safe on config/plaintext mismatch)
      id: decrypt
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        PLAN_PASSPHRASE: ${{ inputs.plan-passphrase }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt "$STACK/stack.otplan"

    - name: Verify fingerprint matches the reviewed plan
      id: fingerprint
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        set -euo pipefail
        # Out of the repo tree, as for the planned-commit record. Only the regenerated
        # fingerprint.txt, a gitignored artifact, is left behind.
        expected="$RUNNER_TEMP/expected-fingerprint.txt"
        mv fingerprint.txt "$expected"
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --fingerprint-only
        if ! diff -q fingerprint.txt "$expected" >/dev/null; then
          names=$(python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --keys)
          echo "::error::apply aborted for $ENV/$STACK_NAME: current env does not match the reviewed plan's fingerprint. Current variable names: $names. Values differ or a variable was added/removed — re-plan."
          exit 1
        fi

    - name: Restore state
      id: restore-state
      if: ${{ inputs.state-path != '' }}
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ inputs.state-path }}

    - name: Apply the stored plan (exact-plan; stale -> fail-safe)
      id: apply
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # The engine owns the command: `tofu apply stack.otplan` applies the reviewed plan
      # artifact and nothing else, so the exact-plan invariant does not depend on branch
      # content. tofu rejects a plan whose state moved since generation, and the non-zero
      # exit leaves the apply check pending (fail-safe).
      run: |
        set -euo pipefail
        # Restored local-backend workspace state carries no `.terraform` record marking the
        # backend initialised, so `init` reads it as legacy state awaiting migration and
        # `-input=false` turns that question into a hard error.
        ws="$STACK/terraform.tfstate.d"
        hidden=$(mktemp -du "$RUNNER_TEMP/tfstate.d.XXXXXX")
        # Hidden across the init and put back either way: under `-reconfigure` a migration is
        # never intended, and non-interactively it could never have been answered.
        if [ -d "$ws" ]; then mv "$ws" "$hidden"; fi
        # errexit is lifted only so the workspace restore runs even on a failed init.
        set +e
        # `init` stays outside the teed pipeline -- its output is setup noise, apply.txt is
        # reviewer-facing comment data -- and above the group marker, so a failure's
        # diagnostics are not buried in a group this step then exits without closing.
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure
        init_status=$?
        set -e
        # init recreates $ws empty; drop that so the real state replaces it
        # rather than being moved inside it.
        if [ -d "$hidden" ]; then rm -rf "$ws"; mv "$hidden" "$ws"; fi
        # Fatal: nothing applies against state the engine could not initialise.
        [ "$init_status" -eq 0 ] || exit "$init_status"
        echo "::group::terramate apply: $STACK"
        # errexit is off for this one pipeline, and the step exits on tofu's own status via
        # PIPESTATUS[0]: with errexit and pipefail live, a `tee` failure alone -- a full
        # $RUNNER_TEMP, a disk hiccup mid-write -- would fail an apply whose every resource
        # succeeded. `Save state` has already persisted the advanced state by then, so a
        # re-run would hit the stale-plan fail-safe with no way back. Exiting on tofu's own
        # captured status keeps a cosmetic `tee` failure from masking a success, or
        # manufacturing one.
        set +e
        # No `-auto-approve`: applying a stored plan never prompts, so the flag is inert, and
        # its absence is a backstop. Were the `stack.otplan` argument ever lost, `-input=false`
        # alone fails with "Error asking for approval", where `-auto-approve` would re-plan
        # from branch content and apply that unattended.
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu apply -input=false stack.otplan 2>&1 | tee "$RUNNER_TEMP/apply.txt"
        status="${PIPESTATUS[0]}"
        set -e
        echo "::endgroup::"
        exit "$status"

    - name: Save state
      # Persisted whenever the apply was attempted, not only on a clean apply: a partial
      # `tofu apply` mutates local state per-resource whether it failed or was cancelled
      # (manually, or by apply-<env>-<stack> concurrency displacement), and dropping that
      # delta would orphan resources on the next run's restore-then-retry.
      # always(), not !cancelled(), is safe because the sink is actions/cache: entries commit
      # only on a completed, size-validated upload, keyed per run_id-run_attempt, so a
      # teardown mid-upload never commits and can never clobber the last-good state. Worst
      # case the delta is lost; best case the partial state persists and the next retry hits
      # tofu's stale-plan fail-safe loudly.
      # The guard on the restore's outcome keeps state that was never restored from being
      # saved. On cancellation this job's own conclusion reads cancelled, so the trusted
      # trailing job -- which completes a check only when the job that applied it succeeded --
      # leaves the check pending and the work is re-detected.
      if: ${{ always() && inputs.state-path != '' && steps.restore-state.outcome == 'success' }}
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: save
        path: ${{ inputs.state-path }}

    - name: Compose cell summary
      # Runs even when a fail-safe or the apply itself failed or was cancelled: the
      # aggregator needs a result for every attempted-or-blocked cell. Built from env vars
      # only, because stack/env/reason text is author-controlled (Terramate tags, workflow
      # inputs) and must never be shell-interpolated or spliced into JSON by string concat.
      # continue-on-error because comment feedback must never outrank the work queue: this
      # step only composes the apply result comment's data, and `Save state` has already
      # advanced past the reviewed .otplan, so failing the job would leave a re-run on the
      # stale-plan fail-safe with no way back on an otherwise-successful apply.
      if: always()
      continue-on-error: true
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        PLANNED_HEAD_OUTCOME: ${{ steps.planned-head.outcome }}
        DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
        FINGERPRINT_OUTCOME: ${{ steps.fingerprint.outcome }}
        RESTORE_OUTCOME: ${{ steps.restore-state.outcome }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os

        # Checked in pipeline order and matched on 'failure', not "!= success": a
        # composite-action step failure halts every later non-always() step, so a fail-safe
        # that never ran reads 'skipped', not 'failure'. Matching 'failure' exactly means only
        # the fail-safe that actually tripped can claim the blocked reason.
        FAILSAFES = [
            ("DOWNLOAD_OUTCOME", "reviewed plan artifact missing or expired — re-run plan"),
            (
                "PLANNED_HEAD_OUTCOME",
                "reviewed plan records no commit or was produced from a different one — re-plan",
            ),
            ("DECRYPT_OUTCOME", "plan artifact could not be decrypted — passphrase/config mismatch"),
            (
                "FINGERPRINT_OUTCOME",
                "environment does not match the reviewed plan's fingerprint — re-plan",
            ),
            ("RESTORE_OUTCOME", "state restore failed"),
        ]

        result, reason = None, ""
        for env_key, message in FAILSAFES:
            if os.environ[env_key] == "failure":
                result, reason = "blocked", message
                break

        if result is None:
            apply_outcome = os.environ["APPLY_OUTCOME"]
            if apply_outcome == "success":
                result = "applied"
            elif apply_outcome in ("failure", "cancelled"):
                result = "failed"
            else:
                # No fail-safe failed and apply never ran, so some other step failed
                # first. Still blocked, but the reason must not name a fail-safe that
                # was never attempted.
                result = "blocked"
                reason = "an earlier step failed before the apply ran — see the job log"

        # apply.txt needs no copy: `Apply the stored plan` already tee'd it to
        # $RUNNER_TEMP/apply.txt, so a blocked cell that never reached the apply never wrote
        # it, and an attempted cell's copy already sits where `Upload apply summary` reads.
        cell_path = os.path.join(os.environ["RUNNER_TEMP"], "cell.json")
        with open(cell_path, "w") as fh:
            json.dump(
                {
                    "stack": os.environ["STACK_NAME"],
                    "stack_path": os.environ["STACK"],
                    "environment": os.environ["ENV"],
                    "result": result,
                    "reason": reason,
                },
                fh,
            )
        PY

    - name: Upload apply summary
      # continue-on-error, as on `Compose cell summary`: a failed cosmetic upload
      # under-reports in the pull request comment, an applied cell rendering as
      # not-attempted, rather than stranding an already-applied cell's check pending.
      # `overwrite: true` because a job re-run in the same workflow run -- the documented
      # "re-run the deploy" recovery path -- cannot 409 on the pre-existing artifact name.
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apply-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          ${{ runner.temp }}/cell.json
          ${{ runner.temp }}/apply.txt
        overwrite: true
