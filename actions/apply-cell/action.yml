name: shipmate apply-cell
description: Apply one stack x env from its reviewed .otplan artifact. Never re-plans. Holds no App key; a trusted trailing job completes the apply check afterwards. Reads the job's GITHUB_TOKEN, which needs actions:read to download the reviewed-plan artifact.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  plan-run-id:
    description: Plan run id holding the reviewed plan artifact.
    required: true
  plan-sha256:
    description: sha256 of the reviewed plan text, recorded on the apply check by the trusted summary job. The apply re-renders the stored plan and refuses if it does not match.
    required: true
  plan-passphrase:
    description: Passphrase to decrypt the .otplan artifact; must match plan-cell's. Empty = expect plaintext.
    required: false
    default: ""
  tf-vars:
    description: The matrix row's resolved tf_vars, serialised with toJSON. Anything but a JSON object of strings is refused; the empty object is a legitimate value and an omitted input is not.
    required: true
  github-vars:
    description: The consumer's reachable GitHub variables, serialised with toJSON. Engine-built, so an empty rendering is a platform fact and not a consumer mistake; empty and null are both read as no variables.
    required: false
    default: ""
  consumer-secrets:
    description: The consumer's SHIPMATE_SECRETS envelope. Empty is the normal case (a consumer forwarding no secrets). Values are masked before anything is written.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Inject identity variables
      shell: bash
      env:
        SHIPMATE_TF_VARS: ${{ inputs.tf-vars }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_SECRETS: ${{ inputs.consumer-secrets }}
        STACK: ${{ inputs.stack }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/env-inject"

    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated), so injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Download reviewed plan artifact (fail-safe if missing)
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.plan-run-id }}
        ART: plan.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_ID" ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: the plan-run-id input reached this action empty. Each cell's plan run comes from its own apply check, and the detects refuse a cell whose check records none, so an empty value here is the matrix wiring dropping it rather than a missing plan, most likely an engine reference pinned at a different revision than the rest. Re-pin every engine reference to one commit."
          exit 1
        fi
        [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan-run-id must be numeric (got: $RUN_ID)"; exit 1; }
        echo "::group::download reviewed plan: $ART"
        if ! gh run download "$RUN_ID" -n "$ART" -D . ; then
          echo "::endgroup::"
          echo "::error::reviewed plan artifact '$ART' missing/expired; cannot apply $ENV/$STACK_NAME without re-planning (fail-safe). Re-run plan."
          exit 1
        fi
        echo "::endgroup::"

    - name: Verify the plan was produced from this commit
      id: planned-head
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack }}
      # Runs before the decrypt, the state restore and the apply, so a plan of another tree
      # is refused at the cheapest point. The record moves out of the repo tree because the
      # action runs in the consumer's checkout and must not leave a stray file at its root.
      run: |
        set -euo pipefail
        if [ ! -f planned-head.txt ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: this reviewed plan records no planned commit, so there is nothing to compare against this checkout and the apply is refused. Re-plan this stack on its pull request and apply the fresh plan; if that pull request has already merged, a new pull request touching the stack plans and applies it afresh."
          exit 1
        fi
        record="$RUNNER_TEMP/planned-head.txt"
        mv planned-head.txt "$record"
        planned=$(cat "$record")
        observed=$(git rev-parse HEAD)
        if [ "$planned" != "$observed" ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: the reviewed plan was produced from $planned but this job has $observed checked out. Re-plan."
          exit 1
        fi

    - name: Decrypt reviewed plan artifact (fail-safe on config/plaintext mismatch)
      id: decrypt
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        PLAN_PASSPHRASE: ${{ inputs.plan-passphrase }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt "$STACK/stack.otplan"

    - name: Verify fingerprint matches the reviewed plan
      id: fingerprint
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        # The reviewed fingerprint moves out of the repo tree, as the planned-commit record
        # does. Only the regenerated fingerprint.txt, a gitignored artifact, is left behind.
        expected="$RUNNER_TEMP/expected-fingerprint.txt"
        mv fingerprint.txt "$expected"
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --fingerprint-only
        if ! diff -q fingerprint.txt "$expected" >/dev/null; then
          names=$(python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --keys)
          echo "::error::apply aborted for $ENV/$STACK_NAME: current env does not match the reviewed plan's fingerprint. Current variable names: $names. Values differ or a variable was added/removed. Re-plan."
          exit 1
        fi

    - name: Check the reviewed plan text's digest reached this action
      id: digest-input
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
      run: |
        set -euo pipefail
        # GitHub does not enforce `required: true`: this refuses an empty or malformed digest before
        # any work. Its own step, above the init: a wiring slip and a tampered plan need different
        # remedies, so they must not share a blocked reason.
        [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
          echo "::error::apply aborted for $ENV/$STACK_NAME: no usable plan-text digest reached this action. Re-pin every engine reference to one commit, then re-plan."
          exit 1
        }

    - name: Provider cache key
      id: provider-cache-key
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/provider-cache-key"

    - name: Restore provider cache
      id: provider-cache
      if: ${{ steps.provider-cache-key.outputs.digest != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: tofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ steps.provider-cache-key.outputs.digest }}

    - name: Initialize the stack
      id: init
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # Its own step: init output is setup noise and stays out of the apply step's teed pipeline,
      # apply.txt being reviewer-facing comment data.
      run: terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure

    - name: Name the restored provider cache entry
      if: ${{ failure() && steps.init.outcome == 'failure' && steps.provider-cache.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        KEY: ${{ steps.provider-cache.outputs.cache-primary-key }}
      run: |
        echo "::error::OpenTofu's init failed after restoring provider cache entry $KEY. If the log above says a cached package does not match the content of the downloaded package, delete the entry with gh cache delete $KEY --repo $GITHUB_REPOSITORY and re-run."

    - name: Locate state
      id: locate-state
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # Inside `terramate run` so a consumer's run.env TF_DATA_DIR or TF_WORKSPACE applies, as it
      # did for init.
      run: terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- python3 "$GITHUB_ACTION_PATH/../../scripts/state-path"

    - name: Restore state
      id: restore-state
      if: ${{ steps.locate-state.outputs.path != '' }}
      uses: $/actions/state
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ steps.locate-state.outputs.path }}

    - name: Verify the stored plan renders as the reviewed plan text
      id: plan-digest
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack }}
        ENV: ${{ inputs.env }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
      run: |
        set -euo pipefail
        # Binds the reviewed plan text to the plan about to run. `tofu show` is byte-identical
        # across runners at one tofu version (a version or provider change refuses the plan file),
        # so a difference is a content mismatch. Needs the providers `init` installs: runs after it.
        rendered="$RUNNER_TEMP/rendered-plan.txt"
        tofu -chdir="$STACK" show -no-color stack.otplan > "$rendered"
        # Digested from stdin, not by name: sha256sum escapes a path containing a backslash and
        # prefixes the whole line with one, which would never equal the recorded digest.
        actual=$(sha256sum < "$rendered" | cut -d' ' -f1)
        if [ "$actual" != "$PLAN_SHA256" ]; then
          echo "::error::apply aborted for $ENV/$STACK_NAME: the stored plan does not render to the plan text that was reviewed (expected $PLAN_SHA256, got $actual). Nothing has been applied. Re-plan this stack on its pull request and review the fresh plan."
          exit 1
        fi

    - name: Apply the stored plan (exact-plan; stale -> fail-safe)
      id: apply
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # The engine owns the command, so exact-plan does not depend on branch content. tofu rejects
      # a plan whose state moved since generation, and the non-zero exit leaves the apply check
      # pending (fail-safe).
      run: |
        set -euo pipefail
        echo "::group::terramate apply: $STACK"
        # Exit on tofu's own PIPESTATUS[0], not pipefail: a `tee` failure alone would fail a
        # successful apply whose advanced state `Save state` persists, leaving a re-run on the
        # stale-plan fail-safe with no way back.
        set +e
        # No `-auto-approve`: inert on a stored plan, and its absence is a backstop. Were
        # `stack.otplan` lost, `-input=false` fails "Error asking for approval", where
        # `-auto-approve` would re-plan from branch content and apply that unattended.
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu apply -input=false stack.otplan 2>&1 | tee "$RUNNER_TEMP/apply.txt"
        status="${PIPESTATUS[0]}"
        set -e
        echo "::endgroup::"
        exit "$status"

    - name: Save state
      # always(), not !cancelled(): a failed or cancelled apply still mutated state, and dropping
      # that delta orphans resources. Safe because actions/cache commits only a completed upload:
      # a torn save loses the delta but never clobbers last-good state. Skips unrestored state.
      if: ${{ always() && steps.restore-state.outcome == 'success' }}
      uses: $/actions/state
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: save
        path: ${{ steps.locate-state.outputs.path }}

    - name: Check the provider cache
      id: provider-cache-files
      # No status function in this `if:` or the save's: the implied success() skips both after a
      # failed apply. continue-on-error, as on `Compose cell summary`, keeps a cache failure from
      # stranding an applied cell's check pending.
      if: ${{ steps.provider-cache.outcome == 'success' && steps.provider-cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      shell: bash
      run: |
        if [ -n "$(find "$TF_PLUGIN_CACHE_DIR" -type f -print -quit)" ]; then
          echo "populated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save provider cache
      if: ${{ steps.provider-cache-files.outputs.populated == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ steps.provider-cache.outputs.cache-primary-key }}

    - name: Compose cell summary
      # always(): the aggregator needs a result for every attempted or blocked cell. Env vars only:
      # stack, env and reason text is author-controlled, never shell- or JSON-spliced.
      # Reviewer-facing only (continue-on-error): failing after `Save state` strands a stale plan.
      if: always()
      continue-on-error: true
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack }}
        ENV: ${{ inputs.env }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        PLANNED_HEAD_OUTCOME: ${{ steps.planned-head.outcome }}
        DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
        FINGERPRINT_OUTCOME: ${{ steps.fingerprint.outcome }}
        DIGEST_INPUT_OUTCOME: ${{ steps.digest-input.outcome }}
        INIT_OUTCOME: ${{ steps.init.outcome }}
        LOCATE_OUTCOME: ${{ steps.locate-state.outcome }}
        RESTORE_OUTCOME: ${{ steps.restore-state.outcome }}
        PLAN_DIGEST_OUTCOME: ${{ steps.plan-digest.outcome }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-cell-summary"

    - name: Upload apply summary
      # Reviewer-facing only (continue-on-error): a failed upload drops the cell's output from the
      # comment rather than stranding its check pending. `overwrite: true` keeps a same-run job
      # re-run, the documented recovery path, from failing 409 on the existing artifact name.
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apply-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          ${{ runner.temp }}/cell.json
          ${{ runner.temp }}/apply.txt
        overwrite: true
