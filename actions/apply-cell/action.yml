name: shipmate apply-cell
description: Apply one stack x env from its reviewed .otplan artifact. Never re-plans. Holds no App key; a trusted trailing job completes the apply check afterwards. Reads the job's GITHUB_TOKEN, which needs actions:read to download the reviewed-plan artifact.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  plan-run-id:
    description: Plan run id holding the reviewed plan artifact.
    required: true
  plan-sha256:
    description: sha256 of the reviewed plan text, recorded on the apply check by the trusted summary job. The apply re-renders the stored plan and refuses if it does not match.
    required: true
  encryption-key:
    description: Encryption key to decrypt the .otplan artifact and the cached local state, and to seal the state the cell hands to its save job; must match plan-cell's. Required; empty refuses the apply.
    required: false
    default: ""
  tf-vars:
    description: The matrix row's resolved tf_vars, serialised with toJSON. Anything but a JSON object of strings is refused; the empty object is a legitimate value and an omitted input is not.
    required: true
  github-vars:
    description: The consumer's reachable GitHub variables, serialised with toJSON. Engine-built, so an empty rendering is a platform fact and not a consumer mistake; empty and null are both read as no variables.
    required: false
    default: ""
  consumer-secrets:
    description: The consumer's SHIPMATE_SECRETS envelope. Empty is the normal case (a consumer forwarding no secrets). Values are masked before anything is written.
    required: false
    default: ""
  pre-apply-outcome:
    description: The outcome of the wave job's pre-apply check (pre-apply), which runs before the cloud credentials. Anything but success or skipped refuses the apply, an empty value included.
    required: true
  pre-apply-refusal:
    description: The pre-apply check's refusal, which becomes the cell's blocked reason. Empty falls back to a reason that names no cause.
    required: false
    default: ""
outputs:
  state:
    description: "`<value> attempt=<run attempt>` from scripts/state-handoff, which the cell's `save` job reads; empty when the handoff failed before writing it."
    value: ${{ steps.handoff.outputs.state }}
runs:
  using: composite
  steps:
    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated), so injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    # Carries the pre-apply refusal into the blocked reason; the check ran before the cloud
    # credentials, so a refused cell never assumed the apply role. A refused wave skipped checkout
    # and setup: a step above this one that needs them hides the refusal.
    - name: Refuse a cell whose pre-apply check did not pass
      id: pre-apply
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
        OUTCOME: ${{ inputs.pre-apply-outcome }}
      run: |
        if [ "$OUTCOME" != success ] && [ "$OUTCOME" != skipped ]; then
          echo "::error::apply aborted for $ENV/$STACK: the pre-apply check did not pass (outcome: '$OUTCOME'); the job's Pre-apply check step names why"
          exit 1
        fi

    - name: Inject identity variables
      shell: bash
      env:
        SHIPMATE_TF_VARS: ${{ inputs.tf-vars }}
        SHIPMATE_GITHUB_VARS: ${{ inputs.github-vars }}
        SHIPMATE_SECRETS: ${{ inputs.consumer-secrets }}
        STACK: ${{ inputs.stack }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/env-inject"

    - name: Download reviewed plan artifact (fail-safe if missing)
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.plan-run-id }}
        ART: plan.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_ID" ]; then
          echo "::error::apply aborted for $ENV/$STACK: the plan-run-id input reached this action empty. Each cell's plan run comes from its own apply check, and the detects refuse a cell whose check records none, so an empty value here is the matrix wiring dropping it rather than a missing plan, most likely an engine reference pinned at a different revision than the rest. Re-pin every engine reference to one commit."
          exit 1
        fi
        [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan-run-id must be numeric (got: $RUN_ID)"; exit 1; }
        echo "::group::download reviewed plan: $ART"
        if ! gh run download "$RUN_ID" -n "$ART" -D . ; then
          echo "::endgroup::"
          echo "::error::reviewed plan artifact '$ART' missing/expired; cannot apply $ENV/$STACK without re-planning (fail-safe). Re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        fi
        echo "::endgroup::"

    - name: Verify the plan was produced from this commit
      id: planned-head
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
      # Runs before the decrypt, the state restore and the apply, so a plan of another tree
      # is refused at the cheapest point. The record moves out of the repo tree because the
      # action runs in the consumer's checkout and must not leave a stray file at its root.
      run: |
        set -euo pipefail
        if [ ! -f planned-head.txt ]; then
          echo "::error::apply aborted for $ENV/$STACK: this reviewed plan records no planned commit, so there is nothing to compare against this checkout and the apply is refused. Re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        fi
        record="$RUNNER_TEMP/planned-head.txt"
        mv planned-head.txt "$record"
        planned=$(cat "$record")
        observed=$(git rev-parse HEAD)
        if [ "$planned" != "$observed" ]; then
          echo "::error::apply aborted for $ENV/$STACK: the reviewed plan was produced from $planned but this job has $observed checked out. Re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        fi

    - name: Decrypt reviewed plan artifact
      id: decrypt
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt "$STACK/stack.otplan"

    - name: Verify fingerprint matches the reviewed plan
      id: fingerprint
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        # The reviewed fingerprint moves out of the repo tree, as the planned-commit record
        # does. Only the regenerated fingerprint.txt, a gitignored artifact, is left behind.
        expected="$RUNNER_TEMP/expected-fingerprint.txt"
        mv fingerprint.txt "$expected"
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --fingerprint-only
        if ! diff -q fingerprint.txt "$expected" >/dev/null; then
          names=$(python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --keys)
          echo "::error::apply aborted for $ENV/$STACK: current env does not match the reviewed plan's fingerprint. Current variable names: $names. Values differ or a variable was added/removed. Re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        fi

    - name: Check the reviewed plan text's digest reached this action
      id: digest-input
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
      run: |
        set -euo pipefail
        # GitHub does not enforce `required: true`: this refuses an empty or malformed digest before
        # any work. Its own step, above the init: a wiring slip and a tampered plan need different
        # remedies, so they must not share a blocked reason.
        [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
          echo "::error::apply aborted for $ENV/$STACK: no usable plan-text digest reached this action. Re-pin every engine reference to one commit. Then re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        }

    - name: Initialize the stack
      id: init
      uses: $/actions/cell-init
      with:
        stack: ${{ inputs.stack }}
        env: ${{ inputs.env }}
        slug: ${{ steps.ids.outputs.slug }}
        encryption-key: ${{ inputs.encryption-key }}

    # The save job saves local state only on a GitHub-hosted runner, so a cell that would leave
    # state it cannot save refuses here, before anything applies.
    - name: Refuse local-backend state on a runner that is not GitHub-hosted
      id: hosted
      shell: bash
      env:
        STATE_PATH: ${{ steps.init.outputs.state-path }}
      run: |
        if [ -n "$STATE_PATH" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
          echo "::error::the state saver runs only on GitHub-hosted runners; a reused self-hosted runner could alter what it saves. Use a GitHub-hosted runs_on or a remote backend."
          exit 1
        fi

    - name: Verify the stored plan renders as the reviewed plan text
      id: plan-digest
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ENV: ${{ inputs.env }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
      run: |
        set -euo pipefail
        # Binds the reviewed plan text to the plan about to run; before apply, so a refusal applies
        # nothing. After `init`: inside `terramate run` the render reads init's data directory
        # (`TF_DATA_DIR` from run.env) and, where the plan file lacks schemas, init's providers.
        rendered="$RUNNER_TEMP/rendered-plan.txt"
        # stderr goes to a file for `tofu-error`, so it is echoed back on success and failure alike:
        # otherwise a render's warnings and diagnostics never reach the log.
        status=0
        terramate run --quiet --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu show -no-color stack.otplan > "$rendered" 2> "$RUNNER_TEMP/show.txt" || status=$?
        cat "$RUNNER_TEMP/show.txt" >&2
        if [ "$status" -ne 0 ]; then
          python3 "$GITHUB_ACTION_PATH/../../scripts/tofu-error" < "$RUNNER_TEMP/show.txt" || true
          exit 1
        fi
        # Digested from stdin, not by name: sha256sum escapes a path containing a backslash and
        # prefixes the whole line with one, which would never equal the recorded digest.
        actual=$(sha256sum < "$rendered" | cut -d' ' -f1)
        if [ "$actual" != "$PLAN_SHA256" ]; then
          echo "::error::apply aborted for $ENV/$STACK: the stored plan does not render to the plan text that was reviewed (expected $PLAN_SHA256, got $actual). Nothing has been applied. Re-plan (comment shipmate plan or push), or after the merge open a new pull request touching the stack."
          exit 1
        fi

    - name: Apply the stored plan (exact-plan; stale -> fail-safe)
      id: apply
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # The engine owns the command, so exact-plan does not depend on branch content. tofu rejects
      # a plan whose state moved since generation, and the non-zero exit leaves the apply check
      # pending (fail-safe).
      run: |
        set -euo pipefail
        echo "::group::terramate apply: $STACK"
        # Exit on tofu's own PIPESTATUS[0], not pipefail: a `tee` failure alone would fail a
        # successful apply whose advanced state the `save` job persists, leaving a re-run on the
        # stale-plan fail-safe with no way back.
        set +e
        # No `-auto-approve`: inert on a stored plan, and its absence is a backstop. Were
        # `stack.otplan` lost, `-input=false` fails "Error asking for approval", where
        # `-auto-approve` would re-plan from branch content and apply that unattended.
        terramate run --quiet --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu apply -input=false stack.otplan 2>&1 | tee "$RUNNER_TEMP/apply.txt"
        status="${PIPESTATUS[0]}"
        set -e
        echo "::endgroup::"
        exit "$status"

    # always(): a failed or cancelled apply still mutated state; dropping it orphans resources.
    - name: Hand off the state
      id: handoff
      if: always()
      shell: bash
      env:
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
        STATE_PATH: ${{ steps.init.outputs.state-path }}
        SLUG: ${{ steps.ids.outputs.slug }}
        ENV: ${{ inputs.env }}
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/state-handoff"

    # No `overwrite`: a later same-named upload could replace the bundle. A failed upload is not
    # caught here; `save` finds no artifact matching the handed-off digest and refuses.
    - name: Upload the state
      if: ${{ always() && steps.handoff.outputs.bundle == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.handoff.outputs.name }}
        path: ${{ runner.temp }}/state.bundle

    - name: Compose cell summary
      # always(): every attempted or blocked cell needs a result. Env vars only: author text is never
      # shell- or JSON-spliced. Reviewer-facing (continue-on-error).
      if: always()
      continue-on-error: true
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        ENV: ${{ inputs.env }}
        PRE_APPLY_OUTCOME: ${{ steps.pre-apply.outcome }}
        PRE_APPLY_REFUSAL: ${{ inputs.pre-apply-refusal }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        PLANNED_HEAD_OUTCOME: ${{ steps.planned-head.outcome }}
        DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
        FINGERPRINT_OUTCOME: ${{ steps.fingerprint.outcome }}
        DIGEST_INPUT_OUTCOME: ${{ steps.digest-input.outcome }}
        INIT_OUTCOME: ${{ steps.init.outputs.init-outcome }}
        LOCATE_OUTCOME: ${{ steps.init.outputs.locate-outcome }}
        RESTORE_OUTCOME: ${{ steps.init.outputs.restore-outcome }}
        HOSTED_OUTCOME: ${{ steps.hosted.outcome }}
        PLAN_DIGEST_OUTCOME: ${{ steps.plan-digest.outcome }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-cell-summary"

    - name: Upload apply summary
      # Reviewer-facing only (continue-on-error): a failed upload drops the cell's output from the
      # comment rather than stranding its check pending. `overwrite: true` keeps a same-run job
      # re-run from failing 409 on the existing artifact name.
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: apply-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          ${{ runner.temp }}/cell.json
          ${{ runner.temp }}/apply.txt
        overwrite: true
