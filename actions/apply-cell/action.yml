name: shipmate apply-cell
description: Apply one stack x env from its reviewed .otplan artifact; complete the apply check. Never re-plans.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the check, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  head-sha:
    description: PR head SHA carrying the pending apply check.
    required: true
  plan-run-id:
    description: Plan run id holding the reviewed plan artifact.
    required: true
  state-path:
    description: Flavor state path, e.g. stacks/app/.state.
    required: true
  github-token:
    description: GITHUB_TOKEN with actions:read (reviewed-plan artifact download).
    required: true
  plan-passphrase:
    description: Passphrase to decrypt the .otplan artifact; must match plan-cell's. Empty = expect plaintext.
    required: false
    default: ""
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from a repo/org secret).
    required: true
runs:
  using: composite
  steps:
    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated) — injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write

    - name: Download reviewed plan artifact (fail-safe if missing)
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.plan-run-id }}
        ART: plan.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        set -euo pipefail
        if [ -z "$RUN_ID" ]; then
          echo "::error::no successful plan run for this head SHA — no reviewed plan to apply for $ENV/$STACK_NAME. Re-run plan."
          exit 1
        fi
        [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan-run-id must be numeric (got: $RUN_ID)"; exit 1; }
        echo "::group::download reviewed plan: $ART"
        if ! gh run download "$RUN_ID" -n "$ART" -D . ; then
          echo "::endgroup::"
          echo "::error::reviewed plan artifact '$ART' missing/expired — cannot apply $ENV/$STACK_NAME without re-planning (fail-safe). Re-run plan."
          exit 1
        fi
        echo "::endgroup::"

    - name: Decrypt reviewed plan artifact (fail-safe on config/plaintext mismatch)
      id: decrypt
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        PLAN_PASSPHRASE: ${{ inputs.plan-passphrase }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt "$STACK/stack.otplan"

    - name: Verify fingerprint matches the reviewed plan
      id: fingerprint
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        set -euo pipefail
        # Move the reviewed fingerprint OUT of the repo tree: once git-out-of-sync
        # is disabled, git-untracked runs on the apply path, and a stray untracked
        # file at repo root would fail the apply. Only the regenerated
        # fingerprint.txt (a gitignored artifact) may remain in the tree.
        expected="$RUNNER_TEMP/expected-fingerprint.txt"
        mv fingerprint.txt "$expected"
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --fingerprint-only
        if ! diff -q fingerprint.txt "$expected" >/dev/null; then
          names=$(python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" --keys)
          echo "::error::apply aborted for $ENV/$STACK_NAME: current env does not match the reviewed plan's fingerprint. Current variable names: $names. Values differ or a variable was added/removed — re-plan."
          exit 1
        fi

    - name: Snapshot pre-existing apply-check ids
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        ENV: ${{ inputs.env }}
        STACK: ${{ inputs.stack }}
        HEAD_SHA: ${{ inputs.head-sha }}
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      # Record the apply-check ids that exist for this (env, stack) BEFORE
      # the apply runs. The completion step marks only these done, so a plan
      # re-run that creates a fresh duplicate apply check mid-apply is left
      # pending (its plan was never applied by this run) instead of being greened.
      # filter=all sees every pre-existing duplicate; writing to RUNNER_TEMP keeps
      # the live git-untracked safeguard from failing the apply on a repo-root file.
      # Only App-authored checks are snapshotted/completed — a forged same-name
      # check created by another identity is never greened.
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # Check-runs are paginated (a 256-cell PR yields >100); stream them all.
        gh api --paginate --jq '.check_runs[]' \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          > "$RUNNER_TEMP/checks.jsonl"
        # Author-controlled ENV/STACK via env; JSON handled in python. The check
        # name uses the stack PATH ($STACK) — the value deploy-detect reconstructs.
        python3 - > "$RUNNER_TEMP/preexisting-apply-ids.txt" <<'PY'
        import json, os
        name = f"apply / {os.environ['ENV']} / {os.environ['STACK']}"
        _app_id = os.environ["SHIPMATE_APP_ID"]
        if not _app_id:
            raise SystemExit("::error::SHIPMATE_APP_ID is empty — set the SHIPMATE_APP_ID repo/org variable to the shipmate App id.")
        app_id = int(_app_id)
        with open(os.environ["RUNNER_TEMP"] + "/checks.jsonl") as fh:
            ids = [c["id"] for c in map(json.loads, fh)
                   if c.get("name") == name and ((c.get("app") or {}).get("id")) == app_id]
        if not ids:
            raise SystemExit(f"::error::no apply check named '{name}' on head SHA before apply; nothing to complete.")
        print("\n".join(str(i) for i in ids))
        PY

    - name: Restore state
      id: restore-state
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: restore
        path: ${{ inputs.state-path }}

    - name: Apply the stored plan (exact-plan; stale -> fail-safe)
      id: apply
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # The fixture 'apply' script runs `tofu apply stack.otplan` (honors the
      # auth subtree override). tofu rejects a plan whose state moved since it
      # was generated -> non-zero exit -> apply check stays pending (fail-safe).
      # Tee combined stdout+stderr to RUNNER_TEMP (never the repo tree -- the
      # live git-untracked safeguard runs on this path) for the cell-summary
      # artifact. `set -o pipefail` (already on) makes the step's exit code
      # tofu's, not tee's, so the fail-safe above still fires on a real error.
      run: |
        set -euo pipefail
        echo "::group::terramate apply: $STACK"
        terramate script run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" apply 2>&1 | tee "$RUNNER_TEMP/apply.txt"
        echo "::endgroup::"

    - name: Save state
      # Persist state whenever the apply was attempted (restore succeeded), not
      # only on a clean apply: a partial `tofu apply` mutates local state
      # per-resource whether it failed OR was cancelled (manual, or
      # apply-<env>-<stack> concurrency displacement), and dropping that delta
      # would orphan resources on the next run's restore-then-retry. always()
      # (not !cancelled()) is safe here because the sink is actions/cache:
      # entries commit only on a completed, size-validated upload and are keyed
      # per run_id-run_attempt, so a teardown mid-upload never commits and can
      # never clobber the last-good state — worst case is today's behaviour
      # (delta lost), best case the partial state persists and the next retry
      # hits tofu's stale-plan fail-safe loudly. Guard on restore's outcome so
      # we never save a state that was never actually restored (e.g. restore
      # itself failed). On cancellation the later "Complete the apply check"
      # step still skips (default success()), leaving the check pending so the
      # work is re-detected.
      if: ${{ always() && steps.restore-state.outcome == 'success' }}
      uses: ship-iac/shipmate/actions/state@cc54ebf89eb763a243a0dc2fc2504ba7dbed5b92 # pinned to a commit on main
      with:
        stack-slug: ${{ steps.ids.outputs.slug }}
        env: ${{ inputs.env }}
        mode: save
        path: ${{ inputs.state-path }}

    - name: Compose cell summary
      # Runs even when a fail-safe or the apply itself failed/was cancelled --
      # the aggregator needs a result for every attempted-or-blocked cell.
      # Built via python from env vars only: stack/env/reason text is
      # author-controlled (Terramate tags, workflow inputs) and must never be
      # shell-interpolated into the script or spliced into JSON by string
      # concat.
      if: always()
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
        FINGERPRINT_OUTCOME: ${{ steps.fingerprint.outcome }}
        RESTORE_OUTCOME: ${{ steps.restore-state.outcome }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, shutil

        # Checked in pipeline order: the four pre-apply fail-safes run
        # sequentially, so on a real failure every later one is 'skipped',
        # not 'success' -- the first non-success in this order is the one
        # that actually tripped.
        FAILSAFES = [
            ("DOWNLOAD_OUTCOME", "reviewed plan artifact missing or expired — re-run plan"),
            ("DECRYPT_OUTCOME", "plan artifact could not be decrypted — passphrase/config mismatch"),
            (
                "FINGERPRINT_OUTCOME",
                "environment does not match the reviewed plan's fingerprint — re-plan",
            ),
            ("RESTORE_OUTCOME", "state restore failed"),
        ]

        result, reason = None, ""
        for env_key, message in FAILSAFES:
            if os.environ[env_key] != "success":
                result, reason = "blocked", message
                break

        if result is None:
            # apply ran: success -> applied; anything else (failure,
            # cancelled) -> failed. Blocked is reserved for the fail-safes above.
            result = "applied" if os.environ["APPLY_OUTCOME"] == "success" else "failed"

        with open("cell.json", "w") as fh:
            json.dump(
                {
                    "stack": os.environ["STACK_NAME"],
                    "stack_path": os.environ["STACK"],
                    "environment": os.environ["ENV"],
                    "result": result,
                    "reason": reason,
                },
                fh,
            )

        # A blocked cell never reached the apply step -- no apply.txt to copy.
        apply_log = os.path.join(os.environ["RUNNER_TEMP"], "apply.txt")
        if os.path.exists(apply_log):
            shutil.copyfile(apply_log, "apply.txt")
        PY

    - name: Upload apply summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apply-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          cell.json
          apply.txt

    - name: Mint App installation token for completion
      # Re-mint: a long (>1h) apply can outlive the job-start token; completion needs a fresh one.
      id: token_complete
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write

    - name: Complete the apply check
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token_complete.outputs.token }}
      # Complete ONLY the ids snapshotted before the apply (see the snapshot note above):
      # a duplicate apply check created mid-apply is not in the snapshot and stays
      # pending. The body is static (no author input) so it is a plain heredoc.
      run: |
        set -euo pipefail
        cat > body.json <<'JSON'
        {"status": "completed", "conclusion": "success", "output": {"title": "applied", "summary": "Applied the reviewed plan for this stack x environment."}}
        JSON
        # State is already saved; retry each completion so a transient API blip
        # doesn't strand a check pending — re-running can't recover it (the saved
        # plan is now stale against the advanced state).
        while read -r id; do
          [ -z "$id" ] && continue
          ok=""
          for _ in 1 2 3 4 5; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" --input body.json >/dev/null; then ok=1; break; fi
            sleep 3
          done
          [ -n "$ok" ] || { echo "::error::failed to complete apply check $id after retries"; exit 1; }
        done < "$RUNNER_TEMP/preexisting-apply-ids.txt"
