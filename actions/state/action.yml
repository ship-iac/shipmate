name: shipmate state
description: Restore OpenTofu local state for one stack x environment from actions/cache and decrypt it, or save or look up a state file another step already sealed.
inputs:
  stack-slug:
    description: Filesystem-safe stack id (path separators replaced by '-').
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  mode:
    description: >-
      `restore` (before plan or apply) decrypts the newest entry under the stack and environment's
      prefix. `save` saves the file at `path` as it is, which must already be sealed with
      `plan-crypt`'s `encrypt_state` under this key's prefix, then looks the entry up. `lookup` only
      looks up the exact key and never saves.
    required: true
  path:
    description: >-
      State path to cache, relative to the repository root. No default: the cell actions pass
      the path scripts/state-path read from the stack's `tofu init` record.
    required: true
  encryption-key:
    description: SHIPMATE_ENCRYPTION_KEY, which decrypts a restored entry. Required by `restore`, where empty refuses before any cache call; `save` and `lookup` handle ciphertext and read no key.
    required: false
    default: ""
  attempt:
    description: The run attempt in the key. Empty means this job's GITHUB_RUN_ATTEMPT; otherwise 1 to 4 digits with no leading zero.
    required: false
    default: ""
  key-suffix:
    description: Appended to the key, exactly empty or `-r1`; anything else refuses. Every restore matches both, since it restores by prefix.
    required: false
    default: ""
outputs:
  saved:
    description: >-
      `true` only when a `save` or `lookup` found the entry under its exact key: the first
      lookup, or one of up to four more about 3, 10, 20 and 30 s after a miss. Anything else
      means no entry was found: the save failed, was cancelled or skipped, or no lookup found
      the entry.
    value: ${{ steps.verify.outputs.cache-hit == 'true' || steps.verify2.outputs.cache-hit == 'true' || steps.verify3.outputs.cache-hit == 'true' || steps.verify4.outputs.cache-hit == 'true' || steps.verify5.outputs.cache-hit == 'true' }}
runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      # Pass the input via env (never interpolate ${{ }} into the script body):
      # injection-safe, and keeps the block lintable by shellcheck.
      env:
        MODE: ${{ inputs.mode }}
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: |
        case "$MODE" in
          restore|save|lookup) ;;
          *) echo "::error::shipmate/actions/state: 'mode' must be 'restore', 'save' or 'lookup', got '$MODE'"; exit 1 ;;
        esac
        if [ "$MODE" = restore ] && [ -z "$ENCRYPTION_KEY" ]; then
          echo "::error::shipmate/actions/state: SHIPMATE_ENCRYPTION_KEY is empty. Cached local state is encrypted with it, so every restore needs it. Set the secret and forward it to the shipmate workflows."
          exit 1
        fi
    - name: State cache key
      id: key
      shell: bash
      env:
        SLUG: ${{ inputs.stack-slug }}
        ENV_NAME: ${{ inputs.env }}
        ATTEMPT: ${{ inputs.attempt }}
        SUFFIX: ${{ inputs.key-suffix }}
      # '/'-delimited so one env name cannot prefix-match another (state/app/dev/ never matches
      # state/app/dev-eu/...). The attempt makes each GitHub "re-run" a fresh, writable save key.
      run: |
        attempt="${ATTEMPT:-$GITHUB_RUN_ATTEMPT}"
        [[ "$attempt" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::shipmate/actions/state: 'attempt' must be 1 to 4 digits with no leading zero, got '$attempt'"; exit 1; }
        [ -z "$SUFFIX" ] || [ "$SUFFIX" = -r1 ] || { echo "::error::shipmate/actions/state: 'key-suffix' must be empty or '-r1', got '$SUFFIX'"; exit 1; }
        echo "prefix=state/$SLUG/$ENV_NAME/" >> "$GITHUB_OUTPUT"
        echo "key=state/$SLUG/$ENV_NAME/$GITHUB_RUN_ID-$attempt$SUFFIX" >> "$GITHUB_OUTPUT"
    - name: Restore state
      id: restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Decrypt state
      # A refusal must fail this action: cell-init's restore-outcome is then not `success`, so
      # apply-cell never applies over the undecrypted file. No continue-on-error.
      # The matched key, not the save key: plan-crypt names it and cuts its prefix for the remedy.
      if: ${{ inputs.mode == 'restore' && steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
        STATE_PATH: ${{ inputs.path }}
        KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt-state "$STATE_PATH" "$KEY"
    - name: Check the state file is sealed
      id: sealed
      if: ${{ inputs.mode == 'save' }}
      shell: bash
      env:
        STATE_PATH: ${{ inputs.path }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" sealed "$STATE_PATH"
    - name: Save state
      if: ${{ inputs.mode == 'save' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Look up the saved entry
      id: verify
      # actions/cache/save succeeds when it stores nothing, so only exact-key lookups prove the entry;
      # one lookup 300 ms after a save missed an entry found minutes later. The key is per run attempt
      # and an attempt runs one cell per stack and environment, so no other save's entry can match.
      if: ${{ inputs.mode != 'restore' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    # Each step reads only the one before it: a skipped step's outcome is `skipped`, so the chain
    # stops at the first hit and never runs after a failed, cancelled or skipped save.
    - name: Wait before lookup 2
      id: wait2
      if: ${{ steps.verify.outputs.cache-hit != 'true' && steps.verify.outcome == 'success' }}
      shell: bash
      run: sleep 3
    - name: Look up the saved entry, try 2
      id: verify2
      if: ${{ steps.wait2.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 3
      id: wait3
      if: ${{ steps.verify2.outputs.cache-hit != 'true' && steps.verify2.outcome == 'success' }}
      shell: bash
      run: sleep 7
    - name: Look up the saved entry, try 3
      id: verify3
      if: ${{ steps.wait3.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 4
      id: wait4
      if: ${{ steps.verify3.outputs.cache-hit != 'true' && steps.verify3.outcome == 'success' }}
      shell: bash
      run: sleep 10
    - name: Look up the saved entry, try 4
      id: verify4
      if: ${{ steps.wait4.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 5
      id: wait5
      if: ${{ steps.verify4.outputs.cache-hit != 'true' && steps.verify4.outcome == 'success' }}
      shell: bash
      run: sleep 10
    - name: Look up the saved entry, try 5
      id: verify5
      if: ${{ steps.wait5.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
