name: shipmate state
description: Restore or save OpenTofu local state for one stack x environment via actions/cache, encrypted at rest with the plan passphrase.
inputs:
  stack-slug:
    description: Filesystem-safe stack id (path separators replaced by '-').
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  mode:
    description: '"restore" (before plan/apply) or "save" (after apply).'
    required: true
  path:
    description: >-
      State path to cache, relative to the repository root. No default: the cell actions pass
      the path scripts/state-path read from the stack's `tofu init` record.
    required: true
  passphrase:
    description: SHIPMATE_PLAN_PASSPHRASE, which encrypts the cached state. Required; empty refuses both modes before any cache call.
    required: true
outputs:
  saved:
    description: >-
      `true` only when the save mode's lookup found the entry this run saved under its exact key.
      Anything else, empty included, means the state was not saved: the save failed, was cancelled
      or skipped, or the cache stored nothing.
    value: ${{ steps.verify.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      # Pass the input via env (never interpolate ${{ }} into the script body):
      # injection-safe, and keeps the block lintable by shellcheck.
      env:
        MODE: ${{ inputs.mode }}
        PASSPHRASE: ${{ inputs.passphrase }}
      run: |
        case "$MODE" in
          restore|save) ;;
          *) echo "::error::shipmate/actions/state: 'mode' must be 'restore' or 'save', got '$MODE'"; exit 1 ;;
        esac
        if [ -z "$PASSPHRASE" ]; then
          echo "::error::shipmate/actions/state: SHIPMATE_PLAN_PASSPHRASE is empty. Cached local state is encrypted with it, so every restore and save needs it. Set the secret and forward it to the shipmate workflows."
          exit 1
        fi
    - name: State cache key
      id: key
      shell: bash
      env:
        SLUG: ${{ inputs.stack-slug }}
        ENV_NAME: ${{ inputs.env }}
      # '/'-delimited so one env name cannot prefix-match another (state/app/dev/ never matches
      # state/app/dev-eu/...). run_attempt makes each GitHub "re-run" a fresh, writable save key.
      run: |
        echo "prefix=state/$SLUG/$ENV_NAME/" >> "$GITHUB_OUTPUT"
        echo "key=state/$SLUG/$ENV_NAME/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Restore state
      id: restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Decrypt state
      # A refusal must fail this action: cell-init's restore-outcome is then not `success`, so
      # apply-cell never saves the undecrypted file over the entry. No continue-on-error.
      # The matched key, not the save key: plan-crypt names it and cuts its prefix for the remedy.
      if: ${{ inputs.mode == 'restore' && steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        PLAN_PASSPHRASE: ${{ inputs.passphrase }}
        STATE_PATH: ${{ inputs.path }}
        KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt-state "$STATE_PATH" "$KEY"
    - name: Encrypt state
      id: encrypt
      if: ${{ inputs.mode == 'save' }}
      shell: bash
      env:
        PLAN_PASSPHRASE: ${{ inputs.passphrase }}
        STATE_PATH: ${{ inputs.path }}
        # plan-crypt binds the entry to its key's prefix, as decrypt-state reads it.
        KEY: ${{ steps.key.outputs.key }}
      # A 0-byte file is not saved: its restore would hand tofu an empty file, which it reads
      # as no state. Encrypts in place: nothing after the save may read the file.
      run: |
        if [ ! -s "$STATE_PATH" ]; then
          echo "::notice::shipmate/actions/state: no state to save at $STATE_PATH (absent or empty)."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" encrypt-state "$STATE_PATH" "$KEY"
    - name: Save state
      if: ${{ inputs.mode == 'save' && steps.encrypt.outputs.skip != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Look up the saved entry
      id: verify
      # actions/cache/save warns and succeeds when it stores nothing, so only this exact-key lookup
      # proves the entry. It needs one save per key (a second stores nothing, yet this finds the
      # first): the key carries run_id-run_attempt, and an attempt runs one cell per stack x env.
      if: ${{ inputs.mode == 'save' && steps.encrypt.outputs.skip != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
