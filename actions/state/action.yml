name: shipmate state
description: Restore or save OpenTofu local state for one stack x environment via actions/cache, encrypted at rest with the encryption key.
inputs:
  stack-slug:
    description: Filesystem-safe stack id (path separators replaced by '-').
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  mode:
    description: '"restore" (before plan/apply) or "save" (after apply).'
    required: true
  path:
    description: >-
      State path to cache, relative to the repository root. No default: the cell actions pass
      the path scripts/state-path read from the stack's `tofu init` record.
    required: true
  encryption-key:
    description: SHIPMATE_ENCRYPTION_KEY, which encrypts the cached state. Required; empty refuses both modes before any cache call.
    required: true
outputs:
  saved:
    description: >-
      `true` only when a save-mode lookup found the entry this run saved under its exact key: the
      first lookup, or one of up to four more that follow a miss after 3, 7, 10 and 10 s. Anything
      else means the state was not saved: the save failed, was cancelled or skipped, or no lookup
      found the entry.
    value: ${{ steps.verify.outputs.cache-hit == 'true' || steps.verify2.outputs.cache-hit == 'true' || steps.verify3.outputs.cache-hit == 'true' || steps.verify4.outputs.cache-hit == 'true' || steps.verify5.outputs.cache-hit == 'true' }}
runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      # Pass the input via env (never interpolate ${{ }} into the script body):
      # injection-safe, and keeps the block lintable by shellcheck.
      env:
        MODE: ${{ inputs.mode }}
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
      run: |
        case "$MODE" in
          restore|save) ;;
          *) echo "::error::shipmate/actions/state: 'mode' must be 'restore' or 'save', got '$MODE'"; exit 1 ;;
        esac
        if [ -z "$ENCRYPTION_KEY" ]; then
          echo "::error::shipmate/actions/state: SHIPMATE_ENCRYPTION_KEY is empty. Cached local state is encrypted with it, so every restore and save needs it. Set the secret and forward it to the shipmate workflows."
          exit 1
        fi
    - name: State cache key
      id: key
      shell: bash
      env:
        SLUG: ${{ inputs.stack-slug }}
        ENV_NAME: ${{ inputs.env }}
      # '/'-delimited so one env name cannot prefix-match another (state/app/dev/ never matches
      # state/app/dev-eu/...). run_attempt makes each GitHub "re-run" a fresh, writable save key.
      run: |
        echo "prefix=state/$SLUG/$ENV_NAME/" >> "$GITHUB_OUTPUT"
        echo "key=state/$SLUG/$ENV_NAME/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Restore state
      id: restore
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Decrypt state
      # A refusal must fail this action: cell-init's restore-outcome is then not `success`, so
      # apply-cell never saves the undecrypted file over the entry. No continue-on-error.
      # The matched key, not the save key: plan-crypt names it and cuts its prefix for the remedy.
      if: ${{ inputs.mode == 'restore' && steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
        STATE_PATH: ${{ inputs.path }}
        KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" decrypt-state "$STATE_PATH" "$KEY"
    - name: Encrypt state
      id: encrypt
      if: ${{ inputs.mode == 'save' }}
      shell: bash
      env:
        ENCRYPTION_KEY: ${{ inputs.encryption-key }}
        STATE_PATH: ${{ inputs.path }}
        # plan-crypt binds the entry to its key's prefix, as decrypt-state reads it.
        KEY: ${{ steps.key.outputs.key }}
      # A 0-byte file is not saved: its restore would hand tofu an empty file, which it reads
      # as no state. Encrypts in place: nothing after the save may read the file.
      run: |
        if [ ! -s "$STATE_PATH" ]; then
          echo "::notice::shipmate/actions/state: no state to save at $STATE_PATH (absent or empty)."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" encrypt-state "$STATE_PATH" "$KEY"
    - name: Save state
      if: ${{ inputs.mode == 'save' && steps.encrypt.outputs.skip != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Look up the saved entry
      id: verify
      # actions/cache/save warns and succeeds when it stores nothing, so only exact-key lookups prove
      # the entry; a miss is looked up 4 more times, as an entry can lag its save. One save per key
      # (a second stores nothing, yet is found): run_id-run_attempt, one cell per stack x env.
      if: ${{ inputs.mode == 'save' && steps.encrypt.outputs.skip != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    # Each step reads only the one before it: a skipped step's outcome is `skipped`, so the chain
    # stops at the first hit and never runs after a failed, cancelled or skipped save.
    - name: Wait before lookup 2
      id: wait2
      if: ${{ steps.verify.outputs.cache-hit != 'true' && steps.verify.outcome == 'success' }}
      shell: bash
      run: sleep 3
    - name: Look up the saved entry, try 2
      id: verify2
      if: ${{ steps.wait2.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 3
      id: wait3
      if: ${{ steps.verify2.outputs.cache-hit != 'true' && steps.verify2.outcome == 'success' }}
      shell: bash
      run: sleep 7
    - name: Look up the saved entry, try 3
      id: verify3
      if: ${{ steps.wait3.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 4
      id: wait4
      if: ${{ steps.verify3.outputs.cache-hit != 'true' && steps.verify3.outcome == 'success' }}
      shell: bash
      run: sleep 10
    - name: Look up the saved entry, try 4
      id: verify4
      if: ${{ steps.wait4.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
    - name: Wait before lookup 5
      id: wait5
      if: ${{ steps.verify4.outputs.cache-hit != 'true' && steps.verify4.outcome == 'success' }}
      shell: bash
      run: sleep 10
    - name: Look up the saved entry, try 5
      id: verify5
      if: ${{ steps.wait5.outcome == 'success' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: 'true'
