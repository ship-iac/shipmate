name: shipmate apply-complete
description: Complete the apply checks for every wave cell whose job actually succeeded in this run. The only step in the apply path that mints the App key.
inputs:
  snapshot:
    description: JSON object from apply-snapshot mapping each cell to its pre-existing apply-check ids.
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
  github-token:
    description: GITHUB_TOKEN with actions:read (this run's jobs listing).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: List run jobs and select the checks earned by this run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SHIPMATE_SNAPSHOT_JSON: ${{ inputs.snapshot }}
      # A 256-cell level exceeds the 100-per-page cap, so --paginate --jq
      # streams one job object per line for scripts/apply-complete to read on
      # stdin. Unlike actions/apply-summary's cosmetic log-link listing, this
      # one decides which checks get completed: an empty or failed listing
      # must fail the step loudly rather than degrade to no data, or a
      # successful apply would silently strand every check pending.
      #
      # The listing also lags: a wave job can finish seconds before its
      # conclusion is readable here, and a cell we cannot yet decide is not a
      # cell that did not run. So listing and selection are one retry loop --
      # the `gh api` fetch is inside the `for` because re-reading the listing
      # IS the retry; hoisting it turns twelve attempts into one, plus 110
      # seconds of sleeping over a snapshot that can never change.
      #
      # An empty listing (or a fetch that failed outright) is the most extreme
      # form of exactly that lag, so it is retried rather than failed on the
      # first attempt. A failed fetch takes the same path without reading the
      # file it half-wrote: a truncated listing matches a subset of cells and
      # so slips past the script's all-cells-unmatched floor.
      #
      # Ids accumulate across attempts and are deduped at the end, because
      # replicas differ: attempt 4 can land on a staler one than attempt 3 and
      # lose a row attempt 3 already saw. A later read may add a completion,
      # never revoke one -- the ids only ever come from a job GitHub recorded
      # as `success`.
      #
      # ~2 minutes of budget, not the ~30s a lag is expected to need, because
      # exhausting it is expensive rather than merely annoying: it fails
      # `complete`, which fails the env-level, and deploy.yml's `!failure()`
      # guards then skip every successor env-level -- halting a multi-region
      # deploy over infrastructure that already applied.
      #
      # Which is also why exhaustion does not fail *here*: the steps below
      # complete the checks this run did earn, and the last step then fails
      # the job over the cells it did not. Failing at this point instead would
      # discard a whole level's completions over one lagging cell, stranding
      # 29 checks to report the 30th.
      #
      # Only exit 75 (EX_TEMPFAIL) means "ask me again"; any other non-zero is
      # the script itself failing and is propagated immediately, so a broken
      # invocation is not retried for two minutes and then misreported as a
      # stale listing.
      #
      # Diagnostics are echoed once, after the loop, not per attempt: the file
      # is rewritten each time, so a 12-attempt run would otherwise log the
      # same warning 12 times. The stranded marker keeps only the script's
      # `retry:` lines -- the file also holds warnings naming cells that no
      # retry could have helped, and annotating those as the reason for the
      # failure names the wrong cells.
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/earned-ids.txt"
        : > "$RUNNER_TEMP/stranded.txt"
        ok=""
        attempts=12
        for n in $(seq "$attempts"); do
          rc=0
          : > "$RUNNER_TEMP/attempt-ids.txt"
          if gh api --paginate --jq '.jobs[]' \
               "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
               > "$RUNNER_TEMP/jobs.jsonl" && [ -s "$RUNNER_TEMP/jobs.jsonl" ]; then
            python3 "$GITHUB_ACTION_PATH/../../scripts/apply-complete" \
              < "$RUNNER_TEMP/jobs.jsonl" \
              > "$RUNNER_TEMP/attempt-ids.txt" \
              2> "$RUNNER_TEMP/diagnostics.txt" || rc=$?
          else
            rc=75
            echo "retry: the run jobs listing came back empty or unreadable — cannot tell which wave cells succeeded" \
              > "$RUNNER_TEMP/diagnostics.txt"
          fi
          cat "$RUNNER_TEMP/attempt-ids.txt" >> "$RUNNER_TEMP/earned-ids.txt"
          case "$rc" in
            0) ok=1; break ;;
            75) if [ "$n" -lt "$attempts" ]; then sleep 10; fi ;;
            *) cat "$RUNNER_TEMP/diagnostics.txt" >&2; exit "$rc" ;;
          esac
        done
        sort -u "$RUNNER_TEMP/earned-ids.txt" > "$RUNNER_TEMP/complete-ids.txt"
        cat "$RUNNER_TEMP/diagnostics.txt" >&2
        if [ -z "$ok" ]; then
          sed -n 's/^retry: //p' "$RUNNER_TEMP/diagnostics.txt" > "$RUNNER_TEMP/stranded.txt"
          [ -s "$RUNNER_TEMP/stranded.txt" ] ||
            echo "the retries were exhausted without the script naming a reason" \
              > "$RUNNER_TEMP/stranded.txt"
        fi

    - name: Mint App installation token
      # Minted after the jobs listing (which can fail/abort) rather than
      # before it, so the token's lifetime never spans a step that may not
      # need it at all -- only the completion PATCH below actually uses it.
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write

    - name: Complete the apply checks
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      # The body is static (no author input) so it is a plain heredoc. Retry
      # each completion so a transient API blip doesn't strand a check
      # pending — re-running can't recover it (the applied state has already
      # advanced past the reviewed plan).
      run: |
        set -euo pipefail
        cat > body.json <<'JSON'
        {"status": "completed", "conclusion": "success", "output": {"title": "applied", "summary": "Applied the reviewed plan for this stack x environment."}}
        JSON
        while read -r id; do
          [ -z "$id" ] && continue
          ok=""
          for _ in 1 2 3 4 5; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" --input body.json >/dev/null; then ok=1; break; fi
            sleep 3
          done
          [ -n "$ok" ] || { echo "::error::failed to complete apply check $id after retries"; exit 1; }
        done < "$RUNNER_TEMP/complete-ids.txt"

    - name: Fail over any cell the jobs listing never resolved
      shell: bash
      # Deliberately last, and deliberately still a failure: the completions
      # above are the earned half of this run, and a stranded check blocks the
      # gate forever while reporting success everywhere a human looks, so it
      # must never pass as one.
      run: |
        set -euo pipefail
        if [ -s "$RUNNER_TEMP/stranded.txt" ]; then
          echo "::error::the retries were exhausted and these apply checks are left pending: $(tr '\n' ' ' < "$RUNNER_TEMP/stranded.txt")"
          exit 1
        fi
