name: shipmate dispatch
description: Mint a short-lived GitHub App installation token and workflow_dispatch the consumer's .github/workflows/shipmate.yml, one file for every verb. Passes IDs only (dispatch inputs are size-limited); the body carries the verb, which selects the job that runs, plus exactly the other inputs that verb needs.
inputs:
  app-id:
    description: GitHub App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: GitHub App private key (from the shipmate-engine environment secret).
    required: true
  environment:
    description: Target environment, e.g. dev-eu. Carried by unlock always, by apply only when non-empty — an empty environment IS the bare `shipmate apply` (all non-explicit environments). Unused on the plan route, whose dispatched run carries no environment.
    required: false
    default: ''
  verb:
    description: Which job to run in shipmate.yml — plan, apply or unlock. Sent in the dispatch body, where the jobs' `if:` expressions read it. No default — a guessed verb runs one verb's job with another verb's inputs. `actions/comment-ops` exposes this as its `verb` output.
    required: true
  ref:
    description: PR head SHA to check out and apply. Empty and unused on the plan route, whose dispatched run resolves the head from the pull request itself.
    required: true
  pr-number:
    description: PR number the dispatched run belongs to — the plan body carries it beside the verb alone, and the unlock body not at all.
    required: true
  dispatch-ref:
    description: Branch whose workflow file runs (usually the default branch).
    required: true
  repository:
    description: owner/repo to dispatch in.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-actions: write
    - name: workflow_dispatch apply
      shell: bash
      # All author-controlled values pass via env, and the JSON body is built in python, never
      # a shell heredoc with interpolation — injection-safe.
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO: ${{ inputs.repository }}
        DISPATCH_REF: ${{ inputs.dispatch-ref }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERB: ${{ inputs.verb }}
        REF: ${{ inputs.ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        # The App token above is minted `actions: write` and cannot comment; the calling job
        # already holds `pull-requests: write` for comment-ops' own refusals.
        COMMENT_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Every refusal below lands on a run whose checks attach to the dispatch ref, so the pull
        # request would show nothing. Link, never the API's answer: that has no bounded length and
        # a comment body does. `|| true` so a cosmetic failure cannot mask the refusal's status.
        say_no_run_started() {
          GH_TOKEN="$COMMENT_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body=":x: shipmate: the command was authorized, but dispatching its workflow failed, so no run started. The error is in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >/dev/null || true
        }
        # A composite action's `required: true` is not enforced by GitHub, so a caller that omits
        # the input arrives with the empty string. Refuse rather than default: a default runs one
        # verb's job with another verb's inputs.
        if [ -z "${VERB:-}" ]; then
          echo "::error::The calling workflow did not pass a verb to shipmate/actions/dispatch, so nothing selects a job in shipmate.yml. Wire that step's verb input to the verb output of the comment-ops step above it (docs/getting-started.md)."
          say_no_run_started
          exit 1
        fi
        # The verb picks a job, not a file. The case survives to refuse a verb `shipmate.yml`
        # would accept — the input is declared — and then skip every job over, reading as a
        # successful run that did nothing.
        case "$VERB" in
          plan|apply|unlock) WORKFLOW=shipmate.yml ;;
          *) echo "::error::verb must be plan, apply or unlock (got: $VERB)"; say_no_run_started; exit 1 ;;
        esac
        [[ "$WORKFLOW" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::workflow must match ^[A-Za-z0-9._-]+$ (got: $WORKFLOW)"; exit 1; }
        python3 "$GITHUB_ACTION_PATH/../../scripts/dispatch-body" > body.json
        rc=0
        out=$(gh api -X POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" --input body.json 2>&1) || rc=$?
        printf '%s\n' "$out"
        if [ "$rc" -ne 0 ]; then
          # Measured, in order: an absent file answers 404, one with no such trigger `Workflow
          # does not have 'workflow_dispatch' trigger (HTTP 422)`, one declaring fewer inputs
          # than the body names `Unexpected inputs provided`. Anything else is not skew.
          if [[ "$out" == *"HTTP 404"* || "$out" == *workflow_dispatch* || "$out" == *"Unexpected inputs provided"* ]]; then echo "::error::This repository has no .github/workflows/shipmate.yml, or it predates the single-file layout — it declares no workflow_dispatch trigger, or not the verb/environment/ref/pr_number inputs every dispatch sends. Add or update that file — docs/upgrading.md section 0.27.0 has it; re-pinning cannot create it."; fi
          say_no_run_started
          exit "$rc"
        fi
        if [ "$VERB" = plan ]; then
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for PR #$PR_NUMBER"
        else
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for ${ENVIRONMENT:-all environments} (ref $REF)"
        fi
