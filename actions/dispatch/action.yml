name: shipmate dispatch
description: Mint a short-lived GitHub App installation token and workflow_dispatch the consumer's .github/workflows/shipmate.yml, one file for every verb. Passes IDs only (dispatch inputs are size-limited); the body carries the verb, which selects the job that runs, plus exactly the other inputs that verb needs. An unlock dispatch that started a run posts a notice reply on the pull request, linking that run when the API answer carries a usable run id; plan and apply runs answer on the pull request themselves. `scripts/dispatch-body post` sends the dispatch and retries a transient failure unless a shipmate.yml run may have started since the first attempt or none can be ruled out. A failed dispatch of any verb posts a failure reply that says whether a run may have started; one followed by a shipmate.yml run posts a notice reply and passes. Every reply only warns when it cannot be posted.
inputs:
  app-id:
    description: GitHub App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: GitHub App private key (from the shipmate-engine environment secret).
    required: true
  environment:
    description: Target environment, e.g. dev-eu. Carried by unlock always, by apply only when non-empty; an empty environment IS the bare `shipmate apply` (every environment not `targeted`). Unused on the plan route, whose dispatched run carries no environment.
    required: false
    default: ''
  verb:
    description: Which job to run in shipmate.yml (plan, apply or unlock). Sent in the dispatch body, where the jobs' `if:` expressions read it. No default; a guessed verb runs one verb's job with another verb's inputs. `actions/comment-ops` exposes this as its `verb` output.
    required: true
  ref:
    description: PR head SHA to check out and apply. Empty and unused on the plan route, whose dispatched run resolves the head from the pull request itself.
    required: true
  pr-number:
    description: PR number the dispatched run belongs to; the plan body carries it beside the verb alone, and the unlock body not at all.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-actions: write
    - name: workflow_dispatch apply
      shell: bash
      # All author-controlled values pass via env, and the JSON body is built in python, never
      # a shell heredoc with interpolation, so injection-safe.
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        # `ref` picks which branch's copy of shipmate.yml runs. The default branch's copy is the
        # reviewed one (a head ref runs the PR author's), and only it passes the shipmate-engine
        # environment's branch policy.
        DISPATCH_REF: ${{ github.event.repository.default_branch }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERB: ${{ inputs.verb }}
        REF: ${{ inputs.ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        # The App token above is minted `actions: write` and cannot comment; the calling job
        # already holds `pull-requests: write` for comment-ops' own refusals.
        COMMENT_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # reply <outcome> [text] [run id]: one reply on the pull request, with the workflow token.
        reply() {
          GH_TOKEN="$COMMENT_TOKEN" SHIPMATE_REPLY_VERB="$VERB" SHIPMATE_REPLY_ENV="$ENVIRONMENT" SHIPMATE_REPLY_OUTCOME="$1" \
            SHIPMATE_REPLY_TEXT="${2-}" SHIPMATE_REPLY_RUN_ID="${3-}" python3 "$GITHUB_ACTION_PATH/../../scripts/reply-comment"
        }
        # Every refusal and failure below lands on a run whose checks attach to the dispatch ref,
        # so the pull request would show nothing. A reply that fails only warns: it cannot mask
        # the status.

        # Measured skew answers: no file `HTTP 404`, no trigger `'workflow_dispatch' trigger`, fewer
        # inputs `Unexpected inputs provided`. Anything else is not skew.
        say_skew() {
          if [[ "$err" == *"HTTP 404"* || "$err" == *"'workflow_dispatch' trigger"* || "$err" == *"Unexpected inputs provided"* ]]; then echo "::error::This repository has no .github/workflows/shipmate.yml, or that file declares no workflow_dispatch trigger or not the inputs this verb's dispatch sends. docs/getting-started.md publishes it; re-pinning cannot create it."; fi
        }
        say_no_run_started() {
          reply failed "the command was authorized, but dispatching its workflow failed, so no run started. The error is in this run's log." \
            || echo "::warning::could not post the dispatch failure reply"
        }
        # A composite action's `required: true` is not enforced by GitHub, so a caller that omits
        # the input arrives with the empty string. Refuse rather than default: a default runs one
        # verb's job with another verb's inputs.
        if [ -z "${VERB:-}" ]; then
          echo "::error::The calling workflow did not pass a verb to shipmate/actions/dispatch, so nothing selects a job in shipmate.yml. Wire that step's verb input to the verb output of the comment-ops step above it (docs/getting-started.md)."
          say_no_run_started
          exit 1
        fi
        # The verb picks a job, not a file. The case survives to refuse a verb `shipmate.yml`
        # would accept (the input is declared) and then skip every job over, reading as a
        # successful run that did nothing.
        case "$VERB" in
          plan|apply|unlock) WORKFLOW=shipmate.yml ;;
          *) echo "::error::verb must be plan, apply or unlock (got: $VERB)"; say_no_run_started; exit 1 ;;
        esac
        errfile=$(mktemp) || { echo "::error::could not create a temporary file for the dispatch"; say_no_run_started; exit 1; }
        trap 'rm -f -- "$errfile"' EXIT
        rc=0
        # stdout alone is the API's answer, parsed below; `post` writes a failure to stderr.
        # Exit codes are documented in scripts/dispatch-body.
        out=$(python3 "$GITHUB_ACTION_PATH/../../scripts/dispatch-body" post 2>"$errfile") || rc=$?
        err=$(<"$errfile")
        [ -z "$out" ] || printf '%s\n' "$out"
        [ -z "$err" ] || printf '%s\n' "$err"
        if [ "$rc" -eq 3 ]; then
          echo "::warning::the dispatch answered with an error, but a shipmate.yml run started since it; not retried"
          reply notice "the dispatch answered with an error, but a shipmate.yml run started since it; it may be this command's. Check the Actions tab before commenting again." \
            || echo "::warning::could not post the dispatch reply"
          exit 0
        fi
        if [ "$rc" -eq 4 ]; then
          echo "::error::dispatching $WORKFLOW failed with a server or network error, so a run may have started"
          reply failed "the command was authorized, but dispatching its workflow failed with a server or network error, so a run may have started. Check the Actions tab before commenting again; the error is in this run's log." \
            || echo "::warning::could not post the dispatch failure reply"
          exit 1
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::dispatching $WORKFLOW failed, so no run started"
          say_skew
          say_no_run_started
          exit "$rc"
        fi
        if [ "$VERB" = plan ]; then
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for PR #$PR_NUMBER"
        else
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for ${ENVIRONMENT:-all environments} (ref $REF)"
        fi
        # Plan and apply runs answer on the pull request themselves. The unlock run has started, so
        # its reply only warns on failure. Only `workflow_run_id` is passed on, cut to 21
        # characters so an oversized value cannot fail exec; `reply-comment` checks it.
        if [ "$VERB" = unlock ]; then
          run_id=$(printf '%s' "$out" | python3 -c 'import json, sys; print(json.load(sys.stdin)["workflow_run_id"])' 2>/dev/null) || run_id=""
          reply started "" "${run_id:0:21}" || echo "::warning::could not post the dispatch reply; the run started"
        fi
