name: shipmate dispatch
description: Mint a short-lived GitHub App installation token and workflow_dispatch the consumer wrapper the mode selects — apply.yml for apply and unlock (its optional `environment` input selects a targeted env; empty means bare `shipmate apply`), plan.yml for plan. Passes IDs only (dispatch inputs are size-limited); also passes mode (apply, unlock or plan) to control dispatch behavior.
inputs:
  app-id:
    description: GitHub App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: GitHub App private key (from the shipmate-engine environment secret).
    required: true
  environment:
    description: Target environment, e.g. dev-eu. Empty = bare `shipmate apply` (all non-explicit environments), and empty on the plan route, whose dispatched run carries no environment.
    required: false
    default: ''
  mode:
    description: apply (default), unlock or plan. Included in the dispatch body only when 'unlock' — a consumer apply.yml that predates this input declares no such input, and a workflow_dispatch carrying an undeclared input is rejected (422). 'plan' targets plan.yml, whose body carries the PR number alone for the same reason.
    required: false
    default: ''
  ref:
    description: PR head SHA to check out and apply. Empty and unused on the plan route, whose dispatched run resolves the head from the pull request itself.
    required: true
  pr-number:
    description: PR number the dispatched run belongs to — the plan body carries it alone.
    required: true
  workflow:
    description: Workflow file to dispatch. Default apply.yml (the merged wrapper). A split apply.yml/apply-all.yml layout needs the file picked per comment — targeted vs bare — which this static input cannot do, so whichever file it names, the other verb is dispatched at the wrong workflow and rejected (422) over the `environment` input one declares and the other does not. Merge the wrappers instead; the split layout is the escape hatch, not the path. Default plan.yml when mode is plan, apply.yml otherwise.
    required: false
    default: ''
  dispatch-ref:
    description: Branch whose workflow file runs (usually the default branch).
    required: true
  repository:
    description: owner/repo to dispatch in.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Mint App installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-actions: write
    - name: workflow_dispatch apply
      shell: bash
      # All author-controlled values pass via env; the JSON body is built in
      # python (never a shell heredoc with interpolation) — injection-safe.
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO: ${{ inputs.repository }}
        WORKFLOW: ${{ inputs.workflow }}
        DISPATCH_REF: ${{ inputs.dispatch-ref }}
        ENVIRONMENT: ${{ inputs.environment }}
        MODE: ${{ inputs.mode }}
        REF: ${{ inputs.ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        if [ -z "$WORKFLOW" ]; then
          if [ "${MODE:-}" = plan ]; then WORKFLOW=plan.yml; else WORKFLOW=apply.yml; fi
        fi
        [[ "$WORKFLOW" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::workflow must match ^[A-Za-z0-9._-]+$ (got: $WORKFLOW)"; exit 1; }
        case "${MODE:-}" in ''|apply|unlock|plan) ;; *) echo "::error::mode must be apply, unlock or plan (got: $MODE)"; exit 1 ;; esac
        python3 - > body.json <<'PY'
        import json, os
        mode = os.environ.get("MODE", "")
        if mode == "plan":
            # plan.yml declares exactly one input, pr_number. `ref` is not among
            # them: the dispatched run resolves the head from the pull request
            # itself, so nothing a dispatcher states decides what is planned.
            inputs = {"pr_number": os.environ["PR_NUMBER"]}
        else:
            inputs = {
                "ref": os.environ["REF"],
                "pr_number": os.environ["PR_NUMBER"],
            }
            # The `environment` key is included only when set: the merged apply.yml
            # wrapper declares it optional (empty = bare `shipmate apply`), and a
            # split-layout apply-all.yml declares no such input at all — a
            # workflow_dispatch with an undeclared input is rejected (422).
            if os.environ.get("ENVIRONMENT"):
                inputs["environment"] = os.environ["ENVIRONMENT"]
            if mode == "unlock":
                inputs["mode"] = mode
        print(json.dumps({"ref": os.environ["DISPATCH_REF"], "inputs": inputs}))
        PY
        rc=0
        out=$(gh api -X POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" --input body.json 2>&1) || rc=$?
        printf '%s\n' "$out"
        if [ "$rc" -ne 0 ]; then
          # Only a 422 that names `mode` as unexpected is version skew. A 403,
          # a rate limit -- or a 422 about a different input -- is another
          # problem entirely, and explaining it as skew sends the operator to
          # re-pin workflows that are fine. The raw API message is printed above
          # either way.
          if [ "$MODE" = "unlock" ] && [[ "$out" == *"Unexpected inputs provided"* && "$out" == *mode* ]]; then echo "::error::The consumer's apply.yml does not declare the mode input; this repository's workflows predate shipmate unlock. Re-pin the consumer workflows to a release that has it (docs/releasing.md)."; fi
          # Measured: dispatching a workflow with no such trigger answers
          # `Workflow does not have 'workflow_dispatch' trigger (HTTP 422)`.
          # No input name is ANDed in as the unlock branch does: the plan body
          # carries one input, so an unexpected-input 422 there can only be
          # about pr_number, which is what the message already says.
          if [ "$MODE" = "plan" ] && [[ "$out" == *"Unexpected inputs provided"* || "$out" == *workflow_dispatch* ]]; then echo "::error::This repository's plan.yml does not accept a dispatched plan — it predates the plan verb, or declares no pr_number input. Re-pin the consumer workflows to a release that has it (docs/releasing.md)."; fi
          exit "$rc"
        fi
        if [ "${MODE:-}" = plan ]; then
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for PR #$PR_NUMBER"
        else
          echo "::notice title=dispatch::dispatched $WORKFLOW on $DISPATCH_REF for ${ENVIRONMENT:-all environments} (ref $REF)"
        fi
