name: shipmate plan-cell
description: Plan one stack x env, publish plan text + artifacts. (The pending apply check is created by actions/summary with the App token.)
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the check, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
  retention-days:
    description: Plan artifact retention (days); caps how long the plan artifact stays downloadable. Empty = the repository default.
    required: false
    default: "7"
  plan-passphrase:
    description: Optional passphrase to encrypt the .otplan artifact at rest. Empty = plaintext (backward compatible).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      # The engine owns the tofu command line: a pull request cannot redefine
      # what "plan" means. terramate stays in the path for stack cwd and the
      # safeguard policy only.
      # `init` sits above the group marker: its output is setup noise, not plan
      # output. errexit is lifted for the plan itself so the group is closed on
      # a failing plan too -- tofu's error text is the one thing a reader needs
      # here, and an unclosed `::group::` collapses it.
      # Restored local-backend workspace state arrives without the `.terraform`
      # record that marks the backend initialised, so `init` reads it as legacy
      # state awaiting migration and `-input=false` turns that question into a
      # hard error. Hide it across the init and put it back either way: under
      # `-reconfigure` a migration is never intended, and non-interactively it
      # could never have been answered. errexit is lifted only so the restore
      # runs on a failed init; the explicit exit keeps that failure fatal.
      run: |
        set -euo pipefail
        ws="$STACK/terraform.tfstate.d"
        hidden=$(mktemp -du "$RUNNER_TEMP/tfstate.d.XXXXXX")
        if [ -d "$ws" ]; then mv "$ws" "$hidden"; fi
        set +e
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure
        init_status=$?
        set -e
        # init recreates $ws empty; drop that so the real state replaces it
        # rather than being moved inside it.
        if [ -d "$hidden" ]; then rm -rf "$ws"; mv "$hidden" "$ws"; fi
        [ "$init_status" -eq 0 ] || exit "$init_status"
        echo "::group::terramate plan: $STACK"
        set +e
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu plan -input=false -lock=false -out=stack.otplan
        status=$?
        set -e
        echo "::endgroup::"
        exit "$status"

    - name: Stack slug
      id: ids
      shell: bash
      # Author-controlled $STACK via env (never interpolated) — injection-safe.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        slug=$(printf '%s' "$STACK" | tr / -)
        [[ "$slug" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::stack path produced invalid slug"; exit 1; }
        echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Render + classify plan
      id: plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        tofu -chdir="$STACK" show -no-color stack.otplan > plan.txt
        tofu -chdir="$STACK" show -json stack.otplan > plan.json
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-classify" plan.json

    - name: Encrypt plan artifact at rest (no-op without a passphrase)
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        PLAN_PASSPHRASE: ${{ inputs.plan-passphrase }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/plan-crypt" encrypt "$STACK/stack.otplan"

    - name: Step summary (plan text, 64KiB cap)
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        {
          echo "## $STACK_NAME / $ENV"
          echo '```'
          head -c 65536 plan.txt
          bytes=$(wc -c < plan.txt)
          echo ''
          echo '```'
          if [ "$bytes" -gt 65536 ]; then
            echo "_Plan truncated at 64 KiB ($bytes bytes total) — full plan in this job's raw log._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload plan artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: plan.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          ${{ inputs.stack }}/stack.otplan
          fingerprint.txt
        retention-days: ${{ inputs.retention-days }}

    - name: Write cell summary
      shell: bash
      # Build via python from env vars so an author-controlled stack-name/env
      # cannot inject shell or break the JSON.
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        ADD: ${{ steps.plan.outputs.add }}
        CHANGE: ${{ steps.plan.outputs.change }}
        DESTROY: ${{ steps.plan.outputs.destroy }}
        CHANGED: ${{ steps.plan.outputs.changed }}
      run: |
        python3 - <<'PY'
        import json, os
        with open("fingerprint.txt", encoding="utf-8") as fh:
            fingerprint = fh.read().strip()
        with open("cell.json", "w") as fh:
            json.dump({
                "stack": os.environ["STACK_NAME"],
                "stack_path": os.environ["STACK"],
                "environment": os.environ["ENV"],
                "add": int(os.environ["ADD"]),
                "change": int(os.environ["CHANGE"]),
                "destroy": int(os.environ["DESTROY"]),
                "changed": os.environ["CHANGED"] == "true",
                "fingerprint": fingerprint,
            }, fh)
        PY

    - name: Upload cell summary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cell-summary.${{ inputs.env }}.${{ steps.ids.outputs.slug }}
        path: |
          cell.json
          plan.txt
        retention-days: ${{ inputs.retention-days }}
