name: shipmate unlock-cell
description: Release a stranded OpenTofu state lock for one stack x env. Probes with a plan to discover the lock id, then force-unlocks that id and nothing else. Runs no other tofu command and completes no check.
inputs:
  stack:
    description: Stack path, e.g. stacks/app.
    required: true
  stack-name:
    description: Stack display name for the report, e.g. app.
    required: true
  env:
    description: Environment name, e.g. dev-eu.
    required: true
runs:
  using: composite
  steps:
    - name: Init
      id: init
      shell: bash
      # A failed init leaves the lock UNKNOWN, not absent, and unknown is not a
      # success -- so this fails the cell, like every other cell's init.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu init -input=false -reconfigure

    - name: Probe the state lock
      id: probe
      shell: bash
      # A plan is the probe: it takes the backend's lock (so a held lock fails
      # it and prints the whole `Lock Info:` block, which carries the only copy
      # of the id `force-unlock` needs), and `-refresh=false` keeps it from
      # touching a single provider on the way there. No `-out`: nothing here
      # ever applies what this plans.
      # errexit is lifted for just that pipeline and tofu's own status taken
      # from PIPESTATUS[0]: a failing plan is the EXPECTED path here, and a
      # cosmetic `tee` failure must not decide which of the three outcomes
      # below the cell reports.
      # scripts/lock-info is the engine's only parser of this output; it writes
      # held/lock_id/lock_created/lock_operation and exits 0 either way, so
      # "no lock" arrives as data rather than as a failure.
      env:
        STACK: ${{ inputs.stack }}
      run: |
        set -euo pipefail
        echo "::group::terramate plan (lock probe): $STACK"
        set +e
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu plan -input=false -refresh=false 2>&1 | tee "$RUNNER_TEMP/probe.txt"
        status="${PIPESTATUS[0]}"
        set -e
        echo "::endgroup::"
        echo "probe_status=$status" >> "$GITHUB_OUTPUT"
        python3 "$GITHUB_ACTION_PATH/../../scripts/lock-info" < "$RUNNER_TEMP/probe.txt"

    - name: Report that no lock was released
      id: report
      if: ${{ steps.probe.outputs.held != 'true' }}
      shell: bash
      # Two ways to get here, and they are not the same fact. A clean probe
      # proves no lock is held -- which is also every local-backend cell, where
      # a lock dies with the process that took it, so this action is
      # structurally a graceful no-op there, and that path succeeds.
      # A failed probe with no parsable lock (a config error, a failed init, any
      # other tofu failure) proves nothing at all. It must never be reported as
      # "no lock held" -- an operator reading that would take the cell for clean
      # while it may still be locked -- and it fails the cell: the engine
      # failing to look is not a success, and an annotation on a green run
      # across dozens of cells is easy to miss.
      env:
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        PROBE_STATUS: ${{ steps.probe.outputs.probe_status }}
      run: |
        set -euo pipefail
        if [ "$PROBE_STATUS" = "0" ]; then
          echo "::notice::no state lock held for $STACK_NAME / $ENV"
        else
          echo "::warning::could not determine whether a lock is held for $STACK_NAME / $ENV — see the log"
          exit 1
        fi

    - name: Release the state lock
      id: release
      if: ${{ steps.probe.outputs.held == 'true' }}
      shell: bash
      # `-force` is mandatory: without it OpenTofu asks for confirmation, and no
      # cell has a TTY. The id comes from the probe's own output via env: it
      # reaches an argv, which is why lock-info charset-pins it.
      # Not wrapped in a `::group::`: this is one command whose failure text is
      # the whole point, and an unclosed group collapses it.
      # `created` and `operation` are rendered only when non-empty -- lock-info
      # blanks a value that fails its charset guard rather than rejecting an
      # otherwise-usable lock, so neither field may be rendered unconditionally.
      env:
        STACK: ${{ inputs.stack }}
        STACK_NAME: ${{ inputs.stack-name }}
        ENV: ${{ inputs.env }}
        LOCK_ID: ${{ steps.probe.outputs.lock_id }}
        LOCK_CREATED: ${{ steps.probe.outputs.lock_created }}
        LOCK_OPERATION: ${{ steps.probe.outputs.lock_operation }}
      run: |
        set -euo pipefail
        terramate run --disable-safeguards=git-out-of-sync --no-recursive -C "$STACK" -- tofu force-unlock -force "$LOCK_ID"
        msg="released state lock $LOCK_ID for $STACK_NAME / $ENV"
        if [ -n "$LOCK_CREATED" ]; then msg="$msg, created $LOCK_CREATED"; fi
        if [ -n "$LOCK_OPERATION" ]; then msg="$msg, operation $LOCK_OPERATION"; fi
        echo "::notice::$msg"
        {
          echo "## $STACK_NAME / $ENV — state lock released"
          echo ""
          echo "Released lock \`$LOCK_ID\`."
          echo ""
          echo "Releasing a lock is not recovery: the run that held it may have left"
          echo "the environment part-changed. Re-run the deploy for this cell, and"
          echo "re-plan first if its plan is now stale."
        } >> "$GITHUB_STEP_SUMMARY"
