name: shipmate verify-environments
description: Refuse an apply run before its first wave when a cell would bind a GitHub Environment that does not exist. Holds no App key — GITHUB_TOKEN can list environments under the snapshot job's checks:read floor.
inputs:
  waves-json:
    description: This run's wave matrices (the apply-env-level.yml waves_json shape).
    required: true
  shared-envs:
    description: The SHIPMATE_SHARED_ENVS repository variable, verbatim. Passed in because a script cannot read `vars` itself; it decides which envs bind the bare environment instead of <env>-apply.
    required: true
  github-token:
    description: GITHUB_TOKEN. Listing environments needs no App key and no added permission.
    required: true
runs:
  using: composite
  steps:
    - name: Verify the apply-path environments exist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SHIPMATE_WAVES_JSON: ${{ inputs.waves-json }}
        SHIPMATE_SHARED_ENVS: ${{ inputs.shared-envs }}
      # Unpaginated on purpose: the script refuses a listing whose total_count exceeds what it
      # read, because a missing page is indistinguishable from a missing environment.
      run: |
        set -euo pipefail
        # A failed listing exits non-zero rather than warning: a check that did not happen must
        # not let the applies through.
        gh api "repos/$GITHUB_REPOSITORY/environments?per_page=100" \
          > "$RUNNER_TEMP/environments.json" || {
          echo "::error::could not list this repository's GitHub Environments, so the apply-path environment pre-flight did not run; refusing to apply. A transient failure (a 5xx, a rate limit) clears on a re-run of this workflow; a persistent 403 means the token cannot read environments."
          exit 1
        }
        python3 "$GITHUB_ACTION_PATH/../../scripts/verify-environments" < "$RUNNER_TEMP/environments.json"
