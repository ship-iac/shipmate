name: shipmate apply-summary
description: Render the apply result comment and post it to the pull request. Downloads the per-cell apply-summary.* artifacts, mints a shipmate App installation token, scans the head SHA's apply checks, and lists the run's jobs for per-cell log links.
inputs:
  pr-number:
    description: Pull request number to comment on.
    required: true
  environment:
    description: Environment name for the targeted apply form. Empty = the all-environments form.
    required: false
    default: ""
  waves-json:
    description: Targeted form's waves JSON (one wave array). Empty when unused.
    required: false
    default: ""
  envlevel0-waves:
    description: All-environments form's env-level 0 waves JSON. Empty when unused.
    required: false
    default: ""
  envlevel1-waves:
    description: All-environments form's env-level 1 waves JSON. Empty when unused.
    required: false
    default: ""
  envlevel2-waves:
    description: All-environments form's env-level 2 waves JSON. Empty when unused.
    required: false
    default: ""
  envlevel3-waves:
    description: All-environments form's env-level 3 waves JSON. Empty when unused.
    required: false
    default: ""
  excluded-envs:
    description: JSON array of explicit environments left pending (all-environments form only). Empty = [].
    required: false
    default: ""
  skipped-envs:
    description: "JSON array of environments skipped because they are ordered after an environment not applying this run (held for review, or excluded as explicit); all-environments form only. Empty = []."
    required: false
    default: ""
  review-held-envs:
    description: JSON array of environments held until an approving review lands (all-environments form only). Empty = [].
    required: false
    default: ""
  applied-ungated-envs:
    description: "JSON array of environments applied without an approving review, per SHIPMATE_UNGATED_ENVS (all-environments form only). Empty = []."
    required: false
    default: ""
  results:
    description: "join(needs.*.result, ',') from the caller — feeds the short-form nothing-pending sentence."
    required: true
  gate-verdict:
    description: Gate verdict from gate-refresh — 'complete' or anything else. Empty until the gate has run.
    required: false
    default: ""
  head-sha:
    description: PR head SHA carrying the apply checks; their state tells an applied cell from a recorded one.
    required: true
  cells-dir:
    description: Directory to download apply-summary.*/cell.json trees into.
    required: false
    default: cells
  github-token:
    description: GITHUB_TOKEN with actions:read (artifact download + run jobs listing).
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail
        if [ -z "$PRIVATE_KEY" ]; then
          echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
          exit 1
        fi
        [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
    - name: Download apply cell summaries
      id: download
      # continue-on-error because for comment-ops the comment IS the feedback channel: a
      # transient artifact-API 5xx or a 403 must not skip `Mint App installation token` and
      # `Post apply result comment`, leaving a developer whose apply fully succeeded with no PR
      # comment at all. The renderer already handles an empty or partial cells directory --
      # missing cells render as not-attempted rows, or the whole run degrades to the short form.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: apply-summary.*
        path: ${{ inputs.cells-dir }}
        github-token: ${{ inputs.github-token }}
        merge-multiple: false

    - name: Warn on apply cell summaries download failure
      if: ${{ steps.download.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning::apply cell summaries download failed; the comment renders without per-cell detail"

    - name: Mint App installation token
      # Minted before `Render apply result comment`, not only before `Post apply result
      # comment`: `Scan apply checks (degrade to no data on failure)` needs it too, and one token
      # covers both uses -- the same shape actions/summary uses for its three writes.
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        # From the App installation, so no consumer's calling job has to grant it: a called
        # workflow's job permissions cannot exceed its caller's, so taking this off GITHUB_TOKEN
        # would break every consumer wrapper.
        permission-checks: read
        permission-pull-requests: write

    - name: Scan apply checks (degrade to no data on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      # The pending apply checks are the work queue, so the comment reads them rather than
      # trusting the per-cell artifact alone. apply-cell composes its verdict from the apply step
      # and uploads it; actions/apply-complete then completes the check from a later job, and only
      # for cells whose own job recorded success. A failed `Save state` in the cell, or a failed
      # completion, leaves an `applied` artifact against a still-pending check.
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # filter=all for the same reason gate-refresh uses it: a re-created check name keeps its
        # historical runs and apply-gate judges the newest run per name. Degrade, never fail --
        # the renderer treats an absent name as unknown and falls back to artifact-only status.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, status, conclusion, id, app: {id: .app.id}}' > checks.jsonl; then
          echo "::warning::apply-check scan failed; the comment falls back to artifact-only status"
          : > checks.jsonl
        fi

    - name: List run jobs (log links; degrade to none on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Cosmetic: apply-comment falls back to the workflow-run URL per row. Mirror
        # actions/summary's treatment of a cosmetic API listing -- warn and degrade to an empty
        # file, never fail the step.
        if ! gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | {name, html_url}' > jobs.jsonl; then
          echo "::warning::run jobs listing failed; per-cell log links degrade to the workflow-run URL"
          : > jobs.jsonl
        fi

    - name: Render apply result comment
      shell: bash
      env:
        CELLS: ${{ inputs.cells-dir }}
        SHIPMATE_ENVIRONMENT: ${{ inputs.environment }}
        SHIPMATE_WAVES_JSON: ${{ inputs.waves-json }}
        SHIPMATE_ENVLEVEL0_WAVES: ${{ inputs.envlevel0-waves }}
        SHIPMATE_ENVLEVEL1_WAVES: ${{ inputs.envlevel1-waves }}
        SHIPMATE_ENVLEVEL2_WAVES: ${{ inputs.envlevel2-waves }}
        SHIPMATE_ENVLEVEL3_WAVES: ${{ inputs.envlevel3-waves }}
        SHIPMATE_RESULTS: ${{ inputs.results }}
        SHIPMATE_GATE: ${{ inputs.gate-verdict }}
        SHIPMATE_EXCLUDED_ENVS: ${{ inputs.excluded-envs }}
        SHIPMATE_SKIPPED_ENVS: ${{ inputs.skipped-envs }}
        SHIPMATE_REVIEW_HELD_ENVS: ${{ inputs.review-held-envs }}
        SHIPMATE_APPLIED_UNGATED_ENVS: ${{ inputs.applied-ungated-envs }}
        SHIPMATE_CHECKS: checks.jsonl
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-comment" < jobs.jsonl

    - name: Post apply result comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Fresh comment every run (audit trail, not a sticky comment) -- never
        # search for or PATCH an existing one.
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be numeric (got: $PR_NUMBER)"; exit 1; }
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md >/dev/null
