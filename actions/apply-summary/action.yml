name: shipmate apply-summary
description: Render the apply result comment and post it to the pull request. Reads the per-cell apply-summary.* artifacts the calling job downloads into cells/ and apply-detect's report it downloads into apply-report/ (none when detect never ran), the comment's dispositions, waiting and held cells, environment order and autoplan actor (a missing or unreadable one renders a red line and never a green verdict), mints a shipmate App installation token, scans the head SHA's apply checks, and lists the run's jobs for per-cell log links. Reads the job's GITHUB_TOKEN, which needs actions:read for the jobs listing.
inputs:
  pr-number:
    description: Pull request number to comment on.
    required: true
  environment:
    description: Environment name for the targeted apply form. Empty = the all-environments form.
    required: false
    default: ""
  cells:
    description: apply-detect's `cells` output, a JSON list of `{stack, environment}`. Empty when detect did not succeed, which reads as no expected cell.
    required: false
    default: ""
  detect-result:
    description: "`needs.detect.result`. Only `failure` with a non-empty `detect-refusal` lets the comment read an incomplete report: the empty one the detect job wrote before a step failed with an `::error::`."
    required: false
    default: ""
  detect-refusal:
    description: "detect's `refusal` output, apply-pr-read's, setup's or else apply-detect's: the first error of the `::error::` message that failed detect (whatever its cause, a failed tool or API call included) on one line, empty when detect raised none. Non-empty, the comment shows it in a code fence under the verdict line; empty leaves the comment unchanged."
    required: false
    default: ""
  lock-refusal:
    description: "The lock job's `refusal` output: the first error of the `::error::` message that failed the lock job (the review-decision match, lock-acquire, verify-environments or apply-snapshot, whatever its cause, a failed API call included) on one line, empty when it raised none. Non-empty, the comment shows it in a code fence under the verdict line, as it does detect-refusal; empty leaves the comment unchanged."
    required: false
    default: ""
  refused-by-rule:
    description: "detect's or else the lock job's `refused_by_rule` output: `true` when that job failed on a refusal by rule (a cell behind the base, a targeted apply without its review, another holder's cell lock), empty otherwise. With results that read failed, the verdict reads refused instead of failed; otherwise it is ignored."
    required: false
    default: ""
  auto:
    description: "'true' for an `apply_mode: auto` run: the comment says so under the verdict line, refused or not."
    required: false
    default: "false"
  results:
    description: "join(needs.*.result, ',') from the caller; a result other than success, skipped or cancelled renders the verdict failed (refused with refused-by-rule `true`), a blank one included; otherwise a cancelled result renders it cancelled."
    required: true
  head-sha:
    description: PR head SHA carrying the apply checks; their state tells an applied cell from a recorded one, and the verdict line names it.
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
outputs:
  posted:
    description: "`true` once the result comment is posted. Empty when the POST failed or never ran."
    value: ${{ steps.post.outputs.posted }}
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Mint App installation token
      # Minted before `Render apply result comment`, not only before `Post apply result
      # comment`: `Scan apply checks (degrade to no data on failure)` needs it too, and one token
      # covers both uses -- the same shape actions/summary uses for its three writes.
      id: token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # From the App installation, so no consumer's calling job has to grant it: a called
        # workflow's job permissions cannot exceed its caller's, so taking this off GITHUB_TOKEN
        # would break every consumer wrapper.
        permission-checks: read
        permission-pull-requests: write

    - name: Scan apply checks (degrade to no data on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      # The pending apply checks are the work queue, so the comment reads them rather than trusting
      # the artifact alone: an unsaved state or a failed completion leaves an `applied`
      # artifact against a still-pending check (CONTRACT.md, the apply result comment).
      run: |
        set -euo pipefail
        # Degrade, never fail -- the renderer treats an absent name as unknown and falls back to
        # artifact-only status.
        if ! python3 "$GITHUB_ACTION_PATH/../../scripts/gate-status" checks "$HEAD_SHA" \
          '.check_runs[] | {name, status, conclusion, id, app: {id: .app.id}, output: {title: .output.title}}' > checks.jsonl; then
          echo "::warning::apply-check scan failed; the comment falls back to artifact-only status"
        fi

    - name: List run jobs (log links; degrade to none on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Cosmetic: apply-comment falls back to the workflow-run URL per row. Mirror
        # actions/summary's treatment of a cosmetic API listing -- warn and degrade to an empty
        # file, never fail the step.
        if ! gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, html_url}' > jobs.jsonl; then
          echo "::warning::run jobs listing failed; per-cell log links degrade to the workflow-run URL"
          : > jobs.jsonl
        fi

    - name: Render apply result comment
      shell: bash
      env:
        SHIPMATE_ENVIRONMENT: ${{ inputs.environment }}
        SHIPMATE_CELLS: ${{ inputs.cells }}
        SHIPMATE_RESULTS: ${{ inputs.results }}
        SHIPMATE_REPORT_PATH: apply-report/report.json
        SHIPMATE_DETECT_RESULT: ${{ inputs.detect-result }}
        SHIPMATE_DETECT_REFUSAL: ${{ inputs.detect-refusal }}
        SHIPMATE_LOCK_REFUSAL: ${{ inputs.lock-refusal }}
        SHIPMATE_REFUSED_BY_RULE: ${{ inputs.refused-by-rule }}
        SHIPMATE_AUTO: ${{ inputs.auto }}
        SHIPMATE_CHECKS: checks.jsonl
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-comment" < jobs.jsonl

    - name: Post apply result comment
      id: post
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Fresh comment every run (audit trail) -- never search for, PATCH or minimize
        # an existing one.
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be numeric (got: $PR_NUMBER)"; exit 1; }
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md >/dev/null
        # Written only after the POST: an unset `posted`, read through apply-run.yml's outputs,
        # makes apply.yml's outcome job reply.
        echo "posted=true" >> "$GITHUB_OUTPUT"
