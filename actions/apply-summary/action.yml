name: shipmate apply-summary
description: Render the apply result comment and post it to the pull request. Downloads the per-cell apply-summary.* artifacts, mints a shipmate App installation token, scans the head SHA's apply checks, and lists the run's jobs for per-cell log links. Reads the job's GITHUB_TOKEN, which needs actions:read for the artifact download and the jobs listing.
inputs:
  pr-number:
    description: Pull request number to comment on.
    required: true
  environment:
    description: Environment name for the targeted apply form. Empty = the all-environments form.
    required: false
    default: ""
  envlevel0-waves:
    description: Env-level 0 waves JSON; a targeted apply puts every cell here. A padded empty map when level 0 has no cell. Empty when detect did not succeed.
    required: false
    default: ""
  envlevel1-waves:
    description: Env-level 1 waves JSON; a padded empty map when level 1 has no cell, as in every targeted apply. Empty when detect did not succeed.
    required: false
    default: ""
  envlevel2-waves:
    description: Env-level 2 waves JSON; a padded empty map when level 2 has no cell, as in every targeted apply. Empty when detect did not succeed.
    required: false
    default: ""
  envlevel3-waves:
    description: Env-level 3 waves JSON; a padded empty map when level 3 has no cell, as in every targeted apply. Empty when detect did not succeed.
    required: false
    default: ""
  excluded-envs:
    description: "JSON array of explicit environments left pending, including held ones; the comment lists a held one under the hold (all-environments form only). Empty = []."
    required: false
    default: ""
  skipped-envs:
    description: "JSON array of environments skipped because they are ordered after an environment not applying this run (held for review, or excluded as explicit); all-environments form only. Empty = []."
    required: false
    default: ""
  review-held-envs:
    description: JSON array of environments held until an approving review lands (all-environments form only). Empty = [].
    required: false
    default: ""
  applied-ungated-envs:
    description: "JSON array of environments applied without an approving review, per `gated: false` on their entries (all-environments form only); the render step annotates each with a notice, not a comment line. Empty = []."
    required: false
    default: ""
  review-not-required-envs:
    description: "JSON array of gated environments authorized under a null review decision, because the pull request's review state required none (both forms). The render step annotates each with an applied, failed or unrecorded row with a notice, not a comment line. Empty = []."
    required: false
    default: ""
  results:
    description: "join(needs.*.result, ',') from the caller; any result other than success or skipped renders the verdict failed."
    required: true
  head-sha:
    description: PR head SHA carrying the apply checks; their state tells an applied cell from a recorded one, and the verdict line names it.
    required: true
  app-id:
    description: shipmate App id (a repo/org variable, not a secret).
    required: true
  private-key:
    description: shipmate App private key (from the shipmate-engine environment secret).
    required: true
runs:
  using: composite
  steps:
    - name: Verify the App key arrived
      uses: $/actions/verify-app-key
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Download apply cell summaries
      id: download
      # Reviewer-facing only (continue-on-error): for comment-ops the comment IS the feedback
      # channel, so an artifact-API error must not skip the token and the post. The renderer
      # handles an empty or partial cells directory.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: apply-summary.*
        path: cells
        github-token: ${{ github.token }}
        merge-multiple: false

    - name: Warn on apply cell summaries download failure
      if: ${{ steps.download.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::warning::apply cell summaries download failed; the comment renders without per-cell detail"

    - name: Mint App installation token
      # Minted before `Render apply result comment`, not only before `Post apply result
      # comment`: `Scan apply checks (degrade to no data on failure)` needs it too, and one token
      # covers both uses -- the same shape actions/summary uses for its three writes.
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        # From the App installation, so no consumer's calling job has to grant it: a called
        # workflow's job permissions cannot exceed its caller's, so taking this off GITHUB_TOKEN
        # would break every consumer wrapper.
        permission-checks: read
        permission-pull-requests: write

    - name: Scan apply checks (degrade to no data on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
      # The pending apply checks are the work queue, so the comment reads them rather than trusting
      # the artifact alone: a failed `Save state` or a failed completion leaves an `applied`
      # artifact against a still-pending check (CONTRACT.md, the apply result comment).
      run: |
        set -euo pipefail
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head-sha must be a 40-char lowercase hex SHA (got: $HEAD_SHA)"; exit 1; }
        # filter=all for the same reason gate-refresh uses it: a re-created check name keeps its
        # historical runs and apply-gate judges the newest run per name. Degrade, never fail --
        # the renderer treats an absent name as unknown and falls back to artifact-only status.
        if ! gh api --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
          --jq '.check_runs[] | {name, status, conclusion, id, app: {id: .app.id}}' > checks.jsonl; then
          echo "::warning::apply-check scan failed; the comment falls back to artifact-only status"
          : > checks.jsonl
        fi

    - name: List run jobs (log links; degrade to none on failure)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Cosmetic: apply-comment falls back to the workflow-run URL per row. Mirror
        # actions/summary's treatment of a cosmetic API listing -- warn and degrade to an empty
        # file, never fail the step.
        if ! gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, html_url}' > jobs.jsonl; then
          echo "::warning::run jobs listing failed; per-cell log links degrade to the workflow-run URL"
          : > jobs.jsonl
        fi

    - name: Render apply result comment
      shell: bash
      env:
        SHIPMATE_ENVIRONMENT: ${{ inputs.environment }}
        SHIPMATE_ENVLEVEL0_WAVES: ${{ inputs.envlevel0-waves }}
        SHIPMATE_ENVLEVEL1_WAVES: ${{ inputs.envlevel1-waves }}
        SHIPMATE_ENVLEVEL2_WAVES: ${{ inputs.envlevel2-waves }}
        SHIPMATE_ENVLEVEL3_WAVES: ${{ inputs.envlevel3-waves }}
        SHIPMATE_RESULTS: ${{ inputs.results }}
        SHIPMATE_EXCLUDED_ENVS: ${{ inputs.excluded-envs }}
        SHIPMATE_SKIPPED_ENVS: ${{ inputs.skipped-envs }}
        SHIPMATE_REVIEW_HELD_ENVS: ${{ inputs.review-held-envs }}
        SHIPMATE_APPLIED_UNGATED_ENVS: ${{ inputs.applied-ungated-envs }}
        SHIPMATE_REVIEW_NOT_REQUIRED_ENVS: ${{ inputs.review-not-required-envs }}
        SHIPMATE_CHECKS: checks.jsonl
        SHIPMATE_APP_ID: ${{ inputs.app-id }}
        SHIPMATE_HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../../scripts/apply-comment" < jobs.jsonl

    - name: Post apply result comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Fresh comment every run (audit trail, not a sticky comment) -- never
        # search for or PATCH an existing one.
        [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be numeric (got: $PR_NUMBER)"; exit 1; }
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md >/dev/null
