name: manifest-load

# GitHub parses these manifests here because it parses them in production. `yaml.safe_load` is
# more permissive: it accepts an unquoted description whose comma splits a `{ }` flow mapping, and
# GitHub refuses that whole file, failing every job that uses it in "Set up job".

# @main makes this merge-time coverage: `uses:` takes no expressions, so the ref cannot follow a
# PR head, but it runs before any release tag. workflow_dispatch serves the pre-tag check in
# docs/releasing.md § Manifest load, for when the push run predates the tip.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    # Remote refs, not ./actions: the runner parses a remote manifest during "Set up job" and a
    # local one only when the step runs, so `if: false` parses every manifest and runs no action,
    # needing no inputs, credentials or live pull request.
    steps:
      # Measured 2026-08-22: a comma-split manifest under `if: false` fails Set up job with the
      # production error, so the pair discriminates.
      - if: false
        uses: ship-iac/shipmate/actions/apply-cell@main
      - if: false
        uses: ship-iac/shipmate/actions/apply-complete@main
      - if: false
        uses: ship-iac/shipmate/actions/apply-detect@main
      - if: false
        uses: ship-iac/shipmate/actions/apply-snapshot@main
      - if: false
        uses: ship-iac/shipmate/actions/apply-summary@main
      - if: false
        uses: ship-iac/shipmate/actions/build-matrix@main
      - if: false
        uses: ship-iac/shipmate/actions/comment-ops@main
      - if: false
        uses: ship-iac/shipmate/actions/deploy-detect@main
      - if: false
        uses: ship-iac/shipmate/actions/dispatch@main
      - if: false
        uses: ship-iac/shipmate/actions/drift-cell@main
      - if: false
        uses: ship-iac/shipmate/actions/drift-issues@main
      - if: false
        uses: ship-iac/shipmate/actions/gate-refresh@main
      - if: false
        uses: ship-iac/shipmate/actions/plan-cell@main
      - if: false
        uses: ship-iac/shipmate/actions/pr-facts@main
      - if: false
        uses: ship-iac/shipmate/actions/setup@main
      - if: false
        uses: ship-iac/shipmate/actions/state@main
      - if: false
        uses: ship-iac/shipmate/actions/summary@main
      - if: false
        uses: ship-iac/shipmate/actions/unlock-cell@main
      - if: false
        uses: ship-iac/shipmate/actions/verify-app-key@main
      - if: false
        uses: ship-iac/shipmate/actions/verify-environments@main
