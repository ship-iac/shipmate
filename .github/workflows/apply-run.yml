name: apply-run
on:
  workflow_call:
    inputs:
      # Empty runs a bare apply: every pending environment the review decision and `apply_mode`
      # allow, in `needs` order. A name applies that one alone.
      environment: { required: false, type: string, default: "" }
      ref: { required: true, type: string }
      pr_number: { required: true, type: string }
      runs_on: { required: false, default: ubuntu-26.04-arm, type: string }
      # The consumer's `auto` job passes a literal `true`: the auto form of apply-detect.
      auto: { required: false, type: boolean, default: false }
    # A callee's `environment:` resolves in the CALLER's repository, and the environment's value
    # wins over whatever the caller passed, empty included -- `summary` binds `shipmate-engine`.
    secrets:
      # `required: false` is load-bearing: the key lives on the `shipmate-engine` environment
      # (docs/github-app.md §5), so a caller binding none has nothing to pass, and a required
      # declaration rejects the call: "Secret ... is required, but not provided while calling".
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_SECRETS: { required: false }
      SHIPMATE_ENCRYPTION_KEY: { required: false }
    # `apply.yml`'s `outcome` reads these. Every one reads empty when the call was cancelled while
    # it waited in the queue, so `outcome` stays silent then; a job's values read empty when that
    # job never ran.
    outputs:
      # `true`: this run owns the command, `review` claimed its comment or it carries none.
      admitted: { value: "${{ jobs.review.outputs.admitted }}" }
      # Empty: `review` never ran.
      review_result: { value: "${{ jobs.review.result }}" }
      # `true`: no open pull request matched. Empty: `review` did not reach that refusal.
      unbound: { value: "${{ jobs.review.outputs.unbound }}" }
      # `true`: the result comment posted. Empty: it did not, or `summary` never ran.
      posted: { value: "${{ jobs.summary.outputs.posted }}" }
      # Empty: `summary` never ran.
      summary_result: { value: "${{ jobs.summary.result }}" }
      # `summary` is left out: it can end `cancelled` with no run cancel, for example at a full
      # gate-writer queue. Empty: the call ended before any job ran.
      run_cancelled:
        value: ${{ jobs.review.result == 'cancelled' || jobs.detect.result == 'cancelled' || jobs.lock.result == 'cancelled' || jobs.envlevel0.result == 'cancelled' || jobs.envlevel1.result == 'cancelled' || jobs.envlevel2.result == 'cancelled' || jobs.envlevel3.result == 'cancelled' }}
# One apply run per pull request at a time; a later one waits rather than cancels. `apply.yml`'s
# `run` refuses a `pr_number` that is not canonical before it keys this group.
concurrency:
  group: shipmate-apply-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max
jobs:
  review:
    # Deliberately unconditional -- no `if:`: reads the decision server-side for every form; for
    # the comment forms it closes the comment-to-dispatch TOCTOU (CONTRACT.md §Comment-ops). A
    # hand-made dispatch never reaches decide(), so this job and `detect` bind `ref` to the open
    # PR's head.
    runs-on: ubuntu-slim
    # Reaches the App key the same way `summary` does.
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    outputs:
      decision: ${{ steps.rd.outputs.decision }}
      unbound: ${{ steps.rd.outputs.unbound }}
      admitted: ${{ steps.admit.outputs.admitted }}
    steps:
      # `apply.yml`'s `guard` check steps, copied: anchors do not cross files.
      # test_apply_dispatch_actor_guard.py keeps the copies equal.
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::apply refused: the dispatching actor is not a [bot]; comment 'shipmate apply' on the pull request instead of running a direct workflow_dispatch"
          exit 1
      - name: Reject an auto dispatch that does not run the auto form
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'auto' && !inputs.auto }}
        run: |
          echo "::error::apply refused: this run was dispatched with verb 'auto', but the calling job does not pass 'auto: true'; give the shipmate.yml 'auto' job the published 'with:' block (shipmate doctor names the difference)"
          exit 1
      - name: Reject the auto form outside an auto dispatch
        if: ${{ inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'auto') }}
        run: |
          echo "::error::apply refused: the calling job passes 'auto: true', but this run is not a dispatch with verb 'auto'; only the shipmate.yml 'auto' job passes it"
          exit 1
      - name: Reject a bare or targeted apply outside an apply dispatch
        if: ${{ !inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'apply') }}
        run: |
          echo "::error::apply refused: this run is not a dispatch with verb 'apply' and the calling job does not pass 'auto: true'; comment 'shipmate apply' on the pull request, and give the shipmate.yml 'apply' job the published 'if:' (shipmate doctor names the difference)"
          exit 1
      - name: Reject an apply dispatch without a comment id
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'apply' && github.event.inputs.comment_id == '' }}
        run: |
          echo "::error::apply refused: this apply dispatch carries no comment_id, so no comment can be claimed for it; comment 'shipmate apply' on the pull request instead"
          exit 1
      - name: Reject a pull request number that is not canonical
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::apply refused: pr_number is not a pull request number (1 to 10 digits, no leading zero); a workflow or App other than shipmate's comment-ops and autoplan sent this dispatch; comment 'shipmate apply' on the pull request instead"
            exit 1
          fi
      # A second run of the same comment reads `taken` and writes no `admitted`; an `auto` dispatch
      # carries no `comment_id`, skips the claim and is admitted by that empty input.
      - id: claim
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.comment_id != '' }}
        uses: $/actions/claim
        with:
          verb: apply
          environment: ${{ inputs.environment }}
          pr-number: ${{ inputs.pr_number }}
          comment-id: ${{ github.event.inputs.comment_id }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - id: admit
        if: ${{ steps.claim.outputs.state == 'owned' || github.event.inputs.comment_id == '' }}
        run: echo "admitted=true" >> "$GITHUB_OUTPUT"
      - name: Verify the App key arrived
        if: ${{ steps.admit.outputs.admitted == 'true' }}
        uses: $/actions/verify-app-key
        with:
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - id: token
        if: ${{ steps.admit.outputs.admitted == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          permission-pull-requests: read
      - id: rd
        if: ${{ steps.admit.outputs.admitted == 'true' }}
        uses: $/actions/apply-pr-read
        with:
          token: ${{ steps.token.outputs.token }}
          pr-number: ${{ inputs.pr_number }}
          ref: ${{ inputs.ref }}
      # Display only: nothing reads the check, so a failure here must not fail review.
      - name: Show the running apply on the pull request
        if: ${{ steps.admit.outputs.admitted == 'true' }}
        uses: $/actions/apply-run-check
        continue-on-error: true
        timeout-minutes: 1
        with:
          mode: start
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # Display only: no job needs it, and neither `summary`'s `results` nor `run_cancelled` reads
  # it. A refused review tells no one.
  waiters:
    needs: [review]
    if: ${{ needs.review.result == 'success' && needs.review.outputs.admitted == 'true' }}
    runs-on: ubuntu-slim
    # Bounds a hung setup; it does not bound runner pickup or a lost runner.
    timeout-minutes: 3
    # A lost runner or a setup error fails this job, not the run.
    continue-on-error: true
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    steps:
      # The action verifies the App key itself. A failure or a hung API call here must not fail
      # the job.
      - name: Tell the apply runs waiting behind this one
        uses: $/actions/apply-waiters
        continue-on-error: true
        timeout-minutes: 1
        with:
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  detect:
    # No `needs`: it reads the pull request itself, beside `review`, and `lock` refuses unless
    # both read the same decision. A failed `review` stops `lock` and the levels, not this job.
    runs-on: ${{ inputs.runs_on }}
    # It checks out the pull request's tree, so it restores and never saves.
    cache-mode: read
    permissions: { contents: read, checks: read, actions: read, pull-requests: read }
    # An unwritten `_empty` reads '', runs its level and dies at fromJSON.
    outputs:
      envlevel0_waves: ${{ steps.d.outputs.envlevel0_waves }}
      envlevel1_waves: ${{ steps.d.outputs.envlevel1_waves }}
      envlevel2_waves: ${{ steps.d.outputs.envlevel2_waves }}
      envlevel3_waves: ${{ steps.d.outputs.envlevel3_waves }}
      envlevel0_empty: ${{ steps.d.outputs.envlevel0_empty }}
      envlevel1_empty: ${{ steps.d.outputs.envlevel1_empty }}
      envlevel2_empty: ${{ steps.d.outputs.envlevel2_empty }}
      envlevel3_empty: ${{ steps.d.outputs.envlevel3_empty }}
      first_level: ${{ steps.d.outputs.first_level }}
      head_sha: ${{ steps.d.outputs.head_sha }}
      provenance_run: ${{ steps.d.outputs.provenance_run }}
      base_sha: ${{ steps.d.outputs.base_sha }}
      refusal: ${{ steps.pr.outputs.refusal || steps.setup.outputs.refusal || steps.d.outputs.refusal }}
      refused_by_rule: ${{ steps.d.outputs.refused_by_rule }}
      tools: ${{ steps.setup.outputs.tools }}
      report_artifact: ${{ steps.report.outputs.name }}
      decision: ${{ steps.pr.outputs.decision }}
    steps:
      # Before any step that can refuse, so every refusal leaves a report for the result comment;
      # apply-detect overwrites it with the complete one. One artifact name per call and attempt,
      # so a re-run or a second call in the run never reads another's report.
      - id: report
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/apply-report/report.json"
          mkdir -p "${path%/*}"
          echo '{}' > "$path"
          token=$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=apply-report-$GITHUB_RUN_ATTEMPT-$token" >> "$GITHUB_OUTPUT"
      # Before the checkout: a fork, a draft or a moved head refuses before `ref` is checked out.
      - id: pr
        uses: $/actions/apply-pr-read
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr_number }}
          ref: ${{ inputs.ref }}
      # Every form merges the base tip into the head to find the cells behind it, so it needs
      # both histories; blob:none fetches file contents on demand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
      - id: setup
        uses: $/actions/setup
        with: { tofu: "false", resolve: "true" }
      - id: d
        uses: $/actions/apply-detect
        with:
          environment: ${{ inputs.environment }}
          auto: ${{ inputs.auto }}
          head-sha: ${{ inputs.ref }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          review-decision: ${{ steps.pr.outputs.decision }}
          github-vars: ${{ toJSON(vars) }}
          report-path: ${{ steps.report.outputs.path }}
      - name: Upload the apply report
        # Reviewer-facing only (continue-on-error): the apply result comment is its one reader,
        # and it renders a missing report as a red line, never a green verdict. Runs after a
        # failed checkout, setup or detect too.
        if: ${{ !cancelled() && steps.report.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.report.outputs.name }}
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: ignore
          retention-days: 7

  # Locks every cell the waves apply, then runs the first populated level's pre-flight, snapshot
  # and wave0 release. A cell another pull request took after `detect` read the locks refuses the
  # run; a new `shipmate apply` or "Re-run all jobs" recomputes, "Re-run failed jobs" does not.
  lock:
    needs: [review, detect]
    if: ${{ !failure() && !cancelled() && needs.review.outputs.admitted == 'true' }}
    # Its API calls, the locks, the check listing and the flips, grow with the cell count; an
    # `ubuntu-slim` job stops at 15 minutes.
    runs-on: ${{ inputs.runs_on }}
    environment: { name: shipmate-engine, deployment: false }
    # checks:read lists the apply checks; on a private repository, listing environments 403s
    # without actions:read.
    permissions: { actions: read, checks: read }
    # A refusal recorded before the release keeps `unflip` off a run that flipped nothing.
    outputs:
      refusal: ${{ steps.match.outputs.refusal || steps.l.outputs.refusal || steps.verify.outputs.refusal || steps.snap.outputs.refusal }}
      refused_by_rule: ${{ steps.l.outputs.refused_by_rule }}
      by_wave: ${{ steps.snap.outputs.by_wave }}
    steps:
      # Before `lock-acquire`, so a decision that changed between the two reads locks nothing. The
      # right side is quoted: a literal, case-sensitive compare.
      - id: match
        shell: bash
        env:
          REVIEW: ${{ needs.review.outputs.decision }}
          DETECT: ${{ needs.detect.outputs.decision }}
        run: |
          set -euo pipefail
          if [[ -z "$REVIEW" || -z "$DETECT" || "$REVIEW" != "$DETECT" ]]; then
            msg="the review decision changed while this run started (review read '$REVIEW', detect read '$DETECT'); comment \`shipmate apply\` on the pull request again"
            echo "refusal=$msg" >> "$GITHUB_OUTPUT"
            echo "::error::$msg"
            exit 1
          fi
      - id: l
        uses: $/actions/lock-acquire
        with:
          envlevel0-waves: ${{ needs.detect.outputs.envlevel0_waves }}
          envlevel1-waves: ${{ needs.detect.outputs.envlevel1_waves }}
          envlevel2-waves: ${{ needs.detect.outputs.envlevel2_waves }}
          envlevel3-waves: ${{ needs.detect.outputs.envlevel3_waves }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      # Before the release, while a missing or unprotected environment can still refuse the run.
      - id: verify
        if: ${{ needs.detect.outputs.first_level != '' }}
        uses: $/actions/verify-environments
        with:
          waves-json: ${{ needs.detect.outputs.first_level == '0' && needs.detect.outputs.envlevel0_waves || needs.detect.outputs.first_level == '1' && needs.detect.outputs.envlevel1_waves || needs.detect.outputs.first_level == '2' && needs.detect.outputs.envlevel2_waves || needs.detect.outputs.first_level == '3' && needs.detect.outputs.envlevel3_waves || '' }}
      - id: snap
        if: ${{ needs.detect.outputs.first_level != '' }}
        uses: $/actions/apply-snapshot
        with:
          head-sha: ${{ needs.detect.outputs.head_sha }}
          waves-json: ${{ needs.detect.outputs.first_level == '0' && needs.detect.outputs.envlevel0_waves || needs.detect.outputs.first_level == '1' && needs.detect.outputs.envlevel1_waves || needs.detect.outputs.first_level == '2' && needs.detect.outputs.envlevel2_waves || needs.detect.outputs.first_level == '3' && needs.detect.outputs.envlevel3_waves || '' }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - if: ${{ needs.detect.outputs.first_level != '' }}
        uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(steps.snap.outputs.by_wave).wave0) }}
          deploy: false
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  envlevel0:
    # `apply-gate.cell_part` matches a cell job as `L<n> / <env> / <stack> / apply` or `/ save`, so
    # this `L<n>` name is load-bearing: renaming it strands apply checks pending. deploy.yml
    # repeats it.
    name: L0
    # `review` is listed so its failure reaches `!failure()`: `detect` runs beside it and can
    # succeed after `review` failed.
    needs: [review, detect, lock]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel0_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') && needs.lock.result == 'success' }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: &envlevel-permissions { contents: read, checks: read, actions: read, pull-requests: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel0_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
      tools: ${{ needs.detect.outputs.tools }}
      pr_number: ${{ inputs.pr_number }}
      auto: ${{ inputs.auto }}
      provenance_run: ${{ needs.detect.outputs.provenance_run }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      by_wave: ${{ needs.detect.outputs.first_level == '0' && needs.lock.outputs.by_wave || '' }}
    # Named, never `inherit`: `inherit` is evaluated against the consumer's run, so a cross-org
    # consumer's `complete` job would hold no key, its applies would execute, and their apply
    # checks would strand pending forever.
    secrets: &envlevel-secrets
      # Declare a new secret in apply-env-level.yml in the same change that maps it here: the
      # `./` callee is read at this commit, and mapping a secret it does not declare is a hard
      # load-time error, unlike an undeclared action input, which is silently ignored.
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}

  envlevel1:
    name: L1
    needs: [review, detect, lock, envlevel0]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel1_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') && needs.lock.result == 'success' }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel1_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
      tools: ${{ needs.detect.outputs.tools }}
      pr_number: ${{ inputs.pr_number }}
      auto: ${{ inputs.auto }}
      provenance_run: ${{ needs.detect.outputs.provenance_run }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      by_wave: ${{ needs.detect.outputs.first_level == '1' && needs.lock.outputs.by_wave || '' }}
    secrets: *envlevel-secrets

  envlevel2:
    name: L2
    needs: [review, detect, lock, envlevel0, envlevel1]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel2_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') && needs.lock.result == 'success' }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel2_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
      tools: ${{ needs.detect.outputs.tools }}
      pr_number: ${{ inputs.pr_number }}
      auto: ${{ inputs.auto }}
      provenance_run: ${{ needs.detect.outputs.provenance_run }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      by_wave: ${{ needs.detect.outputs.first_level == '2' && needs.lock.outputs.by_wave || '' }}
    secrets: *envlevel-secrets

  envlevel3:
    name: L3
    needs: [review, detect, lock, envlevel0, envlevel1, envlevel2]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel3_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') && needs.lock.result == 'success' }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel3_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
      tools: ${{ needs.detect.outputs.tools }}
      pr_number: ${{ inputs.pr_number }}
      auto: ${{ inputs.auto }}
      provenance_run: ${{ needs.detect.outputs.provenance_run }}
      base_sha: ${{ needs.detect.outputs.base_sha }}
      by_wave: ${{ needs.detect.outputs.first_level == '3' && needs.lock.outputs.by_wave || '' }}
    secrets: *envlevel-secrets

  # `lock` released the first level's wave0, or its runner was lost, and that level's call never
  # started, so no `complete` of it runs: this returns those checks to `queued`. Every refusal
  # `lock` records before the release keeps it off.
  unflip:
    needs: [review, detect, lock, envlevel0, envlevel1, envlevel2, envlevel3]
    if: ${{ always() && needs.detect.outputs.first_level != '' && (needs.detect.outputs.first_level == '0' && needs.envlevel0.result || needs.detect.outputs.first_level == '1' && needs.envlevel1.result || needs.detect.outputs.first_level == '2' && needs.envlevel2.result || needs.detect.outputs.first_level == '3' && needs.envlevel3.result || '') == 'skipped' && needs.lock.result != 'skipped' && needs.lock.outputs.refusal == '' }}
    runs-on: ubuntu-slim
    environment: { name: shipmate-engine, deployment: false }
    permissions: { actions: read, checks: read }
    steps:
      # A lost `lock` runner discards its outputs. The counted listing fails short rather than
      # leave an unlisted check `in_progress`.
      - id: resnap
        if: ${{ needs.lock.outputs.by_wave == '' }}
        uses: $/actions/apply-snapshot
        with:
          head-sha: ${{ needs.detect.outputs.head_sha }}
          waves-json: ${{ needs.detect.outputs.first_level == '0' && needs.detect.outputs.envlevel0_waves || needs.detect.outputs.first_level == '1' && needs.detect.outputs.envlevel1_waves || needs.detect.outputs.first_level == '2' && needs.detect.outputs.envlevel2_waves || needs.detect.outputs.first_level == '3' && needs.detect.outputs.envlevel3_waves || '' }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          counted: "true"
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.lock.outputs.by_wave || steps.resnap.outputs.by_wave }}
          wave-results: '{"wave0": "skipped"}'
          job-id: ${{ job.check_run_id }}
          deploy: false
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  summary:
    needs: [review, detect, lock, envlevel0, envlevel1, envlevel2, envlevel3, unflip]
    # A `pr_number` review reads as missing or not open, or an `auto` run refused at review,
    # gets a red run, no App comment and no gate write. Keyed on `review`:
    # a `detect` failure after a bound review still gets both, as a failed or cancelled apply does.
    if: ${{ always() && needs.review.result == 'success' && needs.review.outputs.admitted == 'true' }}
    runs-on: ubuntu-slim
    # One gate writer per head at a time, across the plan, apply and deploy runs.
    concurrency:
      group: shipmate-gate-${{ inputs.ref || github.run_id }}
      cancel-in-progress: false
      queue: max
    # Every step mints the App key from secrets.SHIPMATE_APP_PRIVATE_KEY, the same as
    # apply-env-level.yml's `complete` job. Deployment branch policy restricts this environment to
    # the default branch, so a branch-authored workflow naming it is denied and never sees the key.
    environment: { name: shipmate-engine, deployment: false }
    # gate-refresh and apply-summary mint their own App tokens for their scans and writes; the one
    # GITHUB_TOKEN scope needed is actions:read, for the cell-summary download and apply-summary's
    # run-jobs listing.
    permissions: { actions: read }
    outputs:
      posted: ${{ steps.result.outputs.posted }}
    steps:
      # Job steps, not composite ones, so `timeout-minutes` can end the run that
      # actions/toolkit#2575 holds open for 180 s after a retried blob download. `!cancelled()`: the
      # comment reads these files and posts even when the job is red.
      - name: Download apply cell summaries
        id: download
        if: ${{ !cancelled() }}
        # Reviewer-facing only: the comment is the feedback channel, so an artifact-API error must
        # not skip it. The renderer handles an empty or partial cells directory.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apply-summary.*
          path: cells
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: Download the apply report
        # Reviewer-facing only: the render reads a missing report as unread, renders a red line and
        # never a green verdict. An empty name would download every artifact of the run.
        if: ${{ !cancelled() && needs.detect.outputs.report_artifact != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.detect.outputs.report_artifact }}
          path: apply-report
      - name: Warn on apply cell summaries download failure
        if: ${{ !cancelled() && steps.download.outcome == 'failure' }}
        run: echo "::warning::apply cell summaries download did not complete; the comment may render without per-cell detail"
      # The gate refresh follows, so a hung comment must end as a failed step, not a cancelled job;
      # 5 minutes leaves the untimed refresh the rest of the job's 15-minute `ubuntu-slim` cap.
      - name: Post apply result comment
        id: result
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: $/actions/apply-summary
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.ref }}
          environment: ${{ inputs.environment }}
          envlevel0-waves: ${{ needs.detect.outputs.envlevel0_waves }}
          envlevel1-waves: ${{ needs.detect.outputs.envlevel1_waves }}
          envlevel2-waves: ${{ needs.detect.outputs.envlevel2_waves }}
          envlevel3-waves: ${{ needs.detect.outputs.envlevel3_waves }}
          detect-result: ${{ needs.detect.result }}
          detect-refusal: ${{ needs.detect.outputs.refusal }}
          lock-refusal: ${{ needs.lock.outputs.refusal }}
          refused-by-rule: ${{ needs.detect.outputs.refused_by_rule || needs.lock.outputs.refused_by_rule }}
          auto: ${{ inputs.auto }}
          results: ${{ join(needs.*.result, ',') }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      # After the comment, so the developer reads the results first. `!cancelled()`: a failed
      # comment step still refreshes the gate.
      - name: Complete gate if every apply check is done
        if: ${{ !cancelled() }}
        uses: $/actions/gate-refresh
        with:
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      # Display only: nothing reads the check, so a failure here must not fail summary.
      - name: End the running apply check
        if: ${{ always() && steps.result.outputs.posted == 'true' }}
        uses: $/actions/apply-run-check
        continue-on-error: true
        timeout-minutes: 1
        with:
          mode: finish
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
