name: apply
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      ref: { required: true, type: string }
      pr_number: { required: true, type: string }
      state_suffix: { required: true, type: string }
    # A callee's `environment:` resolves in the CALLER's repository, and the environment's value
    # wins over whatever the caller passed, empty included -- `summary` binds `shipmate-engine`.
    secrets:
      # `required: false` is load-bearing, not laxity: consumers hold this key on the
      # `shipmate-engine` environment (docs/github-app.md §5), so a caller that binds no
      # environment has no value to pass, and a required declaration would reject the call before
      # any step of `guard`, with "Secret ... is required, but not provided while calling".
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_PLAN_PASSPHRASE: { required: false }
jobs:
  # `gh workflow run apply.yml` by a human with write access would otherwise skip every requirement
  # in scripts/authorize. A human cannot make github.actor a bot login, so this rejects any human
  # dispatch -- though it admits any bot actor with actions:write, not only this App.
  #
  # Its own job, not a first step of `detect`: `summary` must refuse a rejected dispatch -- it mints
  # the App key and comments on the dispatcher-supplied PR number -- while still posting the failure
  # comment and refreshing the gate when `detect` genuinely fails. `needs.guard.result == 'success'`
  # is false only for an unauthorised dispatch. No secrets, no environment, no checkout.
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::apply must be dispatched by the shipmate App via comment-ops, not by a direct workflow_dispatch"
          exit 1

  # The review state this apply rests on, re-read here rather than trusted from comment-ops: `guard`
  # admits any bot actor holding actions:write, so a dispatch input would be a claim that surface
  # could forge. Its own job because `detect` checks out the PR head and runs Terramate over
  # branch-controlled HCL, where no token belongs.
  review:
    # Deliberately unconditional -- no `if:`. A gate on the repository variable is what let an
    # `ungated-envs` action input wider than the variable escape enforcement, and running always
    # closes the TOCTOU between the comment that authorized this apply and the dispatch: the
    # decision is re-read here, so an approval dismissed in between holds.
    needs: [guard]
    runs-on: ubuntu-latest
    # How a callee reaches the App key, the same mechanism the `summary` job uses.
    environment: shipmate-engine
    permissions: {}
    # `apply-detect` refuses the run on this decision; this job only fetches it. Byte-identical to
    # `apply-all.yml`'s `review` job -- one shape, one decision, on both apply paths.
    outputs:
      decision: ${{ steps.rd.outputs.decision }}
    steps:
      - name: Verify the App key arrived
        shell: bash
        env:
          APP_ID: ${{ vars.SHIPMATE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
            exit 1
          fi
          [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - id: rd
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # NONE is the sentinel for a PR that exists with a null decision: the ruleset requires
          # no review. Nothing here has proved the PR exists -- comment-ops reads it over REST
          # first, this does not -- and a pr_number matching no pull request returns a null
          # `pullRequest` with no errors and exit 0, so MISSING_PR is its own value, which
          # detect's catch-all holds every env on.
          # The $owner/$repo/$pr tokens are GraphQL query variables (bound via
          # -F), not shell variables -- single quotes are intentional.
          # shellcheck disable=SC2016
          rd=$(gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision}}}' \
            -F owner="$OWNER" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest | if type == "object" then (.reviewDecision // "NONE") else "MISSING_PR" end')
          echo "decision=$rd" >> "$GITHUB_OUTPUT"

  detect:
    needs: [guard, review]
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: read, actions: read }
    outputs:
      waves: ${{ steps.d.outputs.waves }}
      empty: ${{ steps.d.outputs.empty }}
      head_sha: ${{ steps.d.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - id: d
        uses: ship-iac/shipmate/actions/apply-detect@07bfc1c80279fdf3b53c792d41eeac0f2463b0f6
        with:
          environment: ${{ inputs.environment }}
          head-sha: ${{ inputs.ref }}
          github-token: ${{ github.token }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          # Passed through raw, never defaulted: an empty decision means the review signal never
          # arrived, and empty refuses the run.
          ungated-envs: ${{ vars.SHIPMATE_UNGATED_ENVS }}
          review-decision: ${{ needs.review.outputs.decision }}

  # A targeted apply is single-env by design, so its pending wave set is exactly one env-level's
  # wave matrix. It runs through the same engine the deploy and bare-apply paths use, rather than
  # duplicating wave0..wave7 here.
  apply:
    # Display name only (the job id stays `apply`): a called workflow's jobs display as
    # `<caller job> / <this name> / <wave job>`, and GHA cannot suppress a level -- so this level
    # is named for what it fans out instead of repeating the verb the wave job already carries.
    name: waves
    # `guard` and `review` join `detect` in `needs` so their failures reach `!failure()`: without
    # them a rejected dispatch, or a `review` that could not mint the App key, skips `detect`, and
    # a skipped `detect` reads its outputs as empty strings -- which `!= 'true'` fans out on.
    needs: [guard, review, detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.empty != 'true' }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@a8107dde2500a7f36839a65c1da74f5f11685eca # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      state_suffix: ${{ inputs.state_suffix }}
    # Named, never `inherit`: these two files sit in one organization but the RUN belongs to the
    # consumer, and `inherit` is evaluated against the run -- so a cross-organization consumer's
    # `complete` job would hold no key, its applies would execute, and their apply checks would
    # strand pending forever.
    secrets:
      # Adding a secret here is ordered: declare it in apply-env-level.yml, merge, bump this job's
      # `uses:` pin, and only then map it. Mapping a secret the pinned callee does not declare is a
      # hard load-time error, unlike an undeclared action input (docs/releasing.md).
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  summary:
    # `review` is in this list because `results:` is `join(needs.*.result, ',')`, which covers only
    # THIS job's needs. A failed `review` skips `detect` -- correctly: nothing applies and the gate
    # stays pending -- while `summary` still runs on `guard`'s success, so without the entry the
    # comment renders the non-failure form over a run that died.
    needs: [guard, review, detect, apply]
    # `always()` alone would still run this job, and mint the App key, when the bot-actor rejection
    # failed; `needs.guard.result == 'success'` closes that. Keyed on `guard`, not `detect`:
    # `always()` posts the comment and refreshes the gate when apply failed or was cancelled, and
    # must do the same for a genuine `detect` failure -- a cell recording no plan run.
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    # Both steps mint the App key from secrets.SHIPMATE_APP_PRIVATE_KEY, the same as
    # apply-env-level.yml's `complete` job. Deployment branch policy restricts this environment to
    # the default branch, so a branch-authored workflow naming it is denied and never sees the key.
    environment: shipmate-engine
    # gate-refresh and apply-summary each mint their own App token: a checks:read scan plus the
    # statuses:write gate write, and a checks:read scan of the head SHA's apply checks plus the
    # comment POST. actions:read is the one GITHUB_TOKEN scope needed here, for apply-summary's
    # artifact download and run-jobs listing.
    permissions: { actions: read }
    steps:
      - name: Complete gate if every apply check is done
        id: gate
        uses: ship-iac/shipmate/actions/gate-refresh@94d9d252bbc37a291b2077911ce0c2531c2c9c2f
        with:
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - name: Post apply result comment
        uses: ship-iac/shipmate/actions/apply-summary@94d9d252bbc37a291b2077911ce0c2531c2c9c2f
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.ref }}
          environment: ${{ inputs.environment }}
          waves-json: ${{ needs.detect.outputs.waves }}
          results: ${{ join(needs.*.result, ',') }}
          gate-verdict: ${{ steps.gate.outputs.verdict }}
          github-token: ${{ github.token }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
