name: apply
on:
  workflow_call:
    inputs:
      # Empty runs a bare apply: every pending environment the review decision and `explicit`
      # allow, in `needs` order. A name applies that one alone.
      environment: { required: false, type: string, default: "" }
      ref: { required: true, type: string }
      pr_number: { required: true, type: string }
    # A callee's `environment:` resolves in the CALLER's repository, and the environment's value
    # wins over whatever the caller passed, empty included -- `summary` binds `shipmate-engine`.
    secrets:
      # `required: false` is load-bearing: consumers hold this key on the `shipmate-engine`
      # environment (docs/github-app.md §5), so a caller binding no environment has nothing to
      # pass. A required declaration rejects the call before the first callee job binding none
      # (`guard`) runs a step, with "Secret ... is required, but not provided while calling".
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_SECRETS: { required: false }
      SHIPMATE_PLAN_PASSPHRASE: { required: false }
jobs:
  # `gh workflow run apply.yml` by a human with write access would otherwise skip every requirement
  # in scripts/authorize. A human cannot make github.actor a bot login, so this rejects any human
  # dispatch -- though it admits any bot actor with actions:write, not only this App.
  #
  # Its own job, not a first step of `detect`: `summary` must refuse a rejected dispatch -- it mints
  # the App key and comments on the dispatcher-supplied PR number -- while still posting the failure
  # comment and refreshing the gate when `detect` genuinely fails. `needs.guard.result == 'success'`
  # is false only for an unauthorised dispatch. No secrets, no environment, no checkout.
  guard:
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::apply must be dispatched by the shipmate App via comment-ops, not by a direct workflow_dispatch"
          exit 1

  review:
    # Deliberately unconditional -- no `if:`. Running always closes the TOCTOU between the
    # comment that authorized this apply and the dispatch: the decision is re-read here, so an
    # approval dismissed in between holds.
    needs: [guard]
    uses: ./.github/workflows/apply-review.yml
    permissions: {}
    with:
      pr_number: ${{ inputs.pr_number }}
    # Named, never `inherit`: the callee's `shipmate-engine` binding supplies the key only when
    # the name is mapped here, even to an empty value.
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  detect:
    # A `review` that FAILS is caught by `!failure()`, so nothing applies and the run is visibly
    # red. The explicit `if:` stays rather than reverting to GHA's default `success()`: both forms
    # refuse a failed `review`, and this one says so.
    needs: [guard, review]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: read, actions: read }
    # Exactly one of `t` (targeted) and `d` (every environment) runs, and a skipped step's outputs
    # read as ''. A targeted apply is one env-level, so levels 1-3 read 'true' from the input, never
    # from a missing output: an unwritten `_empty` reads '', runs its level and dies at fromJSON.
    outputs:
      envlevel0_waves: ${{ steps.t.outputs.waves || steps.d.outputs.envlevel0_waves }}
      envlevel1_waves: ${{ steps.d.outputs.envlevel1_waves }}
      envlevel2_waves: ${{ steps.d.outputs.envlevel2_waves }}
      envlevel3_waves: ${{ steps.d.outputs.envlevel3_waves }}
      envlevel0_empty: ${{ steps.t.outputs.empty || steps.d.outputs.envlevel0_empty }}
      envlevel1_empty: ${{ inputs.environment != '' && 'true' || steps.d.outputs.envlevel1_empty }}
      envlevel2_empty: ${{ inputs.environment != '' && 'true' || steps.d.outputs.envlevel2_empty }}
      envlevel3_empty: ${{ inputs.environment != '' && 'true' || steps.d.outputs.envlevel3_empty }}
      head_sha: ${{ steps.t.outputs.head_sha || steps.d.outputs.head_sha }}
      excluded_envs: ${{ steps.d.outputs.excluded_envs }}
      skipped_envs: ${{ steps.d.outputs.skipped_envs }}
      review_held_envs: ${{ steps.d.outputs.review_held_envs }}
      applied_ungated_envs: ${{ steps.d.outputs.applied_ungated_envs }}
      review_not_required_envs: ${{ steps.t.outputs.review_not_required_envs || steps.d.outputs.review_not_required_envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - uses: $/actions/setup
      - id: t
        if: ${{ inputs.environment != '' }}
        uses: $/actions/apply-detect
        with:
          environment: ${{ inputs.environment }}
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          # Passed through raw, never defaulted: an empty decision means the review signal never
          # arrived, and empty refuses the run.
          review-decision: ${{ needs.review.outputs.decision }}
          github-vars: ${{ toJSON(vars) }}
      - id: d
        if: ${{ inputs.environment == '' }}
        uses: $/actions/apply-all-detect
        with:
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          # Passed through raw, never defaulted: an empty decision means the review signal never
          # arrived, and empty is the hold-everything value.
          review-decision: ${{ needs.review.outputs.decision }}
          github-vars: ${{ toJSON(vars) }}

  envlevel0:
    # Display name only (the job ids stay `envlevel*`): a called workflow's jobs display as
    # `<caller job> / <this name> / <wave job>`, and GHA cannot suppress a level -- so each level
    # is named for the env-level it fans out instead of repeating the verb the wave job carries.
    name: L0
    # `guard` and `review` are listed so their failures reach `!failure()`: otherwise a failed one
    # skips `detect`, whose outputs then read as '' -- which `!= 'true'` fans out on, over
    # `fromJSON('')`.
    needs: [guard, review, detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel0_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: &envlevel-permissions { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel0_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
    # Named, never `inherit`: these two files sit in one organization but the RUN belongs to the
    # consumer, and `inherit` is evaluated against the run -- so a cross-organization consumer's
    # `complete` job would hold no key, its applies would execute, and their apply checks would
    # strand pending forever.
    secrets: &envlevel-secrets
      # Declare a new secret in apply-env-level.yml in the same change that maps it here: the
      # `./` callee is read at this commit, and mapping a secret it does not declare is a hard
      # load-time error, unlike an undeclared action input, which is silently ignored.
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}

  envlevel1:
    name: L1
    needs: [guard, review, detect, envlevel0]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel1_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel1_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
    secrets: *envlevel-secrets

  envlevel2:
    name: L2
    needs: [guard, review, detect, envlevel0, envlevel1]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel2_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel2_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
    secrets: *envlevel-secrets

  envlevel3:
    name: L3
    needs: [guard, review, detect, envlevel0, envlevel1, envlevel2]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel3_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel3_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
    secrets: *envlevel-secrets

  summary:
    # `review` is in this list because `results:` is `join(needs.*.result, ',')`, which covers only
    # THIS job's needs. A failed `review` skips `detect` -- correctly: nothing applies and the gate
    # stays pending -- while `summary` still runs on `guard`'s success, so without the entry the
    # comment renders the non-failure form over a run that died.
    needs: [guard, review, detect, envlevel0, envlevel1, envlevel2, envlevel3]
    # `needs.guard.result == 'success'` stops `always()` minting the App key after a rejected
    # dispatch. Keyed on `guard`, not `detect`: a genuine `detect` failure (no plan run, a `needs`
    # cycle) still gets the comment and gate refresh, as a failed or cancelled apply does.
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-slim
    # Both steps mint the App key from secrets.SHIPMATE_APP_PRIVATE_KEY, the same as
    # apply-env-level.yml's `complete` job. Deployment branch policy restricts this environment to
    # the default branch, so a branch-authored workflow naming it is denied and never sees the key.
    environment: shipmate-engine
    # gate-refresh and apply-summary each mint their own App token: a checks:read scan plus the
    # statuses:write gate write, and a checks:read scan of the head SHA's apply checks plus the
    # comment POST. actions:read is the one GITHUB_TOKEN scope needed here, for apply-summary's
    # artifact download and run-jobs listing.
    permissions: { actions: read }
    steps:
      - name: Complete gate if every apply check is done
        uses: $/actions/gate-refresh
        with:
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - name: Post apply result comment
        uses: $/actions/apply-summary
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.ref }}
          environment: ${{ inputs.environment }}
          envlevel0-waves: ${{ needs.detect.outputs.envlevel0_waves }}
          envlevel1-waves: ${{ needs.detect.outputs.envlevel1_waves }}
          envlevel2-waves: ${{ needs.detect.outputs.envlevel2_waves }}
          envlevel3-waves: ${{ needs.detect.outputs.envlevel3_waves }}
          excluded-envs: ${{ needs.detect.outputs.excluded_envs }}
          skipped-envs: ${{ needs.detect.outputs.skipped_envs }}
          review-held-envs: ${{ needs.detect.outputs.review_held_envs }}
          applied-ungated-envs: ${{ needs.detect.outputs.applied_ungated_envs }}
          review-not-required-envs: ${{ needs.detect.outputs.review_not_required_envs }}
          results: ${{ join(needs.*.result, ',') }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
