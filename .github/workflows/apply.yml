name: apply
on:
  workflow_call:
    inputs:
      # Empty runs a bare apply: every pending environment the review decision and `apply_mode`
      # allow, in `needs` order. A name applies that one alone.
      environment: { required: false, type: string, default: "" }
      ref: { required: true, type: string }
      pr_number: { required: true, type: string }
      runs_on: { required: false, default: ubuntu-26.04-arm, type: string }
      # The consumer's `auto` job passes a literal `true`: the auto form of apply-detect.
      auto: { required: false, type: boolean, default: false }
    # A callee's `environment:` resolves in the CALLER's repository, and the environment's value
    # wins over whatever the caller passed, empty included -- `outcome` binds `shipmate-engine`.
    secrets:
      # `required: false` is load-bearing: the key lives on the `shipmate-engine` environment
      # (docs/github-app.md §5), so a caller binding none has nothing to pass, and a required
      # declaration rejects the call: "Secret ... is required, but not provided while calling".
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_SECRETS: { required: false }
      SHIPMATE_ENCRYPTION_KEY: { required: false }
jobs:
  # Names why `run.if` refused the dispatch: the failing check step states its rule, and the
  # last step refuses when none does. A human cannot make github.actor a bot login, so the first
  # step stops a hand dispatch that would skip scripts/authorize. No secrets, environment or checkout.
  guard:
    needs: [run]
    # A run cancelled before `run` starts also leaves it skipped; `!cancelled()` keeps that run
    # from refusing.
    if: ${{ !cancelled() && needs.run.result == 'skipped' }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - &reject-actor
        name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::apply refused: the dispatching actor is not a [bot]; comment 'shipmate apply' on the pull request instead of running a direct workflow_dispatch"
          exit 1
      # A called workflow's `github` context is its caller's, so these read the dispatch itself.
      # A fence `auto` job without `auto: true` would otherwise run the App's dispatch as a bare
      # apply, skipping the actor, provenance, autoplan actor and mergeability checks.
      - &reject-auto-without-form
        name: Reject an auto dispatch that does not run the auto form
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'auto' && !inputs.auto }}
        run: |
          echo "::error::apply refused: this run was dispatched with verb 'auto', but the calling job does not pass 'auto: true'; give the shipmate.yml 'auto' job the published 'with:' block (shipmate doctor names the difference)"
          exit 1
      - &reject-form-outside-auto
        name: Reject the auto form outside an auto dispatch
        if: ${{ inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'auto') }}
        run: |
          echo "::error::apply refused: the calling job passes 'auto: true', but this run is not a dispatch with verb 'auto'; only the shipmate.yml 'auto' job passes it"
          exit 1
      # Fails closed: an unreadable `inputs` reads '' and refuses every bare and targeted apply,
      # as does any call that is not a dispatch.
      - &reject-non-apply
        name: Reject a bare or targeted apply outside an apply dispatch
        if: ${{ !inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'apply') }}
        run: |
          echo "::error::apply refused: this run is not a dispatch with verb 'apply' and the calling job does not pass 'auto: true'; comment 'shipmate apply' on the pull request, and give the shipmate.yml 'apply' job the published 'if:' (shipmate doctor names the difference)"
          exit 1

      # An apply dispatch claims its comment in `apply-run.yml`'s `review`; one without a comment
      # id would bypass the claim.
      - &reject-no-comment
        name: Reject an apply dispatch without a comment id
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'apply' && github.event.inputs.comment_id == '' }}
        run: |
          echo "::error::apply refused: this apply dispatch carries no comment_id, so no comment can be claimed for it; comment 'shipmate apply' on the pull request instead"
          exit 1

      # The number keys `apply-run.yml`'s concurrency group, so two spellings of one pull request
      # must not reach two groups. Read through `env:`: a `${{ }}` inside `run:` is injectable.
      - &reject-pr-number
        name: Reject a pull request number that is not canonical
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::apply refused: pr_number is not a pull request number (1 to 10 digits, no leading zero); a workflow or App other than shipmate's comment-ops and autoplan sent this dispatch; comment 'shipmate apply' on the pull request instead"
            exit 1
          fi
      - name: Refuse a dispatch that no check explains
        run: |
          echo "::error::apply refused: the run job's condition refused this dispatch and no rule names why; comment 'shipmate apply' on the pull request"
          exit 1

  # Every apply job runs inside `apply-run.yml`, one run per pull request at a time; its `review`
  # repeats `guard`'s check steps and claims the comment.
  run:
    # `!cancelled()` keeps a cancelled run from queueing an apply. Then `guard`'s check conditions
    # negated and the canonical-number test; an expression error skips the call too.
    # test_apply_dispatch_actor_guard.py keeps the two in step.
    if: ${{ !cancelled() && !(!endsWith(github.actor, '[bot]')) && !(github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'auto' && !inputs.auto) && !(inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'auto')) && !(!inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'apply')) && !(github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'apply' && github.event.inputs.comment_id == '') && format('{0}', fromJSON(inputs.pr_number)) == inputs.pr_number && inputs.pr_number != 'true' && fromJSON(inputs.pr_number) >= 1 && fromJSON(inputs.pr_number) < 1e10 && !contains(inputs.pr_number, '.') }}
    uses: ./.github/workflows/apply-run.yml
    # The union of what `apply-run.yml`'s jobs request; a callee job asking for more fails the run.
    permissions: { contents: read, checks: read, actions: read, pull-requests: read, id-token: write }
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr_number }}
      runs_on: ${{ inputs.runs_on }}
      auto: ${{ inputs.auto }}
    # Named like the wave calls' secrets: mapping a secret `apply-run.yml` does not declare is a
    # load-time error, so declare a new one there in the same change.
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}

  # Cancels this pull request's apply runs that wait at an older head and replies naming the run
  # this one waits behind (scripts/apply-queue). Display only: nothing needs it, and it may end
  # after `run` joined the group. Same `if:` as `run` without `!cancelled()`.
  queue:
    if: ${{ !(!endsWith(github.actor, '[bot]')) && !(github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'auto' && !inputs.auto) && !(inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'auto')) && !(!inputs.auto && (github.event_name != 'workflow_dispatch' || github.event.inputs.verb != 'apply')) && !(github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'apply' && github.event.inputs.comment_id == '') && format('{0}', fromJSON(inputs.pr_number)) == inputs.pr_number && inputs.pr_number != 'true' && fromJSON(inputs.pr_number) >= 1 && fromJSON(inputs.pr_number) < 1e10 && !contains(inputs.pr_number, '.') }}
    runs-on: ubuntu-slim
    environment: { name: shipmate-engine, deployment: false }
    # Its writes use the App token; a job-token `actions: write` would fail every caller that
    # grants `actions: read`.
    permissions: {}
    # A lost runner or a setup error fails this job, not the run.
    continue-on-error: true
    timeout-minutes: 3
    steps:
      # `guard`'s checks, before any step reads the App key.
      - *reject-actor
      - *reject-auto-without-form
      - *reject-form-outside-auto
      - *reject-non-apply
      - *reject-no-comment
      - *reject-pr-number
      - uses: $/actions/apply-queue
        with:
          pr-number: ${{ inputs.pr_number }}
          environment: ${{ inputs.environment }}
          auto: ${{ inputs.auto }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # `always()`, not `!cancelled()`: it must answer a cancelled run too, and only job-level status
  # functions see that cancel. It answers only a run whose `review` wrote `admitted`, so a run
  # cancelled while it waited in the group stays silent. Holds the App key but checks nothing out.
  outcome:
    needs: [run]
    if: ${{ always() && needs.run.outputs.posted != 'true' && (needs.run.outputs.review_result != 'failure' || (needs.run.outputs.unbound != 'true' && !inputs.auto)) && needs.run.outputs.admitted == 'true' }}
    runs-on: ubuntu-slim
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    steps:
      # An output that did not arrive reads empty, never the refused text.
      - id: reply
        uses: $/actions/outcome-reply
        with:
          verb: apply
          environment: ${{ inputs.environment }}
          pr-number: ${{ inputs.pr_number }}
          review-result: ${{ needs.run.outputs.review_result }}
          summary-result: ${{ needs.run.outputs.summary_result }}
          run-cancelled: ${{ needs.run.outputs.run_cancelled == 'true' }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      # Display only: nothing reads the check, so a failure here must not fail outcome.
      - name: End the running apply check
        if: ${{ always() && steps.reply.outputs.posted == 'true' }}
        uses: $/actions/apply-run-check
        continue-on-error: true
        timeout-minutes: 1
        with:
          mode: finish
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
