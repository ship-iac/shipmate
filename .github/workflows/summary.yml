name: summary
on:
  workflow_call:
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: { required: true }
jobs:
  summary:
    # One gate write per head SHA. Two plan runs for the same commit
    # (draft->ready, or a rapid re-push) produce two workflow_run events, and
    # commit-status writes are last-write-wins in arrival order. Job level, not
    # workflow level: a called workflow's top-level `concurrency:` is ignored.
    concurrency:
      group: shipmate-summary-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    # Three guards, each closing a specific path:
    #  - `path`: `workflow_run.workflows:` in the caller matches by workflow
    #    NAME, so a branch file merely named like the plan workflow could fire
    #    this one; matching the file path instead pins it to the real file.
    #  - `event == 'pull_request'`: excludes a push-triggered run of that same
    #    file.
    #  - `head_repository.full_name`: a fork's plan run must not author
    #    checks, comments or a gate under the App identity now that this job
    #    — not the plan job — holds the key.
    if: >-
      github.event.workflow_run.path == '.github/workflows/plan.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Deployment branch policy: default branch only. A workflow_run job runs at
    # the default-branch ref, so it passes; a branch-authored workflow naming
    # this environment is denied and never sees the key.
    environment: shipmate-engine
    permissions:
      actions: read
      contents: read
      # The pull-request fallback lookup below; a callee's permissions are
      # capped by the caller job's, so the consumer wrapper must grant it too.
      pull-requests: read
    steps:
      - name: Skip when a newer plan run exists for this head SHA
        id: newest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          THIS_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # --slurp wraps every page into one array before `--jq` runs:
          # `--paginate` alone evaluates `--jq` once PER PAGE, and picking a
          # "latest" record independently per page can silently pick the
          # wrong run once a head_sha's history spans more than one page.
          # `status == "completed"`, not `conclusion == "success"`: a FAILING
          # run's own record has conclusion "failure", so filtering to
          # "success" excluded a failing run from ever seeing itself as the
          # newest -- it always deferred to an older green run, and a stale
          # green gate outlived a newer red one. `sort_by(..., .id) | last`
          # breaks a same-second tie on `run_started_at` (draft->ready can
          # produce two runs within the same second) by highest run id.
          newest=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?head_sha=$SHA&per_page=100" \
            --jq '[.[].workflow_runs[] | select(.status == "completed")] | sort_by(.run_started_at, .id) | last | .id // empty')
          if [ -n "$newest" ] && [ "$newest" != "$THIS_RUN" ]; then
            echo "superseded by run $newest"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the pull request number
        id: pr
        if: steps.newest.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          FROM_EVENT: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # Identifiers come from the event or the API — never from artifacts,
          # which the untrusted plan run wrote.
          n=$(printf '%s' "$FROM_EVENT" | jq -r '.[0].number // empty')
          if [ -z "$n" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty')
          fi
          [ -n "$n" ] || { echo "::warning::no pull request found for $SHA; nothing to summarise"; }
          # The deleted plan.yml summary job carried `github.event.pull_request.draft
          # == false`. Restore it here: a draft skips every plan job, and a run
          # that planned nothing must never write a gate.
          if [ -n "$n" ]; then
            # Captured separately, not inlined in `[ "$(...)" = ... ]`: a
            # failing `gh api` call there is only an argument to `[`, not the
            # executed command, so it is exempt from `set -e` and its empty
            # output would read as "not a draft" -- failing OPEN. Fail closed
            # instead: treat "can't tell" the same as "is a draft".
            draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .draft) || draft=""
            if [ -z "$draft" ] || [ "$draft" = "true" ]; then
              echo "pull request $n is a draft, or its draft status could not be verified; nothing to summarise"
              n=""
            fi
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Count and download the plan run's cell summaries
        id: artifacts
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          # `scripts/gate-state` does int(os.environ.get("SHIPMATE_ARTIFACT_COUNT",
          # "0")) -- an unset/empty count reaches int("") and raises, which kills
          # the whole action and writes NO gate. A bare `set -e` here would let a
          # transient `gh api` failure abort this step, and every later step's
          # plain `if:` is implicitly `success() && ...`, so the summary action
          # step would then be skipped outright -- same "no gate at all" outcome,
          # one step earlier. Catch the failure instead and still emit a count.
          # --slurp wraps every page into one array before `--jq` runs:
          # `--paginate` alone evaluates `--jq` once PER PAGE, and the matrix
          # cap is 256 cells -- comfortably more than one 100-artifact page. A
          # bare `[.artifacts[] | ...] | length` would then emit one count PER
          # PAGE ("100\n56"), and writing that multi-line value to
          # $GITHUB_OUTPUT corrupts the output file and fails the step.
          if count=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.[].artifacts[] | select(.name | startswith("cell-summary."))] | length'); then
            echo "count=$count" >> "$GITHUB_OUTPUT"
          else
            # Report 1 (at least one, unverified), never 0: gate-state's
            # cell_count < artifact_count shortfall check only fires on a nonzero
            # count, and the download step below will find nothing to parse, so a
            # reported 0 here would read as "nothing changed" and green the gate
            # over evidence we never actually saw.
            echo "::warning::could not list this plan run's artifacts; treating its evidence as incomplete"
            echo "count=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.pr.outputs.number != '' && steps.artifacts.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: cell-summary.*
          path: cells
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: ship-iac/shipmate/actions/summary@ce0512bebe53d0330e2928378fb8f366fc3b1ff9 # provisional pin: branch-local commit, not yet on main -- repin with dev/repin_internal.py once this merges
        if: steps.pr.outputs.number != ''
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          run-conclusion: ${{ github.event.workflow_run.conclusion }}
          # `|| '1'`, never `'0'`: the failure branch above deliberately
          # reports 1 (evidence unknown, never "nothing changed") so a
          # shortfall against the parsed cell_count trips gate-state's hold
          # path instead of greening the gate. Falling back to '0' here would
          # contradict that and green exactly the case the sentinel exists to
          # catch.
          artifact-count: ${{ steps.artifacts.outputs.count || '1' }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
