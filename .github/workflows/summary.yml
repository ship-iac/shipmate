name: summary
on:
  workflow_call:
    # The decision lives in the `summary` job, but the facts arrive as inputs the caller states: a
    # reusable workflow's job-level `if:` reads only YAML contexts, so it cannot call a script, and
    # reading the event payload directly is what made the `summary` job's `if:` and `build-matrix`,
    # which keyed on the event name, disagree about what a non-pull-request trigger means.
    inputs:
      pr-number:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      detect-result:
        required: true
        type: string
      plan-result:
        required: true
        type: string
      planned-cells:
        required: true
        type: string
      # Empty `head-repo` refuses: the caller gets a skipped job rather than an App-authored gate
      # over fork content. Empty `is-draft` refuses unless `on-demand` is 'true', and empty
      # `on-demand` refuses unless `is-draft` is 'false'.
      head-repo:
        required: false
        default: ""
        type: string
      is-draft:
        required: false
        default: ""
        type: string
      # Stated by the same producer as `head-repo` and `is-draft`. A caller that states it from
      # anywhere else is a wiring defect `shipmate doctor` reports, not one the `if:` can see.
      on-demand:
        required: false
        default: ""
        type: string
    # Declaring no other secret is load-bearing: mapping a secret a callee does not declare is a
    # hard load-time error, so a plan wrapper passes this key alone and never the passphrase.
    secrets:
      # `required: false` -- apply.yml's `secrets:` note carries the argument. The one job here
      # binds `environment: shipmate-engine`, so a required declaration is satisfiable today; a job
      # that bound no environment would fail every consumer scoping the key to it, at load time.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
jobs:
  summary:
    # The fork clause yields to no trigger; it alone guards App-key exposure over fork-authored
    # content. The draft clause does yield: skipping a draft is autoplan's economy, not a trust
    # decision, and `shipmate plan` on a draft asks for that plan. The parentheses are load-bearing:
    # `&&` binds tighter than `||`, so without them a fork's `on-demand` alone satisfies the guard.
    if: >-
      inputs.head-repo != '' &&
      inputs.head-repo == github.repository &&
      (inputs.is-draft == 'false' || inputs.on-demand == 'true')
    runs-on: ubuntu-latest
    # The guard is on the job, not on a step: a skipped job creates no deployment and never enters
    # the environment, whereas a first-step check would already hold the App key in scope.
    environment: shipmate-engine
    permissions:
      contents: read
    steps:
      # Unconditional: skipping it when zero cells were planned would make gate-state's "more
      # cells than planned" branch unreachable, so a run reporting zero planned cells while cell
      # summaries exist would green the gate instead of holding it. A `pattern:` matching nothing
      # is a no-op for this action, not a failure -- only `name:` errors on a miss.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # A failed download must reach gate-state as a cell-summary shortfall it reports on the
        # gate, not as a dead job that writes no gate at all.
        continue-on-error: true
        with:
          pattern: cell-summary.*
          path: cells

      - uses: ship-iac/shipmate/actions/summary@a9be68cc9442bbf03478a7eabbd0afc2847cdd4e # pinned to a commit on main
        with:
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ inputs.head-sha }}
          detect-result: ${{ inputs.detect-result }}
          plan-result: ${{ inputs.plan-result }}
          planned-cells: ${{ inputs.planned-cells }}
          on-demand: ${{ inputs.on-demand }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
