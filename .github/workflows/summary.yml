name: summary
on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      detect-result:
        required: true
        type: string
      plan-result:
        required: true
        type: string
      planned-cells:
        required: true
        type: string
    secrets:
      # `required: false` — see apply.yml's note. This workflow's only job binds
      # `environment: shipmate-engine`, so a required declaration happens to be
      # satisfiable today; adding any job that does not bind the environment
      # would make every consumer that scopes the key to it fail at load time.
      # Declaring nothing else is also load-bearing: mapping a secret a callee
      # does not declare is a hard load-time error, so a consumer's plan
      # wrapper passes this key alone and never the passphrase.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
jobs:
  summary:
    # Both clauses live here rather than in the caller because no check inspects
    # the caller's YAML for this. A consumer who kept this job and dropped
    # a clause would hand a fork pull request an App-authored gate — fail-open,
    # and invisible. On the job, not on a step: a skipped job creates no
    # deployment and never enters the environment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: shipmate-engine
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # Unconditional: skipping it when zero cells were planned would make
        # gate-state's "more cells than planned" branch structurally unreachable,
        # so a run reporting zero planned cells while cell summaries exist would
        # green the gate instead of holding. A `pattern:` that matches nothing
        # is a no-op for this action, not a failure — only `name:` errors on a
        # miss — so there is nothing to guard against.
        # A failed download must reach gate-state as a cell-summary shortfall it
        # reports on the gate, not as a dead job that writes no gate at all.
        continue-on-error: true
        with:
          pattern: cell-summary.*
          path: cells

      - uses: ship-iac/shipmate/actions/summary@f3a88b94017c534c3a41e0bbc4e346d34e331182 # pinned to a commit on main
        with:
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ inputs.head-sha }}
          detect-result: ${{ inputs.detect-result }}
          plan-result: ${{ inputs.plan-result }}
          planned-cells: ${{ inputs.planned-cells }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
