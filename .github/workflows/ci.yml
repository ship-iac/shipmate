name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: scripts/tests/test_pin_status.py and test_repin.py are fixtured on real
        # historical commits. A shallow clone omits those commits, which fails those tests -- or
        # passes them vacuously, since refs_at() on an absent commit returns [] and "safe to pin"
        # then holds for the wrong reason.
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # actionlint lints .github/workflows/ and shellchecks their `run:` blocks. It does not
      # cover actions/*/action.yml; GitHub itself parses those in manifest-load.yml on push to
      # main. The download script is pinned at the release tag and verifies the binary checksum.
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Ruff lint (incl. flake8-bandit S rules)
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # The internal-pin guard runs in its own workflow (internal-pins.yml) on push to main
      # only, so it is excluded here. docs/releasing.md § The guard has the tradeoff.
      - name: Unit tests
        run: uv run pytest scripts/tests -q --ignore=scripts/tests/test_internal_pins.py

      # ty is still beta; surface type findings without gating CI on them.
      - name: Type check (ty, beta)
        run: uv run ty check
        continue-on-error: true
