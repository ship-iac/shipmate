name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: scripts/tests/test_repin.py is fixtured on a real historical commit,
        # which a shallow clone omits -- those tests then skip loudly instead of running.
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # actionlint lints .github/workflows/ and shellchecks their `run:` blocks. It does not
      # cover actions/*/action.yml; GitHub itself parses those in manifest-load.yml on push to
      # main. The download script is pinned at the release tag and verifies the binary checksum.
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Ruff lint (incl. flake8-bandit S rules)
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest scripts/tests -q

      # ty is still beta; surface type findings without gating CI on them.
      - name: Type check (ty, beta)
        run: uv run ty check
        continue-on-error: true
