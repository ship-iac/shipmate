name: apply-all
on:
  workflow_call:
    inputs:
      ref: { required: true, type: string }
      pr_number: { required: true, type: string }
      plan_run_id: { required: true, type: string }
      state_suffix: { required: true, type: string }
    secrets:
      # `required: false` is load-bearing — see apply.yml's note: a caller that
      # binds no environment holds no value to pass, and a required declaration
      # kills the run at the first callee job that binds no environment
      # (`guard`).
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_PLAN_PASSPHRASE: { required: false }
jobs:
  # `gh workflow run apply-all.yml` by a human with write access would
  # otherwise skip every requirement in scripts/authorize. A human cannot make
  # github.actor a bot login, so this rejects any human dispatch -- though it
  # admits any bot actor with actions:write, not only this App.
  #
  # Its own job, not a first step of `detect`: `summary` must refuse a rejected
  # dispatch (it mints the App key and comments on the dispatcher-supplied PR
  # number) while still posting the failure comment and refreshing the gate
  # when `detect` genuinely fails -- an env_order cycle, a bad plan run id.
  # Keying `summary` on this job separates
  # the two: `needs.guard.result == 'success'` is false only for an
  # unauthorised dispatch. No secrets, no environment, no checkout.
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::apply-all must be dispatched by the shipmate App via comment-ops, not by a direct workflow_dispatch"
          exit 1

  # The review state the bare-apply partition needs, re-read here rather than
  # accepted as a dispatch input: `guard` above admits any bot actor holding
  # actions:write, so an input would be a claim that surface could forge.
  # Its own job because `detect` checks out the PR head and runs Terramate over
  # branch-controlled HCL -- no token belongs in that job. `environment:` is how
  # a callee reaches the App key (same mechanism as `summary` below).
  #
  # Deliberately unconditional -- no `if:`. A gate on the repository variable is
  # what let a `ungated-envs` action input wider than the variable escape
  # enforcement, and running always is also what closes the TOCTOU between the
  # comment that authorized this apply and the dispatch: the decision is re-read
  # here, so an approval dismissed in between holds.
  review:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: shipmate-engine
    permissions: {}
    outputs:
      decision: ${{ steps.rd.outputs.decision }}
    steps:
      - name: Verify the App key arrived
        shell: bash
        env:
          APP_ID: ${{ vars.SHIPMATE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
            exit 1
          fi
          [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - id: rd
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # NONE is the sentinel for a PR that exists with a null decision --
          # the ruleset requires no review. Nothing here has proved the PR
          # exists (unlike comment-ops, which reads it over REST first), and a
          # pr_number matching no pull request returns a null `pullRequest`
          # with no errors and exit 0 -- so that case gets its own value, which
          # detect's catch-all holds every env on. Never defaulted in a
          # workflow expression: a decision that fails to arrive must arrive
          # empty, which holds every env too.
          # The $owner/$repo/$pr tokens are GraphQL query variables (bound via
          # -F), not shell variables -- single quotes are intentional.
          # shellcheck disable=SC2016
          rd=$(gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision}}}' \
            -F owner="$OWNER" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest | if type == "object" then (.reviewDecision // "NONE") else "MISSING_PR" end')
          echo "decision=$rd" >> "$GITHUB_OUTPUT"

  detect:
    # A `review` that FAILS is caught by `!failure()`, so nothing applies and
    # the run is visibly red. The explicit `if:` stays rather than reverting to
    # GHA's default `success()`: both forms refuse a failed `review`, and this
    # one says so.
    needs: [guard, review]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: read, actions: read }
    outputs:
      envlevel0_waves: ${{ steps.d.outputs.envlevel0_waves }}
      envlevel1_waves: ${{ steps.d.outputs.envlevel1_waves }}
      envlevel2_waves: ${{ steps.d.outputs.envlevel2_waves }}
      envlevel3_waves: ${{ steps.d.outputs.envlevel3_waves }}
      envlevel0_empty: ${{ steps.d.outputs.envlevel0_empty }}
      envlevel1_empty: ${{ steps.d.outputs.envlevel1_empty }}
      envlevel2_empty: ${{ steps.d.outputs.envlevel2_empty }}
      envlevel3_empty: ${{ steps.d.outputs.envlevel3_empty }}
      head_sha: ${{ steps.d.outputs.head_sha }}
      plan_run_id: ${{ steps.d.outputs.plan_run_id }}
      excluded_envs: ${{ steps.d.outputs.excluded_envs }}
      skipped_envs: ${{ steps.d.outputs.skipped_envs }}
      review_held_envs: ${{ steps.d.outputs.review_held_envs }}
      applied_ungated_envs: ${{ steps.d.outputs.applied_ungated_envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - id: d
        uses: ship-iac/shipmate/actions/apply-all-detect@06d9d8e233548fa8d4b4904f28dcc72cdd4b20d9
        with:
          plan-run-id: ${{ inputs.plan_run_id }}
          head-sha: ${{ inputs.ref }}
          github-token: ${{ github.token }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          # Passed through raw, never defaulted: an empty decision means the
          # review signal never arrived, and empty is the hold-everything value.
          ungated-envs: ${{ vars.SHIPMATE_UNGATED_ENVS }}
          review-decision: ${{ needs.review.outputs.decision }}

  envlevel0:
    # Display name only (job id unchanged) — see apply.yml's `waves` job.
    name: L0
    # `guard` and `review` are in `needs` as well, so their failures reach
    # `!failure()` here: without them a rejected dispatch (or a review job that
    # could not mint the App key) skips `detect`, and a skipped `detect` reads
    # its outputs as empty strings -- which the `!= 'true'` guard below reads as
    # "not empty" and fans out anyway, on `fromJSON('')`.
    needs: [guard, review, detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel0_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@8dcf08e1ed6bc14fbedfc532151f91f314ebb172 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel0_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      plan_run_id: ${{ needs.detect.outputs.plan_run_id }}
      state_suffix: ${{ inputs.state_suffix }}
    # Named, never `inherit`: these two files sit in one organization but the RUN
    # belongs to the consumer, and `inherit` is evaluated against the run -- so a
    # cross-organization consumer's `complete` job would hold no key, and its
    # applies would execute and strand their apply checks pending forever.
    # Ordering rule for adding a secret here: declare it in apply-env-level.yml,
    # merge, bump the pin below, and only then map it in this block. Mapping a
    # secret the pinned callee does not declare is a hard load-time error (unlike
    # an undeclared action input, which is silently ignored) -- docs/releasing.md.
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel1:
    # Display name only (job id unchanged) — see apply.yml's `waves` job.
    name: L1
    needs: [guard, review, detect, envlevel0]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel1_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@8dcf08e1ed6bc14fbedfc532151f91f314ebb172 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel1_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      plan_run_id: ${{ needs.detect.outputs.plan_run_id }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel2:
    # Display name only (job id unchanged) — see apply.yml's `waves` job.
    name: L2
    needs: [guard, review, detect, envlevel0, envlevel1]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel2_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@8dcf08e1ed6bc14fbedfc532151f91f314ebb172 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel2_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      plan_run_id: ${{ needs.detect.outputs.plan_run_id }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel3:
    # Display name only (job id unchanged) — see apply.yml's `waves` job.
    name: L3
    needs: [guard, review, detect, envlevel0, envlevel1, envlevel2]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel3_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@8dcf08e1ed6bc14fbedfc532151f91f314ebb172 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel3_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      plan_run_id: ${{ needs.detect.outputs.plan_run_id }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  summary:
    # `review` is in this list because `results:` below is
    # `join(needs.*.result, ',')` -- which covers only THIS job's needs. A
    # failed `review` skips `detect` (correctly: nothing applies, the gate stays
    # pending) while `summary` still runs on `guard`'s success, so without the
    # entry the comment renders the non-failure form over a run that died.
    needs: [guard, review, detect, envlevel0, envlevel1, envlevel2, envlevel3]
    # `always()` alone would still run this job -- and mint the App key -- when
    # the bot-actor rejection failed; `needs.guard.result == 'success'` closes
    # that. Keyed on `guard` and NOT on `detect`: `always()` is needed so
    # results/gate-refresh post when an envlevel failed or was cancelled, and a
    # genuine `detect` failure (an env_order cycle, a bad plan run id) must
    # still get the developer a failure comment and a gate refresh.
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    # Both steps below mint the App key (via secrets.SHIPMATE_APP_PRIVATE_KEY),
    # same as apply-env-level.yml's complete job -- deployment branch policy
    # restricts this environment to the default branch, so a branch-authored
    # workflow naming it is denied and never sees the key.
    environment: shipmate-engine
    # gate-refresh mints its own App token (checks:read scan + statuses:write
    # gate write); apply-summary mints its own App token too, also
    # checks:read now -- it scans the head SHA's apply checks to fold their
    # state into the result comment, not just the comment POST. actions:read
    # is needed here for apply-summary's artifact download and run-jobs
    # listing.
    permissions: { actions: read }
    steps:
      - name: Complete gate if every apply check is done
        id: gate
        uses: ship-iac/shipmate/actions/gate-refresh@4ab4d7a13c1db20003938dbd72b34290217176f4
        with:
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - name: Post apply result comment
        uses: ship-iac/shipmate/actions/apply-summary@06d9d8e233548fa8d4b4904f28dcc72cdd4b20d9
        with:
          pr-number: ${{ inputs.pr_number }}
          head-sha: ${{ inputs.ref }}
          envlevel0-waves: ${{ needs.detect.outputs.envlevel0_waves }}
          envlevel1-waves: ${{ needs.detect.outputs.envlevel1_waves }}
          envlevel2-waves: ${{ needs.detect.outputs.envlevel2_waves }}
          envlevel3-waves: ${{ needs.detect.outputs.envlevel3_waves }}
          excluded-envs: ${{ needs.detect.outputs.excluded_envs }}
          skipped-envs: ${{ needs.detect.outputs.skipped_envs }}
          review-held-envs: ${{ needs.detect.outputs.review_held_envs }}
          applied-ungated-envs: ${{ needs.detect.outputs.applied_ungated_envs }}
          results: ${{ join(needs.*.result, ',') }}
          gate-verdict: ${{ steps.gate.outputs.verdict }}
          github-token: ${{ github.token }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
