name: deploy
on:
  workflow_call:
    inputs:
      runs_on: { required: false, default: ubuntu-26.04-arm, type: string }
    secrets:
      # Consumers pass this by name: `vars` reach a called workflow automatically, secrets do not,
      # and no environment supplies it (the waves bind the env's apply environment). Without it
      # every env-level apply refuses at its decrypt.
      SHIPMATE_ENCRYPTION_KEY: { required: false }
      # Feeds the `summary` job's App-token mints for the gate write and the lock release. An
      # empty key fails loud in each one's `Verify the App key arrived`, before the mint.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_SECRETS: { required: false }
jobs:
  detect:
    runs-on: ${{ inputs.runs_on }}
    permissions: { contents: read, checks: read, actions: read, pull-requests: read }
    outputs:
      envlevel0_waves: ${{ steps.d.outputs.envlevel0_waves }}
      envlevel1_waves: ${{ steps.d.outputs.envlevel1_waves }}
      envlevel2_waves: ${{ steps.d.outputs.envlevel2_waves }}
      envlevel3_waves: ${{ steps.d.outputs.envlevel3_waves }}
      envlevel0_empty: ${{ steps.d.outputs.envlevel0_empty }}
      envlevel1_empty: ${{ steps.d.outputs.envlevel1_empty }}
      envlevel2_empty: ${{ steps.d.outputs.envlevel2_empty }}
      envlevel3_empty: ${{ steps.d.outputs.envlevel3_empty }}
      head_sha: ${{ steps.d.outputs.head_sha }}
      pr_number: ${{ steps.d.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history to diff against the previous default-branch tip; file contents are fetched
        # only when a diff or read needs them, so the history costs commits and trees, not blobs.
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: $/actions/setup
        with: { tofu: "false" }
      - id: d
        uses: $/actions/deploy-detect
        with:
          # The caller is `on: push` to the default branch; its event payload
          # (and so the previous main tip) is visible here.
          base-sha: ${{ github.event.before }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-vars: ${{ toJSON(vars) }}

  envlevel0:
    # `apply-gate.is_cell_job` matches a wave job as `L<n> / <env> / <stack>`, so this `L<n>` name
    # is load-bearing: renaming it strands apply checks pending. apply.yml repeats it.
    name: L0
    needs: [detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel0_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: &envlevel-permissions { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel0_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
    # Named, never inherit: see the envlevel0 job in apply.yml.
    secrets: &envlevel-secrets
      # Declare a new secret in apply-env-level.yml first: see the envlevel0 job in apply.yml.
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}

  envlevel1:
    name: L1
    needs: [detect, envlevel0]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel1_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel1_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
    secrets: *envlevel-secrets

  envlevel2:
    name: L2
    needs: [detect, envlevel0, envlevel1]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel2_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel2_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
    secrets: *envlevel-secrets

  envlevel3:
    name: L3
    needs: [detect, envlevel0, envlevel1, envlevel2]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel3_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/apply-env-level.yml
    permissions: *envlevel-permissions
    with:
      waves_json: ${{ needs.detect.outputs.envlevel3_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
    secrets: *envlevel-secrets

  summary:
    needs: [detect, envlevel0, envlevel1, envlevel2, envlevel3]
    if: always()
    runs-on: ubuntu-slim
    # One gate writer per head at a time, across the plan, apply and deploy runs; the run-id
    # fallback keeps a failed detect's empty head SHA out of a shared group.
    concurrency:
      group: shipmate-gate-${{ needs.detect.outputs.head_sha || github.run_id }}
      cancel-in-progress: false
    # The gate write goes through a minted App token, not GITHUB_TOKEN. Same environment as
    # apply-env-level.yml's `complete` job: deployment branch policy restricts it to the default
    # branch, which is also this workflow's own trigger, so it never blocks the real run.
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    steps:
      - name: Complete gate on the merged PR head SHA
        uses: $/actions/gate-refresh
        with:
          head-sha: ${{ needs.detect.outputs.head_sha }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          detect-result: ${{ needs.detect.result }}
          deploy-results: ${{ join(needs.*.result, ',') }}
      # Runs after a failed or skipped level too: a failed cell keeps its lock through its pending
      # check, and the cells that applied release theirs. Its failure fails the job, so a re-run
      # retries the release it owes.
      - name: Release the merged pull request's cell locks
        if: ${{ !cancelled() && needs.detect.outputs.pr_number != '' }}
        uses: $/actions/lock-release
        with:
          pr-number: ${{ needs.detect.outputs.pr_number }}
          head-sha: ${{ needs.detect.outputs.head_sha }}
          merged: "true"
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
