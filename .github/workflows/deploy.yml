name: deploy
on:
  workflow_call:
    inputs:
      runs_on: { required: false, default: ubuntu-26.04-arm, type: string }
    secrets:
      # Consumers pass this by name: `vars` reach a called workflow automatically, secrets do not,
      # and no environment supplies it (the waves bind the env's apply environment). Without it
      # every cell refuses at its decrypt.
      SHIPMATE_ENCRYPTION_KEY: { required: false }
      # Reaches `summary`, `replan` and, via `waves`, each stage's `entry`, `complete` and
      # `save`. An empty key first fails `Verify the App key arrived` in the first `entry`, or in
      # `summary` with no cells; the re-plan only warns. A cell's `apply` refuses a non-empty one.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_SECRETS: { required: false }
jobs:
  detect:
    runs-on: ${{ inputs.runs_on }}
    permissions: { contents: read, checks: read, actions: read, pull-requests: read }
    outputs:
      levels: ${{ steps.d.outputs.levels }}
      stages: ${{ steps.d.outputs.stages }}
      keys: ${{ steps.d.outputs.keys }}
      counts: ${{ steps.d.outputs.counts }}
      empty: ${{ steps.d.outputs.empty }}
      head_sha: ${{ steps.d.outputs.head_sha }}
      pr_number: ${{ steps.d.outputs.pr_number }}
      refused_locked: ${{ steps.d.outputs.refused_locked }}
      tools: ${{ steps.setup.outputs.tools }}
      warm: ${{ steps.d.outputs.warm }}
      max_parallel: ${{ steps.d.outputs.max_parallel }}
      push: ${{ steps.d.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history to diff against the previous default-branch tip; file contents are fetched
        # only when a diff or read needs them, so the history costs commits and trees, not blobs.
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: setup
        uses: $/actions/setup
        with: { tofu: "false", cache-save: "true", resolve: "true" }
      - id: d
        uses: $/actions/deploy-detect
        with:
          # The caller is `on: push` to the default branch; its event payload
          # (and so the previous main tip) is visible here.
          base-sha: ${{ github.event.before }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-vars: ${{ toJSON(vars) }}

  # Saves the provider cache entry of each distinct lock on the merged tree, and the OpenTofu
  # entry through setup; a tools-only row (empty `stack`) runs setup alone. A degrade job: no job
  # needs it, so `continue-on-error` keeps its failure off the run's conclusion. The `if:` guards
  # an empty matrix, which fails the run.
  warm:
    needs: [detect]
    if: ${{ needs.detect.outputs.warm != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions: { contents: read }
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.detect.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.warm) }}
    name: warm / ${{ matrix.stack || 'tools' }}
    steps:
      - if: ${{ matrix.stack != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: $/actions/setup
        with: { cache-save: "true", versions: "${{ needs.detect.outputs.tools }}" }
      - if: ${{ matrix.stack != '' }}
        uses: $/actions/warm
        with:
          stack: ${{ matrix.stack }}
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}

  # No `name:`, matching `apply-run.yml`'s `waves`, so cell job names keep one shape.
  waves:
    needs: [detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ./.github/workflows/waves.yml
    permissions: { contents: read, checks: read, actions: read, pull-requests: read, id-token: write }
    with:
      stages: ${{ needs.detect.outputs.stages }}
      levels: ${{ needs.detect.outputs.levels }}
      keys: ${{ needs.detect.outputs.keys }}
      counts: ${{ needs.detect.outputs.counts }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      runs_on: ${{ inputs.runs_on }}
      tools: ${{ needs.detect.outputs.tools }}
      pr_number: ${{ needs.detect.outputs.pr_number }}
      by_wave: ''
      deploy: true
    # Named, never inherit: see the `waves` job in apply-run.yml.
    secrets:
      # Declare a new secret in waves.yml and stage.yml first: see the `waves` job in apply-run.yml.
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}

  summary:
    needs: [detect, waves]
    if: always()
    runs-on: ubuntu-slim
    # One gate writer per head at a time, across the plan, apply and deploy runs; the run-id
    # fallback keeps a failed detect's empty head SHA out of a shared group.
    concurrency:
      group: shipmate-gate-${{ needs.detect.outputs.head_sha || github.run_id }}
      cancel-in-progress: false
      queue: max
    # The gate write goes through a minted App token, not GITHUB_TOKEN. Same environment as
    # stage.yml's `complete` job: deployment branch policy restricts it to the default
    # branch, which is also this workflow's own trigger, so it never blocks the real run.
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    steps:
      - name: Complete gate on the merged PR head SHA
        uses: $/actions/gate-refresh
        with:
          head-sha: ${{ needs.detect.outputs.head_sha }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          detect-result: ${{ needs.detect.result }}
          deploy-results: ${{ join(needs.*.result, ',') }}
      # Runs after a failed or skipped stage too: a failed cell keeps its lock through its pending
      # check and the cells that applied release theirs, but a detect refused over another pull
      # request's lock applied nothing, so all go. A failure fails the job; a re-run retries it.
      - name: Release the merged pull request's cell locks
        if: ${{ !cancelled() && needs.detect.outputs.pr_number != '' }}
        uses: $/actions/lock-release
        with:
          pr-number: ${{ needs.detect.outputs.pr_number }}
          head-sha: ${{ needs.detect.outputs.head_sha }}
          merged: "true"
          release-pending: ${{ needs.detect.outputs.refused_locked == 'true' }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # Re-plans the open pull requests this push may put behind; display-only (`continue-on-error`).
  # It takes the consumer's runner, as its work grows with the open pull requests. The timeout caps
  # its runtime from start, not queue (CONTRACT.md §Plan comment, Re-plan after a merge).
  replan:
    needs: [detect, summary]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    continue-on-error: true
    environment: { name: shipmate-engine, deployment: false }
    permissions: {}
    steps:
      - name: Re-plan the open pull requests this push may put behind
        uses: $/actions/base-push-plan
        with:
          push: ${{ needs.detect.outputs.push }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
