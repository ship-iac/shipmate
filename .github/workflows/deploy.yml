name: deploy
on:
  workflow_call:
    inputs:
      # The flavor's state filename suffix under actions/state (`.state`, `terraform.tfstate`,
      # `terraform.tfstate.d`). A remote backend passes the empty string explicitly, which skips
      # actions/state entirely. Omitting the input fails at workflow-resolution time, deliberately:
      # a missing state configuration must be loud, not indistinguishable from a remote backend.
      state_suffix: { required: true, type: string }
    secrets:
      # Consumers pass this by name. `vars` (TERRAMATE_VERSION, TOFU_VERSION, SLACK_WEBHOOK) are
      # inherited by a called workflow automatically; secrets are NOT, and an encrypting consumer
      # that forwards nothing has every env-level apply fail its decrypt fail-safe. No environment
      # can supply it either: the wave jobs bind the env's apply environment, not `shipmate-engine`.
      SHIPMATE_PLAN_PASSPHRASE: { required: false }
      # Feeds the `summary` job's App-token mint for the gate write. An empty key fails loud one
      # step earlier, in that job's `Verify the App key arrived`.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
jobs:
  detect:
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: read, actions: read, pull-requests: read }
    outputs:
      envlevel0_waves: ${{ steps.d.outputs.envlevel0_waves }}
      envlevel1_waves: ${{ steps.d.outputs.envlevel1_waves }}
      envlevel2_waves: ${{ steps.d.outputs.envlevel2_waves }}
      envlevel3_waves: ${{ steps.d.outputs.envlevel3_waves }}
      envlevel0_empty: ${{ steps.d.outputs.envlevel0_empty }}
      envlevel1_empty: ${{ steps.d.outputs.envlevel1_empty }}
      envlevel2_empty: ${{ steps.d.outputs.envlevel2_empty }}
      envlevel3_empty: ${{ steps.d.outputs.envlevel3_empty }}
      head_sha: ${{ steps.d.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - id: d
        uses: ship-iac/shipmate/actions/deploy-detect@a9be68cc9442bbf03478a7eabbd0afc2847cdd4e
        with:
          # The caller is `on: push` to the default branch; its event payload
          # (and so the previous main tip) is visible here.
          base-sha: ${{ github.event.before }}
          github-token: ${{ github.token }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}

  envlevel0:
    # Display name only (job id unchanged) -- see apply.yml's `waves` job.
    name: L0
    needs: [detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel0_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@a8a4158c82a2c33171585e4095d04fb5ee6d3c77 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel0_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      state_suffix: ${{ inputs.state_suffix }}
    # Named, never `inherit`: these two files sit in one organization but the RUN belongs to the
    # consumer, and `inherit` is evaluated against the run -- so a cross-organization consumer's
    # `complete` job would hold no key, its applies would execute, and their apply checks would
    # strand pending forever.
    secrets:
      # Adding a secret here is ordered: declare it in apply-env-level.yml, merge, bump this
      # job's `uses:` pin, and only then map it. Mapping a secret the pinned callee does not
      # declare is a hard load-time error, unlike an undeclared action input, which is silently
      # ignored (docs/releasing.md).
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel1:
    name: L1
    needs: [detect, envlevel0]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel1_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@a8a4158c82a2c33171585e4095d04fb5ee6d3c77 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel1_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel2:
    name: L2
    needs: [detect, envlevel0, envlevel1]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel2_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@a8a4158c82a2c33171585e4095d04fb5ee6d3c77 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel2_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  envlevel3:
    name: L3
    needs: [detect, envlevel0, envlevel1, envlevel2]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.envlevel3_empty != 'true' && !contains(join(needs.*.result, ','), 'cancelled') }}
    uses: ship-iac/shipmate/.github/workflows/apply-env-level.yml@a8a4158c82a2c33171585e4095d04fb5ee6d3c77 # pinned to a commit on main
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      waves_json: ${{ needs.detect.outputs.envlevel3_waves }}
      head_sha: ${{ needs.detect.outputs.head_sha }}
      state_suffix: ${{ inputs.state_suffix }}
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  summary:
    needs: [detect, envlevel0, envlevel1, envlevel2, envlevel3]
    if: always()
    runs-on: ubuntu-latest
    # The gate write goes through a minted App token, not GITHUB_TOKEN. Same environment as
    # apply-env-level.yml's `complete` job: deployment branch policy restricts it to the default
    # branch, which is also this workflow's own trigger, so it never blocks the real run.
    environment: shipmate-engine
    permissions: {}
    steps:
      - name: Verify the App key arrived
        shell: bash
        env:
          APP_ID: ${{ vars.SHIPMATE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The shipmate App private key did not reach this job. Three causes, in the order worth checking: (1) the calling workflow used 'secrets: inherit' across an organization boundary -- GitHub delivers no inherited secrets there, and inherit also suppresses the value this job's environment binding would otherwise supply, so pass the secret by name instead; (2) the caller left SHIPMATE_APP_PRIVATE_KEY out of its secrets block; (3) this job binds no environment, or binds one that holds no secret of that name. See docs/getting-started.md."
            exit 1
          fi
          [ -n "$APP_ID" ] || { echo "::error::SHIPMATE_APP_ID is unset. Set it as a repository or organization variable (docs/github-app.md)."; exit 1; }
      - name: Mint App installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Complete gate on the merged PR head SHA
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          # A failed `detect` leaves no head SHA. Fail loud rather than post a gate reading green.
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::detect produced no head SHA; deploy cannot gate"; exit 1
          fi
          # Any env-level result other than success or skipped -- failure, cancelled, timed_out --
          # blocks the gate; `grep -q failure` alone missed cancels. Scanned in-process because a
          # pipeline whose reader exits early inverts the verdict under `pipefail`, SIGPIPE 141
          # reading as "all clean".
          concl=success; title="all env-levels applied"
          IFS=',' read -ra results <<< "$RESULTS"
          # An empty result string means no env-level job reported at all. Nothing was applied,
          # so it must read as incomplete rather than all-clean.
          [ ${#results[@]} -gt 0 ] || results=("")
          for r in "${results[@]}"; do
            case "$r" in
              success|skipped) ;;
              *) concl=failure; title="deploy incomplete"; break ;;
            esac
          done
          python3 - "$concl" "$title" > body.json <<'PY'
          import json, os, sys
          # Commit status, not a check-run (see actions/summary for why).
          concl, title = sys.argv[1:3]
          body = {"state": concl, "context": "shipmate / gate",
                  "description": (title + " — deploy env-level applies completed")[:140]}
          server, repo, run_id = (os.environ.get(k, "") for k in
                                  ("GITHUB_SERVER_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID"))
          if server and repo and run_id:
              body["target_url"] = f"{server}/{repo}/actions/runs/{run_id}"
          print(json.dumps(body))
          PY
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input body.json >/dev/null
      - name: Slack on failed deploy (outranks drift)
        if: ${{ always() && (contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')) && vars.SLACK_WEBHOOK != '' }}
        env:
          SLACK: ${{ vars.SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          python3 -c "import json;open('p.json','w').write(json.dumps({'text':':rotating_light: shipmate deploy failed on main — a wave apply failed or was cancelled.'}))"
          curl -sS -X POST -H 'Content-Type: application/json' --data @p.json "$SLACK" >/dev/null
