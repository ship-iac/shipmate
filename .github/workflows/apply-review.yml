name: apply-review
# Re-reads the review decision server-side, in its own job away from branch-controlled HCL
# (CONTRACT.md §Comment-ops). `apply-detect` refuses and `apply-all-detect` holds on it; this
# workflow only fetches it.
on:
  workflow_call:
    inputs:
      pr_number: { required: true, type: string }
    outputs:
      decision:
        description: The pull request's reviewDecision, NONE when it has none, MISSING_PR when no such pull request exists.
        value: ${{ jobs.review.outputs.decision }}
    secrets:
      # `required: false` is load-bearing -- apply.yml's `secrets:` note has the argument.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
# Floor, not a default to inherit from: see plan.yml.
permissions: {}
jobs:
  review:
    # Display name only: the calling job is already `review`, and a called workflow's jobs display
    # as `<caller job> / <this name>`.
    name: decision
    runs-on: ubuntu-slim
    # How a callee reaches the App key, the same mechanism the `summary` job uses.
    environment: shipmate-engine
    permissions: {}
    outputs:
      decision: ${{ steps.rd.outputs.decision }}
    steps:
      - name: Verify the App key arrived
        uses: $/actions/verify-app-key
        with:
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - id: rd
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # NONE: a null decision (no review rule, or code-owner review owns no changed file). A PR
          # number matching none returns a null `pullRequest` with exit 0, hence MISSING_PR.
          # shellcheck disable=SC2016 # $owner/$repo/$pr are GraphQL variables bound via -F.
          rd=$(gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){reviewDecision}}}' \
            -F owner="$OWNER" -F repo="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest | if type == "object" then (.reviewDecision // "NONE") else "MISSING_PR" end')
          echo "decision=$rd" >> "$GITHUB_OUTPUT"
