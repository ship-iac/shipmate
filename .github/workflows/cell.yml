name: cell
on:
  workflow_call:
    inputs:
      # One wave matrix row, serialized with toJSON. `environment` and `stack` repeat two of its
      # fields because the concurrency group reads only inputs (test_cell_workflow.py pins the
      # caller's `with:`).
      cell: { required: true, type: string }
      environment: { required: true, type: string }
      stack: { required: true, type: string }
      head_sha: { required: true, type: string }
      runs_on: { required: true, type: string }
      tools: { required: true, type: string }
      pr_number: { required: false, type: string, default: "" }
      auto: { required: false, type: boolean, default: false }
      provenance_run: { required: false, type: string, default: "" }
      base_sha: { required: false, type: string, default: "" }
      deploy: { required: false, type: boolean, default: false }
    # No App key: the cell writes no check.
    secrets:
      SHIPMATE_ENCRYPTION_KEY:
        required: false
      SHIPMATE_SECRETS:
        required: false
# Floor, not a default to inherit from: see plan.yml. Without it, a lost block would inherit
# id-token: write.
permissions: {}
# Held from `apply` through `save`, so no other run restores this cell's state before this run
# saves it. Without `queue: max`, a third arrival evicts the run already waiting.
concurrency:
  group: apply-${{ inputs.environment }}-${{ inputs.stack }}
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ${{ inputs.runs_on }}
    # Pull-request code runs here, so it saves nothing: `save` writes the state entry.
    cache-mode: read
    permissions: { contents: read, actions: read, checks: read, pull-requests: read, id-token: write }
    environment: ${{ fromJSON(inputs.cell).env_binding }}
    outputs:
      state: ${{ steps.cell.outputs.state }}
    steps:
      # Every attempt: a wave can wait hours on an environment approval, and "Re-run failed
      # jobs" skips `detect` and `lock`. A failure skips the cloud credentials; apply-cell runs
      # only to refuse. `deploy-detect` reads this step's listed name and `Apply the cell`'s
      # to tell whether an ended run applied a cell.
      - name: Pre-apply check
        id: pre-apply
        if: ${{ inputs.pr_number != '' || inputs.deploy }}
        uses: $/actions/pre-apply
        with:
          pr-number: ${{ inputs.pr_number }}
          env: ${{ inputs.environment }}
          stack: ${{ inputs.stack }}
          head-sha: ${{ inputs.head_sha }}
          auto: ${{ inputs.auto }}
          provenance-run: ${{ inputs.provenance_run }}
          base-sha: ${{ inputs.base_sha }}
          plan-run-id: ${{ fromJSON(inputs.cell).plan_run_id }}
          plan-sha256: ${{ fromJSON(inputs.cell).plan_sha256 }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          deploy: ${{ inputs.deploy }}
          job-id: ${{ job.check_run_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      # A read-only job's cache save warns; setup's save is skipped instead.
      - uses: $/actions/setup
        with: { versions: "${{ inputs.tools }}", cache-save: "false" }
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ fromJSON(inputs.cell).role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ fromJSON(inputs.cell).role_arn }}
          aws-region: ${{ fromJSON(inputs.cell).cred_region }}
      - name: Apply the cell
        id: cell
        uses: $/actions/apply-cell
        if: ${{ !cancelled() && (success() || steps.pre-apply.outcome == 'failure') }}
        with:
          tf-vars: ${{ toJSON(fromJSON(inputs.cell).tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ inputs.stack }}
          env: ${{ inputs.environment }}
          plan-run-id: ${{ fromJSON(inputs.cell).plan_run_id }}
          plan-sha256: ${{ fromJSON(inputs.cell).plan_sha256 }}
          encryption-key: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
          pre-apply-outcome: ${{ steps.pre-apply.outcome }}
          pre-apply-refusal: ${{ steps.pre-apply.outputs.refusal }}

  # Runs no pull-request code: no checkout, no environment, no secret. It is the only job that
  # writes the cell's state entry, so it runs whatever `apply` ended with; a cancelled or failed
  # apply may still have changed the state. Same runner as `apply`: a cache entry's version
  # includes its compression method.
  save:
    needs: [apply]
    if: ${{ always() }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: write
    permissions: { actions: read }
    steps:
      - uses: $/actions/state-save
        with:
          job-id: ${{ job.check_run_id }}
          stack: ${{ inputs.stack }}
          environment: ${{ inputs.environment }}
          state: ${{ needs.apply.outputs.state }}
