      WAVE_STATE: '{"wave0": ${{ toJSON(needs.wave0-read.outputs.report) }}, "wave1": ${{ toJSON(needs.wave1-read.outputs.report) }}, "wave2": ${{ toJSON(needs.wave2-read.outputs.report) }}, "wave3": ${{ toJSON(needs.wave3-read.outputs.report) }}, "wave4": ${{ toJSON(needs.wave4-read.outputs.report) }}, "wave5": ${{ toJSON(needs.wave5-read.outputs.report) }}, "wave6": ${{ toJSON(needs.wave6-read.outputs.report) }}, "wave7": ${{ toJSON(needs.wave7-read.outputs.report) }}}'
