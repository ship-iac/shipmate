name: apply-env-level
on:
  workflow_call:
    inputs:
      waves_json: { required: true, type: string }
      head_sha: { required: true, type: string }
    secrets:
      SHIPMATE_PLAN_PASSPHRASE:
        required: false
      SHIPMATE_APP_PRIVATE_KEY:
        required: false
      SHIPMATE_SECRETS:
        required: false
# Floor, not a default to inherit from: every job here declares its own block, so a job that
# loses its block gets nothing rather than everything the caller granted, id-token: write included.
permissions: {}
jobs:
  # Pre-flight, before any wave runs: verify that the environments the waves will bind exist,
  # then capture the apply-check ids. It needs no secret and no environment.
  snapshot:
    runs-on: ubuntu-slim
    # Permissions cap at each `uses:` boundary, so every calling job must also grant checks:read or
    # this job fails at workflow-resolution time. actions:read is not decorative: on a private
    # repository, listing environments 403s with checks:read alone, and actions:read unlocks it
    # (measured; undocumented). Every call site already grants it for the waves and `complete`.
    permissions: { checks: read, actions: read }
    outputs:
      snapshot: ${{ steps.snap.outputs.snapshot }}
    steps:
      # First, before anything else in this workflow: an apply that binds an environment nobody
      # created gets one auto-created with no reviewers, no wait timer and no branch policy.
      # A cell's variables come from the environment table keyed by matrix.environment, so plan
      # and apply hash identically whatever the job bound and the fingerprint pins nothing about
      # the binding. Existence is the only discriminator.
      - uses: $/actions/verify-environments
        with:
          waves-json: ${{ inputs.waves_json }}
      - id: snap
        uses: $/actions/apply-snapshot
        with:
          head-sha: ${{ inputs.head_sha }}
          waves-json: ${{ inputs.waves_json }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}

  wave0:
    needs: [snapshot]
    if: ${{ !failure() && !cancelled() && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' }}
    runs-on: ubuntu-latest
    permissions: &wave-permissions { contents: read, actions: read, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave0 }}
    environment: &wave-environment ${{ matrix.env_binding }}
    concurrency: &wave-concurrency
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: &wave-name apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    # wave1..wave7 alias this list, so an edit here changes all eight waves. A change for one
    # wave needs that wave's `steps:` written out in full instead of `*wave-steps`.
    steps: &wave-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: $/actions/setup
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ matrix.role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ matrix.cred_region }}
      - uses: $/actions/apply-cell
        with:
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ matrix.plan_run_id }}
          plan-sha256: ${{ matrix.plan_sha256 }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave1:
    needs: [wave0]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave1 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave2:
    needs: [wave0, wave1]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave2 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave3:
    needs: [wave0, wave1, wave2]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave3 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave4:
    needs: [wave0, wave1, wave2, wave3]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave4 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave5:
    needs: [wave0, wave1, wave2, wave3, wave4]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave5 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave6:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave6 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave7:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' }}
    runs-on: ubuntu-latest
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave7 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps

  # Completes the checks the `snapshot` job captured, for every cell whose wave job succeeded in
  # this run. The only job in this workflow that holds the App key. Ordered after every wave, so
  # that gate-refresh and the apply-summary comment -- both of which `needs:` this called workflow
  # in the callers -- never observe a stale-pending check for a cell that just applied.
  complete:
    needs: [snapshot, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: shipmate-engine
    steps:
      - uses: $/actions/apply-complete
        with:
          snapshot: ${{ needs.snapshot.outputs.snapshot }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
