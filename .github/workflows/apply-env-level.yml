name: apply-env-level
on:
  workflow_call:
    inputs:
      waves_json: { required: true, type: string }
      head_sha: { required: true, type: string }
      plan_run_id: { required: true, type: string }
      state_suffix: { required: true, type: string }
    secrets:
      SHIPMATE_PLAN_PASSPHRASE:
        required: false
      SHIPMATE_APP_PRIVATE_KEY:
        required: false
jobs:
  # Capture the apply-check ids BEFORE any wave runs. No secret, no
  # environment needed -- but permissions cap at each `uses:` boundary, so
  # every caller job below must also grant checks:read or this job fails at
  # workflow-resolution time.
  snapshot:
    runs-on: ubuntu-latest
    permissions: { checks: read }
    outputs:
      snapshot: ${{ steps.snap.outputs.snapshot }}
    steps:
      - id: snap
        uses: ship-iac/shipmate/actions/apply-snapshot@83960876131bf43583026d39948184079c807e33
        with:
          head-sha: ${{ inputs.head_sha }}
          waves-json: ${{ inputs.waves_json }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-token: ${{ github.token }}

  wave0:
    needs: [snapshot]
    if: ${{ !failure() && !cancelled() && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave0 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave1:
    needs: [wave0]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave1 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave2:
    needs: [wave0, wave1]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave2 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave3:
    needs: [wave0, wave1, wave2]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave3 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave4:
    needs: [wave0, wave1, wave2, wave3]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave4 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave5:
    needs: [wave0, wave1, wave2, wave3, wave4]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave5 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave6:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave6 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave7:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave7 }}
    environment: ${{ matrix.environment }}-apply
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - uses: ship-iac/shipmate/actions/apply-cell@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ matrix.stack }}/${{ inputs.state_suffix }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  # Completes the checks the snapshot job captured, for every cell whose wave
  # job actually succeeded in this run. The only job in this workflow that
  # holds the App key — ordered after every wave so gate-refresh and the
  # apply-summary comment (both `needs:` this called workflow in the callers)
  # never observe a stale-pending check for a cell that just applied.
  complete:
    needs: [snapshot, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { actions: read }
    environment: shipmate-engine
    steps:
      - uses: ship-iac/shipmate/actions/apply-complete@17d5e93bda614568fda0c5686547364ec8f5662b
        with:
          snapshot: ${{ needs.snapshot.outputs.snapshot }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
