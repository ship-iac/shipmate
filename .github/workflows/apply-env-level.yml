name: apply-env-level
on:
  workflow_call:
    inputs:
      waves_json: { required: true, type: string }
      head_sha: { required: true, type: string }
      runs_on: { required: true, type: string }
      # The version pair the caller's detect job resolved; every wave cell installs exactly it.
      tools: { required: true, type: string }
      # On apply, each cell refuses unless this pull request holds its lock. With `deploy` (the
      # merge deploy) it is the merged pull request, empty on a push, and each cell refuses only
      # a lock another pull request holds.
      pr_number: { required: false, type: string, default: "" }
      # `base_sha` is the base tip detect read, which every pre-merge pre-apply check compares;
      # `auto` marks an auto apply, whose check also compares `provenance_run`, detect's plan run.
      auto: { required: false, type: boolean, default: false }
      provenance_run: { required: false, type: string, default: "" }
      base_sha: { required: false, type: string, default: "" }
      deploy: { required: false, type: boolean, default: false }
    secrets:
      SHIPMATE_ENCRYPTION_KEY:
        required: false
      SHIPMATE_APP_PRIVATE_KEY:
        required: false
      SHIPMATE_SECRETS:
        required: false
# Floor, not a default to inherit from: see plan.yml. Without it, a lost block would inherit
# id-token: write.
permissions: {}
jobs:
  # Pre-flight, before any wave runs: verify that the environments the waves will bind exist and
  # carry a branch policy, and map the apply-check ids, whole and per wave. It binds
  # shipmate-engine only to check the App key and mint once, so a bad key fails before any apply.
  snapshot:
    runs-on: ubuntu-slim
    # Permissions cap at each `uses:` boundary, so every calling job must grant checks:read too,
    # or this fails at workflow resolution. actions:read is not decorative: on a private repository,
    # listing environments 403s without it (measured; undocumented).
    permissions: { checks: read, actions: read }
    environment: { name: shipmate-engine, deployment: false }
    outputs:
      snapshot: ${{ steps.snap.outputs.snapshot }}
      by_wave: ${{ steps.snap.outputs.by_wave }}
    steps:
      # Before any wave binds the environments it checks: binding one nobody created auto-creates
      # it with no protection. Variables are keyed by matrix.environment, so the fingerprint pins
      # nothing about the binding; existence and a branch policy are the only discriminators.
      - uses: $/actions/verify-environments
        with:
          waves-json: ${{ inputs.waves_json }}
      - id: snap
        uses: $/actions/apply-snapshot
        with:
          head-sha: ${{ inputs.head_sha }}
          waves-json: ${{ inputs.waves_json }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # Flips one wave's apply checks to in_progress right before it; the wave needs it, so no flip
  # lands after the completion. Each earlier wave and release must be success or skipped:
  # `!cancelled()` alone would run past a failure.
  wave0-release:
    needs: [snapshot]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave0) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave1-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave1) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave2-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave2) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave3-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict, wave2, wave2-release, wave2-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave2-verdict.result == 'success' || (needs.wave2-verdict.result == 'skipped' && needs.wave2.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave3) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave4-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict, wave2, wave2-release, wave2-verdict, wave3, wave3-release, wave3-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave2-verdict.result == 'success' || (needs.wave2-verdict.result == 'skipped' && needs.wave2.result == 'skipped')) && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave3-verdict.result == 'success' || (needs.wave3-verdict.result == 'skipped' && needs.wave3.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave4) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave5-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict, wave2, wave2-release, wave2-verdict, wave3, wave3-release, wave3-verdict, wave4, wave4-release, wave4-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave2-verdict.result == 'success' || (needs.wave2-verdict.result == 'skipped' && needs.wave2.result == 'skipped')) && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave3-verdict.result == 'success' || (needs.wave3-verdict.result == 'skipped' && needs.wave3.result == 'skipped')) && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') && (needs.wave4-verdict.result == 'success' || (needs.wave4-verdict.result == 'skipped' && needs.wave4.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave5) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave6-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict, wave2, wave2-release, wave2-verdict, wave3, wave3-release, wave3-verdict, wave4, wave4-release, wave4-verdict, wave5, wave5-release, wave5-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave2-verdict.result == 'success' || (needs.wave2-verdict.result == 'skipped' && needs.wave2.result == 'skipped')) && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave3-verdict.result == 'success' || (needs.wave3-verdict.result == 'skipped' && needs.wave3.result == 'skipped')) && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') && (needs.wave4-verdict.result == 'success' || (needs.wave4-verdict.result == 'skipped' && needs.wave4.result == 'skipped')) && (needs.wave5.result == 'success' || needs.wave5.result == 'skipped') && (needs.wave5-release.result == 'success' || needs.wave5-release.result == 'skipped') && (needs.wave5-verdict.result == 'success' || (needs.wave5-verdict.result == 'skipped' && needs.wave5.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave6) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave7-release:
    needs: [snapshot, wave0, wave0-release, wave0-verdict, wave1, wave1-release, wave1-verdict, wave2, wave2-release, wave2-verdict, wave3, wave3-release, wave3-verdict, wave4, wave4-release, wave4-verdict, wave5, wave5-release, wave5-verdict, wave6, wave6-release, wave6-verdict]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave0-verdict.result == 'success' || (needs.wave0-verdict.result == 'skipped' && needs.wave0.result == 'skipped')) && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave1-verdict.result == 'success' || (needs.wave1-verdict.result == 'skipped' && needs.wave1.result == 'skipped')) && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave2-verdict.result == 'success' || (needs.wave2-verdict.result == 'skipped' && needs.wave2.result == 'skipped')) && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave3-verdict.result == 'success' || (needs.wave3-verdict.result == 'skipped' && needs.wave3.result == 'skipped')) && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') && (needs.wave4-verdict.result == 'success' || (needs.wave4-verdict.result == 'skipped' && needs.wave4.result == 'skipped')) && (needs.wave5.result == 'success' || needs.wave5.result == 'skipped') && (needs.wave5-release.result == 'success' || needs.wave5-release.result == 'skipped') && (needs.wave5-verdict.result == 'success' || (needs.wave5-verdict.result == 'skipped' && needs.wave5.result == 'skipped')) && (needs.wave6.result == 'success' || needs.wave6.result == 'skipped') && (needs.wave6-release.result == 'success' || needs.wave6-release.result == 'skipped') && (needs.wave6-verdict.result == 'success' || (needs.wave6-verdict.result == 'skipped' && needs.wave6.result == 'skipped')) }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave7) }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  wave0:
    needs: [snapshot, wave0-release]
    if: ${{ !failure() && !cancelled() && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' && needs.wave0-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    # Pull-request code runs here, so it saves nothing: `waveN-save` saves the state.
    cache-mode: read
    permissions: &wave-permissions { contents: read, actions: read, checks: read, pull-requests: read, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave0 }}
    environment: &wave-environment ${{ matrix.env_binding }}
    concurrency: &wave-concurrency
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: &wave-name ${{ matrix.environment }} / ${{ matrix.stack }}
    # wave1..wave7 alias this list, so an edit here changes all eight waves. A change for one
    # wave needs that wave's `steps:` written out in full instead of `*wave-steps`.
    steps: &wave-steps
      # Every attempt: a wave can wait hours on an environment approval, and "Re-run failed
      # jobs" skips `detect` and `lock`. A failure skips the cloud credentials; apply-cell runs
      # only to refuse. `deploy-detect` reads this step's listed name and `Apply the cell`'s
      # to tell whether an ended run applied a cell.
      - name: Pre-apply check
        id: pre-apply
        if: ${{ inputs.pr_number != '' || inputs.deploy }}
        uses: $/actions/pre-apply
        with:
          pr-number: ${{ inputs.pr_number }}
          env: ${{ matrix.environment }}
          stack: ${{ matrix.stack }}
          head-sha: ${{ inputs.head_sha }}
          auto: ${{ inputs.auto }}
          provenance-run: ${{ inputs.provenance_run }}
          base-sha: ${{ inputs.base_sha }}
          plan-run-id: ${{ matrix.plan_run_id }}
          plan-sha256: ${{ matrix.plan_sha256 }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          deploy: ${{ inputs.deploy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      # A read-only job's cache save warns; setup's save is skipped instead.
      - uses: $/actions/setup
        with: { versions: "${{ inputs.tools }}", cache-save: "false" }
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ matrix.role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ matrix.cred_region }}
      - name: Apply the cell
        uses: $/actions/apply-cell
        if: ${{ !cancelled() && (success() || steps.pre-apply.outcome == 'failure') }}
        with:
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          plan-run-id: ${{ matrix.plan_run_id }}
          plan-sha256: ${{ matrix.plan_sha256 }}
          encryption-key: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
          pre-apply-outcome: ${{ steps.pre-apply.outcome }}
          pre-apply-refusal: ${{ steps.pre-apply.outputs.refusal }}
  wave1:
    needs: [wave0, wave1-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' && needs.wave1-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave1 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave2:
    needs: [wave0, wave1, wave2-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' && needs.wave2-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave2 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave3:
    needs: [wave0, wave1, wave2, wave3-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' && needs.wave3-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave3 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave4:
    needs: [wave0, wave1, wave2, wave3, wave4-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' && needs.wave4-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave4 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave5:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' && needs.wave5-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave5 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave6:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' && needs.wave6-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave6 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave7:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' && needs.wave7-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave7 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps

  # After each wave that ran: `waveN-read` classes each cell from the state line in its own
  # job log, one `waveN-save` leg per cell with a state saves it, and `waveN-verdict` fails
  # unless every cell's state was saved or it had none. No new job holds the encryption key,
  # binds an environment or runs pull-request code. Every later release needs each verdict.
  wave0-read:
    needs: [snapshot, wave0]
    if: ${{ always() && needs.snapshot.result == 'success' && needs.wave0.result != 'skipped' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: read
    permissions: &state-permissions { actions: read }
    outputs:
      cells: ${{ steps.read.outputs.cells }}
      report: ${{ steps.read.outputs.report }}
    env:
      WAVE: wave0
    steps: &read-steps
      - id: read
        uses: $/actions/state-read
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave: ${{ env.WAVE }}
          job-id: ${{ job.check_run_id }}
  wave0-save:
    needs: [wave0-read]
    if: ${{ always() && needs.wave0-read.result == 'success' && needs.wave0-read.outputs.cells != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    cache-mode: write
    permissions: *state-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.wave0-read.outputs.cells) }}
    # No ` / ` of its own, so apply-gate's `is_cell_job` never matches a leg.
    name: &save-name save-state (${{ matrix.environment }} ${{ matrix.stack }})
    steps: &save-steps
      - uses: $/actions/state-save
        with:
          stack: ${{ matrix.stack }}
          environment: ${{ matrix.environment }}
          slug: ${{ matrix.slug }}
          digest: ${{ matrix.digest }}
          attempt: ${{ matrix.attempt }}
  wave0-verdict:
