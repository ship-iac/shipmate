        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ (matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)]) != '' || vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)] || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ship-iac/shipmate/actions/apply-cell@a8a4158c82a2c33171585e4095d04fb5ee6d3c77
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ matrix.plan_run_id }}
          state-path: ${{ inputs.state_suffix != '' && format('{0}/{1}', matrix.stack, inputs.state_suffix) || '' }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  # Completes the checks the `snapshot` job captured, for every cell whose wave job succeeded in
  # this run. The only job in this workflow that holds the App key. Ordered after every wave, so
  # that gate-refresh and the apply-summary comment -- both of which `needs:` this called workflow
  # in the callers -- never observe a stale-pending check for a cell that just applied.
  complete:
    needs: [snapshot, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { actions: read }
    environment: shipmate-engine
    steps:
      - uses: ship-iac/shipmate/actions/apply-complete@a9be68cc9442bbf03478a7eabbd0afc2847cdd4e
        with:
          snapshot: ${{ needs.snapshot.outputs.snapshot }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
