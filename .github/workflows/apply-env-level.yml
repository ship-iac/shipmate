name: apply-env-level
on:
  workflow_call:
    inputs:
      waves_json: { required: true, type: string }
      head_sha: { required: true, type: string }
      runs_on: { required: true, type: string }
      # The version pair the caller's detect job resolved; every wave cell installs exactly it.
      tools: { required: true, type: string }
      # On apply, each cell refuses unless this pull request holds its lock. With `deploy` (the
      # merge deploy) it is the merged pull request, empty on a push, and each cell refuses only
      # a lock another pull request holds.
      pr_number: { required: false, type: string, default: "" }
      # `auto` marks an auto apply; its pre-apply check then also compares `provenance_run`,
      # detect's plan run, and `base_sha`, the base tip detect read.
      auto: { required: false, type: boolean, default: false }
      provenance_run: { required: false, type: string, default: "" }
      base_sha: { required: false, type: string, default: "" }
      deploy: { required: false, type: boolean, default: false }
    secrets:
      SHIPMATE_ENCRYPTION_KEY:
        required: false
      SHIPMATE_APP_PRIVATE_KEY:
        required: false
      SHIPMATE_SECRETS:
        required: false
# Floor, not a default to inherit from: see plan.yml. Without it, a lost block would inherit
# id-token: write.
permissions: {}
jobs:
  # Pre-flight, before any wave runs: verify that the environments the waves will bind exist and
  # carry a branch policy, and map the apply-check ids, whole and per wave. It binds
  # shipmate-engine only to check the App key and mint once, so a bad key fails before any apply.
  snapshot:
    runs-on: ubuntu-slim
    # Permissions cap at each `uses:` boundary, so every calling job must grant checks:read too,
    # or this fails at workflow resolution. actions:read is not decorative: on a private repository,
    # listing environments 403s without it (measured; undocumented).
    permissions: { checks: read, actions: read }
    environment: { name: shipmate-engine, deployment: false }
    outputs:
      snapshot: ${{ steps.snap.outputs.snapshot }}
      by_wave: ${{ steps.snap.outputs.by_wave }}
    steps:
      # Before any wave binds the environments it checks: binding one nobody created auto-creates
      # it with no protection. Variables are keyed by matrix.environment, so the fingerprint pins
      # nothing about the binding; existence and a branch policy are the only discriminators.
      - uses: $/actions/verify-environments
        with:
          waves-json: ${{ inputs.waves_json }}
      - id: snap
        uses: $/actions/apply-snapshot
        with:
          head-sha: ${{ inputs.head_sha }}
          waves-json: ${{ inputs.waves_json }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # Flips one wave's apply checks to in_progress right before it; the wave needs it, so no flip
  # lands after the completion. Each earlier wave and release must be success or skipped:
  # `!cancelled()` alone would run past a failure.
  wave0-release:
    needs: [snapshot]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave0) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave1-release:
    needs: [snapshot, wave0, wave0-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave1) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave2-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave2) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave3-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release, wave2, wave2-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave3) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave4-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release, wave2, wave2-release, wave3, wave3-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave4) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave5-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release, wave2, wave2-release, wave3, wave3-release, wave4, wave4-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave5) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave6-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release, wave2, wave2-release, wave3, wave3-release, wave4, wave4-release, wave5, wave5-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') && (needs.wave5.result == 'success' || needs.wave5.result == 'skipped') && (needs.wave5-release.result == 'success' || needs.wave5-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave6) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave7-release:
    needs: [snapshot, wave0, wave0-release, wave1, wave1-release, wave2, wave2-release, wave3, wave3-release, wave4, wave4-release, wave5, wave5-release, wave6, wave6-release]
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' && (needs.wave0.result == 'success' || needs.wave0.result == 'skipped') && (needs.wave0-release.result == 'success' || needs.wave0-release.result == 'skipped') && (needs.wave1.result == 'success' || needs.wave1.result == 'skipped') && (needs.wave1-release.result == 'success' || needs.wave1-release.result == 'skipped') && (needs.wave2.result == 'success' || needs.wave2.result == 'skipped') && (needs.wave2-release.result == 'success' || needs.wave2-release.result == 'skipped') && (needs.wave3.result == 'success' || needs.wave3.result == 'skipped') && (needs.wave3-release.result == 'success' || needs.wave3-release.result == 'skipped') && (needs.wave4.result == 'success' || needs.wave4.result == 'skipped') && (needs.wave4-release.result == 'success' || needs.wave4-release.result == 'skipped') && (needs.wave5.result == 'success' || needs.wave5.result == 'skipped') && (needs.wave5-release.result == 'success' || needs.wave5-release.result == 'skipped') && (needs.wave6.result == 'success' || needs.wave6.result == 'skipped') && (needs.wave6-release.result == 'success' || needs.wave6-release.result == 'skipped') }}
    runs-on: ubuntu-slim
    permissions: { actions: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-release
        with:
          snapshot: ${{ toJSON(fromJSON(needs.snapshot.outputs.by_wave).wave7) }}
          deploy: ${{ inputs.deploy }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  wave0:
    needs: [snapshot, wave0-release]
    if: ${{ !failure() && !cancelled() && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' && needs.wave0-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: &wave-permissions { contents: read, actions: read, checks: read, pull-requests: read, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave0 }}
    environment: &wave-environment ${{ matrix.env_binding }}
    concurrency: &wave-concurrency
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: &wave-name ${{ matrix.environment }} / ${{ matrix.stack }}
    # wave1..wave7 alias this list, so an edit here changes all eight waves. A change for one
    # wave needs that wave's `steps:` written out in full instead of `*wave-steps`.
    steps: &wave-steps
      # Every attempt: a wave can wait hours on an environment approval, and "Re-run failed
      # jobs" skips `detect` and `lock`. A failure skips the cloud credentials; apply-cell runs
      # only to refuse.
      - name: Pre-apply check
        id: pre-apply
        if: ${{ inputs.pr_number != '' || inputs.deploy }}
        uses: $/actions/pre-apply
        with:
          pr-number: ${{ inputs.pr_number }}
          env: ${{ matrix.environment }}
          stack: ${{ matrix.stack }}
          head-sha: ${{ inputs.head_sha }}
          auto: ${{ inputs.auto }}
          provenance-run: ${{ inputs.provenance_run }}
          base-sha: ${{ inputs.base_sha }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          deploy: ${{ inputs.deploy }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - uses: $/actions/setup
        with: { versions: "${{ inputs.tools }}" }
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ matrix.role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ matrix.cred_region }}
      - uses: $/actions/apply-cell
        if: ${{ !cancelled() && (success() || steps.pre-apply.outcome == 'failure') }}
        with:
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          plan-run-id: ${{ matrix.plan_run_id }}
          plan-sha256: ${{ matrix.plan_sha256 }}
          encryption-key: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
          pre-apply-outcome: ${{ steps.pre-apply.outcome }}
          pre-apply-refusal: ${{ steps.pre-apply.outputs.refusal }}
  wave1:
    needs: [wave0, wave1-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' && needs.wave1-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave1 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave2:
    needs: [wave0, wave1, wave2-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave2) != '[]' && needs.wave2-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave2 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave3:
    needs: [wave0, wave1, wave2, wave3-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave3) != '[]' && needs.wave3-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave3 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave4:
    needs: [wave0, wave1, wave2, wave3, wave4-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave4) != '[]' && needs.wave4-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave4 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave5:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave5) != '[]' && needs.wave5-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave5 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave6:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave6) != '[]' && needs.wave6-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave6 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps
  wave7:
    needs: [wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7-release]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave7) != '[]' && needs.wave7-release.result == 'success' }}
    runs-on: ${{ inputs.runs_on }}
    permissions: *wave-permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave7 }}
    environment: *wave-environment
    concurrency: *wave-concurrency
    name: *wave-name
    steps: *wave-steps

  # Writes one wave's checks when it ends: success completes, any other outcome returns to
  # queued with a title. `continue-on-error`: a cell missing from the listing fails this job
  # after ~2 minutes of retries, and `complete` lists the level again.
  wave0-complete:
    needs: [snapshot, wave0]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave0.result == 'success' || needs.wave0.result == 'failure') }}
    runs-on: ubuntu-slim
    # Never fails the level: `complete` writes every snapshot check after all waves, so
    # failing here would skip successor env-levels over a check `complete` then writes.
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave0": "${{ needs.wave0.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave1-complete:
    needs: [snapshot, wave1]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave1.result == 'success' || needs.wave1.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave1": "${{ needs.wave1.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave2-complete:
    needs: [snapshot, wave2]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave2.result == 'success' || needs.wave2.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave2": "${{ needs.wave2.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave3-complete:
    needs: [snapshot, wave3]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave3.result == 'success' || needs.wave3.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave3": "${{ needs.wave3.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave4-complete:
    needs: [snapshot, wave4]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave4.result == 'success' || needs.wave4.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave4": "${{ needs.wave4.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave5-complete:
    needs: [snapshot, wave5]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave5.result == 'success' || needs.wave5.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave5": "${{ needs.wave5.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave6-complete:
    needs: [snapshot, wave6]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave6.result == 'success' || needs.wave6.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave6": "${{ needs.wave6.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
  wave7-complete:
    needs: [snapshot, wave7]
    if: ${{ always() && needs.snapshot.result == 'success' && (needs.wave7.result == 'success' || needs.wave7.result == 'failure') }}
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave7": "${{ needs.wave7.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}

  # Rewrites every snapshot check like the completion jobs, and is the only writer on a
  # cancelled run. It needs every release, wave and completion, so no flip lands after it and
  # gate-refresh and apply-summary never read a check while a write is in flight.
  complete:
    needs: [snapshot, wave0-release, wave1-release, wave2-release, wave3-release, wave4-release, wave5-release, wave6-release, wave7-release, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7, wave0-complete, wave1-complete, wave2-complete, wave3-complete, wave4-complete, wave5-complete, wave6-complete, wave7-complete]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-slim
    permissions: { actions: read, checks: read }
    environment: { name: shipmate-engine, deployment: false }
    steps:
      - uses: $/actions/apply-complete
        with:
          by-wave: ${{ needs.snapshot.outputs.by_wave }}
          wave-results: '{"wave0": "${{ needs.wave0.result }}", "wave1": "${{ needs.wave1.result }}", "wave2": "${{ needs.wave2.result }}", "wave3": "${{ needs.wave3.result }}", "wave4": "${{ needs.wave4.result }}", "wave5": "${{ needs.wave5.result }}", "wave6": "${{ needs.wave6.result }}", "wave7": "${{ needs.wave7.result }}"}'
          job-id: ${{ job.check_run_id }}
          deploy: ${{ inputs.deploy }}
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
