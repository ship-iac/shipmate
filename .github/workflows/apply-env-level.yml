    needs: [snapshot, wave0-release, wave1-release, wave2-release, wave3-release, wave4-release, wave5-release, wave6-release, wave7-release, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7, wave0-complete, wave1-complete, wave2-complete, wave3-complete, wave4-complete, wave5-complete, wave6-complete, wave7-complete, wave0-read, wave1-read, wave2-read, wave3-read, wave4-read, wave5-read, wave6-read, wave7-read, wave0-save, wave1-save, wave2-save, wave3-save, wave4-save, wave5-save, wave6-save, wave7-save, wave0-verdict, wave1-verdict, wave2-verdict, wave3-verdict, wave4-verdict, wave5-verdict, wave6-verdict, wave7-verdict]
