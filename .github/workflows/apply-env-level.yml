          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ inputs.state_suffix != '' && format('{0}/{1}', matrix.stack, inputs.state_suffix) || '' }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  # Completes the checks the snapshot job captured, for every cell whose wave
  # job actually succeeded in this run. The only job in this workflow that
  # holds the App key — ordered after every wave so gate-refresh and the
  # apply-summary comment (both `needs:` this called workflow in the callers)
  # never observe a stale-pending check for a cell that just applied.
  complete:
    needs: [snapshot, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7]
    if: ${{ always() && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { actions: read }
    environment: shipmate-engine
    steps:
      - uses: ship-iac/shipmate/actions/apply-complete@4ab4d7a13c1db20003938dbd72b34290217176f4
        with:
          snapshot: ${{ needs.snapshot.outputs.snapshot }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
