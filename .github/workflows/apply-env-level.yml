name: apply-env-level
on:
  workflow_call:
    inputs:
      waves_json: { required: true, type: string }
      head_sha: { required: true, type: string }
      plan_run_id: { required: true, type: string }
      state_suffix: { required: true, type: string }
    secrets:
      SHIPMATE_PLAN_PASSPHRASE:
        required: false
      SHIPMATE_APP_PRIVATE_KEY:
        required: false
# Floor, not a default to inherit from: every job below declares its own block,
# and this makes a job that loses its block get nothing rather than everything
# the caller granted -- which now includes id-token: write.
permissions: {}
jobs:
  # Capture the apply-check ids BEFORE any wave runs. No secret, no
  # environment needed -- but permissions cap at each `uses:` boundary, so
  # every caller job below must also grant checks:read or this job fails at
  # workflow-resolution time.
  snapshot:
    runs-on: ubuntu-latest
    permissions: { checks: read }
    outputs:
      snapshot: ${{ steps.snap.outputs.snapshot }}
    steps:
      - id: snap
        uses: ship-iac/shipmate/actions/apply-snapshot@83960876131bf43583026d39948184079c807e33
        with:
          head-sha: ${{ inputs.head_sha }}
          waves-json: ${{ inputs.waves_json }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-token: ${{ github.token }}

  wave0:
    needs: [snapshot]
    if: ${{ !failure() && !cancelled() && toJSON(fromJSON(inputs.waves_json).wave0) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave0 }}
    # A repository variable, not a workflow input: which environment an apply
    # binds decides whether the reviewer gate and the apply role apply to it, and
    # branch content must not be able to choose that. A listed env's applies bind
    # the bare environment; the consumer's plan workflow must name the same one
    # (CONTRACT.md).
    environment: >-
      ${{ contains(format(',{0},', vars.SHIPMATE_SHARED_ENVS), format(',{0},', matrix.environment))
      && matrix.environment || format('{0}-apply', matrix.environment) }}
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: apply / ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      # Flavor-agnostic: unset vars resolve to "" and are excluded from the
      # fingerprint (empty TF_VAR_* aren't hashed), so folders (no vars) still match their plan.
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.head_sha }}" }
      - uses: ship-iac/shipmate/actions/setup@21d05c37ca0199767059abfecd28242460b86a0c
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      # A consumer opts into AWS OIDC per environment (plan/apply roles may
      # differ per env/account), and AWS_ROLE_ARN_<WORKLOAD> wins over
      # AWS_ROLE_ARN so one environment can serve several workloads.
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ (matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)]) != '' || vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)] || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ship-iac/shipmate/actions/apply-cell@9c579faca9615b12cebbb7d65a3e15dd89cb39d1
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          head-sha: ${{ inputs.head_sha }}
          plan-run-id: ${{ inputs.plan_run_id }}
          state-path: ${{ inputs.state_suffix != '' && format('{0}/{1}', matrix.stack, inputs.state_suffix) || '' }}
          github-token: ${{ github.token }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
  wave1:
    needs: [wave0]
    if: ${{ !failure() && !cancelled() && !contains(join(needs.*.result, ','), 'cancelled') && toJSON(fromJSON(inputs.waves_json).wave1) != '[]' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, id-token: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.waves_json).wave1 }}
    environment: >-
      ${{ contains(format(',{0},', vars.SHIPMATE_SHARED_ENVS), format(',{0},', matrix.environment))
      && matrix.environment || format('{0}-apply', matrix.environment) }}
    concurrency:
