name: plan
on:
  workflow_call:
    inputs:
      state_suffix: { required: true, type: string }
      # The three local samples run a slimmer image than the apply path's fixed ubuntu-latest.
      runs_on: { required: false, default: ubuntu-latest, type: string }
    secrets:
      # Both `required: false`, for apply.yml's reason: the `summary` job binds
      # `shipmate-engine` and the cells bind `<env>-plan`, so a required declaration would fail
      # at load time for every consumer who scopes a key to an environment instead of the repo.
      SHIPMATE_APP_PRIVATE_KEY: { required: false }
      SHIPMATE_PLAN_PASSPHRASE: { required: false }
# Floor, not a default to inherit from: every job here declares its own block, so a job that
# loses its block gets nothing rather than everything the caller granted.
permissions: {}
jobs:
  # One producer for every pull-request fact below, and its own job rather than `detect`'s first
  # step: `detect` can fail on a fmt check or stale codegen, and `summary` must still be told which
  # head to gate -- an empty `head-repo` there refuses, turning a failing gate into no gate at all.
  facts:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      pull-requests: read
    outputs:
      head-sha: ${{ steps.facts.outputs.head-sha }}
      head-repo: ${{ steps.facts.outputs.head-repo }}
      base-sha: ${{ steps.facts.outputs.base-sha }}
      pr-number: ${{ steps.facts.outputs.pr-number }}
      is-draft: ${{ steps.facts.outputs.is-draft }}
      on-demand: ${{ steps.facts.outputs.on-demand }}
    steps:
      - id: facts
        uses: ship-iac/shipmate/actions/pr-facts@d9eb0107785248de43eb7aebfce7246c7205777e

  detect:
    needs: facts
    # Autoplan skips drafts; `shipmate plan` on a draft is an explicit request and plans it.
    if: needs.facts.outputs.is-draft == 'false' || needs.facts.outputs.on-demand == 'true'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      empty: ${{ steps.matrix.outputs.empty }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      # Both triggers check out something else by default -- the base branch under
      # `pull_request_target`, the dispatch ref under `workflow_dispatch`. Naming the head SHA is
      # what makes this a plan of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.facts.outputs.head-sha }}
          fetch-depth: 0
      - uses: ship-iac/shipmate/actions/setup@59ac665afe78a75d4fe1d18bf4349dbbde9b08c2
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      # Before the two terramate steps, not after: this step is where a fork's pull request is
      # refused, and `terramate fmt`/`generate` evaluate the checked-out HCL.
      - id: matrix
        uses: ship-iac/shipmate/actions/build-matrix@37d72846f4c77196c3554a86b8cb4124d668762e
        with:
          base-sha: ${{ needs.facts.outputs.base-sha }}
          head-repo: ${{ needs.facts.outputs.head-repo }}
          head-sha: ${{ needs.facts.outputs.head-sha }}
      - name: fmt check
        run: terramate fmt --check
      - name: stale codegen check
        run: terramate generate --detailed-exit-code

  plan:
    needs: [facts, detect]
    if: needs.detect.outputs.empty == 'false'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    # SHIPMATE_SHARED_ENVS is a repository variable, not a workflow input: which environment a
    # cell binds decides whether the reviewer gate and the cloud role reach it, and branch content
    # must not choose that. The apply side binds the same variable the same way.
    environment: >-
      ${{ contains(format(',{0},', vars.SHIPMATE_SHARED_ENVS), format(',{0},', matrix.environment))
      && matrix.environment || format('{0}-plan', matrix.environment) }}
    name: ${{ matrix.stack }} / ${{ matrix.environment }}
    env:
      TF_VAR_env: ${{ vars.TF_VAR_env }}
      TF_VAR_region: ${{ vars.TF_VAR_region }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.facts.outputs.head-sha }}
          fetch-depth: 0
      - uses: ship-iac/shipmate/actions/setup@59ac665afe78a75d4fe1d18bf4349dbbde9b08c2
        with:
          terramate-version: ${{ vars.TERRAMATE_VERSION }}
          tofu-version: ${{ vars.TOFU_VERSION }}
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ (matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)]) != '' || vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ matrix.workload_var != '' && vars[format('AWS_ROLE_ARN_{0}', matrix.workload_var)] || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ship-iac/shipmate/actions/plan-cell@44e0692b874f0ac75de1adfac277850fb0288c75
        with:
          stack: ${{ matrix.stack }}
          stack-name: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
          expected-head: ${{ needs.facts.outputs.head-sha }}
          state-path: ${{ inputs.state_suffix != '' && format('{0}/{1}', matrix.stack, inputs.state_suffix) || '' }}
          plan-passphrase: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}

  # The only job here that holds the App key. It checks out nothing and runs no repository
  # content, which is what makes `pull_request_target` safe for this file. All three trust
  # decisions are on its own `if:`, reading the one producer above.
  summary:
    needs: [facts, detect, plan]
    # The fork clause yields to no trigger; it alone guards App-key exposure over fork-authored
    # content. The draft clause does yield -- skipping a draft is economy, not trust. The
    # parentheses are load-bearing: `&&` binds tighter than `||`, so `on-demand` alone would pass.
    if: >-
      ${{ !cancelled() && needs.facts.outputs.head-repo != '' &&
      needs.facts.outputs.head-repo == github.repository &&
      (needs.facts.outputs.is-draft == 'false' || needs.facts.outputs.on-demand == 'true') }}
    runs-on: ${{ inputs.runs_on }}
    # The guard is on the job, not on a step: a skipped job creates no deployment and never enters
    # the environment, whereas a first-step check would already hold the App key in scope.
    environment: shipmate-engine
    permissions:
      contents: read
    steps:
      # Unconditional: skipping it when zero cells were planned would make gate-state's "more
      # cells than planned" branch unreachable. A `pattern:` matching nothing is a no-op here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # A failed download must reach gate-state as a cell-summary shortfall it reports on the
        # gate, not as a dead job that writes no gate at all.
        continue-on-error: true
        with:
          pattern: cell-summary.*
          path: cells
      - uses: ship-iac/shipmate/actions/summary@d9eb0107785248de43eb7aebfce7246c7205777e
        with:
          pr-number: ${{ needs.facts.outputs.pr-number }}
          head-sha: ${{ needs.facts.outputs.head-sha }}
          detect-result: ${{ needs.detect.result }}
          plan-result: ${{ needs.plan.result }}
          planned-cells: ${{ needs.detect.outputs.count }}
          on-demand: ${{ needs.facts.outputs.on-demand }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          private-key: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
