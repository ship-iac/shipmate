name: unlock
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      ref: { required: true, type: string }
      runs_on: { required: false, default: ubuntu-26.04-arm, type: string }
    # Unlock's first and only secret. It carries no engine credential -- unlock reads no plan
    # artifact and mints no App token -- but `unlock-cell` runs `tofu init`, so a consumer
    # whose backend configuration reads a plain TF_VAR_* needs the envelope here too.
    secrets:
      SHIPMATE_SECRETS: { required: false }
# Floor, not a default to inherit from: see plan.yml. Without it, a lost block would inherit
# id-token: write.
permissions: {}
# An unlock run holds the default branch's cache scope while it runs the pull request's HCL,
# and nothing in this file saves an Actions-cache entry.
cache-mode: read
jobs:
  # Rejects a human dispatch: see the guard job in apply.yml.
  guard:
    runs-on: ubuntu-slim
    # For the started reaction alone. This job checks nothing out, so it runs no pull-request HCL.
    permissions: { pull-requests: write }
    steps:
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::unlock refused: the dispatching actor is not a [bot]; comment 'shipmate unlock <env>' on the pull request instead of running a direct workflow_dispatch"
          exit 1
      # Display only: an unlock is idempotent, so a second run of the comment needs no claim.
      - uses: $/actions/unlock-rocket
        with:
          comment-id: ${{ github.event.inputs.comment_id }}

  detect:
    needs: [guard]
    runs-on: ${{ inputs.runs_on }}
    permissions: { contents: read, checks: read, actions: read }
    outputs:
      cells: ${{ steps.d.outputs.cells }}
      tools: ${{ steps.setup.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - id: setup
        uses: $/actions/setup
        with: { tofu: "false", resolve: "true" }
      - id: d
        uses: $/actions/unlock-detect
        with:
          environment: ${{ inputs.environment }}
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-vars: ${{ toJSON(vars) }}
      # The `unlock` job binds the same environment as the apply waves, so it needs the same
      # pre-flight that apply-run.yml's `lock` and apply-env-level.yml's `snapshot` run. A
      # failure fails `detect`, which `unlock`'s `!failure()` reads as "do not run".
      - name: Verify the unlock-path environment exists and carries a branch policy
        if: ${{ steps.d.outputs.cells != '[]' }}
        # GitHub creates a missing environment on demand with no reviewers, no wait timer and no
        # branch policy, and keeps it -- so an unlock into a missing one silently retires that
        # env's reviewer gate.
        uses: $/actions/verify-environments
        with:
          # The flat queue is wrapped as one wave because the action's input shape is the waves
          # object. It refuses an empty cell set by design, which is why the step's `if:` filters
          # `[]` out rather than letting it decide.
          waves-json: ${{ format('{{"wave0":{0}}}', steps.d.outputs.cells) }}

  unlock:
    # `guard` is in `needs` as well as `detect`: a rejected dispatch leaves `detect` skipped, and a
    # skipped `detect` reads its outputs as empty strings -- which `!= '[]'` reads as a queue.
    needs: [guard, detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.cells != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    # No PR comment, deliberately -- do not "fix" it: this job runs the pull request's HCL, so it
    # holds no pull-requests: write. Each leg uploads a record and `result` replies from it.
    permissions: { contents: read, actions: read, id-token: write }
    strategy:
      # One cell that cannot determine its lock state must not stop its siblings from releasing
      # theirs.
      fail-fast: false
      # Nothing here is wave-ordered -- releasing a lock has no dependencies -- so the matrix is
      # flat.
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.cells) }}
    environment: ${{ matrix.env_binding }}
    # cell.yml's group (scripts/tests/test_apply_cell_concurrency_guard.py): an unlock queues
    # behind a live apply for the cell, so the lock is gone or orphaned by the time it runs.
    # Without `queue: max`, an unlock arriving behind a waiting cell evicts it.
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
      queue: max
    name: ${{ matrix.environment }} / ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: $/actions/setup
        with: { versions: "${{ needs.detect.outputs.tools }}" }
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      # Byte-identical to cell.yml's step but for the row's spelling
      # (scripts/tests/test_aws_oidc_wiring_guard.py).
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ matrix.role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ matrix.cred_region }}
      - id: cell
        uses: $/actions/unlock-cell
        with:
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
      # A leg that failed before `unlock-cell` set an outcome records `failed`. This job runs
      # pull-request HCL, so `result` checks the record against `detect`'s queue.
      - name: Record the cell's outcome
        if: ${{ always() }}
        shell: bash
        env:
          INDEX: ${{ strategy.job-index }}
          STACK: ${{ matrix.stack }}
          ENVIRONMENT: ${{ matrix.environment }}
          OUTCOME: ${{ steps.cell.outputs.outcome }}
          LOCK_ID: ${{ steps.cell.outputs.lock_id }}
        run: >-
          python3 -c 'import json, os; e = os.environ; print(json.dumps({"index": int(e["INDEX"]),
          "stack": e["STACK"], "environment": e["ENVIRONMENT"], "outcome": e["OUTCOME"] or "failed",
          "lock_id": e["LOCK_ID"]}))' > "$RUNNER_TEMP/shipmate-unlock-$INDEX.json"
      - name: Upload the cell's outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipmate-unlock-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shipmate-unlock-${{ strategy.job-index }}.json
          # A re-run of failed jobs replaces its own record.
          overwrite: true

  # Reads only the legs' records and `detect`'s cells, and checks nothing out, so it runs no
  # pull-request code. A cancelled run posts nothing.
  result:
    needs: [guard, detect, unlock]
    if: ${{ !cancelled() && needs.detect.result != 'skipped' }}
    runs-on: ubuntu-slim
    permissions: { pull-requests: write }
    steps:
      # A lone matching artifact downloads without a directory of its name; `unlock-result` reads
      # the root only when no record directory exists.
      - name: Download the cells' records
        id: download
        if: ${{ needs.detect.result == 'success' && needs.detect.outputs.cells != '[]' }}
        # Display only: the reply names a failed download, so it must not stop the reply. A job
        # step so `timeout-minutes` can end the 180 s actions/toolkit#2575 adds after a retry.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shipmate-unlock-*
          path: ${{ runner.temp }}/unlock-records
          merge-multiple: false
      - uses: $/actions/unlock-result
        with:
          comment-id: ${{ github.event.inputs.comment_id }}
          environment: ${{ inputs.environment }}
          cells: ${{ needs.detect.outputs.cells }}
          detect-result: ${{ needs.detect.result }}
          download-outcome: ${{ steps.download.outcome }}
