name: unlock
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      ref: { required: true, type: string }
    # Unlock's first and only secret. It carries no engine credential -- unlock reads no plan
    # artifact and mints no App token -- but `unlock-cell` runs `tofu init`, so a consumer
    # whose backend configuration reads a plain TF_VAR_* needs the envelope here too.
    secrets:
      SHIPMATE_SECRETS: { required: false }
# Floor, not a default to inherit from: see plan.yml. Without it, a lost block would inherit
# id-token: write.
permissions: {}
# A dispatched run holds the default branch's cache scope while it runs the pull request's HCL,
# and nothing in this file saves an Actions-cache entry.
cache-mode: read
jobs:
  # Rejects a human dispatch: see the guard job in apply.yml.
  guard:
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Reject dispatches that did not come from a bot actor
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::unlock refused: the dispatching actor is not a [bot]; comment 'shipmate unlock <env>' on the pull request instead of running a direct workflow_dispatch"
          exit 1

  detect:
    needs: [guard]
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: read, actions: read }
    outputs:
      cells: ${{ steps.d.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - uses: $/actions/setup
      - id: d
        uses: $/actions/apply-detect
        with:
          environment: ${{ inputs.environment }}
          # A literal, not an input: this file is the verb. `run_unlock` reads
          # neither the review decision nor the ungated-env list -- an approval
          # reviews a diff and unlock applies none -- so neither is passed.
          mode: unlock
          head-sha: ${{ inputs.ref }}
          app-id: ${{ vars.SHIPMATE_APP_ID }}
          github-vars: ${{ toJSON(vars) }}
      # The `unlock` job binds the same environment as the apply waves, so it needs the pre-flight
      # apply-env-level.yml's `snapshot` job runs. A failure fails `detect`, which `unlock`'s
      # `!failure()` reads as "do not run".
      - name: Verify the unlock-path environment exists
        if: ${{ steps.d.outputs.cells != '[]' }}
        # GitHub creates a missing environment on demand with no reviewers, no wait timer and no
        # branch policy, and that created environment then satisfies the apply path's own
        # pre-flight -- so an unlock into a missing one silently retires that env's reviewer gate.
        uses: $/actions/verify-environments
        with:
          # The flat queue is wrapped as one wave because the action's input shape is the waves
          # object. It refuses an empty cell set by design, which is why the step's `if:` filters
          # `[]` out rather than letting it decide.
          waves-json: ${{ format('{{"wave0":{0}}}', steps.d.outputs.cells) }}

  unlock:
    # `guard` is in `needs` as well as `detect`: a rejected dispatch leaves `detect` skipped, and a
    # skipped `detect` reads its outputs as empty strings -- which `!= '[]'` reads as a queue.
    needs: [guard, detect]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.cells != '[]' }}
    runs-on: ubuntu-latest
    # No PR comment, deliberately -- do not "fix" it: it needs pull-requests: write, which the
    # consumer's job does not grant. comment-ops' reaction acknowledges acceptance, step summaries
    # carry per-cell detail, and a failure reds the run and notifies the actor.
    permissions: { contents: read, actions: read, id-token: write }
    strategy:
      # One cell that cannot determine its lock state must not stop its siblings from releasing
      # theirs.
      fail-fast: false
      # Nothing here is wave-ordered -- releasing a lock has no dependencies -- so the matrix is
      # flat.
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.cells) }}
    environment: ${{ matrix.env_binding }}
    # The wave jobs' group (scripts/tests/test_apply_cell_concurrency_guard.py): an unlock queues
    # behind a live apply for the cell, so the lock is gone or orphaned by the time it runs.
    concurrency:
      group: apply-${{ matrix.environment }}-${{ matrix.stack }}
      cancel-in-progress: false
    name: unlock / ${{ matrix.stack }} / ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ inputs.ref }}" }
      - uses: $/actions/setup
      # The table chooses role and region; detect resolves a reference in it from a repository or
      # organization variable. A vars.* fallback would pick a role the table did not and stay green.
      # Byte-identical to the wave jobs' step (scripts/tests/test_aws_oidc_wiring_guard.py).
      - name: Configure cloud credentials (AWS OIDC)
        if: ${{ matrix.role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ matrix.cred_region }}
      - uses: $/actions/unlock-cell
        with:
          tf-vars: ${{ toJSON(matrix.tf_vars) }}
          github-vars: ${{ toJSON(vars) }}
          consumer-secrets: ${{ secrets.SHIPMATE_SECRETS }}
          stack: ${{ matrix.stack }}
          env: ${{ matrix.environment }}
