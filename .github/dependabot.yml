version: 2
updates:
  # Composite-action and workflow `uses:` SHA pins. `/` covers .github/workflows only. Each
  # composite action carries its own third-party pins (create-github-app-token in
  # actions/dispatch, for one), so the `/actions/*` glob is what puts those in scope.
  - package-ecosystem: github-actions
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        # Group minor + patch into one PR; majors open individually for review.
        update-types: [minor, patch]
    ignore:
      # This repo's own action pins are hand-managed by docs/releasing.md's two-step cascade and
      # are deliberately heterogeneous: each points at the commit whose action content it needs.
      # Dependabot would flatten them to the latest release SHA, which mid-cascade downgrades the
      # pin just bumped -- and internal-pins.yml, on push-to-main only, catches that after merge.
      - dependency-name: "ship-iac/shipmate*"

  # Dev toolchain pinned in pyproject.toml / uv.lock (ruff, ty, pytest, ...).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        update-types: [minor, patch]
