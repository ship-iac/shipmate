# manifest-load.yml's `if: false` is the point of that workflow, not a mistake (docs/releasing.md
# § Manifest load): GitHub parses a remote action's manifest while setting the job up, before any
# step's `if:` is evaluated. A skipped step proves the manifest loads without running the action.
paths:
  .github/workflows/manifest-load.yml:
    ignore:
      - 'constant expression "false" in condition'
  .github/workflows/*.yml:
    ignore:
      # actionlint 1.7.12 has no `$/` self-repository syntax (GitHub, 2026-07-30) and reads
      # `$/actions/<name>` as a remote ref missing its `@`. Remove when a release parses it.
      - 'specifying action "\$/actions/[a-z-]+" in invalid format because ref is missing'
      # `job.workflow_repository` is documented and measured live; actionlint 1.7.12 types the
      # `job` context without it. The two doctor steps are pinned whole by
      # test_engine_self_reference.py.
      - 'property "workflow_repository" is not defined in object type'
