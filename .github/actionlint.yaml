# manifest-load.yml's `if: false` is the point of that workflow, not a mistake: GitHub parses a
# remote action's manifest while setting the job up, before any step's `if:` is evaluated, so a
# skipped step proves the manifest loads without running it. docs/releasing.md § Manifest load.
paths:
  .github/workflows/manifest-load.yml:
    ignore:
      - 'constant expression "false" in condition'
