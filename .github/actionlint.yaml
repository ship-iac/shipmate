# manifest-load.yml's `if: false` is the point of that workflow, not a mistake (docs/releasing.md
# § Manifest load): GitHub parses a remote action's manifest while setting the job up, before any
# step's `if:` is evaluated. A skipped step proves the manifest loads without running the action.
paths:
  .github/workflows/manifest-load.yml:
    ignore:
      - 'constant expression "false" in condition'
