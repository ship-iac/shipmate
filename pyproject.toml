[project]
name = "shipmate"
version = "0.0.0"
description = "Serverless TACO engine — GitHub Actions composite actions + scripts over Terramate and OpenTofu"
requires-python = ">=3.11"

# shipmate ships no importable package — just standalone GHA helper scripts and
# their tests. Tell uv not to try to build/install this as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
# dev/ holds dev-time tooling (the internal-pin model and its CLIs), not shipped
# runtime surface, so it is not importable from scripts/. Tests of that tooling
# import it by name; this is what makes `import pinrefs` resolve without a
# sys.path hack in every test module.
pythonpath = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",  # Astral type checker — still beta; kept non-blocking in CI
    "pytest>=8",
    "pyyaml>=6",         # parse composite action.yml in the shellcheck test
    "shellcheck-py>=0.10",  # pip-packaged shellcheck binary (cross-platform)
]

[tool.ruff]
target-version = "py311"
line-length = 100
# The helper scripts are executable, extension-less files (they run as GHA
# steps, not as an importable module), so ruff won't discover them by glob —
# list them explicitly.
extend-include = [
    "scripts/apply-comment",
    "scripts/apply-detect",
    "scripts/apply-gate",
    "scripts/authorize",
    "scripts/build-matrix",
    "scripts/comment-parse",
    "scripts/deploy-detect",
    "scripts/doctor",
    "scripts/env-order",
    "scripts/pending-checks",
    "scripts/plan-classify",
    "scripts/plan-crypt",
    "scripts/register-app",
    "scripts/summary-comment",
    "scripts/waves",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C90", # mccabe — cyclomatic complexity ceiling
]

[tool.ruff.lint.mccabe]
# Complexity is the budgeted resource in this codebase: helper scripts must
# stay individually reviewable. comment-parse's parse() sits at exactly 8,
# the ceiling itself (tied with test_gate_name_consistency.py's
# test_inline_gate_write_job_mints_app_statuses_token -- C901 applies to
# tests too, per-file-ignores only covers S101/S603/S607); do not raise this
# without splitting the function first.
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point (S101); they invoke trusted dev tools by name
# (shellcheck) via subprocess (S603/S607).
"scripts/tests/*" = ["S101", "S603", "S607"]
