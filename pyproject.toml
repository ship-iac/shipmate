[project]
name = "shipmate"
version = "0.0.0"
description = "Serverless TACO engine — GitHub Actions composite actions + scripts over Terramate and OpenTofu"
requires-python = ">=3.11"

# shipmate ships no importable package — just standalone GHA helper scripts and
# their tests. Tell uv not to try to build/install this as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
# scripts/tests/ is listed so `from _loader import load_script` resolves
# without a sys.path hack in every test module. Prepend import mode happens to
# put a test's own directory on sys.path already, so this is currently redundant — but that is pytest's default
# behaviour rather than a declared invariant, and it stops holding the moment
# anyone adds an __init__.py or passes --import-mode=importlib. Declaring it
# keeps 20 test modules from failing collection on a config change elsewhere.
# scripts/ holds the shared loader that the scripts and the test loader import.
pythonpath = ["scripts", "scripts/tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.64",  # Astral type checker — still beta; kept non-blocking in CI
    "pytest>=8",
    "pyyaml>=6",         # parse workflow and action YAML in the guard tests
    "shellcheck-py>=0.10",  # pip-packaged shellcheck binary (cross-platform)
]

[tool.ruff]
target-version = "py311"
line-length = 100
# The helper scripts are extension-less, so the glob feeds every non-gitignored
# file under scripts/, at any depth, to ruff as Python. Non-Python test data
# must live under scripts/tests/fixtures/.
extend-include = ["scripts/*"]
extend-exclude = ["scripts/tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C90", # mccabe — cyclomatic complexity ceiling
    "SIM", # flake8-simplify — SIM115 is the one that matters: an unclosed open()
    "RET", # flake8-return — RET503 catches a fall-through beside an explicit return
]

[tool.ruff.lint.mccabe]
# Complexity is the budgeted resource in this codebase: helper scripts must
# stay individually reviewable. comment-parse's parse() sits at exactly 8,
# the ceiling itself (tied with test_gate_name_consistency.py's
# test_inline_gate_write_job_mints_app_statuses_token -- C901 applies to
# tests too, per-file-ignores only covers S101/S603/S607); do not raise this
# without splitting the function first.
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point (S101); they invoke trusted dev tools by name
# (shellcheck) via subprocess (S603/S607).
"scripts/tests/*" = ["S101", "S603", "S607"]
